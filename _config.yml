# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Jasmine_Iris
subtitle: ''
description: 'Jasmine_Iris 的网络安全学习博客：渗透测试、CTF 题解与漏洞复现笔记。满地都是六便士，我却抬头看见了月亮。'
keywords: '网络安全,渗透测试,CTF,题解,漏洞复现,学习笔记'
author: Jasmine_Iris
language: zh-CN
timezone: 'Asia/Chongqing'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://jasmine-iris.top
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - font/**
  - quiz/**
  - feedback/**
  - 404.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
  - _data
  - .nojekyll
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Search
search:
  path: search.xml
  field: post
  content: true

# Blog encryption (hexo-blog-encrypt)
# 按分类加密：categories 里的分类会整类加密（由 scripts/encrypt-category.js 实现）
encrypt:
  abstract: 这是一篇加密文章，请输入密码后继续阅读。
  message: A hint is actually no hint at all.
  wrong_pass_message: 密码错误，请重试。
  decryptButton:
    text: Decrypt
  categories:
    - name: 随笔
      password: 1313113

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/Jasmineee007/Jasmineee007.github.io.git
  branch: main
  # hexo-deployer-git 默认跳过点开头文件，放开才能把 source/.nojekyll 部署上去
  # （前提：source 下没有其他点开头文件，.github/workflows 残留已删）
  ignore_hidden: false

# Sitemap (hexo-generator-sitemap)
sitemap:
  path: sitemap.xml
  rel: false
  tags: false
  categories: false

# RSS 订阅 (hexo-generator-feed)
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  order_by: -date
  autodiscovery: true

# 外链 nofollow (hexo-filter-nofollow)：防权重流失，自有域名豁免
nofollow:
  enable: true
  field: site
  exclude:
    - jasmine-iris.top
    - www.jasmine-iris.top
    - jasmineee007.github.io
