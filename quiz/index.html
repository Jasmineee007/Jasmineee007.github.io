"64位","128位","256位"],"a":0,"e":"\u003cb>DES密钥名义64位但实际有效56位（每字节第8位为奇偶校验位）\u003c/b>，56位密钥已被暴力破解。3DES（三重DES）相当于112/168位有效密钥，但速度慢。现代系统应使用AES-256或国密SM4替代DES。"},{"c":"crypto","t":"s","q":"PGP加密系统同时使用了（　）。","o":["仅对称加密","仅非对称加密","对称加密（加密数据）+非对称加密（传递对称密钥）+数字签名","仅哈希函数"],"a":2,"e":"\u003cb>PGP=混合加密体系：用对称密钥加密消息本体（速度），用接收方公钥加密对称密钥（分发），用发送方私钥签名（认证）\u003c/b>。PGP采用信任网模型（Web of Trust）而非层级CA模型，用户之间相互签名建立信任链。GnuPG是开源实现。"},{"c":"crypto","t":"f","q":"MD5算法输出长度为128位，由于已被证实存在碰撞攻击，不建议用于安全敏感场景。","a":0,"e":"正确。MD5输出128位（16字节），王小云院士于2004年证明了MD5碰撞攻击可行性，且已有成熟工具可在秒级产生碰撞。安全场景应使用SHA-256或SM3（均256位输出）。"},{"c":"crypto","t":"f","q":"AES-256比AES-128的安全性更高，因此在所有场景下都应使用AES-256。","a":1,"e":"错误。虽然AES-256确实比AES-128密钥空间更大，但AES-128已被广泛认为足够安全，且AES-128在某些硬件（如AES-NI指令集优化不完善时）和受限场景（如IoT设备）下性能更好。应根据实际威胁模型选择。"},{"c":"crypto","t":"f","q":"数字证书中包含了持有者的私钥，CA验证后签发。","a":1,"e":"错误。数字证书只包含持有者的公钥，私钥由持有者独立生成并安全保管，绝不传输给CA或在证书中暴露。CA只对持有者的公钥及身份信息做签名担保。"},{"c":"crypto","t":"s","q":"SM3国密哈希算法的输出长度为（　）。","o":["128位","256位","512位","64位"],"a":1,"e":"\u003cb>SM3输出256位（32字节）哈希值\u003c/b>，与SHA-256输出长度相同。SM3由王小云院士团队设计，安全性优于SHA-1，与SHA-256相当。SM3已列入ISO/IEC国际标准，在电子签名、数字证书、消息认证码等领域广泛应用。"},{"c":"crypto","t":"s","q":"SM9标识密码学的特点是（　）。","o":["需要预先交换公钥证书","使用用户身份标识（如手机号/邮箱）作为公钥，无需PKI证书管理","只能用于加密不能签名","安全性低于RSA"],"a":1,"e":"\u003cb>SM9基于身份的加密（IBE）和签名（IBS）\u003c/b>：用户身份标识直接作为公钥，KGC根据身份生成私钥。优势：无需证书管理和分发，简化了PKI部署。适用于移动通信、物联网等轻量级场景。"},{"c":"crypto","t":"s","q":"GCM加密模式的优势是（　）。","o":["仅加密不认证","同时提供加密和认证（AEAD），且支持并行加密，性能优异","速度最慢","仅用于非对称加密"],"a":1,"e":"\u003cb>GCM是AEAD（认证加密）模式：同时保证数据保密性和完整性\u003c/b>，附加认证数据（AAD）可对关联数据进行完整性保护。GCM支持硬件加速（AES-NI），性能优于CBC+HMAC组合。TLS 1.2/1.3推荐AES-256-GCM。"},{"c":"crypto","t":"s","q":"ECC椭圆曲线密码相比RSA在同等安全级别下（　）。","o":["需要更长的密钥","密钥更短、计算更快、带宽和存储更节省","安全性更低","不能用于数字签名"],"a":1,"e":"\u003cb>ECC-256的安全强度约等于RSA-3072\u003c/b>，ECC-384约等于RSA-7680。更短的密钥意味着更快的计算、更少的带宽和更小的证书。ECC广泛用于TLS（ECDHE密钥交换）、ECDSA/EdDSA数字签名。"},{"c":"crypto","t":"s","q":"TLS 1.3相比TLS 1.2的改进不包括（　）。","o":["移除不安全的密码套件","强制前向保密（PFS）","增加了56位DES支持","握手从2-RTT减少到1-RTT"],"a":2,"e":"\u003cb>TLS 1.3改进：移除大量不安全算法（RC4/3DES/静态RSA/SHA-1）、强制PFS、0-RTT快速重连、握手简化\u003c/b>。56位DES在TLS 1.3中被彻底移除。TLS 1.3是当前最安全的TLS版本。"},{"c":"crypto","t":"s","q":"Base64编码与加密的区别是（　）。","o":["没有区别","Base64是编码方式（可逆、不提供安全性），加密是使用密钥的数学变换（提供保密性）","Base64比AES更安全","Base64是加密算法"],"a":1,"e":"\u003cb>Base64将二进制数据转为ASCII字符串，不使用密钥、不提供保密性\u003c/b>，任何人都可以解码。常见误区：将敏感数据Base64后当加密传输——这是明文传输！真正的加密需要密钥（AES/RSA等）。"},{"c":"crypto","t":"s","q":"TLS前向保密（PFS）的含义是（　）。","o":["SSL证书永不过期","即使长期私钥被泄露，之前会话的加密通信仍然安全（因为会话密钥通过临时密钥交换生成）","证书可以随意复制","握手不需要证书"],"a":1,"e":"\u003cb>PFS：每次会话使用独立的临时密钥交换（ECDHE/DHE），会话密钥不依赖服务器长期私钥\u003c/b>。即使日后服务器私钥泄露，攻击者也无法解密之前截获的加密流量。TLS 1.3强制PFS。"},{"c":"crypto","t":"s","q":"密钥轮换（Key Rotation）的最佳实践是（　）。","o":["永不需要更换密钥","定期更换加密密钥，旧密钥仅用于解密已有数据直到数据被重新加密","密钥被泄露后才更换","每天更换一次所有密钥"],"a":1,"e":"\u003cb>密钥轮换策略：对称密钥建议6-12个月更换、非对称密钥建议1-3年更换\u003c/b>。轮换后旧密钥仅用于解密/验证已有数据，新数据使用新密钥。密钥轮换可降低单次泄露的累计影响。"},{"c":"crypto","t":"s","q":"量子计算对当前密码体系的主要威胁是（　）。","o":["威胁AES-256的安全性","Shor算法可破解RSA/ECC等基于大整数分解和离散对数的公钥密码","量子计算无法影响任何密码","只影响哈希算法"],"a":1,"e":"\u003cb>Shor算法可在多项式时间内解决大整数分解和椭圆曲线离散对数问题\u003c/b>，直接威胁RSA和ECC。AES受Grover算法影响但翻倍密钥即可。后量子密码（PQC）：格密码、哈希签名等。"},{"c":"crypto","t":"s","q":"HMAC的构造原理是（　）。","o":["直接对消息哈希","使用密钥与哈希函数组合（密钥与消息拼接后经两轮哈希计算）","仅使用密钥加密消息","HMAC不需要密钥"],"a":1,"e":"\u003cb>HMAC(k,m)使用密钥与哈希函数组合生成消息认证码\u003c/b>，安全性基于底层哈希函数。常见用法：HMAC-SHA256、HMAC-SM3。广泛用于TLS记录层、API签名、JWT签名、消息认证等场景。"},{"c":"crypto","t":"f","q":"AES-128在量子计算机面前已经完全不安全了，必须立即迁移到后量子密码。","a":1,"e":"错误。Grover算法对AES的影响是将有效密钥长度减半（AES-128变为等效64位），AES-256变为等效128位。AES-256在可预见的量子计算面前仍然安全。真正需要紧急迁移的是RSA和ECC等公钥算法。"},{"c":"crypto","t":"s","q":"RSA公钥密码算法的安全性基于（　）。","o":["大整数因子分解难题","椭圆曲线离散对数难题","背包问题","格基约简难题"],"a":0,"e":"\u003cb>RSA基于大整数因子分解难题\u003c/b>：两个大素数相乘容易、反向分解极难。SM2则基于椭圆曲线离散对数问题，相同安全强度下密钥更短。"},{"c":"crypto","t":"s","q":"与RSA相比，椭圆曲线密码（ECC）的主要优势是（　）。","o":["同等安全强度下密钥更短、运算与存储开销更小","完全不依赖数学难题","只能用于数字签名","算法必须公开"],"a":0,"e":"\u003cb>ECC在相同安全强度下密钥长度更短\u003c/b>（如256位ECC≈3072位RSA），计算快、占用资源少，因此被SM2、区块链地址等广泛采用。"},{"c":"crypto","t":"s","q":"AES加密算法的分组长度固定为（　）。","o":["64位","128位","256位","512位"],"a":1,"e":"\u003cb>AES分组长度固定128位\u003c/b>，密钥长度支持128/192/256位；DES/3DES分组为64位；国密SM4分组128位（结构类似AES），SM1分组也为128位。"},{"c":"crypto","t":"s","q":"AES算法支持的密钥长度不包括（　）。","o":["128位","192位","256位","512位"],"a":3,"e":"\u003cb>AES密钥长度仅有128/192/256位三种\u003c/b>，密钥越长强度越高（AES-256常用于加密敏感数据）。512位不在AES标准之内。"},{"c":"crypto","t":"s","q":"数字签名能够提供的安全服务不包括（　）。","o":["完整性验证","发送方身份认证","防抵赖（不可否认）","数据机密性（加密）"],"a":3,"e":"数字签名=私钥签名+公钥验签，提供\u003cb>完整性、身份认证与防抵赖\u003c/b>，但\u003cb>不提供机密性\u003c/b>（明文可读）；需要保密时需配合对称/非对称加密。"},{"c":"crypto","t":"s","q":"CA（证书颁发机构）的主要作用是（　）。","o":["签发、管理和吊销数字证书","对数据加密","检测入侵","备份数据"],"a":0,"e":"\u003cb>CA负责签发、管理和吊销数字证书\u003c/b>，通过证书链建立公钥的可信体系（PKI），使浏览器能验证服务器身份，是HTTPS信任机制的基石。"},{"c":"crypto","t":"s","q":"PKI（公钥基础设施）的核心组成部分不包括（　）。","o":["CA证书颁发机构","RA注册机构","证书库与证书吊销列表（CRL）","入侵检测系统（IDS）"],"a":3,"e":"PKI由\u003cb>CA、RA、证书库、CRL吊销列表、密钥管理系统\u003c/b>等组成，解决“公钥归属”的信任问题；IDS是安全防护设备，不属于PKI组成部分。"},{"c":"crypto","t":"s","q":"Diffie-Hellman算法主要用于（　）。","o":["在不安全信道上协商共享密钥","数字签名","报文摘要","身份认证"],"a":0,"e":"\u003cb>Diffie-Hellman用于密钥交换（协商共享会话密钥）\u003c/b>，但本身不认证对方身份，需配合数字签名（如TLS中结合证书）防止中间人攻击。"},{"c":"crypto","t":"s","q":"在加密大量业务数据时，通常更高效的选择是（　）。","o":["对称加密（如AES）","非对称加密（如RSA）","哈希函数","数字签名"],"a":0,"e":"\u003cb>对称加密速度快、适合大数据量加密\u003c/b>；非对称加密慢、多用于密钥协商与签名。HTTPS的做法正是：先用非对称协商会话密钥，再用对称加密数据。"},{"c":"crypto","t":"s","q":"口令哈希时引入随机“盐”（salt）的主要目的是（　）。","o":["破坏彩虹表攻击，使相同口令产生不同哈希值","提高口令复杂度","加密口令","压缩存储空间"],"a":0,"e":"\u003cb>加盐使相同口令在不同用户/场景下哈希不同\u003c/b>，彩虹表无法预计算命中；同时应选用慢哈希（bcrypt、scrypt、PBKDF2）提高暴力破解成本。"},{"c":"crypto","t":"s","q":"一次性口令（OTP/动态令牌）的主要优点是（　）。","o":["口令使用一次即失效，抗重放攻击","口令永久有效","无需任何终端设备","不依赖时间"],"a":0,"e":"\u003cb>OTP每次登录使用不同临时口令（时间/事件同步）\u003c/b>，即使被截获也无法重放，常用于双因素认证（如手机动态码、硬件令牌）。"},{"c":"crypto","t":"s","q":"TLS/SSL协议工作在（　）。","o":["应用层与传输层之间","网络层与传输层之间","物理层与数据链路层之间","应用层之上"],"a":0,"e":"\u003cb>TLS位于应用层与传输层之间\u003c/b>，为HTTP、FTP、SMTP等上层协议提供加密、完整性校验与身份认证（HTTPS=HTTP+TLS），是保护Web通信的标准。"},{"c":"crypto","t":"s","q":"理想的哈希函数应具有“雪崩效应”，其含义是（　）。","o":["输入微小的变化会引起输出摘要大量变化","输入越大输出越大","输出可逆","输出长度可变"],"a":0,"e":"\u003cb>雪崩效应：输入1位的改变应引起输出约一半比特变化\u003c/b>，输入与摘要之间无明显规律，是哈希抗碰撞、抗统计分析的基本安全要求。"},{"c":"crypto","t":"s","q":"关于分组密码的CBC（密码分组链接）模式，下列说法正确的是（　）。","o":["每个明文分组先与前一个密文分组异或后再加密，相同的明文块得到不同密文","相同的明文块总产生相同的密文","不依赖初始化向量IV","属于流密码模式"],"a":0,"e":"\u003cb>CBC模式将当前明文块与上一密文块异或后再加密\u003c/b>（首块与随机IV异或），相同明文块在不同位置密文不同；而ECB模式相同明文块密文相同，易泄露规律，安全性较弱。"},{"c":"crypto","t":"s","q":"关于国密SM1算法，下列说法正确的是（　）。","o":["以IP核形式内置于芯片，算法不公开","是哈希算法","是公钥算法","输出256位摘要"],"a":0,"e":"\u003cb>SM1为对称加密算法，算法以IP核形式内置于芯片、不对外公开\u003c/b>，分组128位；与之不同，SM2、SM3、SM4的算法均已公开，可软件实现。"},{"c":"crypto","t":"s","q":"HTTPS建立加密会话时，用于验证服务器身份（防中间人）的机制是（　）。","o":["服务器数字证书（CA签发）","仅靠IP地址","仅靠随机数","仅靠压缩算法"],"a":0,"e":"HTTPS握手阶段，服务器提供\u003cb>CA签发的数字证书\u003c/b>，客户端校验证书链与域名，确认服务器身份后再协商会话密钥；证书无效时浏览器会告警。"},{"c":"crypto","t":"s","q":"在对称分组密码的工作模式中，ECB（电子密码本）模式的主要安全缺陷是（　）。","o":["相同明文块产生相同密文块，泄露数据模式","无法加密","速度过慢","不需要密钥"],"a":0,"e":"\u003cb>ECB模式将每个明文块独立加密，相同明文块→相同密文块\u003c/b>，导致密文呈现可辨识的重复模式，攻击者可据此推断明文结构（如图片轮廓），不推荐用于数据加密。\u003cb>对比\u003c/b>：CBC模式让每个密文块依赖前一块，隐藏了模式；但ECB支持并行、速度快。\u003cb>记忆\u003c/b>：'ECB=电子密码本，一样进一样出，模式泄露'。"},{"c":"crypto","t":"s","q":"CBC（密码分组链接）模式加密时，第一个明文块需要与（　）异或后再加密。","o":["初始化向量（IV）","上一个密文块","随机数","密钥本身"],"a":0,"e":"\u003cb>CBC模式第一个明文块与初始化向量（IV）异或后加密\u003c/b>，后续每个明文块与\u003cb>上一个密文块\u003c/b>异或后加密，形成链接。\u003cb>关键点\u003c/b>：IV必须\u003cb>随机且不可预测\u003c/b>，同一密钥+固定IV会产生相同结果，易被分析；IV不保密但需每次变化。\u003cb>易错点\u003c/b>：CBC链中的异或对象是第一块用IV、其余用前一块密文。"},{"c":"crypto","t":"s","q":"下列分组密码工作模式中，同时提供机密性与认证（认证加密AEAD）的是（　）。","o":["GCM","ECB","CBC","OFB"],"a":0,"e":"\u003cb>GCM（Galois/Counter Mode）是认证加密模式\u003c/b>：在CTR计数模式上叠加GMAC认证，一次加密同时提供\u003cb>机密性、完整性、真实性\u003c/b>，广泛用于TLS 1.2/1.3、IPsec、WiFi（WPA2/3）。\u003cb>对比\u003c/b>：ECB/CBC/CFB/OFB/CTR只提供机密性，需另行配合MAC（加密与MAC要不同密钥）。\u003cb>记忆\u003c/b>：'GCM=机密性+认证一步到位，现代首选'。"},{"c":"crypto","t":"s","q":"在CBC模式下，仅使用MAC（未认证加密）时，正确的做法是（　）。","o":["先加密后MAC（Encrypt-then-MAC），且加密密钥与MAC密钥分离","先MAC后加密共用同一密钥","不进行完整性保护","直接明文发送"],"a":0,"e":"\u003cb>正确组合是'先加密再MAC'（Encrypt-then-MAC）且使用不同密钥\u003c/b>，可防止密文被篡改或Padding Oracle等攻击。\u003cb>辨析\u003c/b>：MAC与加密共用同一密钥是常见错误（密钥分离原则）；先MAC后加密存在密文替换风险。\u003cb>扩展\u003c/b>：现代推荐直接使用GCM等认证加密模式，避免手工组合出错。\u003cb>记忆\u003c/b>：'EtM+密钥分离，或干脆用GCM'。"},{"c":"crypto","t":"s","q":"Padding Oracle（填充预言）攻击针对的主要是（　）。","o":["CBC模式配合服务器对填充错误的不同响应，逐字节还原明文","RSA私钥运算","哈希碰撞","ECC曲线参数"],"a":0,"e":"\u003cb>Padding Oracle攻击利用服务器对'填充错误'与'MAC校验失败'返回不同错误信息（区分响应）\u003c/b>，在CBC模式下逐字节猜测并还原明文，无需知道密钥。\u003cb>防护\u003c/b>：错误响应统一、先验证MAC再检查填充、使用认证加密（GCM）。\u003cb>记忆\u003c/b>：'服务器别把错误细节说破'，统一报错即可防御该侧信道。"},{"c":"crypto","t":"s","q":"RSA算法中，用于加密的是（　），用于解密的是（　）。","o":["公钥、私钥","私钥、公钥","公钥、公钥","私钥、私钥"],"a":0,"e":"\u003cb>RSA加密用公钥、解密用私钥\u003c/b>（公钥公开，私钥保密）；反之，\u003cb>数字签名用私钥签名、公钥验签\u003c/b>。\u003cb>核心逻辑\u003c/b>：'加密=发给谁用谁的公开信息；签名=证明是我，用我私有的钥匙'。\u003cb>易错点\u003c/b>：加密方向与签名方向相反，这是公钥密码学最常考易错点。\u003cb>记忆\u003c/b>：'公钥加密私钥解，私钥签名公钥验'。"},{"c":"crypto","t":"s","q":"数字签名的核心流程是（　）。","o":["对消息哈希后用发送方私钥加密（签名），接收方用发送方公钥验证","对消息整体用接收方公钥加密","用对称密钥加密消息","对消息进行压缩"],"a":0,"e":"\u003cb>数字签名=对消息的哈希值用发送方\u003cb>私钥\u003c/b>进行签名，接收方用发送方\u003cb>公钥\u003c/b>验签\u003c/b>，提供\u003cb>真实性（确认发送者）、完整性（哈希防篡改）与不可否认性\u003c/b>。\u003cb>对比\u003c/b>：加密用接收方公钥（只有接收方私钥能解）；签名用发送方私钥（任何人有公钥都可验证）。\u003cb>记忆\u003c/b>：'签名=私钥签+公钥验；加密=公钥加+私钥解'。"},{"c":"crypto","t":"s","q":"数字信封技术的做法是（　）。","o":["用对称密钥加密数据，再用接收方公钥加密该对称密钥","用公钥加密所有数据","用哈希保存所有数据","用私钥加密数据"],"a":0,"e":"\u003cb>数字信封=混合加密\u003c/b>：先用对称密钥（如AES）加密大数据，再用接收方\u003cb>公钥加密这个对称密钥\u003c/b>；接收方用私钥解开信封取回对称密钥再解密数据。兼得\u003cb>对称加密的高效\u003c/b>与\u003cb>非对称加密的密钥管理安全\u003c/b>。\u003cb>易错点\u003c/b>：公钥只加密'钥匙'不加密大数据（性能考虑）；HTTPS、邮件加密（PGP/S/MIME）均用此原理。"},{"c":"crypto","t":"s","q":"在数字证书（X.509）中，CA的作用是（　）。","o":["对证书持有者身份进行审核并签发/管理证书","负责数据加密","分配IP地址","存储所有明文口令"],"a":0,"e":"\u003cb>CA（证书颁发机构）审核申请者身份后签发证书，并用CA私钥对证书进行签名\u003c/b>；浏览器用CA公钥（内置于信任库）验证证书真实性，并支持证书吊销（CRL/OCSP）。\u003cb>证书链\u003c/b>：根CA→中级CA→终端证书逐级信任。\u003cb>易错点\u003c/b>：证书本身用CA私钥签名而非持有者公钥签名；信任模型基于'浏览器内置信任根'。\u003cb>记忆\u003c/b>：'CA=签发+签名+管理证书的权威'。"},{"c":"crypto","t":"s","q":"X.509数字证书中通常不包含下列哪项内容？","o":["证书持有者的私钥","证书持有者的公钥","CA的数字签名","证书有效期"],"a":0,"e":"\u003cb>证书只包含公钥，私钥绝不出现在证书中\u003c/b>（私钥由持有者自己安全保存）。证书内容包括：持有者公钥、主题（姓名/域名）、签发者CA、有效期、序列号、CA签名等。\u003cb>易错点\u003c/b>：'证书=公开的公钥+CA担保'，私钥泄露出证书即泄露身份。\u003cb>记忆\u003c/b>：'证书装公钥，私钥自己留'。"},{"c":"crypto","t":"s","q":"证书吊销后，客户端校验证书当前状态一般通过（　）。","o":["CRL（吊销列表）或OCSP（在线状态协议）","重新安装证书","修改浏览器时间","查询DNS"],"a":0,"e":"\u003cb>证书吊销状态通过CRL（CA定期发布的吊销列表）或OCSP（实时在线查询）校验\u003c/b>，用于确认证书是否在有效期内被提前吊销（如私钥泄露、域名变更）。\u003cb>易错点\u003c/b>：证书有效期≠仍可信；'过期'和'吊销'是两回事。OCSP比CRL实时性更好。\u003cb>记忆\u003c/b>：'吊销查询=CRL/OCSP'。"},{"c":"crypto","t":"s","q":"TLS 1.2握手中，客户端验证服务器身份主要依据（　）。","o":["服务器出示的数字证书与证书链校验","服务器的MAC地址","服务器的IP","服务器的对称密钥"],"a":0,"e":"\u003cb>TLS握手中服务器向客户端出示数字证书（含公钥），客户端校验证书链、有效期、域名与吊销状态\u003c/b>，通过后用于后续密钥协商（如ECDHE），实现服务器身份认证并防止中间人。\u003cb>扩展\u003c/b>：双向TLS（mTLS）还要求客户端出示证书。\u003cb>易错点\u003c/b>：证书验证失败（如自签名）浏览器会告警，这正是防中间人的关键环节。"},{"c":"crypto","t":"s","q":"前向保密（Forward Secrecy）是指（　）。","o":["即使服务器长期私钥泄露，已捕获的历史会话密钥也无法被解出","加密速度更快","不需要证书","密钥可以重复使用"],"a":0,"e":"\u003cb>前向保密：会话密钥由临时密钥（如ECDHE每次握手生成）协商，即使服务器长期私钥事后泄露，攻击者也无法解密之前抓取的历史会话流量\u003c/b>。\u003cb>实现\u003c/b>：使用DHE/ECDHE密钥交换（临时DH参数）。\u003cb>对比\u003c/b>：RSA密钥交换无前向保密（会话密钥被私钥保护，私钥泄露则历史会话可解）。\u003cb>记忆\u003c/b>：'前向保密=今日泄私钥，昨日流量不解密'，TLS 1.3强制要求。"},{"c":"crypto","t":"s","q":"SSL/TLS协议的发展中，已彻底废弃、存在严重漏洞（POODLE等）的版本是（　）。","o":["SSLv3","TLS 1.3","TLS 1.2","TLS 1.0的后续版本"],"a":0,"e":"\u003cb>SSLv3因POODLE（填充预言攻击）等严重漏洞已被彻底废弃\u003c/b>，任何设备都不应支持。\u003cb>现状\u003c/b>：TLS 1.2仍广泛使用；\u003cb>TLS 1.3\u003c/b>为当前最新推荐（强制前向保密、移除弱算法、握手更快）。\u003cb>安全基线\u003c/b>：关闭SSLv2/SSLv3/TLS 1.0/1.1，启用TLS 1.2/1.3。\u003cb>记忆\u003c/b>：'SSL全废、TLS1.0/1.1过期、1.2主流、1.3最新'。"},{"c":"crypto","t":"s","q":"Diffie-Hellman（DH）密钥交换协议的主要作用是（　）。","o":["在不安全的公开信道上安全地协商出共享密钥","加密存储数据","验证数字签名","压缩数据"],"a":0,"e":"\u003cb>DH协议让双方在公开信道上通过交换公开参数（基于离散对数）协商出一个只有双方知道的共享密钥\u003c/b>，无需预先共享秘密。\u003cb>局限\u003c/b>：传统DH\u003cb>不提供身份认证\u003c/b>，易被中间人攻击，需结合数字签名/证书（如TLS的ECDHE+证书）。\u003cb>记忆\u003c/b>：'DH=公开信道协商共享密钥，但不认人'。"},{"c":"crypto","t":"s","q":"使用哈希算法存储口令时，正确的做法是（　）。","o":["加随机盐（salt）并使用慢哈希（如bcrypt/argon2）","直接用MD5不加盐","使用可逆加密存储","明文存储并加密数据库"],"a":0,"e":"\u003cb>口令存储应'加盐+慢哈希'\u003c/b>：盐（随机值）防止相同口令产生相同哈希（防彩虹表）；慢哈希（bcrypt、scrypt、argon2、PBKDF2）增大暴力破解计算成本。MD5/SHA-1快且无盐，极易被彩虹表与GPU暴力破解。\u003cb>易错点\u003c/b>：加盐后盐与哈希一起存储；同一用户重设口令盐应更新。\u003cb>记忆\u003c/b>：'口令存储=盐+慢哈希'。"},{"c":"crypto","t":"s","q":"彩虹表（Rainbow Table）攻击针对的是（　）。","o":["未加盐的口令哈希，用预计算表快速反查明文","RSA密钥","TLS证书","防火墙规则"],"a":0,"e":"\u003cb>彩虹表用预计算的'哈希→明文'对照表快速反查口令\u003c/b>，攻击普通未加盐哈希效率极高。\u003cb>防护\u003c/b>：\u003cb>加盐\u003c/b>（每个口令不同盐→相同口令哈希不同→彩虹表失效）、使用慢哈希、提高口令熵。\u003cb>对比\u003c/b>：暴力破解是逐个试，彩虹表是查表。\u003cb>记忆\u003c/b>：'彩虹表专打无盐哈希，加盐即破'。"},{"c":"crypto","t":"s","q":"HMAC（基于哈希的消息认证码）与普通哈希（如MD5直接对消息哈希）的区别是（　）。","o":["HMAC需要密钥参与，可同时验证完整性与真实性；普通哈希无密钥只能验完整性","没有区别","HMAC更慢但更弱","普通哈希更安全"],"a":0,"e":"\u003cb>HMAC=哈希函数+共享密钥\u003c/b>，只有知道密钥的一方才能生成/验证MAC，因此同时提供\u003cb>完整性（防篡改）与真实性（确认来源）\u003c/b>；普通哈希无密钥，任何人都能伪造，只能防意外损坏、不能防恶意篡改。\u003cb>应用\u003c/b>：TLS、API签名（HMAC-SHA256）。\u003cb>记忆\u003c/b>：'哈希防改不防假，HMAC带钥匙既防改又防假'。"},{"c":"crypto","t":"s","q":"流密码RC4已被弃用的主要原因是（　）。","o":["密钥调度存在偏差，可被统计攻击恢复明文偏置，配合BEAST等攻击可解密TLS流量","加密速度太慢","密钥太长","只能加密小数据"],"a":0,"e":"\u003cb>RC4存在严重密钥偏差（早期字节可预测）\u003c/b>，被BEAST、Bar-Mitzvah等攻击利用，可逐步解密TLS密文，因此RC4已被标准禁用。\u003cb>对比\u003c/b>：现代流式场景推荐AES-CTR/AES-GCM或ChaCha20。\u003cb>记忆\u003c/b>：'RC4=有偏+被破=弃用'；顺带记忆WEP也因用RC4而极弱。"},{"c":"crypto","t":"s","q":"侧信道（Side-Channel）攻击利用的是（　）。","o":["密码实现运行时的物理或时序信息（运行时间、功耗、电磁、缓存）","密码算法本身的数学弱点","密钥长度不足","明文太长"],"a":0,"e":"\u003cb>侧信道攻击利用实现层面的信息泄露\u003c/b>：如不同输入导致不同\u003cb>运行时间\u003c/b>（时序攻击）、功耗曲线（功耗分析）、缓存访问模式、电磁辐射等，绕过数学复杂度获取密钥。\u003cb>对比\u003c/b>：密码分析攻击针对算法数学；侧信道针对\u003cb>实现\u003c/b>。\u003cb>防护\u003c/b>：恒定时间实现、密钥混淆、随机化。\u003cb>记忆\u003c/b>：'算法没破，破的是实现跑起来漏的边角料信息'。"},{"c":"crypto","t":"s","q":"量子计算机对传统RSA/ECC的主要威胁是（　）。","o":["Shor算法可在多项式时间内分解大整数、求解离散对数，导致RSA/ECC被破","增加加密强度","减少密钥长度","加速HTTPS"],"a":0,"e":"\u003cb>量子计算机运行Shor算法可在多项式时间内破解大整数分解（RSA）与离散对数（ECC/DH）\u003c/b>，一旦大规模量子计算机出现，现有公钥体系将失效。\u003cb>应对\u003c/b>：研究\u003cb>后量子密码（PQC，如基于格的Kyber/Dilithium）\u003c/b>与量子密钥分发（QKD）。\u003cb>易错点\u003c/b>：对称加密（AES）受量子影响较小（Grover算法仅将密钥强度减半，如AES-256≈128位安全）。\u003cb>记忆\u003c/b>：'量子打公钥（RSA/ECC），对称只减半'。"},{"c":"crypto","t":"s","q":"对称加密与非对称加密相比，主要优点是（　）。","o":["加解密速度快、适合大数据量加密","密钥分发不需要保护","不需要管理密钥","公钥可公开"],"a":0,"e":"\u003cb>对称加密（AES/DES/SM4）计算速度快，适合大量数据加密\u003c/b>；缺点是密钥分发与数量管理困难（N个人需N(N-1)/2对密钥）。\u003cb>非对称\u003c/b>：密钥管理简便（公钥公开），但速度慢，不适合大数据。\u003cb>实际方案\u003c/b>：混合加密（数字信封）结合两者优点。\u003cb>记忆\u003c/b>：'对称=快但密钥难发；非对称=慢但密钥好管'。"},{"c":"crypto","t":"s","q":"在密码学中，密钥分级管理（如根密钥、主密钥、会话密钥）的目的是（　）。","o":["通过密钥分层降低单点泄露影响并便于管理","提高加密速度","减少密钥数量到1个","替代所有算法"],"a":0,"e":"\u003cb>密钥分级：用上层密钥（主密钥）加密保护下层密钥（数据/会话密钥）\u003c/b>，实现'密钥加密密钥'体系，降低大密钥量管理的复杂度，并限制泄露影响范围。\u003cb>扩展\u003c/b>：KMS（密钥管理服务）负责密钥生成、存储、轮换、销毁的全生命周期管理。\u003cb>记忆\u003c/b>：'一层钥匙开一层锁，泄露不连锅端'。"},{"c":"crypto","t":"s","q":"密钥轮换（定期更换密钥）的主要目的是（　）。","o":["限制单个密钥被破解后暴露的数据量，降低长期泄露风险","让加密更美观","替代口令修改","提高网络带宽"],"a":0,"e":"\u003cb>密钥轮换缩小'密钥被破→换钥前'暴露的数据窗口\u003c/b>，即使某次密钥泄露也能及时止损，同时满足合规要求（如密评、行业规范）。\u003cb>对比\u003c/b>：口令定期修改针对身份，密钥轮换针对加密材料，两者都要做。\u003cb>记忆\u003c/b>：'轮换=把泄露窗口变小'，长密钥使用期=大风险敞口。"},{"c":"crypto","t":"s","q":"国密算法中，用于数字签名与密钥交换、基于椭圆曲线的非对称算法是（　）。","o":["SM2","SM3","SM4","SM1"],"a":0,"e":"\u003cb>SM2是基于椭圆曲线的非对称算法\u003c/b>，用于数字签名、密钥交换与加密（类似ECC+RSA职能），是国密体系的核心公钥算法。\u003cb>分工回顾\u003c/b>：SM3=哈希（256位），SM4=对称分组（128位），SM1=芯片内置对称（不公开），SM9=标识密码。\u003cb>易错点\u003c/b>：'签名找SM2'、'哈希找SM3'、'加密找SM4'，一一对应即可。"},{"c":"crypto","t":"s","q":"商用密码应用安全性评估（密评）主要评估的内容是（　）。","o":["密码应用的合规性、正确性、有效性","网络带宽利用率","服务器CPU性能","数据库索引效率"],"a":0,"e":"\u003cb>密评评估商用密码应用的'合规性（是否符合法规标准）、正确性（是否按规范使用）、有效性（防护是否有效）'三性\u003c/b>；《密码法》要求关键信息基础设施使用商用密码并开展密评，与等保测评衔接。\u003cb>易错点\u003c/b>：密评管'密码用得对不对'，不是网络或性能测评。\u003cb>记忆\u003c/b>：'密评=合规、正确、有效三件套'。"},{"c":"crypto","t":"s","q":"消息认证码（MAC）与数字签名的区别是（　）。","o":["MAC使用对称密钥、只能验证对称密钥持有者；数字签名使用私钥，具有不可否认性","没有区别","MAC更安全","数字签名不能验证完整性"],"a":0,"e":"\u003cb>MAC用对称共享密钥\u003c/b>，第三方无法区分消息由哪一方产生（无不可否认性）；\u003cb>数字签名用发送方私钥\u003c/b>，任何持有公钥者都能验证且签名者无法抵赖，具有\u003cb>不可否认性\u003c/b>。\u003cb>选型\u003c/b>：只需双方认证用MAC；需要对外证明来源（合同、证书）用数字签名。\u003cb>记忆\u003c/b>：'MAC认人不分家，签名有法律效力'。"},{"c":"crypto","t":"s","q":"Kerberos协议中，TGT（票据授予票据）由（　）签发，其有效期通常为8～10小时。","o":["认证服务器（AS）","票据授予服务器（TGS）","应用服务器","客户端"],"a":0,"e":"\u003cb>TGT由认证服务器（AS）在用户首次认证成功后签发\u003c/b>，之后用户凭TGT向TGS换取访问具体服务的票据（ST）。\u003cb>流程\u003c/b>：AS发TGT→TGS发服务票据→访问服务。\u003cb>易错点\u003c/b>：签发TGT的是AS，不是TGS；Kerberos严重依赖时间同步（偏差超票据有效期即失效）。\u003cb>记忆\u003c/b>：'AS发TGT，TGS发ST'。"},{"c":"crypto","t":"s","q":"口令（密码）安全中，对抗在线暴力破解最直接有效的措施是（　）。","o":["账户锁定策略（连续失败N次锁定）与延迟应答","把口令明文显示","取消口令验证","增加内存"],"a":0,"e":"\u003cb>账户锁定（如连续5次失败锁定30分钟）可阻断在线暴力破解\u003c/b>；配合失败延迟、验证码、来源IP限制更有效。\u003cb>对比\u003c/b>：加盐慢哈希对抗的是'数据库泄露后的离线破解'；锁定对付'实时逐个试密码'。\u003cb>易错点\u003c/b>：锁定策略需防攻击者利用它制造DoS（锁死合法用户），可结合IP维度的限制。\u003cb>记忆\u003c/b>：'在线爆破→锁定+延迟；离线爆破→盐+慢哈希'。"},{"c":"crypto","t":"s","q":"下列关于一次性口令（OTP，如动态令牌）的说法正确的是（　）。","o":["每次登录使用不同口令，可抵御口令重用与重放攻击","口令固定不变","不需要时间同步","只能离线使用"],"a":0,"e":"\u003cb>一次性口令每次使用后即失效（基于时间TOTP或计数器HOTP），防口令重用、防重放\u003c/b>，即使被截获也无法再次使用，常作为MFA第二因素。\u003cb>注意\u003c/b>：基于时间的TOTP需要设备与服务器时间同步（时间偏差过大验证失败）。\u003cb>记忆\u003c/b>：'OTP=一次一密，用后即焚'。"},{"c":"crypto","t":"s","q":"在TLS 1.3中，默认强制采用的密钥交换方式（保证前向保密）是（　）。","o":["ECDHE（临时椭圆曲线DH）","静态RSA密钥交换","不加密","使用明文"],"a":0,"e":"\u003cb>TLS 1.3默认/仅支持(EC)DHE密钥交换\u003c/b>，移除静态RSA密钥交换与RC4等弱算法，从而\u003cb>强制实现前向保密\u003c/b>并简化握手。\u003cb>对比\u003c/b>：TLS 1.2可选RSA（无前向保密），因此建议配置为仅使用ECDHE。\u003cb>记忆\u003c/b>：'TLS1.3=必须(EC)DHE=天然前向保密'。"},{"c":"crypto","t":"s","q":"为提升口令安全性，下列口令策略中不推荐的是（　）。","o":["使用简单的字典单词（如password123）","长度不低于12位且包含大小写数字符号","启用多因素认证","定期更换并避免重复使用旧口令"],"a":0,"e":"\u003cb>字典单词+数字（password123）极易被字典攻击/规则爆破命中，是最差口令\u003c/b>。\u003cb>推荐\u003c/b>：长口令（12位以上）、混合字符、开启MFA、口令管理器生成随机口令。\u003cb>易错点\u003c/b>：复杂度与长度相比，\u003cb>长度是防爆破的关键\u003c/b>（指数级增大搜索空间）；'密码学强度'考题常考口令熵与长度优先。\u003cb>记忆\u003c/b>：'长而不乱优于短而复杂'。"},{"c":"crypto","t":"s","q":"AES-256与AES-128的主要区别是（　）。","o":["密钥长度不同（256位与128位），256位抗暴力破解强度更高","分组长度不同","迭代轮数相同","256位不能用于商用"],"a":0,"e":"\u003cb>AES-128/192/256区别在密钥长度\u003c/b>，分组长度均为128位；密钥越长，暴力破解搜索空间越大（128位≈3.4×10^38，256位≈1.16×10^77）。\u003cb>安全强度\u003c/b>：AES-128在可预见的计算能力下已足够安全，AES-256用于更高保密要求（含国密密评推荐、量子Grover减半后仍有余量）。\u003cb>易错点\u003c/b>：密钥长度≠分组长度；AES分组固定128位。\u003cb>记忆\u003c/b>：'数字=密钥位数'。"},{"c":"crypto","t":"s","q":"SSL证书加密强度相关的考点：RSA 2048位的安全强度大致相当于ECC（　）位。","o":["256","1024","128","64"],"a":0,"e":"\u003cb>ECC（如P-256）用256位即可达到约RSA 3072位、优于RSA 2048位的安全强度\u003c/b>，密钥更短、运算更快。\u003cb>对比记忆\u003c/b>：RSA 2048≈ECC 224～256位；这就是SM2/ECC在资源受限设备（物联网、移动端）受欢迎的原因。\u003cb>易错点\u003c/b>：非对称强度比较'密钥位数'不能直接等同，ECC位数小但强度高。\u003cb>记忆\u003c/b>：'ECC位数小、强度高、跑得快'。"},{"c":"crypto","t":"s","q":"在数据加密场景中，传输加密通常使用对称算法（如AES）而不是非对称算法（如RSA），主要原因是（　）。","o":["对称算法加解密速度快，适合大数据量实时传输","非对称算法密钥短不安全","对称算法不需要密钥","非对称算法不可逆"],"a":0,"e":"\u003cb>非对称算法（RSA/ECC）运算慢（大数模幂运算），不适合逐字节加密大量数据\u003c/b>；传输加密用对称算法（AES/SM4）保证性能，密钥则通过非对称（如TLS的ECDHE+证书）或数字信封安全协商/分发。\u003cb>记忆\u003c/b>：'数据用对称，钥匙用非对称'，这是混合加密体系的通用设计。"},{"c":"crypto","t":"s","q":"下列做法中，能有效防止重放攻击的是（　）。","o":["在协议中加入随机数/时间戳/序号并由接收方校验","使用固定口令","关闭日志","加密但不校验"],"a":0,"e":"\u003cb>防重放=让每个报文唯一且可校验时效\u003c/b>：加入\u003cb>随机数（nonce）、时间戳、单调递增序号\u003c/b>，接收方校验'新鲜度'，旧报文（已用过的nonce/过期时间戳）直接丢弃。\u003cb>对比\u003c/b>：加密防窃听、MAC防篡改，但都不防重放；TLS、Kerberos、OTP均含防重放设计。\u003cb>记忆\u003c/b>：'防重放=验新鲜'。"},{"c":"crypto","t":"m","q":"下列算法中，属于对称加密算法的有（　）。","o":["AES","DES","SM4","SM2"],"a":[0,1,2],"e":"\u003cb>AES、DES、SM4 均为对称加密算法\u003c/b>：加解密使用同一密钥，速度快但密钥分发需另行解决；SM2 是基于椭圆曲线（ECC）的非对称算法，公钥加密、私钥解密。\u003cb>记忆\u003c/b>：国密家族'2'=非对称、'3'=哈希、'4'=对称分组。"},{"c":"crypto","t":"m","q":"下列属于哈希（散列）算法的有（　）。","o":["MD5","SHA-256","SM3","RSA"],"a":[0,1,2],"e":"MD5（128位）、SHA-256（256位）、SM3（256位）均为\u003cb>哈希算法\u003c/b>：单向不可逆、定长输出，用于完整性校验与口令存储；\u003cb>RSA 是非对称加密算法\u003c/b>（基于大整数分解难题），既不是哈希也不是对称加密。"},{"c":"crypto","t":"s","q":"柯克霍夫原则（Kerckhoffs's principle）的核心思想是（　）。","o":["密码系统的安全性应仅依赖于密钥的保密，算法本身可以公开","算法和密钥都必须保密才安全","密钥越短越便于记忆，因此越安全","加密次数越多越安全"],"a":0,"e":"\u003cb>柯克霍夫原则：假设敌人完全了解加密算法，系统仍应保持安全——安全性只系于密钥\u003c/b>。这是现代密码算法（AES、RSA）公开接受审查的设计基础；依赖'算法保密'的隐匿式安全经不起公开检验，也难以大规模运维。\u003cb>易错点\u003c/b>：混淆'算法保密'与'密钥保密'。\u003cb>记忆\u003c/b>：'藏钥匙，不藏锁的设计图'。"},{"c":"auth","t":"s","q":"下列关于用户口令的说法错误的是（　）。","o":["口令不能设置为空","口令长度越长，安全性越高","复杂口令安全性足够高，不需要定期修改","口令认证是最常见的认证机制"],"a":2,"e":"\u003cb>C错误\u003c/b>：再复杂的口令也可能因钓鱼、键盘记录等泄露，定期更换仍是必要的安全习惯。其余说法均正确。"},{"c":"auth","t":"s","q":"以下属于“基于实体所有”的鉴别方法的是（　）。","o":["用户通过自己设置的口令登录系统","用户使用个人指纹通过指纹识别","用户利用与系统协商的秘密函数应答挑战","用户使用智能卡完成身份鉴别"],"a":3,"e":"三要素：\u003cb>你知道\u003c/b>（口令、秘密函数）、\u003cb>你是\u003c/b>（指纹等生物特征）、\u003cb>你有\u003c/b>（智能卡、U盾）。智能卡属于“实体所有”。"},{"c":"auth","t":"s","q":"以下属于基于实体所有的鉴别威胁的是（　）。","o":["用于鉴别的物品可能被复制","用于鉴别的物品可能被篡改","用于鉴别的物品可能被损坏","以上都是"],"a":3,"e":"基于\u003cb>实体所有\u003c/b>（物品/令牌）的鉴别方式面临\u003cb>复制（克隆）、篡改、损坏、丢失\u003c/b>等威胁，故选'以上都是'。\u003cb>三类鉴别因素及威胁\u003c/b>：你知道的（口令→易被猜测/钓鱼）；你拥有的（智能卡/U盾→易被复制/丢失）；你固有的（生物特征→不可更换、易被采集复制）。\u003cb>扩展\u003c/b>：多因素认证（MFA）组合不同类别因素，显著提升安全性。"},{"c":"auth","t":"s","q":"下面不是SQL Server支持的身份认证方式的是（　）。","o":["SQL Server认证","生物认证","Windows NT集成认证","SQL Server混合认证"],"a":1,"e":"SQL Server支持Windows集成认证与SQL Server认证（混合模式），\u003cb>不支持生物认证\u003c/b>。"},{"c":"auth","t":"s","q":"字典攻击是黑客利用自动执行的程序猜测用户名和密码，审计这类攻击通常需要借助（　）。","o":["强化的验证方法和强壮的加密","全面的日志记录和入侵监测系统","强化的验证方法和入侵监测系统","全面的日志记录和强壮的加密"],"a":1,"e":"字典攻击表现为大量失败登录尝试，审计主要依赖\u003cb>全面的日志记录+入侵监测系统（IDS）\u003c/b>发现异常。"},{"c":"auth","t":"s","q":"Kerberos认证协议最严重的问题是它严重依赖于（　）。","o":["时间同步","密钥长度","网络带宽","用户数量"],"a":0,"e":"Kerberos票据含时间戳，\u003cb>严重依赖时间同步\u003c/b>；客户端与服务端时间偏差超过票据有效期将导致票据失效，可被利用实施拒绝服务。部署上应配置NTP统一时钟并限制票据有效期。"},{"c":"auth","t":"s","q":"Kerberos是一种常用的身份认证协议，它采用的加密算法是（　）。","o":["MD5","Elgamal","DES","RSA"],"a":2,"e":"传统Kerberos协议采用\u003cb>DES对称加密\u003c/b>算法（新版扩展支持AES等更强算法）。\u003cb>Kerberos体系\u003c/b>：AS认证服务器发放TGT，TGS票据授予服务器发放服务票据；\u003cb>核心缺陷=严重依赖时间同步\u003c/b>（时间偏差过大票据失效，可被用于拒绝服务攻击）。\u003cb>记忆\u003c/b>：Kerberos=对称加密+票据+时间同步依赖，用于Windows域（AD）与多数SSO场景。"},{"c":"auth","t":"s","q":"Kerberos协议中TGS的中文含义是（　）。","o":["认证服务器","票据授予服务器","票据授予票据","应用服务器"],"a":1,"e":"TGS=Ticket Granting Server，\u003cb>票据授予服务器\u003c/b>，负责向客户端发放访问具体服务的服务票据。"},{"c":"auth","t":"s","q":"Kerberos协议中TGT指的是（　）。","o":["票据授予票据，用于向TGS申请服务票据","服务票据本身","客户端口令哈希","时间同步令牌"],"a":0,"e":"TGT=Ticket Granting Ticket，\u003cb>票据授予票据\u003c/b>，由AS发放，客户端凭TGT向TGS申请具体服务票据，有效期通常8-10小时。"},{"c":"auth","t":"s","q":"Kerberos协议中，AS（认证服务器）的主要作用是（　）。","o":["发放服务票据","验证用户身份并向其发放TGT","存储应用数据","同步各主机时间"],"a":1,"e":"AS=Authentication Server，验证用户身份后\u003cb>发放TGT\u003c/b>；凭TGT再向TGS换取服务票据。"},{"c":"auth","t":"s","q":"下列属于双因素认证的是（　）。","o":["连续输入两次口令","口令+指纹","使用两个不同账号登录","设置更长的口令"],"a":1,"e":"双因素=两种不同类别的因子组合（你知道的+你是的/你有的），\u003cb>口令+指纹\u003c/b>符合；两次口令仍属同一因子。"},{"c":"auth","t":"s","q":"用户名＋口令属于哪一类鉴别因子？（　）","o":["知识因子（你知道什么）","持有因子（你有什么）","特征因子（你是什么）","位置因子"],"a":0,"e":"三类因子：\u003cb>知识\u003c/b>（口令、PIN）、\u003cb>持有\u003c/b>（智能卡、U盾、令牌）、\u003cb>特征\u003c/b>（指纹、人脸）。仅口令属于单因素鉴别，强度最弱，泄露途径最多。"},{"c":"auth","t":"s","q":"生物特征鉴别（如指纹）的主要缺点是（　）。","o":["采集设备昂贵","一旦泄露终身无法更换","识别速度太慢","必须连接互联网"],"a":1,"e":"指纹、虹膜等特征\u003cb>终身不可变更\u003c/b>，特征库一旦泄露即造成永久性风险；且存在误识率与拒识率的平衡问题。其优点是不易遗忘、不怕丢失、必须本人到场。"},{"c":"auth","t":"s","q":"基于知识的鉴别方式面临的主要威胁是（　）。","o":["口令被猜测、窃取、钓鱼泄露","鉴别物品被复制","设备硬件损坏","网络中断"],"a":0,"e":"口令类威胁包括\u003cb>暴力破解、字典攻击、撞库、键盘记录、钓鱼\u003c/b>等。对应防护：复杂度策略、账户锁定、防钓鱼意识教育，以及根本手段——叠加第二因素（MFA）。"},{"c":"auth","t":"s","q":"单点登录（SSO）的含义是（　）。","o":["一次认证后可访问多个授权的系统","完全不需要认证","匿名访问所有系统","浏览器密码自动填充工具"],"a":0,"e":"SSO让用户\u003cb>登录一次即可访问彼此信任的多个系统\u003c/b>，减少口令重复使用带来的风险。典型协议：Kerberos、CAS、SAML、OIDC。风险是凭证一旦失守影响面扩大，应配合MFA使用。"},{"c":"auth","t":"s","q":"由资源属主自主决定谁能访问该资源的访问控制模型是（　）。","o":["自主访问控制（DAC）","强制访问控制（MAC）","基于角色的访问控制（RBAC）","基于属性的访问控制"],"a":0,"e":"三大模型：\u003cb>DAC\u003c/b>属主自主授权（典型：Linux文件权限）；\u003cb>MAC\u003c/b>由系统按安全标签强制（典型：SELinux）；\u003cb>RBAC\u003c/b>按角色授权（企业主流）。三者对比是常考内容。"},{"c":"auth","t":"s","q":"强制访问控制（MAC）的特点是（　）。","o":["由系统依据安全标签强制实施，主体不能自行转让权限","资源属主可随意授权他人","仅依赖口令保护","只适用于个人电脑"],"a":0,"e":"MAC对主客体都赋予安全级别标签（如绝密/机密/秘密），\u003cb>由系统强制检查，属主无权更改\u003c/b>，安全性高但管理成本大，用于军事等高安全场景，对应TCSEC的B1级以上要求。"},{"c":"auth","t":"s","q":"RBAC模型的核心思想是（　）。","o":["权限直接分配给用户个人","将权限分配给角色，用户通过被赋予的角色获得权限","按IP地址授权","按上网时间段授权"],"a":1,"e":"\u003cb>RBAC在用户与权限之间加入“角色”层\u003c/b>：岗位调整只需改角色归属，权限随角色批量生效，管理简单、符合最小权限原则，是企业系统与数据库权限管理的主流模型。"},{"c":"auth","t":"s","q":"防御在线口令暴力破解的有效措施是（　）。","o":["设置账户锁定阈值并辅以验证码","使用更长的用户名","定期删除日志","关闭登录审计"],"a":0,"e":"\u003cb>锁定阈值\u003c/b>（连续失败N次锁定）直接中断在线爆破；验证码抑制自动化工具。口令复杂度防字典，MFA保证口令泄露后仍有防线——单一措施都不完备，需组合使用。"},{"c":"auth","t":"s","q":"系统中口令的安全存储方式是（　）。","o":["明文存储便于找回","仅MD5哈希","加盐的慢哈希（bcrypt/PBKDF2/加盐SM3）","加密后存在共享Excel中"],"a":2,"e":"禁止明文；裸MD5/SHA可被彩虹表与GPU爆破秒杀。\u003cb>正确做法：随机盐＋慢哈希\u003c/b>。传输环节还需HTTPS等加密通道，防止被嗅探。"},{"c":"auth","t":"s","q":"Kerberos服务默认使用的端口是（　）。","o":["88","389","464","749"],"a":0,"e":"Kerberos默认\u003cb>UDP/TCP 88\u003c/b>。389是LDAP，749是kadmin管理端口。与其他常考端口区分：SSH 22、DNS 53、HTTPS 443。"},{"c":"auth","t":"s","q":"AAA安全框架指的是（　）。","o":["认证、授权、审计（计费）","加密、审计、报警","账号、口令、权限","防火墙、IDS、IPS"],"a":0,"e":"\u003cb>Authentication（认证：你是谁）＋Authorization（授权：你能做什么）＋Accounting（审计/计费：你做了什么）\u003c/b>。它是网络准入与堡垒机4A体系的理论基础。"},{"c":"auth","t":"s","q":"银行动态口令令牌（硬件令牌/U盾）属于哪类鉴别因子？（　）","o":["知识因子","持有因子","特征因子","行为因子"],"a":1,"e":"时间同步的动态口令令牌属于\u003cb>持有因子（你有什么）\u003c/b>。口令＋令牌即构成双因素认证；短信验证码以手机为载体，也归入持有因子。"},{"c":"auth","t":"f","q":"只要采用了多因素认证，就一定比单因素认证更安全。","a":1,"e":"不绝对。因素强度与实现质量决定效果——例如短信验证码可被SIM卡 swapping/补卡劫持。但合理组合的多因素（口令＋U盾/指纹）确实能显著提升安全性，是等保三级明确要求。"},{"c":"auth","t":"s","q":"“账号口令+手机短信验证码”登录方式属于（　）。","o":["单因素认证","双因素认证","生物特征认证","匿名认证"],"a":1,"e":"口令=你知道的（知识因素），短信验证码=你拥有的（手机/SIM卡，持有因素），两类因子组合即\u003cb>双因素认证\u003c/b>，可显著抵御撞库与单纯口令泄露。更稳妥的方式是TOTP动态令牌或硬件密钥（短信存在被拦截、SIM卡被补办的风险）。"},{"c":"auth","t":"s","q":"“智能卡+PIN码”的组合属于（　）。","o":["单因素认证","双因素认证（持有+知识）","双因素认证（知识+生物）","仅持有因素"],"a":1,"e":"智能卡=你拥有的，PIN=你知道的，仅窃取卡片或仅套取PIN均无法通过，属\u003cb>双因素\u003c/b>。生物特征（指纹/虹膜）属于第三类“你是的”因素，三者组合为多因素。"},{"c":"auth","t":"s","q":"访问控制的三个基本要素是（　）。","o":["主体、客体、控制策略","用户、口令、权限","加密、认证、审计","资产、威胁、脆弱性"],"a":0,"e":"\u003cb>主体（S）发起访问\u003c/b>（用户、进程），\u003cb>客体（O）被访问\u003c/b>（文件、服务、端口），\u003cb>控制策略\u003c/b>定义谁可以对谁做什么操作。注意主体与客体可随场景互换；D选项是风险评估要素。"},{"c":"auth","t":"s","q":"Windows文件ACL、Linux文件属主自主授权（chmod）体现的访问控制模型是（　）。","o":["DAC（自主访问控制）","MAC（强制访问控制）","RBAC（基于角色）","ZTA（零信任）"],"a":0,"e":"\u003cb>DAC：资源所有者可自主决定谁能访问并转授权\u003c/b>，灵活但权限易扩散、难以集中审计，是商用操作系统的默认模型。MAC由系统按安全标签强制实施，RBAC以角色为桥梁分配权限。"},{"c":"auth","t":"s","q":"依据主体与客体的安全标签实施控制、用户无权更改的访问控制模型是（　）。","o":["DAC","MAC（强制访问控制）","RBAC","ACL"],"a":1,"e":"\u003cb>MAC按安全等级/标签强制约束\u003c/b>（如上读下写等规则防泄密），用户无法自行改标签，控制强、成本高，典型应用于军事系统和SELinux/AppArmor。等保三级“基于角色的访问控制”对应的则是RBAC。"},{"c":"auth","t":"s","q":"企业中按“岗位职责”定义权限、员工入职即绑定角色的访问控制模型是（　）。","o":["DAC","MAC","RBAC（基于角色的访问控制）","自由裁决访问控制"],"a":2,"e":"\u003cb>RBAC：用户→角色→权限\u003c/b>，授权按岗位定义，入职能上岗、转岗换角色、离职撤角色，天然贴合最小权限与审计要求，是企业管理系统与等保推荐的主流模型。"},{"c":"auth","t":"s","q":"最小权限原则的含义是（　）。","o":["所有人权限相同","仅授予主体完成其任务所必需的最小权限","权限越高效率越高","普通用户不需要任何权限"],"a":1,"e":"\u003cb>最小权限：只给“刚好够用”的权限\u003c/b>。落地手段：按角色裁剪、默认拒绝、sudo临时授权、定期权限复核。发生泄露或误操作时影响面（爆炸半径）最小。与其互补的还有职责分离与需要知道原则。"},{"c":"auth","t":"s","q":"“开发人员不得直接操作生产环境”体现的安全管理原则是（　）。","o":["最小权限","职责分离（SoD）","深度防御","默认安全"],"a":1,"e":"\u003cb>职责分离\u003c/b>：把敏感关键任务拆分给多人（开发-测试-部署、申请-审批-执行），防止单人完成高危链条，配套双人复核与操作审计，属预防性管理控制。"},{"c":"auth","t":"s","q":"RADIUS协议实现AAA服务，其认证授权与计费默认使用的端口是（　）。","o":["TCP 1812/1813","UDP 1812/1813","UDP 1645/1646","TCP 49"],"a":1,"e":"\u003cb>RADIUS基于UDP，1812认证授权、1813计费\u003c/b>（早期使用1645/1646），仅对口令部分加密；TACACS+基于TCP 49，报文全加密且可按命令粒度授权，更适合网络设备管理认证。AAA=Authentication认证、Authorization授权、Accounting计账。"},{"c":"auth","t":"s","q":"关于单点登录（SSO），下列说法错误的是（　）。","o":["一次认证后可访问多个授权系统","减少口令重复使用带来的风险","认证中心一旦被攻破影响全局","SSO可以完全替代双因素认证"],"a":3,"e":"\u003cb>D错误\u003c/b>：SSO解决“便捷与口令分散”问题，但认证中心成为单点风险，恰恰更需要双因素认证、异常登录检测加以保护，两者是互补而非替代。常见协议：CAS、SAML 2.0、OIDC。"},{"c":"auth","t":"s","q":"OAuth 2.0协议主要用于（　）。","o":["用户的身份认证","授权第三方应用在受限范围内访问用户资源","加密网络传输","防御SQL注入"],"a":1,"e":"OAuth 2.0是\u003cb>授权框架\u003c/b>：资源所有者、客户端、授权服务器、资源服务器四角色，\u003cb>授权码模式\u003c/b>（配合PKCE）最常用。注意它解决“授权”而非“认证”，认证需在其上叠加OIDC，这是常见概念混淆点。"},{"c":"auth","t":"s","q":"JWT（JSON Web Token）由三个部分组成，正确的是（　）。","o":["头部、载荷、签名","头部、正文、落款","密钥、数据、证书","用户名、口令、角色"],"a":0,"e":"\u003cb>Header（算法）.Payload（声明，如sub/exp）.Signature（签名）\u003c/b>。签名防篡改，可验证不可伪造；但载荷仅Base64URL编码\u003cb>并不加密\u003c/b>，切勿放敏感信息。风险点：alg置none攻击、弱密钥可离线爆破，应白名单算法并使用强密钥。"},{"c":"auth","t":"s","q":"防御会话固定攻击的正确做法是（　）。","o":["使用更长的会话ID","用户认证成功后重新生成会话标识","会话ID永久有效","仅依赖HTTPS"],"a":1,"e":"会话固定攻击=诱骗受害者使用攻击者预设的会话ID，若登录后ID不变即被冒用。\u003cb>认证成功、权限提升后必须更换会话ID\u003c/b>；并配合HttpOnly、Secure、SameSite属性及空闲超时失效。HTTPS只防窃听，不解决ID被预置的问题。"},{"c":"auth","t":"s","q":"下列口令存储方案中，最不可取的是（　）。","o":["随机盐+bcrypt慢哈希","随机盐+PBKDF2","明文存储以便找回口令","盐+SHA-256（迭代次数高）"],"a":2,"e":"\u003cb>明文存储是绝对红线\u003c/b>；可逆加密同样危险（密钥可被一并拖走）；无盐MD5/SHA-1会被彩虹表与GPU穷举秒破。正确做法：\u003cb>随机盐+bcrypt/PBKDF2/argon2等慢哈希\u003c/b>，传输走HTTPS，配合口令策略与错误次数锁定。"},{"c":"auth","t":"s","q":"OAuth 2.0协议的核心作用是（　）。","o":["加密通信","授权第三方应用代表用户访问资源，而不暴露用户凭证","身份认证","文件传输"],"a":1,"e":"\u003cb>OAuth 2.0是授权框架，让用户授权第三方应用有限度访问其资源（如用微信登录第三方APP）\u003c/b>，但不暴露用户口令。四种授权模式：授权码模式（最安全）、隐式模式、资源所有者密码凭证模式、客户端凭证模式。注意：OAuth是授权不是认证，认证用OIDC。"},{"c":"auth","t":"s","q":"SAML（安全断言标记语言）的主要用途是（　）。","o":["加密文件","实现跨域单点登录（SSO）的身份认证","网络扫描","数据库管理"],"a":1,"e":"\u003cb>SAML基于XML，通过身份提供者（IdP）与服务提供者（SP）之间交换断言实现SSO\u003c/b>，企业级应用广泛。SAML 2.0是主流版本。SAML安全注意：签名断言防篡改、加密断言属性、限制断言有效期与重放。OIDC是现代的JSON/Web替代方案。"},{"c":"auth","t":"s","q":"RBAC（基于角色的访问控制）的核心思想是（　）。","o":["每个用户单独配置权限","权限分配给角色，用户通过关联角色获得权限","所有用户拥有相同权限","权限直接分配给IP地址"],"a":1,"e":"\u003cb>RBAC=用户→角色→权限\u003c/b>。管理员只需管理少量角色即可覆盖大量用户，简化了权限管理。RBAC模型分层：RBAC0基础、RBAC1支持角色继承、RBAC2支持约束（互斥角色、基数限制）。等保三级要求基于角色的访问控制。"},{"c":"auth","t":"s","q":"MAC（强制访问控制）与DAC（自主访问控制）的根本区别是（　）。","o":["没有区别","MAC由系统强制执行安全策略，用户不能自行授权；DAC由资源所有者自主决定访问权限","MAC由用户决定，DAC由系统决定","MAC只用于文件，DAC只用于网络"],"a":1,"e":"\u003cb>DAC：资源所有者自行设置权限（如Linux文件属主chmod）\u003c/b>，灵活但可能被滥用；\u003cb>MAC：系统根据安全标签（如机密/秘密/公开）和用户 Clearance强制执行\u003c/b>，即使root也无法绕过。SELinux/AppArmor是Linux的MAC实现。"},{"c":"auth","t":"s","q":"多因素认证（MFA）的三种典型因素是（　）。","o":["知道什么、有什么、是什么","颜色、声音、触觉","身高、体重、年龄","用户名、密码、IP"],"a":0,"e":"\u003cb>三因素：知识因素（口令/PIN）+持有因素（手机/U盾/令牌）+固有因素（指纹/面部/虹膜）\u003c/b>。MFA要求至少两个不同因素组合（如口令+短信验证码是最常见的双因素认证）。等保三级要求两种以上鉴别技术组合。"},{"c":"auth","t":"s","q":"TOTP动态令牌的工作原理是（　）。","o":["每次发送短信获取验证码","基于共享密钥和当前时间生成一次性密码（如Google Authenticator）","在服务器端存储固定密码表","每次登录由管理员手动生成"],"a":1,"e":"\u003cb>TOTP（Time-based One-Time Password）：客户端与服务端共享密钥+时间戳经HMAC计算生成6位动态码\u003c/b>，30秒换一次。HOTP基于计数器替代时间。优势：离线可用、不依赖短信通道（防SIM劫持）；风险：设备丢失需备用恢复码。"},{"c":"auth","t":"s","q":"Kerberos认证中TGT（票据授予票据）的作用是（　）。","o":["直接访问应用服务","代替用户口令，凭TGT向TGS获取各类服务票据","加密数据库","验证数字签名"],"a":1,"e":"\u003cb>用户认证成功后获得TGT，后续访问各服务时凭TGT向TGS请求对应服务票据（Service Ticket），不再重复输入口令\u003c/b>，实现单点登录。TGT有效期通常8-10小时，缓存在本地内存。Kerberos最大缺陷：强依赖时间同步。"},{"c":"auth","t":"s","q":"SSO（单点登录）的核心优势是（　）。","o":["提高密码强度","用户登录一次即可访问多个相互信任的系统，无需重复认证","减少服务器数量","加密所有网络流量"],"a":1,"e":"\u003cb>SSO：一次认证，多系统通行\u003c/b>。常见实现：Kerberos（Windows域环境）、SAML（Web SSO企业级）、OIDC/OAuth2.0（现代Web/移动端）、CAS。SSO降低了用户记忆多套口令的负担，但风险集中——主认证点被攻破则所有关联系统同时暴露。"},{"c":"auth","t":"s","q":"LDAP协议的主要用途是（　）。","o":["加密网页","集中管理目录服务，如统一用户账号、组织架构查询","传输邮件","网络抓包"],"a":1,"e":"\u003cb>LDAP（轻量目录访问协议）用于查询和修改目录服务\u003c/b>，如AD（Active Directory）、OpenLDAP存储的统一用户信息。常见操作：bind（认证）、search（查询）、add/modify/delete。端口389（明文）/636（TLS加密）。AD环境常与Kerberos SSO配合。"},{"c":"auth","t":"s","q":"PAM（可插拔认证模块）的架构优势是（　）。","o":["仅用于Windows系统","将认证功能模块化，应用程序不关心具体认证方式","只能使用密码认证","替代LDAP"],"a":1,"e":"\u003cb>PAM将系统认证与具体认证方式解耦\u003c/b>：应用程序只需调用PAM API，PAM配置决定实际认证方式（密码/指纹/OTP/智能卡等），通过动态加载.so模块实现。Linux系统（/etc/pam.d/）广泛使用PAM，灵活且易于扩展。"},{"c":"auth","t":"s","q":"JWT（JSON Web Token）由三部分组成，正确顺序是（　）。","o":["Header.Payload.Signature","Payload.Header.Signature","Signature.Header.Payload","Token.Key.Data"],"a":0,"e":"\u003cb>JWT=Header（算法+类型）.Payload（声明信息）.Signature（签名）\u003c/b>。签名部分用HMAC或RSA对前两部分签名保证完整性。JWT是无状态的（服务端不存Session），但一旦签发无法轻易撤销，需配合短有效期+黑名单机制。常见漏洞：算法篡改为none、密钥弱。"},{"c":"auth","t":"s","q":"在等保三级中，身份鉴别要求“两种或两种以上组合”是指（　）。","o":["任意两种即可","两种及以上不同类型的鉴别技术组合（如口令+生物识别+令牌中的两种）","必须同时使用口令、U盾和指纹","两种以上相同口令"],"a":1,"e":"\u003cb>两种或两种以上不同类型的鉴别技术组合\u003c/b>：如口令（知识因素）+动态口令/生物识别/智能卡（持有/固有因素）。如果用“口令+短信验证码”也算两种因素，但短信验证码安全性不如OTP令牌（有SIM劫持风险）。等保强调多因素，不是多口令。"},{"c":"auth","t":"s","q":"Active Directory域环境中，GPO（组策略对象）的用途是（　）。","o":["创建数据库表","集中配置和管理域内计算机与用户的安全策略、软件部署等","发送邮件","编译代码"],"a":1,"e":"\u003cb>GPO可集中管理：账户策略（口令策略、锁定策略）、审核策略、软件安装、脚本执行、注册表配置、防火墙规则等\u003c/b>。GPO按层级应用（本地→站点→域→OU）后执行的生效。安全管理中常通过GPO统一下发安全基线配置。"},{"c":"auth","t":"f","q":"OAuth 2.0的主要功能是身份认证（Authentication），用于验证用户身份。","a":1,"e":"错误。OAuth 2.0是授权框架（Authorization），用于让用户授权第三方应用访问其资源。身份认证应使用OpenID Connect（OIDC），它建立在OAuth 2.0之上，增加了ID Token提供身份认证功能。"},{"c":"auth","t":"f","q":"SELinux工作在强制访问控制（MAC）模式下，即使root用户也必须遵守安全策略。","a":0,"e":"正确。SELinux是Linux内核的MAC实现，基于安全上下文（user:role:type:level）强制执行策略，即使root也无法绕过。SELinux有Enforcing（强制执行）、Permissive（仅记录不阻断）、Disabled三种模式。"},{"c":"auth","t":"s","q":"ABAC（基于属性的访问控制）的核心思想是（　）。","o":["按IP地址控制","基于主体、资源、环境属性的组合进行动态访问控制决策","按固定角色控制","按时间段控制"],"a":1,"e":"\u003cb>ABAC：综合用户属性（职位/部门/级别）、资源属性（密级/类别）、环境属性（时间/地点/设备安全状态）\u003c/b>动态决策。相比RBAC更灵活，但也更复杂。云环境中ABAC被广泛使用（如AWS IAM Policy基于标签的策略）。"},{"c":"auth","t":"s","q":"RADIUS协议的主要用途是（　）。","o":["Web缓存","集中式认证授权计费（AAA），常用于VPN、WiFi 802.1X、网络设备管理登录","电子邮件传输","文件共享"],"a":1,"e":"\u003cb>RADIUS用于集中AAA\u003c/b>。工作流程：客户端向RADIUS服务器发送认证请求，服务器验证后返回结果。典型场景：企业WiFi 802.1X认证、VPN接入认证、交换机/路由器管理登录。UDP 1812/1813端口。"},{"c":"auth","t":"s","q":"802.1X认证协议中三个参与方是（　）。","o":["客户端、交换机、路由器","请求者（Supplicant）、认证者（Authenticator/交换机）、认证服务器（RADIUS）","浏览器、服务器、数据库","用户名、密码、验证码"],"a":1,"e":"\u003cb>802.1X是端口级网络接入认证\u003c/b>：请求者发起EAP认证、认证者转发认证信息、认证服务器（RADIUS/AD）验证并授权。未认证端口只能走EAPoL流量。认证失败则端口拒绝访问。"},{"c":"auth","t":"s","q":"Linux中pam_faillock模块的作用是（　）。","o":["加密文件系统","记录登录失败次数并锁定账户（防暴力破解）","管理用户组","配置网络接口"],"a":1,"e":"\u003cb>pam_faillock：记录连续登录失败次数，达到阈值后锁定账户\u003c/b>。配置在/etc/pam.d/system-auth中，设置deny=5（失败5次锁定）、unlock_time=300（锁定5分钟）。是Linux防暴力破解的基础措施。"},{"c":"auth","t":"s","q":"OIDC（OpenID Connect）与OAuth 2.0的关系是（　）。","o":["完全无关","OIDC建立在OAuth 2.0之上，增加了身份认证层（ID Token）","OAuth 2.0是OIDC的新版本","OIDC替代了OAuth 2.0"],"a":1,"e":"\u003cb>OIDC在OAuth 2.0的授权层之上增加了身份认证层\u003c/b>：通过ID Token（JWT格式）传递用户身份信息。OAuth 2.0只解决授权，OIDC同时解决认证和授权。OIDC核心端点：authorization/token/userinfo。"},{"c":"auth","t":"s","q":"生物识别认证的安全风险不包括（　）。","o":["生物特征不可更换（一旦泄露终身风险）","活体检测可能被绕过","生物特征比密码更容易记忆","传感器欺骗和重放攻击"],"a":2,"e":"\u003cb>生物识别风险：特征不可撤销（密码泄露可改，指纹不可换）、活体检测被绕过（3D面具/高仿指纹）、数据库泄露\u003c/b>、传感器级攻击。比密码更容易记忆不是安全风险而是便利性。推荐多因素认证。"},{"c":"auth","t":"s","q":"强密码策略通常要求包含（　）。","o":["仅要求长度","大写字母、小写字母、数字和特殊字符中至少三类组合，且满足最小长度要求","仅要求包含数字","仅要求包含特殊字符"],"a":1,"e":"\u003cb>典型强密码策略：最小8-12位、大写+小写+数字+特殊字符中至少三类\u003c/b>，且不包含用户名/常见字典词。等保三级要求口令复杂度检查。NIST最新建议：优先长密码短语而非复杂但短且需频繁改的密码。"},{"c":"auth","t":"s","q":"Windows Credential Guard的核心安全机制是（　）。","o":["加密硬盘","使用虚拟化安全（VBS）隔离凭据存储，防止lsass被窃取时泄露凭据","禁用所有账户","强制改密码"],"a":1,"e":"\u003cb>Credential Guard使用Hyper-V虚拟化创建安全隔离的容器存储凭据\u003c/b>，即使攻击者获取SYSTEM权限运行Mimikatz也无法提取凭据。前提：TPM 2.0、UEFI Secure Boot、启用虚拟化。"},{"c":"auth","t":"s","q":"等保访问控制要求不包括（　）。","o":["应为登录用户分配账户和权限","应为所有用户提供管理员权限","应仅授予最小权限","应定期清理过期账户"],"a":1,"e":"\u003cb>等保访问控制核心要求：账户与权限管理、最小权限原则、权限分离、权限定期复核\u003c/b>。为所有用户提供管理员权限严重违反最小权限原则，是等保测评的不合格项。"},{"c":"auth","t":"f","q":"RBAC中一个用户只能被分配一个角色。","a":1,"e":"错误。RBAC允许一个用户关联多个角色。例如一个用户可以同时拥有开发者和项目成员两个角色，同时获得两个角色的权限集合。RBAC1支持角色继承，RBAC2支持角色互斥和基数约束。"},{"c":"auth","t":"s","q":"AAA安全模型中的三个A分别指（　）。","o":["认证（Authentication）、授权（Authorization）、审计/计费（Accounting）","认证、加密、授权","审计、加密、认证","授权、计费、加密"],"a":0,"e":"\u003cb>AAA=认证（你是谁）+授权（能做什么）+审计/计费（做了什么）\u003c/b>，是网络接入、VPN、运维访问控制的基础模型（如RADIUS、TACACS+）。"},{"c":"auth","t":"s","q":"RADIUS认证协议默认使用的端口是（　）。","o":["认证1812/计费1813","1812/1814","49","53"],"a":0,"e":"\u003cb>RADIUS默认认证端口1812、计费端口1813（UDP）\u003c/b>，广泛用于企业WiFi（802.1X）、VPN与设备AAA认证；TACACS+则基于TCP 49。"},{"c":"auth","t":"s","q":"关于RADIUS与TACACS+，下列说法错误的是（　）。","o":["RADIUS基于UDP，TACACS+基于TCP","RADIUS合并认证与授权，TACACS+分离认证、授权、计费","TACACS+加密整个报文，RADIUS只加密口令","两者都只能用于拨号认证"],"a":3,"e":"两者都是网络AAA协议：\u003cb>RADIUS基于UDP（1812/1813），TACACS+基于TCP（49）\u003c/b>；TACACS+将认证/授权/计费分离并加密整包，常用于思科设备。两者均可用于接入与设备认证，不限拨号。"},{"c":"auth","t":"s","q":"802.1X是一种（　）。","o":["基于端口的网络访问控制协议","无线加密算法","防火墙规则","VPN协议"],"a":0,"e":"\u003cb>802.1X是基于端口的接入控制\u003c/b>：客户端（Supplicant）须通过认证服务器（RADIUS）认证后端口才开放，常用于企业WiFi与有线接入的安全准入。"},{"c":"auth","t":"s","q":"自主访问控制（DAC）的含义是（　）。","o":["资源属主可自主决定谁可以访问自己的资源","权限由中央管理员统一强制","基于安全标签","不支持任何授权"],"a":0,"e":"\u003cb>DAC允许资源属主按意愿授权/撤销访问\u003c/b>（如Linux文件权限rwx、Windows NTFS ACL），灵活但安全性弱于MAC；大多数普通系统采用DAC。"},{"c":"auth","t":"s","q":"基于角色的访问控制（RBAC）中，权限的分配对象是（　）。","o":["角色","直接授权给个人用户","安全标签","网络端口"],"a":0,"e":"\u003cb>RBAC把权限授予“角色”，再将用户加入角色\u003c/b>，实现权限与组织职责解耦，新增/调整人员只需变更角色，便于统一管理与审计，是企业系统主流模型。"},{"c":"auth","t":"s","q":"“最小权限原则”是指（　）。","o":["只授予完成工作所需的最小权限","权限越大越好","所有人权限相同","禁止一切权限"],"a":0,"e":"\u003cb>最小权限：用户/程序仅拥有完成任务所需的最小权限\u003c/b>，降低账号被滥用、恶意软件提权的风险，是安全基线与等保加固的核心原则。"},{"c":"auth","t":"s","q":"设置账户锁定策略（如连续5次失败锁定30分钟）的主要目的是（　）。","o":["遏制口令暴力破解攻击","提高口令复杂度","防止口令泄露","实现单点登录"],"a":0,"e":"\u003cb>账户锁定可有效遏制在线暴力破解\u003c/b>（攻击者无法无限尝试），配合登录失败日志（lastb/审核日志）可发现并封禁攻击源。"},{"c":"auth","t":"s","q":"OAuth 2.0是一种（　）。","o":["授权框架，让第三方在用户授权下访问其受保护资源","对称加密算法","身份认证协议","防火墙协议"],"a":0,"e":"\u003cb>OAuth 2.0是授权框架\u003c/b>，通过访问令牌（Access Token）委托授权（如“微信授权登录”）；严格说它侧重“授权”而非“认证”，认证常由OpenID Connect完成。"},{"c":"auth","t":"s","q":"单点登录（SSO）带来的主要好处是（　）。","o":["用户一次登录即可访问多个关联系统","彻底消灭口令","一个账号共享给多人","无需任何认证"],"a":0,"e":"\u003cb>SSO一次认证、多处通行\u003c/b>，改善体验并减少口令疲劳，同时便于集中管理认证策略；常用实现有SAML、OAuth/OIDC、CAS等。"},{"c":"auth","t":"s","q":"使用CA签发的数字证书进行身份认证，通常属于（　）鉴别方式。","o":["基于实体所有（拥有私钥凭证）","基于你知道的口令","基于生物特征","基于地理位置"],"a":0,"e":"证书认证以“持有私钥”为核心：验证方用公钥发起挑战，证明你\u003cb>确实拥有与证书对应的私钥\u003c/b>，属于“你拥有的凭证”类鉴别（还可再叠加口令构成双因素）。"},{"c":"auth","t":"s","q":"OAuth 2.0中，授权码模式（Authorization Code）最安全的原因之一是（　）。","o":["授权码通过后端服务器换令牌，令牌不暴露给浏览器/前端","授权码直接返回给浏览器","不需要登录","令牌永远不过期"],"a":0,"e":"\u003cb>授权码模式中，授权码先经浏览器回传，再由后端服务器用自己的凭据（client secret）向授权服务器换取访问令牌\u003c/b>，令牌只在受信任的后端传输，浏览器端拿不到令牌，降低泄露风险。\u003cb>对比\u003c/b>：隐式模式（implicit）把令牌直接返回给浏览器，现已不推荐。\u003cb>扩展\u003c/b>：配合PKCE（代码挑战）进一步防授权码截获。\u003cb>记忆\u003c/b>：'授权码=后端换令牌，令牌不落地浏览器'。"},{"c":"auth","t":"s","q":"JWT（JSON Web Token）由哪三部分组成？","o":["Header（头部）、Payload（载荷）、Signature（签名）","用户名、密码、令牌","公钥、私钥、证书","IP、端口、协议"],"a":0,"e":"\u003cb>JWT由Header.Payload.Signature三段以点连接组成\u003c/b>：Header声明算法与类型，Payload携带用户/声明数据（base64url编码），Signature对前两段用密钥签名以防篡改。\u003cb>安全要点\u003c/b>：Payload仅编码不加密，\u003cb>不得放敏感信息\u003c/b>；服务端必须验证签名。\u003cb>易错点\u003c/b>：JWT可读（base64可解码），'加密'与'编码'是两回事。\u003cb>记忆\u003c/b>：'头、体、签，三段式'。"},{"c":"auth","t":"s","q":"JWT常见攻击中，'alg:none'攻击的原理是（　）。","o":["攻击者将算法改为none，伪造无签名的Token绕过校验","暴力破解密钥","窃取Cookie","SQL注入"],"a":0,"e":"\u003cb>若服务端未严格校验JWT头部alg字段，攻击者改为'none'即可构造无签名Token且被接受\u003c/b>，从而伪造任意身份。\u003cb>防护\u003c/b>：服务端白名单校验算法、禁用none、按固定算法验签并校验密钥类型。\u003cb>记忆\u003c/b>：'alg:none=告诉服务器'这Token没签名'，服务器不查就中招'；同族攻击还有RS256→HS256算法混淆。"},{"c":"auth","t":"s","q":"会话Cookie应设置的属性中，能有效降低XSS窃取会话风险的是（　）。","o":["HttpOnly","Domain","Path","Expires"],"a":0,"e":"\u003cb>HttpOnly属性使JavaScript无法读取该Cookie\u003c/b>（document.cookie取不到），即使存在XSS也无法直接窃取会话。\u003cb>其他重要属性\u003c/b>：Secure（仅HTTPS传输）、SameSite（防CSRF跨站携带）。\u003cb>易错点\u003c/b>：HttpOnly防XSS偷会话，SameSite防CSRF，Secure防明文传输，三者职责不同。\u003cb>记忆\u003c/b>：'HttpOnly=脚本禁读，Secure=只走加密，SameSite=防跨站带Cookie'。"},{"c":"auth","t":"s","q":"会话固定（Session Fixation）攻击的利用方式是（　）。","o":["攻击者先获取/设置一个会话ID并诱导受害者使用，登录后沿用该会话ID实施劫持","暴力破解会话ID","窃取数据库","伪造数字证书"],"a":0,"e":"\u003cb>会话固定=攻击者先取得（或让受害者浏览器设置）一个已知的会话ID，诱导受害者用它登录，登录成功后会话仍可被攻击者利用\u003c/b>（会话ID未更换）。\u003cb>防护\u003c/b>：\u003cb>登录成功后重新生成会话ID\u003c/b>、会话ID只由服务端生成并绑定IP/UA、设置超时。\u003cb>记忆\u003c/b>：'登录后必换会话ID'是防固定最核心手段。"},{"c":"auth","t":"s","q":"多因素认证（MFA）的含义是（　）。","o":["组合两种或以上不同类型的认证因素（如口令+动态令牌）","设置两个相同口令","同时开两个登录页面","双网卡"],"a":0,"e":"\u003cb>MFA组合\u003cb>不同类型\u003c/b>的认证因素：你知道的（口令）、你拥有的（手机/令牌/USBKey）、你固有的（指纹/人脸）\u003c/b>；仅'口令+短信验证码'若同为'你知道/你拥有'仍算两类，但都属弱因素时效果有限。\u003cb>对应等保\u003c/b>：等保三级要求'两种或以上组合鉴别技术'即MFA。\u003cb>记忆\u003c/b>：'不同类型才算MFA，同类叠加意义有限'。"},{"c":"auth","t":"s","q":"TOTP（基于时间的一次性口令）动态令牌验证时，关键前提是（　）。","o":["客户端与服务器时间同步（时间窗口内有效）","令牌能联网","不需要密钥","与IP绑定"],"a":0,"e":"\u003cb>TOTP基于当前时间+共享密钥计算一次性口令\u003c/b>，客户端与服务器时间偏差必须在允许窗口内（通常±30秒），否则验证失败。\u003cb>对比\u003c/b>：HOTP基于计数器。TOTP无需联网，但依赖时间同步；这与Kerberos'依赖时间同步'异曲同工。\u003cb>易错点\u003c/b>：时间不同步→TOTP失效，是常见运维排错点。\u003cb>记忆\u003c/b>：'TOTP=T+OTP，认的是时间'。"},{"c":"auth","t":"s","q":"零信任安全模型的核心思想是（　）。","o":["不信任任何位置的任何请求，持续验证身份与权限（默认拒绝）","信任内网一切流量","只信任外部网络","取消所有认证"],"a":0,"e":"\u003cb>零信任'永不信任、始终验证'\u003c/b>：无论请求来自内网/外网，一律先认证后授权，最小权限+持续动态评估+微分段，替代'内网可信'的传统边界模型。\u003cb>落地技术\u003c/b>：SDP（软件定义边界）、IAM、微隔离、多因素认证、持续信任评估。\u003cb>易错点\u003c/b>：零信任不是'不做认证'，而是\u003cb>不因位置而信任\u003c/b>。\u003cb>记忆\u003c/b>：'零信任=内网也不白给，每步都要验'。"},{"c":"auth","t":"s","q":"SDP（软件定义边界）实现零信任的主要方式是（　）。","o":["先认证设备/用户身份，再按需开放最小网络访问（隐藏服务）","把防火墙全部关闭","开放全部端口","依赖内网IP信任"],"a":0,"e":"\u003cb>SDP基于'先验证、后连接'：接入者先完成设备/用户认证，SDP控制器动态下发策略，只对被授权者开放特定的最小访问范围\u003c/b>，服务对未授权者'隐身'，有效缩小攻击面。\u003cb>记忆\u003c/b>：'SDP=看不见的边界，认证后才显形'；是零信任落地的主流技术之一。"},{"c":"auth","t":"s","q":"RBAC（基于角色的访问控制）的授权方式是（　）。","o":["把权限赋予角色，用户关联角色从而获得权限","按数据内容动态授权","按安全标签授权","每人单独设置全部权限"],"a":0,"e":"\u003cb>RBAC=权限→角色→用户\u003c/b>：管理员把权限授予角色，再把角色分配给用户，简化管理并符合最小权限。\u003cb>对比\u003c/b>：ABAC基于属性（用户/资源/环境）策略授权，更细更灵活；MAC基于安全标签强制；DAC由资源属主自主决定。\u003cb>易错点\u003c/b>：RBAC管'角色'，ABAC管'属性'，MAC管'标签'。\u003cb>记忆\u003c/b>：'RBAC=角色当中间层'。"},{"c":"auth","t":"s","q":"基于属性的访问控制（ABAC）的特点是基于（　）进行动态授权。","o":["主体、资源、环境等多维属性及策略","固定的角色列表","物理位置","口令复杂度"],"a":0,"e":"\u003cb>ABAC依据用户属性、资源属性、环境属性（时间/位置/设备）等组合出策略（Policy），可精细动态授权\u003c/b>，适合大数据、云环境复杂场景。\u003cb>对比\u003c/b>：RBAC按角色粗粒度；ABAC更灵活但策略设计与性能成本更高。\u003cb>易错点\u003c/b>：'ABAC=Attribute属性'，见到'属性+策略'选ABAC。\u003cb>记忆\u003c/b>：'ABAC=多维属性拼策略'。"},{"c":"auth","t":"s","q":"Linux中文件的owner（属主）拥有全部rwx权限，该机制属于（　）访问控制。","o":["自主访问控制（DAC）","强制访问控制（MAC）","基于角色的访问控制（RBAC）","基于属性的访问控制（ABAC）"],"a":0,"e":"\u003cb>Linux文件权限由属主自主设置（chmod）并自由授权，属于DAC（自主访问控制）\u003c/b>。\u003cb>对比\u003c/b>：SELinux在Linux上叠加的是MAC（基于安全标签策略）；Windows NTFS ACL也属DAC类。\u003cb>易错点\u003c/b>：'Linux rwx=自主'，'SELinux=强制'，两者可共存于同一系统。\u003cb>记忆\u003c/b>：'chmod谁都能改=自主'。"},{"c":"auth","t":"s","q":"LDAP（轻量目录访问协议）的主要用途是（　）。","o":["集中存储与查询目录信息（用户、组织、证书等）","传输文件","加密网络","负载均衡"],"a":0,"e":"\u003cb>LDAP用于集中管理目录型数据：用户账号、组织架构、邮箱、证书、打印机等\u003c/b>，是AD域、统一身份认证（SSO）、企业通讯录的底层目录服务。\u003cb>注意\u003c/b>：LDAP默认端口389（LDAPS为636）；AD还支持Kerberos认证。\u003cb>易错点\u003c/b>：LDAP是'目录数据库+访问协议'，不是加密协议也不是文件传输协议。\u003cb>记忆\u003c/b>：'LDAP=企业通讯录/账号的中央数据库'。"},{"c":"auth","t":"s","q":"Active Directory（AD）域环境中，负责用户身份认证的Kerberos组件关系是（　）。","o":["域控制器（KDC）集认证服务（AS）与票据服务（TGS）于一体","客户端自己生成票据","没有认证组件","DNS负责认证"],"a":0,"e":"\u003cb>AD域中域控（Domain Controller）即KDC（密钥分发中心），内嵌AS与TGS\u003c/b>，负责整个域的用户认证与票据发放；客户端凭域账号登录后获得TGT，再换取服务票据。\u003cb>扩展\u003c/b>：域渗透攻击（黄金票据、Kerberoasting）正是针对Kerberos机制。\u003cb>易错点\u003c/b>：KDC=AS+TGS，由域控统一承担。\u003cb>记忆\u003c/b>：'域控=KDC=认证大脑'。"},{"c":"auth","t":"s","q":"单点登录（SSO）的核心价值是（　）。","o":["用户一次认证后无需重复登录即可访问多个应用系统","提高密码强度","加密所有应用","离线使用所有系统"],"a":0,"e":"\u003cb>SSO（单点登录）使用户在一个认证中心登录一次，即可免密访问多个关联系统\u003c/b>，改善体验并实现\u003cb>集中认证、统一账号管理与审计\u003c/b>。\u003cb>实现\u003c/b>：基于OAuth2.0/OIDC、SAML、CAS、JWT。\u003cb>安全注意\u003c/b>：SSO单点失守=全部沦陷，认证中心须重点防护。\u003cb>记忆\u003c/b>：'一次登录，全线通行；认证中心是金钥匙'。"},{"c":"auth","t":"s","q":"SAML协议主要用于（　）场景。","o":["企业Web单点登录与身份联合（基于XML断言）","文件加密","无线认证","数据库审计"],"a":0,"e":"\u003cb>SAML（安全断言标记语言）基于XML，在企业间/应用间交换认证与授权断言（Assertion），是传统企业SSO与联邦身份的主流协议\u003c/b>（如办公门户、云应用）。\u003cb>对比\u003c/b>：OIDC/OAuth2基于JSON更轻量，适合互联网API场景。\u003cb>易错点\u003c/b>：'SAML=XML+企业SSO'，'OIDC=JSON+现代API'。\u003cb>记忆\u003c/b>：'SAML说话是XML'。"},{"c":"auth","t":"s","q":"OIDC（OpenID Connect）在OAuth 2.0基础上增加的核心能力是（　）。","o":["提供标准化的用户身份信息（ID Token），实现身份认证","实现文件传输","提供数据库查询","实现数据加密"],"a":0,"e":"\u003cb>OIDC在OAuth2.0授权框架上增加ID Token（含用户身份声明，JWT格式）与UserInfo端点，把'授权'扩展为'身份认证'\u003c/b>，是当今互联网登录（'用XX登录'）的事实标准。\u003cb>辨析\u003c/b>：OAuth2管'能访问什么'（授权），OIDC管'你是谁'（认证）。\u003cb>记忆\u003c/b>：'OIDC=OAuth+身份'。"},{"c":"auth","t":"s","q":"CAPTCHA（验证码）的主要安全作用是（　）。","o":["区分人与自动化程序，防止撞库/批量注册/暴力破解","提高网速","加密传输","替代口令"],"a":0,"e":"\u003cb>验证码用于区分真人用户与自动化脚本\u003c/b>，可有效遏制\u003cb>撞库、批量注册、恶意刷票、登录爆破、垃圾评论\u003c/b>等自动化攻击。\u003cb>局限\u003c/b>：验证码不提供认证强度，且有被OCR/打码平台绕过的风险。\u003cb>扩展\u003c/b>：行为验证（滑块）、设备指纹常作为补充。\u003cb>记忆\u003c/b>：'验证码=人机测试，挡脚本不挡真人'。"},{"c":"auth","t":"s","q":"生物特征认证（指纹、人脸）相比口令的主要优点是（　）。","o":["无需记忆、难以伪造（不患遗忘）","完全无法被复制","可随时更换","不需要任何存储"],"a":0,"e":"\u003cb>生物特征'是本人固有'，无需记忆、使用便捷\u003c/b>；但存在\u003cb>不可更换性\u003c/b>（泄露后无法重置）、可被采集复制（照片/指纹膜）、误识率与隐私问题。\u003cb>安全实践\u003c/b>：生物特征宜作为MFA因素之一，不宜单独用于高价值场景。\u003cb>易错点\u003c/b>：'生物特征不可更换'是常考点。\u003cb>记忆\u003c/b>：'优在方便、劣在不可换'。"},{"c":"auth","t":"s","q":"最小权限原则（Least Privilege）的要求是（　）。","o":["用户/程序只被授予完成其任务所必需的最小权限","所有用户都是管理员","禁止一切授权","权限越大越好"],"a":0,"e":"\u003cb>最小权限：任何主体（用户、进程、服务）只拥有完成本职工作所需的最小权限，用完即收敛\u003c/b>，从而把权限滥用与泄露的影响降到最低。\u003cb>落地\u003c/b>：普通用户不配管理员、服务用低权限账号、sudo按需授权、定期权限复核。\u003cb>易错点\u003c/b>：'最小权限'不是'不授权'，而是'恰到好处'。\u003cb>记忆\u003c/b>：'够用就好，多一分都是风险'。"},{"c":"auth","t":"s","q":"关于口令锁定策略，下列配置中最合理的是（　）。","o":["连续5次失败锁定30分钟并审计告警","失败无限制不锁定","第一次失败即永久锁定","锁定后永远无法解锁"],"a":0,"e":"\u003cb>合理配置：连续失败达到阈值（如5次）后锁定一段时间（如30分钟），并产生审计告警，管理员可解锁\u003c/b>；既能拦爆破，又不过度影响用户体验、防止被利用做账号DoS。\u003cb>易错点\u003c/b>：永久锁定易被攻击者恶意触发造成业务中断；'锁定+告警+可解锁'是平衡方案。\u003cb>记忆\u003c/b>：'有阈值、有时长、可解锁、有告警'。"},{"c":"auth","t":"s","q":"Kerberos认证中最严重的已知问题是（　）。","o":["严重依赖时间同步，时间偏差过大导致票据失效/被利用","加密强度过高","不支持多用户","不能跨平台"],"a":0,"e":"\u003cb>Kerberos严重依赖客户端与服务器的时钟同步\u003c/b>：时间偏差超过票据有效期范围会导致认证失败，攻击者也可利用时间偏差实施拒绝服务。\u003cb>其他考点\u003c/b>：票据可被离线破解（如AS-REP Roasting）、黄金/白银票据伪造。\u003cb>易错点\u003c/b>：'时间同步'是Kerberos标志性缺陷。\u003cb>记忆\u003c/b>：'Kerberos认时间，对不上表就罢工'。"},{"c":"auth","t":"s","q":"账号生命周期管理的正确顺序是（　）。","o":["创建→使用→变更→停用→删除（回收）","删除→创建→使用","只创建不回收","使用→创建→删除"],"a":0,"e":"\u003cb>账号生命周期：申请创建→日常使用→权限/状态变更→离职停用→归档删除（回收）\u003c/b>；重点是\u003cb>离职/转岗及时停用与权限回收\u003c/b>，防止'幽灵账号'与权限滞留。\u003cb>扩展\u003c/b>：配合定期账号审计（清理长期未登录、可疑账号）、最小权限与MFA。\u003cb>易错点\u003c/b>：'只建不删'是常见管理缺陷。\u003cb>记忆\u003c/b>：'建、用、变、停、删，闭环管理'。"},{"c":"auth","t":"s","q":"权限复核（定期评审）的主要目的是（　）。","o":["发现并收敛越权、冗余、滞留的权限","提高系统速度","减少存储空间","加密数据"],"a":0,"e":"\u003cb>定期权限复核对照岗位职责与实际需要，清理多余/过期/越权授权\u003c/b>，防止权限蔓延与内部风险，也是等保与ISO 27001的管理要求。\u003cb>落地\u003c/b>：定期导出权限清单与岗位职责比对、离职人员立即回收、特权账号专项审计。\u003cb>记忆\u003c/b>：'权限也是资产，要盘点、要收敛'。"},{"c":"auth","t":"s","q":"关于验证码（CAPTCHA）与人机识别，下列说法错误的是（　）。","o":["验证码可以完全替代强口令认证","验证码可防批量自动化操作","行为验证属于人机识别手段","验证码有被绕过的可能"],"a":0,"e":"\u003cb>验证码只是'人机测试'，不能替代身份认证\u003c/b>，更不能替代强口令与MFA——它挡的是脚本，不是持有了你口令的人。\u003cb>正确理解\u003c/b>：验证码用于防自动化（批量注册/撞库/爆破），行为验证是其升级形态，且确实存在绕过手段。\u003cb>易错点\u003c/b>：把验证码当认证手段是理解错误。\u003cb>记忆\u003c/b>：'验证码验的是人不是身份'。"},{"c":"auth","t":"s","q":"在企业统一身份体系中，'特权账号管理（PAM）'关注的重点是（　）。","o":["对root/管理员等高权限账号的托管、动态口令、操作审计与轮换","普通员工上网行为","磁盘容量","打印机管理"],"a":0,"e":"\u003cb>PAM（Privileged Access Management，特权访问管理）托管root/管理员/服务账号等特权凭证\u003c/b>：统一保险库存储、按需动态取用（临时口令）、全程操作录像审计、定期自动轮换，防止特权账号共享与滥用。\u003cb>易错点\u003c/b>：PAM≠堡垒机，但常与堡垒机结合落地特权运维审计。\u003cb>记忆\u003c/b>：'特权账号上锁、取用留痕、定期换锁'。"},{"c":"auth","t":"s","q":"OAuth 2.0中的'访问令牌（Access Token）'的正确理解是（　）。","o":["用于访问受保护资源的短期凭证，应保密传输并设有效期","长期不变的登录密码","公开可随意分享","用于所有系统通用的万能密钥"],"a":0,"e":"\u003cb>Access Token是授权服务器签发给客户端、用于访问资源服务器API的短期凭证，应通过安全通道传输、设置短有效期并限定范围（scope）\u003c/b>；\u003cb>不应与'登录密码'混为一谈，更不能公开分享\u003c/b>。\u003cb>对比\u003c/b>：Refresh Token用于刷新已过期的访问令牌，需更严格保护。\u003cb>记忆\u003c/b>：'Access=短期通行证，Refresh=补票'。"},{"c":"auth","t":"s","q":"关于会话（Session）的安全管理，下列做法错误的是（　）。","o":["会话超时后仍长期保留会话ID","登录成功后更换会话ID","设置合理的会话超时","会话ID绑定登录者身份"],"a":0,"e":"\u003cb>'会话超时后仍长期保留'是错误做法\u003c/b>——会话ID应设置合理的闲置/绝对超时并强制失效。\u003cb>正确做法\u003c/b>：登录后更换会话ID（防固定）、合理超时、绑定身份/IP、退出时销毁会话。\u003cb>易错点\u003c/b>：会话ID长期有效会扩大劫持窗口。\u003cb>记忆\u003c/b>：'会话短命、登录换ID、退出即毁'。"},{"c":"auth","t":"s","q":"对企业来说，实施多因素认证（MFA）最主要的收益是（　）。","o":["即使口令泄露，攻击者没有第二因素仍难以登录","完全杜绝所有攻击","替代所有安全设备","提高系统运行速度"],"a":0,"e":"\u003cb>MFA显著降低'口令泄露=账号沦陷'的风险\u003c/b>：单靠钓鱼/撞库得到的口令无法完成登录，是账号安全性价比最高的措施之一。\u003cb>局限\u003c/b>：仍可能被MFA疲劳攻击、会话劫持、设备接管绕过，故要配合异常检测。\u003cb>记忆\u003c/b>：'口令是单保险，MFA是双保险'。"},{"c":"auth","t":"s","q":"在身份认证因素中，'你拥有的东西'（如U盾、动态令牌、手机）面临的主要威胁是（　）。","o":["丢失、被盗、复制","容易遗忘","永远无法被攻击","不需要保护"],"a":0,"e":"\u003cb>'你拥有'类因素（令牌/U盾/手机）的威胁=丢失、被盗、被复制\u003c/b>，一旦落入他人之手即可冒充。\u003cb>三类因素威胁对照\u003c/b>：你知道的→被猜测/钓鱼；你拥有的→被盗/复制；你固有的→被采集复制且不可更换。\u003cb>易错点\u003c/b>：与'基于实体所有的鉴别威胁（复制、篡改、损坏）'呼应。\u003cb>记忆\u003c/b>：'东西会丢会假，生物会被采，口令会被猜'。"},{"c":"auth","t":"s","q":"下列关于口令存储与传输安全的做法，正确的是（　）。","o":["传输用TLS加密，存储用加盐慢哈希","明文传输明文存储","MD5无盐存储","用HTTP传输并禁用HTTPS"],"a":0,"e":"\u003cb>口令正确做法：传输走TLS（防嗅探），存储用'加盐+慢哈希'（防拖库后破解），前端不做明文日志\u003c/b>。\u003cb>常见反面\u003c/b>：明文存储/传输、无盐MD5、HTTP裸传均为高危。\u003cb>易错点\u003c/b>：'存储'与'传输'两个环节都要防护，缺一不可。\u003cb>记忆\u003c/b>：'传输加密、存储加盐、日志脱敏'。"},{"c":"auth","t":"m","q":"下列属于'双因素认证（2FA）'组合的有（　）。","o":["静态口令 + 手机短信验证码","静态口令 + 指纹识别","用户名 + 静态口令","口令 + 再次输入口令"],"a":[0,1],"e":"双因素认证要求\u003cb>两类不同性质的因素\u003c/b>：所知（口令）、所有（动态令牌/短信/USB Key）、所是（生物特征）。\u003cb>用户名+口令只是单一'所知'因素\u003c/b>；重复输入口令也仍是同一因素，不构成双因素。"},{"c":"auth","t":"s","q":"关于 BLP（Bell-LaPadula）安全模型，下列说法正确的是（　）。","o":["它关注机密性，规则是'不上读、不下写'，信息只能向同级或高密级方向流动","它关注完整性，规则是'不上读、不下写'","它允许高密级主体把信息写入低密级文件","它是一种基于生物特征的身份认证协议"],"a":0,"e":"\u003cb>BLP 保机密性：不上读（No Read Up）、不下写（No Write Down）\u003c/b>，信息只能同级或向上流动，防止高密信息泄向低密级；\u003cb>Biba 保完整性，方向恰好相反：上读、下写\u003c/b>（只采信更高级来源、只影响低级对象）。\u003cb>易错点\u003c/b>：BLP 与 Biba 方向记反是最高频失分点。\u003cb>记忆\u003c/b>：'BLP 不越级看、不泄密写；Biba 好数据从上读、往下流'。"},{"c":"linux","t":"s","q":"Linux中修改缺省密码长度限制的配置文件是（　）。","o":["/etc/login","/etc/shadow","/etc/login.defs","/etc/password"],"a":2,"e":"\u003cb>/etc/login.defs\u003c/b>定义口令策略（最小长度、最长使用期等）。/etc/shadow存加密口令，/etc/passwd存用户基本信息。"},{"c":"linux","t":"s","q":"Linux系统中/etc/shadow文件的典型权限是（　）。","o":["所有用户可读写","仅root可读","所有用户可读","仅root可写、所有用户可读"],"a":1,"e":"/etc/shadow存放加密口令及口令策略，\u003cb>仅root可读\u003c/b>；/etc/passwd才是所有用户可读。"},{"c":"linux","t":"s","q":"/etc/shadow文件中存放的内容是（　）。","o":["用户基本信息","用户加密口令及口令策略","用户组信息","系统日志"],"a":1,"e":"\u003cb>加密口令及口令策略\u003c/b>（最后修改时间、最长使用期等）存于/etc/shadow；用户名、UID、主目录等基本信息存于/etc/passwd。"},{"c":"linux","t":"s","q":"Linux有三个查看文件的命令，若希望在查看文件内容过程中可以用光标上下移动来查看，应使用（　）命令。","o":["less","cat","more","man"],"a":0,"e":"\u003cb>less\u003c/b>支持上下方向键移动、搜索（/向前、?向后）与回看，功能最强，适合日志与代码分析；more只能向下翻页；cat一次性输出全部。口诀“less is more”，且less打开大文件更快。"},{"c":"linux","t":"s","q":"cat、more、less三个查看文件命令中，只能向下翻页、不能回看的是（　）。","o":["cat","more","less","三个都可以"],"a":1,"e":"\u003cb>more\u003c/b>只能向下翻页（回车下一行、空格下一页）；less支持上下移动与搜索，推荐用于日志分析。"},{"c":"linux","t":"s","q":"使用vim工具编辑index.php文件时，产生的交换文件名是（　）。","o":[".index.php.swp","index.php2",".index.php","index.php.bak"],"a":0,"e":"vim编辑时创建的交换文件格式为\u003cb>.文件名.swp\u003c/b>（如.index.php.swp），防止意外退出丢失数据，正常退出后自动删除。"},{"c":"linux","t":"s","q":"备份程序mybackup需要在周一至周五每天下午1点和晚上8点各运行一次，正确的crontab条目是（　）。","o":["0 13,20 * * 1,2,3,4,5 mybackup","0 13,20 1,5 * * mybackup","* 13,20 * * 1,2,3,4,5 mybackup","0 13,20 * * 1,5 mybackup"],"a":0,"e":"五段依次为\u003cb>分 时 日 月 周\u003c/b>：0分、13和20时、每日、每月、周一至周五→\u003ccode>0 13,20 * * 1,2,3,4,5\u003c/code>。"},{"c":"linux","t":"s","q":"root用户crontab设置了 \u003ccode>30 6 * * 1-5 /opt/mytar.sh\u003c/code>，该脚本将在（　）被执行。","o":["每周一至周五早上6:30","每周一至周五晚上6:30","每月1日至5日早上6:30","每天早上6:30"],"a":0,"e":"\u003ccode>30 6 * * 1-5\u003c/code>按\u003cb>分 时 日 月 周\u003c/b>解读：第1位30=30分，第2位6=6时，第3位*每天，第4位*每月，第5位1-5=周一至周五，故为\u003cb>周一至周五早上6:30\u003c/b>执行。\u003cb>易错点\u003c/b>：周字段1-5是'周一到周五'，不是'1号到5号'；若写1-5在第3位才是每月1-5日。\u003cb>扩展\u003c/b>：crontab最小粒度是分钟，无法按秒执行。"},{"c":"linux","t":"s","q":"crontab时间格式的五个字段按顺序依次是（　）。","o":["时 分 日 月 周","分 时 日 月 周","分 时 月 日 周","日 月 分 时 周"],"a":1,"e":"crontab时间格式五字段顺序为\u003cb>分 时 日 月 周（星期）\u003c/b>。\u003cb>记忆口诀\u003c/b>：'分时日月周'，从最小单位分钟开始；星期字段取值0-7，\u003cb>0和7都代表周日\u003c/b>。\u003cb>易错点\u003c/b>：日期（第3位）与星期（第5位）同时指定时，满足任一条件即执行（取或），这是crontab的特殊规则。"},{"c":"linux","t":"s","q":"crontab的星期字段中，代表星期日的数值是（　）。","o":["只有0","只有7","0和7都可以","6"],"a":2,"e":"crontab星期字段取值范围\u003cb>0-7\u003c/b>，其中\u003cb>0和7都表示周日\u003c/b>（1-6对应周一至周六）。\u003cb>示例\u003c/b>：\u003ccode>0 9 * * 0\u003c/code>与\u003ccode>0 9 * * 7\u003c/code>都表示每周日9点执行。\u003cb>易错点\u003c/b>：很多程序只有0-6且0=周日，crontab额外支持7=周日，两者等价。\u003cb>扩展\u003c/b>：数值可用逗号（1,3,5）、连字符（1-5）、步进（*/5）组合。"},{"c":"linux","t":"s","q":"UNIX/Linux系统中，下列命令可以将普通账号变为root账号的是（　）。","o":["/bin/passwd","chgrp","/bin/su","chmod"],"a":2,"e":"\u003cb>su\u003c/b>可切换用户身份（普通→root）；sudo仅以root权限执行单条命令；passwd改口令、chmod改权限、chgrp改属组，均不能提权。"},{"c":"linux","t":"s","q":"关于sudo与su的区别，下列说法正确的是（　）。","o":["sudo需要知道root口令","su以root权限执行单条命令且有日志记录","sudo以root权限执行单条命令且有日志记录，无需暴露root口令","两者完全相同"],"a":2,"e":"\u003cb>sudo\u003c/b>按授权配置临时提权执行单条命令并记录日志，用户无需知道root口令；su需输入目标用户（root）口令完全切换身份。"},{"c":"linux","t":"s","q":"在Linux环境下，将当前目录中的myfile.txt压缩成myfile.txt.tar.gz，正确的命令是（　）。","o":["tar -zcvf myfile.txt.tar.gz myfile.txt","tar -zcvf myfile.txt myfile.txt.tar.gz","tar -cvf myfile.txt.tar.gz myfile.txt","tar -cvf myfile.txt myfile.txt.tar.gz"],"a":0,"e":"语法：\u003ccode>tar -zcvf 压缩包名 被压缩文件\u003c/code>，\u003cb>包名在前、源文件在后\u003c/b>；-z调用gzip，-c创建，-v显示过程，-f指定文件名。"},{"c":"linux","t":"s","q":"Linux系统中使用命令（　）可以较直观（人类可读）地显示文件系统大小。","o":["df -l","df -i","df -h","du -s"],"a":2,"e":"\u003cb>df -h\u003c/b>以人类可读单位（KB/MB/GB/TB）显示\u003cb>文件系统（磁盘分区）\u003c/b>使用情况。\u003cb>选项辨析\u003c/b>：-l只显示本地文件系统，-i显示inode使用率，-h人类可读；du显示目录占用空间。\u003cb>区分df与du\u003c/b>：df统计整个文件系统（分区），du统计指定目录/文件的磁盘占用，两者常配合排查'磁盘满'。\u003cb>易错点\u003c/b>：问'人类可读'关键词选-h。"},{"c":"linux","t":"s","q":"vi/vim编辑器中，不保存强制退出的命令是（　）。","o":[":wq!",":q!",":quit",":wq"],"a":1,"e":"vim中\u003cb>:q!\u003c/b>强制退出且\u003cb>不保存\u003c/b>修改。\u003cb>退出命令辨析\u003c/b>：\u003ccode>:q\u003c/code>正常退出（有未保存修改时提示）；\u003ccode>:wq\u003c/code>保存并退出；\u003ccode>:wq!\u003c/code>强制保存并退出；\u003ccode>:q!\u003c/code>放弃修改强制退出。\u003cb>记忆\u003c/b>：'!'(感叹号)=强制；'w'=write保存，'q'=quit退出。若不慎误改文件，可用:q!放弃所有修改。"},{"c":"linux","t":"s","q":"关于chmod命令，下列说法正确的是（　）。","o":["可以修改文件属主","可以将普通用户提升为root","用于修改文件访问权限，不能用于提权","可以修改文件所属组"],"a":2,"e":"chmod仅\u003cb>修改文件的读/写/执行权限\u003c/b>，不能提权；改属主是chown，改属组是chgrp。"},{"c":"linux","t":"s","q":"/etc/login.defs文件的主要作用是（　）。","o":["定义口令策略（最小长度、最长使用期等）","存储用户加密口令","记录用户登录日志","配置网络接口"],"a":0,"e":"\u003cb>/etc/login.defs\u003c/b>定义创建用户时的缺省口令策略，如口令最小长度（PASS_MIN_LEN）、最长使用天数等。"},{"c":"linux","t":"f","q":"su切换到root需要输入root的口令，而sudo只需管理员事先授权配置，无需暴露root口令。","a":0,"e":"\u003cb>正确。\u003c/b>su切换身份需输入目标用户（如root）的\u003cb>口令\u003c/b>，root口令面临泄露风险；sudo只需管理员在/etc/sudoers中\u003cb>授权\u003c/b>，执行时验证用户自身口令，\u003cb>root口令不外泄\u003c/b>，且每次执行都有\u003cb>审计日志\u003c/b>，可按需授予单条命令权限。\u003cb>扩展\u003c/b>：等保/安全基线常要求限制su、审计sudo操作；'最小权限'原则下优先用sudo。"},{"c":"linux","t":"f","q":"cat命令适合查看内容很多的大文件。","a":1,"e":"错误。\u003cb>cat\u003c/b>一次性输出全部内容，大文件会快速刷屏且无法回看；应使用more（只能向下翻页）或less（支持上下移动与搜索，推荐）分页查看，故不适合查看大文件。"},{"c":"linux","t":"s","q":"/etc/passwd中每条记录的字段顺序是（　）。","o":["用户名:口令占位x:UID:GID:注释:主目录:登录Shell","用户名:UID:口令:GID:主目录:注释:Shell","用户名:UID:GID:口令:注释:Shell:主目录","UID:用户名:GID:口令:主目录:Shell:注释"],"a":0,"e":"七字段依次为\u003cb>用户名:x占位:UID:GID:注释:主目录:登录Shell\u003c/b>。真实口令在/etc/shadow中；Shell为/sbin/nologin表示禁止交互登录——封禁可疑账号的常用手段。"},{"c":"linux","t":"s","q":"Linux系统中UID为0的用户是（　）。","o":["普通用户","root超级用户","系统服务用户","虚拟用户"],"a":1,"e":"\u003cb>UID 0即root\u003c/b>，拥有最高权限。排查后门账号的要点：\u003cb>检查是否存在UID=0的异常用户\u003c/b>（除root外任何UID=0的账号都高度可疑）。"},{"c":"linux","t":"s","q":"要禁止root用户远程登录SSH，应（　）。","o":["修改/etc/ssh/sshd_config中PermitRootLogin为no","删除/etc/passwd中root行","关闭22端口","修改/etc/hosts文件"],"a":0,"e":"在\u003cb>sshd_config中设置PermitRootLogin no\u003c/b>并重启sshd服务生效。配合“普通用户登录＋sudo提权”可显著降低root口令被爆破的风险——这是安全基线的标准项。"},{"c":"linux","t":"s","q":"文件权限rwxr-xr--对应的数字表示是（　）。","o":["754","745","654","755"],"a":0,"e":"r=4、w=2、x=1，逐段计算：属主rwx=7、属组r-x=5、其他r--=4，即\u003cb>754\u003c/b>。反向由数字写字母是同一考点的另一面：755=rwxr-xr-x。"},{"c":"linux","t":"s","q":"chmod 700 script.sh的含义是（　）。","o":["所有用户都可读写执行","属主读写执行，属组与其他用户无任何权限","属主只读","属主执行，其他人可写"],"a":1,"e":"7=rwx（属主），两个0表示\u003cb>属组与其他用户无任何权限\u003c/b>。私有脚本与密钥文件常用600/700；注意目录必须有x权限才能被进入（cd）。"},{"c":"linux","t":"s","q":"SUID特殊权限的作用是（　）。","o":["执行文件时临时获得文件属主（通常是root）的权限","禁止任何人执行该文件","使文件只能被属主删除","为目录设置粘滞位"],"a":0,"e":"普通用户执行带SUID的程序时\u003cb>临时拥有属主权限\u003c/b>——/usr/bin/passwd正是靠SUID才能改写/etc/shadow。它也是\u003cb>提权排查重点\u003c/b>：异常新增的SUID程序可能就是提权后门。"},{"c":"linux","t":"s","q":"修改文件属主的命令是（　）。","o":["chown","chgrp","chmod","umask"],"a":0,"e":"\u003cb>chown user file\u003c/b>改属主（chown user:group file可同时改属组）；chgrp改属组；chmod改读写执行权限；umask决定新文件的默认权限。属主变更会直接影响SUID的生效身份。"},{"c":"linux","t":"s","q":"排查系统中SUID文件的命令是（　）。","o":["find / -perm -4000","ls -l /","grep suid /etc/passwd","cat /proc/suid"],"a":0,"e":"\u003cb>find / -perm -4000 -type f\u003c/b>列出所有SUID文件（-2000对应SGID）。排查时对比历史基线，重点关注\u003cb>非标准路径下新增的SUID程序\u003c/b>，它们常被用于权限维持。"},{"c":"linux","t":"s","q":"动态实时查看系统进程与资源占用的命令是（　）。","o":["ps","top","netstat","lsof"],"a":1,"e":"\u003cb>top\u003c/b>动态刷新并按CPU/内存排序，是发现挖矿进程（CPU异常）的第一步；ps aux是静态快照，常配合grep过滤进程路径。发现可疑进程记录其PID再深入分析。"},{"c":"linux","t":"s","q":"排查主机可疑外连（反向连接）应使用的命令是（　）。","o":["netstat -antp（或ss -antp）","free -m","df -h","whoami"],"a":0,"e":"\u003cb>netstat -antp / ss -antp\u003c/b>：-a全部连接 -n数字显示 -t TCP -p进程信息。发现可疑外连IP后记录PID，用ps定位程序路径，再断网处置——挖矿木马常外连3333、4444等矿池端口。"},{"c":"linux","t":"s","q":"查看80端口被哪个进程占用，应使用（　）。","o":["lsof -i:80","mount /dev/sda","crontab -l","uname -a"],"a":0,"e":"\u003cb>lsof -i:80\u003c/b>列出占用80端口的进程；等效方式netstat -antp加grep过滤。排查未知监听端口、后门端口是入侵检测的基本功。"},{"c":"linux","t":"s","q":"立即强制终止指定进程的命令是（　）。","o":["kill -9 PID","kill -HUP PID","ctrl+z","exit"],"a":0,"e":"\u003cb>kill -9发送SIGKILL\u003c/b>不可被进程捕获或忽略；常规应先用kill（SIGTERM，15）允许进程清理资源。注意：恶意进程被杀后若不清除其持久化项（cron/服务），重启后还会复活。"},{"c":"linux","t":"s","q":"排查最近24小时内被修改过的文件，命令是（　）。","o":["find / -mtime -1","find / -name *","ls -la /tmp","stat /"],"a":0,"e":"\u003cb>-mtime -1表示修改时间在1天内\u003c/b>；配合-type f过滤文件。应急中常用于全盘找新生成的webshell，重点检查Web目录、/tmp、/dev/shm等位置。"},{"c":"linux","t":"s","q":"统计日志中每个IP出现次数并按次数降序排列的命令组合是（　）。","o":["sort | uniq -c | sort -rn","grep -c | wc -l","cat | head -n","tr -d | more"],"a":0,"e":"标准三板斧：\u003cb>awk提取IP列 → sort排序 → uniq -c去重计数 → sort -rn按数值降序\u003c/b>。可快速锁定高频访问/攻击源IP，是日志分析与爆破溯源的必会组合。"},{"c":"linux","t":"s","q":"grep -r选项的作用是（　）。","o":["递归搜索目录及子目录下的所有文件","只搜索隐藏文件","按正则排除匹配行","显示文件权限"],"a":0,"e":"\u003cb>-r递归\u003c/b>搜索目录树，-n附加行号。查杀webshell常用：grep -rn --include=*.php eval /var/www/html，按扩展名缩小范围、定位敏感函数。"},{"c":"linux","t":"s","q":"以下属于rootkit检测工具的是（　）。","o":["rkhunter / chkrootkit","ping / traceroute","tar / gzip","useradd / passwd"],"a":0,"e":"\u003cb>rkhunter、chkrootkit\u003c/b>专门检测rootkit。rootkit会替换ps、netstat等系统命令隐藏自身，普通命令的输出可能已被欺骗；严重失陷时应\u003cb>对硬盘做镜像离线取证\u003c/b>，而非继续信任在线系统。"},{"c":"linux","t":"s","q":"SELinux提供的安全机制是（　）。","o":["强制访问控制（MAC）","自主访问控制（DAC）","数据加密存储","网络入侵防御"],"a":0,"e":"\u003cb>SELinux（Red系）/AppArmor（Debian系）\u003c/b>在传统DAC之上叠加MAC策略：即使root也受策略约束，进程只能访问策略允许的资源，可有效缓解提权与漏洞利用，代价是配置成本。"},{"c":"linux","t":"s","q":"Linux的PAM指的是（　）。","o":["可插拔认证模块框架","进程管理器","磁盘分区工具","包管理器"],"a":0,"e":"\u003cb>PAM（可插拔认证模块）\u003c/b>在/etc/pam.d/下按服务灵活组合认证流程：口令复杂度（pam_pwquality）、失败锁定（pam_faillock）等。Linux统一认证的入口，SUID的passwd正是经PAM获得改密能力。"},{"c":"linux","t":"f","q":"/etc/passwd文件默认所有用户均可读。","a":0,"e":"正确。因ls等程序需解析用户名，passwd必须全员可读；这也是历史原因——真实口令早已迁移到\u003cb>仅root可读的/etc/shadow\u003c/b>中。"},{"c":"linux","t":"s","q":"权限755对应的权限字符是（　）。","o":["rwxrwxrwx","rwxr-xr-x","rw-r--r--","rwx--x--x"],"a":1,"e":"r=4、w=2、x=1：7=rwx、5=r-x。755即\u003cb>属主rwx、组r-x、其他r-x\u003c/b>，常用于可执行脚本与目录。计算题技巧：三位数字分别对应属主/组/其他。"},{"c":"linux","t":"s","q":"权限644的含义是（　）。","o":["属主可读写，组和其他只读","所有人可读写","属主只读，其他可写","属主可执行，其他只读"],"a":0,"e":"6=rw、4=r：\u003cb>属主读写，组与其他只读\u003c/b>，普通配置文件常用。更敏感的文件应收紧为600（仅属主读写），如SSH私钥id_rsa必须是600，否则ssh客户端会拒绝使用。"},{"c":"linux","t":"s","q":"将Web目录设置为777权限的风险是（　）。","o":["没有任何风险","任意用户可写入并执行文件，易被植入webshell","会导致目录无法访问","会删除目录下所有文件"],"a":1,"e":"777意味着\u003cb>所有用户可读写执行\u003c/b>，任意用户（包括Web服务账号）都能放置文件并执行，是webshell的温床。应按服务运行用户最小化授权（如755/750），上传目录还需去除执行权限。"},{"c":"linux","t":"s","q":"/usr/bin/passwd设置SUID权限的意义是（　）。","o":["任何用户执行时都以root身份运行该程序","只有root能执行该命令","该命令只能由密码文件属主执行","加快命令执行速度"],"a":0,"e":"SUID（属主x位显示为s，数值4xxx）使\u003cb>普通用户执行时临时获得文件属主（root）权限\u003c/b>，从而能修改仅root可读的/etc/shadow。风险：SUID程序漏洞即提权路径，排查：\u003ccode>find / -perm -4000\u003c/code> 比对基线，移除非必要项。"},{"c":"linux","t":"s","q":"/tmp目录权限1777中的“1”（sticky bit）的作用是（　）。","o":["允许所有人删除目录内文件","仅文件属主和root可以删除该目录下的文件","禁止任何写入","目录内文件自动加密"],"a":1,"e":"\u003cb>sticky bit保证公共可写目录中互不干扰\u003c/b>：每个人都能写，但只有文件属主和root能删除文件，/tmp、/var/tmp标配1777。相关：SGID（2）使目录内新文件继承目录属组。"},{"c":"linux","t":"s","q":"ls -l输出中，文件类型与权限部分的第一个字符为“d”表示（　）。","o":["普通文件","目录","符号链接","设备文件"],"a":1,"e":"首位即文件类型：\u003cb>-普通文件、d目录、l符号链接\u003c/b>、c/b字符/块设备、s套接字、p命名管道；其后9位三组rwx分别对应属主、属组、其他用户。"},{"c":"linux","t":"s","q":"/etc/passwd文件的第3个字段是（　）。","o":["用户名","UID（root为0）","GID","登录Shell"],"a":1,"e":"七个字段依次为：用户名:口令占位x:\u003cb>UID\u003c/b>:GID:描述:主目录:Shell。root的UID为0；\u003cb>排查新增的UID=0账号\u003c/b>是后门检查的必做项（普通系统账号UID多在1–999）。加密口令真身在/etc/shadow。"},{"c":"linux","t":"s","q":"删除用户及其家目录的正确命令是（　）。","o":["userdel tom","userdel -r tom","deluser --force tom","rm -rf /home/tom"],"a":1,"e":"\u003cb>userdel -r 连同家目录与邮件池一并删除\u003c/b>；仅userdel会残留家目录。应急场景可先用usermod -L锁定口令或chage -E 0使其过期（先取证后删除），直接rm家目录不清理账号属于错误操作。"},{"c":"linux","t":"s","q":"在网站目录/var/www中递归且忽略大小写搜索特征字符串eval，正确的命令是（　）。","o":["grep -ri 'eval' /var/www","grep eval /var/www","find /var/www -eval","cat /var/www | eval"],"a":0,"e":"\u003cb>-r递归目录、-i忽略大小写\u003c/b>；-n显示行号、-c只统计次数。webshell排查常用特征：eval、assert、system、base64_decode、gzinflate等，再结合find按修改时间缩小范围。"},{"c":"linux","t":"s","q":"查找全盘近3天内被修改过的jsp文件，正确的命令是（　）。","o":["find / -name '*.jsp' -mtime -3","find / -jsp -time 3","locate --jsp -3d","grep -3 '*.jsp' /"],"a":0,"e":"\u003cb>-name按文件名（支持*通配）、-mtime -3表示3天内修改、可加-type f只要普通文件\u003c/b>。应急中常按“修改时间+大小+名字特征”组合定位新增可疑文件；-mtime +3则表示3天前。"},{"c":"linux","t":"s","q":"netstat -antp 各参数的含义是（　）。","o":["显示所有TCP连接，数字形式显示地址端口，并附进程信息","只显示监听端口的UDP服务","统计网络流量并限速","显示ARP表"],"a":0,"e":"-a全部状态、-n数字地址端口（不做DNS反解、速度快）、-t TCP、-p进程（需root），-u则为UDP。排查外连：\u003ccode>netstat -antp | grep ESTABLISHED\u003c/code> 关注陌生外网IP（如挖矿程序与矿池的长连接）。"},{"c":"linux","t":"s","q":"现代Linux中替代netstat、更快速的连接查看工具是（　）。","o":["ifconfig","ss","ping","traceroute"],"a":1,"e":"\u003cb>ss直接读取内核套接字表\u003c/b>，速度远快于netstat，用法相近（ss -antp、ss -s汇总）。net-tools（netstat/ifconfig/route）已停止维护，新系统建议ip、ss替代。"},{"c":"linux","t":"s","q":"查看8080端口被哪个进程占用的命令是（　）。","o":["lsof -i:8080","netstat -p 8080","port -show 8080","who 8080"],"a":0,"e":"\u003cb>lsof -i:8080列出占用该端口的进程\u003c/b>；lsof万物皆文件：-p看进程打开的所有文件、-u按用户、+D按目录。可排查端口占用、文件已删但仍占空间（deleted）、进程打开的可疑文件。"},{"c":"linux","t":"s","q":"查看系统所有进程及其完整命令行，常用命令是（　）。","o":["ps -ef 或 ps aux","ls -l /proc","cat /etc/passwd","top -n"],"a":0,"e":"\u003cb>ps -ef / ps aux列出进程\u003c/b>，配合grep过滤。可疑进程（名字带空格伪装、藏在/tmp执行）需结合top、pstree与/proc/\u003cb>PID\u003c/b>/exe、/proc/\u003cb>PID\u003c/b>/cmdline交叉验证，防止ps被别名篡改欺骗。"},{"c":"linux","t":"s","q":"kill -15与kill -9的区别是（　）。","o":["没有区别","-15优雅终止（可被捕获清理），-9强制杀死（SIGKILL不可捕获）","-9更安全","-15只能由root使用"],"a":1,"e":"\u003cb>-15（SIGTERM）默认信号，允许进程保存现场后退出；-9（SIGKILL）不可被捕获与忽略，立即终止\u003c/b>。应先15后9；kill -9并非“更彻底”，进程来不及清理可能留下脏数据或锁文件。动手前先核对PID对应命令行。"},{"c":"linux","t":"s","q":"服务器CPU突然长期接近100%，首先用于快速定位异常进程的命令是（　）。","o":["top","df -h","whoami","uname -a"],"a":0,"e":"\u003cb>top查看负载与按CPU排序的进程\u003c/b>（按大写P按CPU列），锁定可疑PID后：ps -ef | grep PID、ls -l /proc/\u003cb>PID\u003c/b>/exe看真实路径、strings分析样本。挖矿常伴外连矿池与crontab持久化，需整体处置。"},{"c":"linux","t":"s","q":"为防止关键配置文件被修改（即使是root），可使用的命令是（　）。","o":["chmod 000 file","chattr +i file","chown root file","umask 777"],"a":1,"e":"\u003cb>chattr +i设置不可变属性\u003c/b>：不能写入、删除、改名、创建硬链接，仅可读；解锁用chattr -i，查看用lsattr。注意恶意程序也可能给自己加i防删--处置时先chattr -i再删除。"},{"c":"linux","t":"s","q":"排查攻击者历史操作最直接的入口是（　）。","o":["history / ~/.bash_history","/etc/hostname","/etc/resolv.conf","uname -r"],"a":0,"e":"\u003cb>history或cat ~/.bash_history\u003c/b>，重点找wget/curl下载、gcc编译、提权、新建账号、编辑可疑文件等痕迹。注意攻击者可能history -c或改HISTFILE清除，需结合last/wtmp、时间线交叉验证。"},{"c":"linux","t":"s","q":"Linux间实现SSH免密登录的正确做法是（　）。","o":["把本机公钥写入目标机~/.ssh/authorized_keys","把口令写在~/password文件","关闭SSH服务","两台主机改相同主机名"],"a":0,"e":"ssh-keygen生成密钥对，\u003cb>公钥追加到目标机对应用户的~/.ssh/authorized_keys\u003c/b>（目录700、文件600）即可免密登录。后门排查要点：检查root及各用户的authorized_keys是否被写入陌生公钥。"},{"c":"linux","t":"s","q":"RHEL/CentOS与Debian/Ubuntu分别查看已安装软件包的命令是（　）。","o":["rpm -qa 与 dpkg -l","yum list 与 apt list","which 与 whereis","lsrpm 与 lsdpkg"],"a":0,"e":"\u003cb>rpm -qa（RHEL系）、dpkg -l（Debian系）\u003c/b>列出已装包，如 rpm -qa | grep openssh。应急中比对非官方渠道安装的可疑包；包管理器安装的文件可被校验（rpm -V），脚本直装程序需另行排查。"},{"c":"linux","t":"s","q":"查看Linux主机防火墙（iptables）当前规则列表的命令是（　）。","o":["iptables -L -n","firewall show","iptables save","netsh show"],"a":0,"e":"\u003cb>iptables -L -n（-v带计数）\u003c/b>查看规则；-n避免DNS反解卡顿。规则自上而下、首条命中即生效，默认策略ACCEPT建议改为DROP（先放行SSH管理端口再改，否则易自锁）。firewalld（firewall-cmd）是其前端。"},{"c":"linux","t":"s","q":"SELinux实现的安全机制是（　）。","o":["自主访问控制（DAC）","强制访问控制（MAC）","基于角色的访问控制（RBAC）","磁盘加密"],"a":1,"e":"\u003cb>SELinux通过安全上下文标签+策略实施强制访问控制\u003c/b>，约束进程能访问的资源，即使root也受策略限制（enforcing强制/permissive仅告警/disabled关闭）。AppArmor同类。排查用getenforce、ps -Z查看上下文。"},{"c":"linux","t":"s","q":"统计/var目录实际占用大小的命令是（　）。","o":["df -sh /var","du -sh /var","ls -lh /var","stat /var"],"a":1,"e":"\u003cb>du -sh统计目录实际占用\u003c/b>；df -h看的是文件系统整体使用率与挂载点。日志暴涨排查先df定位分区、再du逐层缩小；删除大文件后df未释放说明有进程仍占用，用lsof | grep deleted定位，重载该进程即可。"},{"c":"linux","t":"s","q":"提取/etc/passwd中的用户名（第一列），正确的命令是（　）。","o":["cut -d: -f1 /etc/passwd","split /etc/passwd -1","head -1 /etc/passwd","uniq /etc/passwd"],"a":0,"e":"\u003cb>cut -d: -f1以冒号分隔取第1列\u003c/b>；与awk '{print $1}'（默认按空白分列）互补。批量处理常配合sort排序、uniq -c去重统计，如统计登录失败来源IP排行。"},{"c":"linux","t":"s","q":"在Linux中，查看系统当前TCP连接状态的命令是（　）。","o":["ss 或 netstat","ps","top","df"],"a":0,"e":"\u003cb>ss（Socket Statistics）是netstat的现代替代，查看TCP/UDP连接、监听端口\u003c/b>。常用：ss -tlnp（TCP监听+进程），ss -s（统计摘要），netstat -anp。连接状态包括：LISTEN、ESTABLISHED、TIME_WAIT、CLOSE_WAIT等。大量TIME_WAIT可能表明连接未正确关闭。"},{"c":"linux","t":"s","q":"Linux中，设置文件不可修改属性的命令是（　）。","o":["chmod 444","chattr +i","chown root","umask 777"],"a":1,"e":"\u003cb>chattr +i设置文件不可变（immutable），即使root也不能修改/删除，需chattr -i解除\u003c/b>。类似：+a只允许追加。常用于保护关键配置文件（/etc/passwd、/etc/shadow）防止误操作或被篡改。lsattr查看属性。"},{"c":"linux","t":"s","q":"Linux中find命令查找所有SUID权限文件的写法是（　）。","o":["find / -perm 4000","find / -perm -4000","find / -suid","find / -user root"],"a":1,"e":"\u003cb>find / -perm -4000查找所有设置了SUID位的文件\u003c/b>；-perm 4000精确匹配（包括权限位）。SUID文件以文件属主身份执行，如 passwd 命令。攻击者会寻找可利用的SUID程序提权（如find、vim、nmap有SUID时可执行命令）。定期审计SUID/SGID文件是安全基线项。"},{"c":"linux","t":"s","q":"Linux中ulimit命令的作用是（　）。","o":["查看用户列表","限制用户进程的系统资源（如文件数、内存、CPU时间）","安装软件","配置网络接口"],"a":1,"e":"\u003cb>ulimit -n 65535调整最大文件描述符数，ulimit -u限制最大进程数\u003c/b>。防止用户进程耗尽系统资源导致服务不可用（fork炸弹即利用无限制创建子进程）。配置写入/etc/security/limits.conf或/etc/security/limits.d/永久生效。"},{"c":"linux","t":"s","q":"SSH安全加固中，不应在配置中使用的设置是（　）。","o":["PermitRootLogin no","PasswordAuthentication no","MaxAuthTries 6","PermitRootLogin yes"],"a":3,"e":"\u003cb>禁止root直接远程登录是基本安全措施\u003c/b>（先用普通用户登录再su/sudo提权）。SSH加固要点：禁用密码认证只允许密钥认证、改默认端口、禁用空口令、限制允许登录的用户/组、使用Fail2Ban防暴力破解、禁用不安全算法。"},{"c":"linux","t":"s","q":"systemctl命令的作用是（　）。","o":["管理systemd系统和服务管理器（启动/停止/查看/启用服务）","编译内核","格式化磁盘","管理网络连接"],"a":0,"e":"\u003cb>systemctl start/stop/restart/status/enable/disable 服务名\u003c/b>。systemd是现代Linux的init系统，管理服务依赖、日志（journalctl查看日志）、定时器（systemd timers替代部分crontab）、socket激活等。服务管理是运维最基本操作之一。"},{"c":"linux","t":"s","q":"Linux中查看磁盘使用情况的命令是（　）。","o":["free","df -h","ps","ifconfig"],"a":1,"e":"\u003cb>df -h（disk free）查看文件系统磁盘空间使用情况\u003c/b>；du -sh /path查看目录/文件大小；lsblk查看块设备信息；fdisk/gdisk分区工具。磁盘满可能导致服务异常甚至系统宕机，应设置阈值告警（如使用率超85%告警）。"},{"c":"linux","t":"s","q":"iptables防火墙默认策略设置为拒绝所有入站流量、允许所有出站流量的正确写法是（　）。","o":["iptables -P INPUT DROP && iptables -P OUTPUT ACCEPT","iptables -P INPUT ACCEPT && iptables -P OUTPUT DROP","iptables -F","iptables -A INPUT -j ACCEPT"],"a":0,"e":"\u003cb>-P设置默认策略（Policy），INPUT DROP=默认拒绝入站，OUTPUT ACCEPT=默认允许出站\u003c/b>。-A追加规则（在最后），-I插入规则（在最前）；规则自上而下匹配，匹配即执行。注意：远程管理时先放行SSH再设DROP策略，否则会把自己锁在外面。"},{"c":"linux","t":"s","q":"Linux中tail -f /var/log/syslog的作用是（　）。","o":["删除日志文件","实时追踪日志文件的新增内容","截断日志文件","统计日志行数"],"a":1,"e":"\u003cb>tail -f实时跟踪文件末尾新增内容\u003c/b>，常用于实时监控日志输出（如排查线上问题）。tail -n 100查看最后100行；tail -f access.log | grep 404过滤特定内容。less也可以用F键实现类似实时跟踪。"},{"c":"linux","t":"s","q":"Linux中SELinux的Enforcing模式是指（　）。","o":["关闭SELinux","违反策略时仅记录日志但不阻止","违反策略时既记录日志又阻止违规行为","只审计不检测"],"a":2,"e":"\u003cb>Enforcing：强制执行安全策略，违规即阻断+记录\u003c/b>；Permissive：仅记录告警不阻断（调试排障用）；Disabled：完全关闭。查看状态：getenforce/sestatus；临时切换：setenforce 0/1。生产环境建议Enforcing，但应用部署时可能先Permissive调试。"},{"c":"linux","t":"s","q":"Linux中，定期自动清理/var/log下超过30天的日志文件，应使用（　）。","o":["手动rm","logrotate配置轮转策略","crontab直接删除所有日志","停掉syslog服务"],"a":1,"e":"\u003cb>logrotate可按日/周/大小轮转日志，保留指定天数后自动压缩删除旧文件\u003c/b>。配置文件/etc/logrotate.conf和/etc/logrotate.d/，支持：daily/weekly、rotate N保留N份、compress压缩、delaycompress延迟压缩。日志被轮转删除后不影响审计追溯期。"},{"c":"linux","t":"s","q":"Linux中，/proc/self/environ文件的作用是（　）。","o":["存储环境变量（可被Web应用读取导致信息泄露）","存储系统内核参数","存储磁盘分区表","存储用户密码"],"a":0,"e":"\u003cb>/proc/self/environ包含当前进程的环境变量\u003c/b>，Web应用通过LFI/目录遍历读取后，可获取数据库口令、API密钥等敏感信息。防御：限制Web进程对/proc的访问、禁止目录遍历、环境变量中的敏感信息改用密钥管理服务。"},{"c":"linux","t":"s","q":"rsync命令相比cp/scp的优势是（　）。","o":["只能传输小文件","支持增量传输（只传输变化部分）和断点续传","必须传输整个文件","只能本地复制"],"a":1,"e":"\u003cb>rsync核心优势：增量传输（只传变化部分），大幅节省带宽和时间\u003c/b>；支持压缩传输、保留权限/时间戳、目录镜像。常用：rsync -avz --delete（镜像同步，删除目标多余文件）。配合SSH加密传输（-e ssh）。"},{"c":"linux","t":"s","q":"Linux中，strace命令的主要用途是（　）。","o":["查看网络配置","跟踪进程的系统调用和信号，用于诊断程序行为","管理用户账号","安装软件包"],"a":1,"e":"\u003cb>strace -p PID跟踪指定进程的系统调用\u003c/b>（如文件读写、网络连接、exec调用），可用于诊断程序卡住、权限问题、配置错误等。生产环境谨慎使用，有性能影响。ltrace跟踪库调用（如libc函数）。两者是排查疑难问题的利器。"},{"c":"linux","t":"s","q":"docker run -v /:/hostOS ...这类命令存在的安全风险是（　）。","o":["容器内可以访问宿主机整个文件系统（根目录挂载）","容器无法启动","容器网络不通","镜像下载失败"],"a":0,"e":"\u003cb>将宿主机根目录挂载到容器后，容器内获得宿主机全部文件访问权限\u003c/b>，等同于容器逃逸。Docker安全加固：不挂载敏感目录、--read-only只读文件系统、--cap-drop丢弃不需要的Linux capability、使用非root用户运行、AppArmor/SELinux约束。"},{"c":"linux","t":"f","q":"在Linux中，chmod 777将文件权限设为所有用户可读可写可执行，这在生产环境中是极其危险的做法。","a":0,"e":"正确。chmod 777意味着所有用户（属主、属组、其他人）均可读写执行该文件，完全没有任何权限控制。生产环境应遵循最小权限原则。"},{"c":"linux","t":"f","q":"Linux系统中，所有服务的配置文件都应该放在/root目录下以方便管理。","a":1,"e":"错误。Linux服务配置文件分布在标准路径下，如/etc/（全局配置）、/etc/nginx/、/etc/ssh/、/etc/mysql/等。/root是root用户的家目录，不应存放服务配置文件。配置文件路径标准化是运维基础。"},{"c":"linux","t":"s","q":"Linux中/etc/passwd文件里shell字段为nologin表示（　）。","o":["用户已删除","该用户无法通过shell登录系统（但可通过其他方式如FTP/SFTP访问）","用户是超级管理员","用户密码已过期"],"a":1,"e":"\u003cb>/sbin/nologin和/bin/false作为登录shell时\u003c/b>，用户无法获得交互式shell登录，但服务账号仍可运行系统服务。安全基线：系统账号和服务账号的shell应设为nologin。只有需要登录的用户才应分配交互式shell。"},{"c":"linux","t":"s","q":"Linux中crontab定时执行脚本的格式是（　）。","o":["crontab run script.sh","分 时 日 月 周 命令（如0 3 * * * /opt/script.sh每天凌晨3点执行）","crontab start script.sh","crontab exec script.sh"],"a":1,"e":"\u003cb>crontab格式：minute hour day month weekday command\u003c/b>。0 3 * * * =每天凌晨3点；*/5 * * * * =每5分钟；0 0 * * 0 =每周日零点。排查应急时必查crontab -l和/etc/cron*，攻击者常利用计划任务持久化。"},{"c":"linux","t":"s","q":"Linux审计系统auditd的规则配置文件是（　）。","o":["/etc/audit/rules.conf","/etc/audit/audit.rules（规则定义）和/etc/audit/auditd.conf（服务配置）","/etc/syslog.conf","/etc/auditd/config"],"a":1,"e":"\u003cb>audit.rules定义审计规则\u003c/b>（如-w /etc/passwd -p wa监控密码文件读写、-a exit,always -S execve监控命令执行）；\u003cb>auditd.conf配置服务行为\u003c/b>。审计日志存放在/var/log/audit/audit.log。ausearch/aureport分析日志。等保三级要求使用审计系统。"},{"c":"linux","t":"s","q":"Linux中TCP Wrappers的作用是（　）。","o":["加速TCP连接","基于主机名/IP对TCP服务进行简单的访问控制（先查allow再查deny）","加密TCP流量","压缩TCP数据"],"a":1,"e":"\u003cb>TCP Wrappers在应用层进行访问控制\u003c/b>：先检查/etc/hosts.allow（允许），再检查/etc/hosts.deny（拒绝）。规则格式：服务名:IP/主机名。注意：只对支持libwrap库的服务生效，现代系统更多使用iptables/firewalld替代。"},{"c":"linux","t":"s","q":"Linux内核参数tcp_syncookies=1的作用是（　）。","o":["加速TCP连接","防御SYN Flood攻击（当SYN队列满时启用SYN Cookie机制）","增加TCP缓冲区大小","启用TCPKeepAlive"],"a":1,"e":"\u003cb>tcp_syncookies=1：当SYN半连接队列满时，计算SYN Cookie不分配资源\u003c/b>，收到ACK后验证Cookie再建立连接。可有效防御SYN Flood。其他防御：增大tcp_max_syn_backlog、缩短tcp_synack_retries、使用SYN Proxy。"},{"c":"linux","t":"s","q":"Linux中查找最近24小时内被修改文件的命令是（　）。","o":["find / -name *.txt","find / -mtime -1（-1表示1天内修改过）","ls -la","find / -perm 777"],"a":1,"e":"\u003cb>find / -mtime -1 查找最近24小时内修改的文件\u003c/b>。类似：-mmin -60（60分钟内修改）、-ctime（状态变更时间）、-atime（访问时间）。应急响应中常用于发现攻击者上传的后门和被篡改的配置文件。"},{"c":"linux","t":"s","q":"fail2ban工具的主要功能是（　）。","o":["加速网络","监控日志文件中的失败登录，自动封禁可疑IP（防火墙规则）","备份数据","管理用户账户"],"a":1,"e":"\u003cb>fail2ban监控sshd/auth.log等日志\u003c/b>，当某个IP在指定时间窗口内失败次数达到阈值，自动添加iptables/firewalld规则封禁该IP。配置文件：/etc/fail2ban/jail.conf。是SSH防暴力破解的基本措施。"},{"c":"linux","t":"s","q":"SUID和SGID权限位的八进制表示分别是（　）。","o":["SUID=1000, SGID=2000","SUID=4000, SGID=2000（加上文件权限如4755表示设置SUID）","SUID=4, SGID=2","SUID=777, SGID=666"],"a":1,"e":"\u003cb>chmod 4755 = SUID（4000）+ rwx（755）\u003c/b>，文件执行时以文件属主身份运行。chmod 2755 = SGID（2000），文件执行时以文件属组身份运行，目录下新建文件继承属组。排查：find / -perm -4000/-perm -2000。"},{"c":"linux","t":"s","q":"Docker容器安全最佳实践不包括（　）。","o":["使用非root用户运行容器","不挂载宿主机敏感目录","在所有容器中安装完整的操作系统","使用--cap-drop丢弃不需要的capability"],"a":2,"e":"\u003cb>Docker安全加固：非root运行、不挂载敏感目录、只读文件系统、丢弃不必要的capability、限制资源、镜像签名验证、定期更新基础镜像\u003c/b>。容器中不需要也不应安装完整OS。"},{"c":"linux","t":"s","q":"Linux中LD_PRELOAD的安全风险是（　）。","o":["没有安全风险","可指定优先加载的共享库，被恶意利用可实现函数劫持和权限维持","加速程序启动","管理库文件版本"],"a":1,"e":"\u003cb>LD_PRELOAD指定在所有其他共享库之前加载的库\u003c/b>，攻击者可编写恶意.so劫持系统调用。防御：限制LD_PRELOAD、PHP的putenv()禁用LD_PRELOAD、监控异常LD_PRELOAD值。"},{"c":"linux","t":"s","q":"Linux中查看系统启动时间的命令是（　）。","o":["uptime 或 cat /proc/uptime","ps -ef","ifconfig","top -n 1"],"a":0,"e":"\u003cb>uptime显示系统运行时间、当前登录用户数和负载均值\u003c/b>；cat /proc/uptime显示精确秒数。在应急响应中，对比系统启动时间与异常事件时间可判断是否有人重启过系统（清除证据）。"},{"c":"linux","t":"s","q":"执行 chmod 754 表示设置文件权限为（　）。","o":["rwxr-xr--","rwxr-x-w-","rw-r-xr--","rwxrw-r--"],"a":0,"e":"\u003cb>7=rwx(4+2+1)、5=r-x(4+1)、4=r--\u003c/b>，故754对应rwxr-xr--：属主全部权限、组读+执行、其他只读。数字法读写执行分别为4/2/1。"},{"c":"linux","t":"s","q":"同时修改文件属主与属组的命令是（　）。","o":["chown","chmod","chgrp","umask"],"a":0,"e":"\u003cb>chown可同时修改属主和属组\u003c/b>（如 chown user:group file）；仅改属组用chgrp；chmod改权限；umask设置新建文件的默认权限掩码。"},{"c":"linux","t":"s","q":"umask 022 表示新建文件/目录时（　）。","o":["去除属组和其他用户的写权限","给所有人加写权限","去除属主写权限","不改变任何权限"],"a":0,"e":"\u003cb>umask 022从默认权限中减去属组和其他用户的写权限\u003c/b>：文件默认666→644，目录默认777→755。合理的umask防止新建文件被他人随意修改。"},{"c":"linux","t":"s","q":"文件权限 -rwxr-xr-- 表示（　）。","o":["属主可读可写可执行，组可读可执行，其他只读","所有人可读可写可执行","属主只读","属主可执行，组可读写"],"a":0,"e":"第一个字符-为普通文件（d为目录、l为链接）；其后三组rwx依次为\u003cb>属主/属组/其他\u003c/b>的权限：属主rwx、组r-x、其他r--。"},{"c":"linux","t":"s","q":"关于setuid（SUID）位，下列说法正确的是（　）。","o":["允许普通用户以文件属主身份执行该程序（如/usr/bin/passwd）","使文件只能读","禁止程序执行","仅对目录生效"],"a":0,"e":"\u003cb>SUID使执行者临时获得文件属主身份\u003c/b>（如passwd以root修改口令）。SUID程序是提权攻击常利用目标，应排查：find / -perm -4000 -type f。"},{"c":"linux","t":"s","q":"配置sudo授权规则的文件是（　）。","o":["/etc/sudoers","/etc/sudo.conf","/etc/sshd_config","/etc/login.defs"],"a":0,"e":"\u003cb>/etc/sudoers\u003c/b>定义sudo授权规则，必须用visudo编辑（可校验语法），如“user ALL=(ALL) NOPASSWD: /bin/systemctl restart nginx”。"},{"c":"linux","t":"s","q":"useradd命令的作用是（　）。","o":["创建新用户","删除用户","修改用户口令","列出所有用户"],"a":0,"e":"\u003cb>useradd创建用户\u003c/b>（如 useradd -m -s /bin/bash alice），userdel删除用户，usermod修改用户属性，passwd设置或修改口令。"},{"c":"linux","t":"s","q":"passwd -l 命令的作用是（　）。","o":["锁定用户账户（禁止登录）","设置口令最小长度","修改口令策略","强制用户下次登录改密"],"a":0,"e":"\u003cb>passwd -l 锁定账户、-u 解锁\u003c/b>；锁定后该账户无法通过口令登录，常用于临时停用离职/异常账号，防止其继续访问系统。"},{"c":"linux","t":"s","q":"在日志中查找包含“Failed”的行并显示行号，应使用（　）。","o":["grep -n Failed 日志文件","cat 日志文件","tail 日志文件","ls 日志文件"],"a":0,"e":"\u003cb>grep -n 按模式匹配并显示行号\u003c/b>；配合-v（取反）、-c（计数）、-i（忽略大小写）等参数，是日志分析最常用的命令。"},{"c":"linux","t":"s","q":"查找系统中所有设置了SUID权限的文件，正确的是（　）。","o":["find / -perm -4000 -type f","ls -la /","cat /etc/sudoers","grep suid /etc/passwd"],"a":0,"e":"\u003cb>find / -perm -4000 -type f\u003c/b>列出所有setuid文件，是排查提权后门、做安全加固的高频命令；异常SUID文件往往是后门特征。"},{"c":"linux","t":"s","q":"查看当前系统所有进程（含其他用户）的完整命令行，应使用（　）。","o":["ps -ef 或 ps aux","ls -la","cat /etc/passwd","who"],"a":0,"e":"\u003cb>ps -ef/ps aux\u003c/b>查看进程及完整命令行，结合top查看资源占用；排查CPU/内存异常、陌生命令行的进程是应急响应的第一步。"},{"c":"linux","t":"s","q":"查看本机正在监听的端口及其对应进程，可以使用（　）。","o":["netstat -antp 或 ss -antp","df -h","free -m","uptime"],"a":0,"e":"\u003cb>netstat -antp（或ss -antp）\u003c/b>列出监听端口与进程PID，配合 lsof -i :端口 可定位服务；是发现对外开放服务与可疑后门端口的关键命令。"},{"c":"linux","t":"s","q":"RHEL/CentOS 7及以上版本默认的防火墙管理工具是（　）。","o":["firewalld（firewall-cmd）","iptables-service（旧）","nftables（直接）","ufw"],"a":0,"e":"\u003cb>RHEL/CentOS 7+默认使用firewalld\u003c/b>（firewall-cmd管理，底层调用nftables/iptables）；Debian/Ubuntu常用ufw，openSUSE常用SuSEfirewall。"},{"c":"linux","t":"s","q":"systemctl enable nginx 的作用是（　）。","o":["设置nginx开机自启动","立即启动nginx","重启nginx","停止nginx"],"a":0,"e":"\u003cb>systemctl enable=配置开机自启\u003c/b>，disable取消自启；start/stop/restart/status分别控制服务运行状态，是systemd体系的基础操作。"},{"c":"linux","t":"s","q":"修改SSH服务监听的端口与登录配置，应编辑（　）。","o":["/etc/ssh/sshd_config","/etc/ssh/ssh_config","/etc/hosts.allow","/etc/login.defs"],"a":0,"e":"\u003cb>/etc/ssh/sshd_config是sshd服务端配置\u003c/b>（Port、PermitRootLogin、PasswordAuthentication等），修改后需systemctl restart sshd；ssh_config是客户端配置。"},{"c":"linux","t":"s","q":"在systemd系统上查看系统日志的常用命令是（　）。","o":["journalctl","cat","vi","last"],"a":0,"e":"\u003cb>journalctl\u003c/b>读取systemd-journal日志（如 journalctl -u sshd、journalctl -f实时跟踪、--since 1小时前按时间过滤）；传统文件式日志仍在/var/log下。"},{"c":"linux","t":"s","q":"将命令的标准输出与错误输出都丢弃（不显示），可执行（　）。","o":["command >/dev/null 2>&1","command > log","command 2>log","command \u003c file"],"a":0,"e":"\u003cb>>/dev/null丢弃标准输出，2>&1把标准错误重定向到同一位置\u003c/b>，常用于后台脚本静默执行、不污染终端；/dev/null是“黑洞”设备。"},{"c":"linux","t":"s","q":"查看当前用户的历史命令记录，应使用（　）。","o":["history","ls","who","ps"],"a":0,"e":"\u003cb>history查看历史命令\u003c/b>，保存于~/.bash_history；命令历史可能泄露口令/操作，也是信息泄露的途径之一，安全基线常建议限制其记录或及时清理。"},{"c":"linux","t":"s","q":"Linux下用命令行下载远程文件最常用的工具是（　）。","o":["wget / curl","cp","scp","mount"],"a":0,"e":"\u003cb>wget/curl均可下载\u003c/b>；curl更灵活（-k忽略证书、-d POST等，渗透与排障常用），wget适合简单递归下载；scp用于主机间传输。"},{"c":"linux","t":"s","q":"/etc/hosts文件的作用是（　）。","o":["提供本地静态主机名与IP的映射，优先于DNS解析","存储DNS缓存","配置防火墙规则","配置网卡IP"],"a":0,"e":"\u003cb>/etc/hosts提供本地静态域名↔IP映射\u003c/b>，解析优先级通常高于DNS；若被篡改会导致流量被劫持，排查DNS劫持/恶意重定向时需检查该文件。"},{"c":"linux","t":"s","q":"Linux中查看进程状态的常用命令是（　），可配合信号终止进程。","o":["ps / kill","cd / ls","cat / echo","mkdir / rm"],"a":0,"e":"\u003cb>ps\u003c/b>查看进程快照（ps -ef/-aux），\u003cb>kill\u003c/b>按PID向进程发送信号（kill -9强制终止、kill -15优雅终止）。\u003cb>扩展\u003c/b>：top/htop实时监控进程资源；pkill按名称杀；\u003ccode>ps -ef | grep 关键词\u003c/code>定位可疑进程是应急排查第一步。\u003cb>易错点\u003c/b>：kill -9（SIGKILL）不可被捕获，慎用于可能丢数据的进程。\u003cb>记忆\u003c/b>：'ps看进程，kill发信号'。"},{"c":"linux","t":"s","q":"Linux系统中，僵尸进程（Zombie）是指（　）。","o":["进程已结束但未被父进程回收（占用进程表项）","还在运行的进程","被杀死的进程","守护进程"],"a":0,"e":"\u003cb>僵尸进程=子进程已退出，但父进程未调用wait回收其状态信息，进程表项仍保留（状态Z）\u003c/b>；不占CPU/内存，但会占用PID，僵尸过多会耗尽PID。\u003cb>处理\u003c/b>：kill父进程让init回收，或重启相关服务。\u003cb>易错点\u003c/b>：僵尸进程'杀不掉'（kill对其无效），需处理其父进程。\u003cb>记忆\u003c/b>：'僵尸=死了没被收尸，等父进程来收'。"},{"c":"linux","t":"s","q":"Linux守护进程（daemon）的典型特征与创建方式是（　）。","o":["脱离终端在后台常驻运行，通常以systemd服务方式管理","只能在登录终端运行","每次登录自动退出","不能开机自启"],"a":0,"e":"\u003cb>守护进程脱离控制终端、在后台常驻运行\u003c/b>（如sshd、httpd、mysqld），现代系统由\u003cb>systemd\u003c/b>统一管理（systemctl start/enable）。\u003cb>对比\u003c/b>：前台进程占用终端；'&'后台运行进程与守护进程不同。\u003cb>安全提示\u003c/b>：排查可疑常驻进程是发现后门/挖矿的重要手段。\u003cb>记忆\u003c/b>：'daemon=后台常住+系统托管'。"},{"c":"linux","t":"s","q":"systemd中，查看某服务运行状态与开机自启状态的命令分别是（　）。","o":["systemctl status 服务名 与 systemctl is-enabled 服务名","chmod 与 chown","ps 与 kill","ls 与 cd"],"a":0,"e":"\u003cb>systemctl status\u003c/b>查看服务运行状态（active/inactive、进程、日志），\u003cb>systemctl is-enabled\u003c/b>（或systemctl list-unit-files）查看是否开机自启。\u003cb>常用\u003c/b>：systemctl start/stop/restart/reload/enable/disable。\u003cb>易错点\u003c/b>：'运行状态'≠'自启状态'，两者要分开查。\u003cb>记忆\u003c/b>：'status看活着没，is-enabled看出不出勤'。"},{"c":"linux","t":"s","q":"Linux中，journalctl命令的主要用途是（　）。","o":["查看systemd（journald）集中收集的日志","编辑crontab","修改用户口令","查看磁盘分区"],"a":0,"e":"\u003cb>journalctl查看systemd日志（journald集中收集的系统日志）\u003c/b>，常用\u003ccode>journalctl -u 服务名\u003c/code>查某服务日志、\u003ccode>-f\u003c/code>实时跟踪、\u003ccode>--since 1小时前\u003c/code>按时间过滤。\u003cb>对比\u003c/b>：传统日志存/var/log（secure、messages），journald存二进制并持久化（/var/log/journal）。\u003cb>易错点\u003c/b>：排查服务崩溃首选journalctl -u -e。\u003cb>记忆\u003c/b>：'systemd的日志都归journalctl管'。"},{"c":"linux","t":"s","q":"chmod 754 对应的文件权限是（　）。","o":["属主rwx、属组r-x、其他r--","属主rwx、属组rwx、其他r--","属主rw-、属组r-x、其他r--","属主rwx、属组r-x、其他-wx"],"a":0,"e":"\u003cb>chmod 754：7=rwx（属主）、5=r-x（属组）、4=r--（其他）\u003c/b>。\u003cb>数字含义\u003c/b>：r=4、w=2、x=1，相加成和。\u003cb>速记\u003c/b>：7=4+2+1读写执行、6=4+2读写、5=4+1读执行、4=只读。\u003cb>易错点\u003c/b>：'其他'权限是最后一位；忘记x则脚本不可执行。\u003cb>记忆\u003c/b>：'rwx=421，挨个相加'。"},{"c":"linux","t":"s","q":"Linux中，umask 022 表示新建文件的默认权限是（　）。","o":["属主rw-，属组/其他r--（即644）","属主rwx，属组rwx","属主rw-，属组r-x","所有人可写"],"a":0,"e":"\u003cb>umask是'默认权限掩码'：默认权限=最大权限减去umask\u003c/b>。文件最大666、目录最大777；um
