/* ==================== 知识库文本（AI 答疑注入用，来自《网络安全运维理论知识点总结》） ==================== */
const KB_TEXT="# 网络安全运维理论知识点总结\n\n> 适配CCF网络与信息安全专业知识与技能比赛（初赛）\n> \n> 基于CCF初赛题目素材整理，含核心知识点速查表\n\n---\n\n## 一、网络协议基础\n\n### 1.1 TCP/IP协议簇四层模型\n\n| 层次 | 主要协议 | 核心功能 |\n|------|----------|----------|\n| 应用层 | HTTP、HTTPS、FTP、SMTP、POP3、IMAP、DNS、SSH、TELNET | 为用户提供网络应用服务 |\n| 传输层 | TCP、UDP | 端到端数据传输、流量控制、差错控制 |\n| 网络层 | IP、ICMP、ARP、RARP | 路由选择、逻辑寻址、分组转发 |\n| 链路层 | Ethernet、PPP、HDLC | 物理传输、MAC寻址、帧封装 |\n\n### 1.2 邮件传输协议\n\n| 协议 | 默认端口 | 功能说明 | 安全版本 |\n|------|----------|----------|----------|\n| **SMTP** | **25/587** | 发送邮件 | SMTPS (465/587) |\n| **POP3** | **110** | 收取并下载邮件到本地 | POP3S (995) |\n| **IMAP** | **143** | 同步管理服务器端邮件 | IMAPS (993) |\n\n> **记忆要点：**\n>\n> - SMTP = **发**邮件\n> - POP3 = **收**邮件\n> - IMAP = **同步**管理\n\n### 1.3 TELNET vs SSH 对比\n\n| 对比项 | TELNET | SSH |\n|--------|--------|-----|\n| **安全性** | **明文传输** | **加密传输** |\n| 默认端口 | 23 | 22 |\n| 数据完整性 | 无校验 | 消息完整性校验 |\n| 口令传输 | 明文 | 加密 |\n\n> **考试重点：TELNET与SSH的主要区别是SSH采用加密传输，TELNET为明文传输。生产环境中远程管理必须使用SSH。**\n\n### 1.4 IPv6地址\n\n**缩写规则：**\n- 规则一：每组前导0可省略\n- 规则二：连续全0组可用`::`代替（每个地址只能使用一次）\n\n**例题：** 2011:0000:0000:1a30:0000:0000:0100:45ff\n- 步骤1：省略前导0 → 2011:0:0:1a30:0:0:100:45ff\n- 步骤2：合并连续0为:: → **2011::1a30:0:0:100:45ff**\n\n> **易错点：**\n> - `1a30`不能缩写为`1a3`（中间单个0不能省略）\n> - `::`在一个地址中只能出现一次\n\n### 1.5 DNS记录类型\n\n| 记录类型 | 作用 |\n|----------|------|\n| A记录 | 将域名解析为IPv4地址 |\n| AAAA记录 | 将域名解析为IPv6地址 |\n| CNAME | 域名别名解析（Canonical Name） |\n| MX记录 | 邮件交换器记录，指定邮件服务器 |\n| NS记录 | 权威名称服务器记录 |\n| PTR记录 | 反向解析（IP转域名） |\n\n### 1.6 HTTP与HTTPS\n\n| 对比项 | HTTP | HTTPS |\n|--------|------|-------|\n| 默认端口 | 80 | 443 |\n| 传输加密 | 明文 | SSL/TLS加密 |\n| 身份认证 | 无 | 数字证书认证服务器身份 |\n| 数据完整性 | 无校验 | MAC消息认证码校验 |\n\n> **考点提示：实现HTML超文本传输的协议是HTTP协议。**\n\n---\n\n## 二、等保2.0合规规范\n\n### 2.1 安全保护等级划分\n\n| 等级 | 名称 | 受侵害客体 | 侵害程度 |\n|------|------|------------|----------|\n| 第一级 | 自主保护级 | 公民、法人和其他组织的合法权益 | 一般损害 |\n| 第二级 | 指导保护级 | 公民、法人和其他组织的合法权益 | 严重损害或一般损害 |\n| 第三级 | 监督保护级 | 社会秩序、公共利益、国家安全 | 严重损害或一般损害 |\n| 第四级 | 强制保护级 | 社会秩序、公共利益、国家安全 | 特别严重损害 |\n| 第五级 | 专控保护级 | 国家安全 | 特别严重损害 |\n\n### 2.2 一个中心、三重防护\n\n**等保2.0的核心防护理念：**\n\n- **一个中心：** 安全管理中心（态势感知、安全运营中心）\n- **三重防护：**\n  - 安全计算环境（主机、应用、数据）\n  - 安全区域边界（边界防护、访问控制）\n  - 安全通信网络（网络架构、传输安全）\n\n### 2.3 等级测评流程\n\n| 阶段 | 主要内容 | 输出文档 |\n|------|----------|----------|\n| 定级 | 确定保护等级，编制定级报告 | 定级报告 |\n| 备案 | 向公安机关提交备案材料 | 备案证明 |\n| 建设整改 | 依据等级要求建设安全防护 | 整改方案 |\n| 等级测评 | 测评机构进行符合性测评 | 测评报告 |\n| 监督检查 | 公安机关监督检查 | 监督检查记录 |\n\n### 2.4 等保三级技术要求\n\n| 控制类 | 主要要求 |\n|--------|----------|\n| 身份鉴别 | 采用**两种或两种以上组合**的鉴别技术（如口令+指纹、口令+U盾） |\n| 访问控制 | 实施基于角色的访问控制，限制用户权限 |\n| 安全审计 | 记录用户行为、安全事件，审计记录保护6个月以上 |\n| 入侵防范 | 检测和阻止网络攻击、应用攻击 |\n| 恶意代码防范 | 部署防病毒软件，及时更新特征库 |\n| 数据安全 | 数据保密性、完整性保护，备份恢复 |\n\n### 2.5 等保1.0与2.0对比\n\n| 对比项 | 等保1.0 | 等保2.0 |\n|--------|---------|---------|\n| 标准名称 | 信息系统安全等级保护 | 网络安全等级保护 |\n| 保护对象 | 传统信息系统 | **网络基础设施、云平台、物联网、工控系统** |\n| 定级流程 | 自主定级 | **专家评审、主管部门审核** |\n| 可信验证 | 未明确要求 | 强调可信验证要求 |\n| 风险评估 | 可选 | 作为安全管理重要环节 |\n\n---\n\n## 三、商用密码知识\n\n### 3.1 密码体制分类\n\n| 密码类型 | 特点 | 代表算法 |\n|----------|------|----------|\n| **对称加密** | 加密解密使用同一密钥，速度快 | DES、3DES、AES、SM4 |\n| **非对称加密** | 公钥加密、私钥解密，或私钥签名、公钥验证 | RSA、ECC、SM2 |\n| **哈希函数** | 单向散列，不可逆，用于完整性校验 | MD5、SHA系列、SM3 |\n\n### 3.2 国密算法体系（SM系列）\n\n| 算法 | 类型 | 关键参数 | 应用场景 |\n|------|------|----------|----------|\n| **SM1** | 对称加密 | 128位分组 | 芯片内置，不公开 |\n| **SM2** | 非对称加密 | 椭圆曲线密码 | 数字签名、密钥交换 |\n| **SM3** | 哈希算法 | **256位输出（32字节）** | 消息认证、数字签名 |\n| **SM4** | 对称加密 | 128位分组、32轮迭代 | 数据加密（类AES结构） |\n| SM7 | 对称加密 | 64位分组 | 门禁卡、SIM卡 |\n| SM9 | 身份加密 | 标识密码 | 基于标识的加密 |\n\n> **重要数据：SM3杂凑值长度为256位（32字节），2018年成为ISO/IEC 10118-3国际标准**\n\n### 3.3 常见哈希算法对比\n\n| 算法 | 输出长度 | 安全性 | 说明 |\n|------|----------|--------|------|\n| MD5 | 128位（16字节） | **不安全** | 存在碰撞攻击，已被破解 |\n| SHA-1 | 160位（20字节） | **不安全** | 2017年谷歌宣布实际碰撞 |\n| SHA-256 | 256位（32字节） | 安全 | SHA-2家族，当前推荐使用 |\n| **SM3** | 256位（32字节） | 安全 | 中国国密标准 |\n\n### 3.4 密码分析攻击类型\n\n> **按攻击难度从高到低排列（攻击者能力越弱，难度越高）：**\n\n| 攻击类型 | 攻击者能力 | 难度等级 |\n|----------|------------|----------|\n| **唯密文攻击** | 仅能获取密文 | **最难** ⭐⭐⭐⭐⭐ |\n| 已知明文攻击 | 获得部分明文-密文对 | 较难 ⭐⭐⭐⭐ |\n| 选择明文攻击 | 可选择明文获取对应密文 | 中等 ⭐⭐⭐ |\n| 选择密文攻击 | 可选择密文获取对应明文 | 中等 ⭐⭐⭐ |\n\n> **记忆口诀：攻击者能力越强，获取信息越多，攻击难度越低。唯密文攻击只看到密文，难度最大。**\n\n### 3.5 Base64编码\n\n- **编码规则：** 每3个字节（24位）编码为4个Base64字符\n- **填充规则：** 原数据不足3字节时，用\"=\"填充\n\n> **计算示例：**\n> - 题目：\"abcdefg\"的Base64编码\n> - 答案：**YWJjZGVmZw==**\n\n### 3.6 Kerberos认证协议\n\n| 组件 | 全称 | 作用 |\n|------|------|------|\n| **AS** | Authentication Server | 认证服务器，验证用户身份 |\n| **TGS** | Ticket Granting Server | 票据授予服务器，发放服务票据 |\n| **TGT** | Ticket Granting Ticket | 票据授予票据，有效期通常8-10小时 |\n\n> **Kerberos核心缺陷：最严重的安全问题是严重依赖于时间同步。若客户端与服务端时间偏差过大（超过票据有效期），票据将失效，攻击者可利用此进行拒绝服务攻击。**\n\n---\n\n## 四、操作系统安全运维\n\n### 4.1 Linux用户认证\n\n**口令安全原则判断：**\n\n| 说法 | 正确性 | 说明 |\n|------|--------|------|\n| 口令不能设置为空 | ✅ 正确 | 空口令是最严重的安全隐患，等同于未设置认证 |\n| 口令长度越长，安全性越高 | ✅ 正确 | 暴力破解难度随长度指数增长 |\n| 复杂口令不需要定期修改 | ❌ 错误 | 复杂口令也可能泄露（钓鱼、键盘记录），定期更换仍是好习惯 |\n| 口令认证是最常见的认证机制 | ✅ 正确 | 简单易实现，但相对安全性较弱 |\n\n### 4.2 用户认证相关文件\n\n| 文件路径 | 作用 | 权限 |\n|----------|:-----|------|\n| /etc/passwd | 存储用户基本信息（用户名:口令:UID:GID:说明:主目录:shell） | 所有用户可读 |\n| **/etc/shadow** | 存储用户加密口令及口令策略 | **仅root可读** |\n| /etc/login.defs | 定义用户口令策略（最小长度、最长使用期等） | 配置文件 |\n\n> **考点提示：修改缺省密码长度限制的配置文件是/etc/login.defs**\n\n### 4.3 文件查看命令对比\n\n| 命令 | 特点 | 适用场景 |\n|------|------|----------|\n| **cat** | 一次性输出全部内容 | 小文件查看、文件合并重定向 |\n| **more** | 分页显示（回车下翻一行，空格翻一页） | 大文件查看，只能向下 |\n| **less** | 支持上下移动、搜索、/向前 ?向后查找 | 日志分析、代码查看（**推荐使用**） |\n\n> **记忆口诀：\"less is more\" —— less命令比more功能更强大**\n\n### 4.4 vim编辑器备份文件\n\n| 文件类型 | 格式 | 说明 |\n|----------|------|------|\n| **交换文件** | **.filename.swp** | 编辑时创建的临时文件，防止意外退出丢失数据 |\n| 备份文件 | .filename | 需执行:set backup才会创建 |\n| 手动备份 | filename.bak | 用户手动cp或工具创建 |\n\n### 4.5 crontab时间格式\n\n```\n# ┌───────────── 分钟 (0-59)\n# │ ┌─────────── 小时 (0-23)\n# │ │ ┌───────── 日   (1-31)\n# │ │ │ ┌─────── 月   (1-12)\n# │ │ │ │ ┌───── 星期 (0-7, 0和7代表周日)\n# │ │ │ │ │\n*  *  *  *  *  command\n```\n\n> **例题：每周一至周五下午1点和晚上8点执行mybackup**\n> - 正确答案：**0 13,20 * * 1,2,3,4,5 mybackup**\n> - 解析：0分、13时和20时、每周1-5执行\n\n### 4.6 Linux权限管理\n\n| 命令 | 功能 | 能否提权 |\n|------|------|----------|\n| **su** | 切换用户身份 | **✅ 可以**（普通→root） |\n| sudo | 以root权限执行单条命令 | 临时提权，有日志记录 |\n| chmod | 修改文件权限 | ❌ 不能提权 |\n| chgrp | 修改文件所属组 | ❌ 不能提权 |\n| passwd | 修改用户口令 | ❌ 不能提权 |\n\n### 4.7 Windows系统安全\n\n| 项目 | 内容 |\n|------|------|\n| 事件日志格式 | **.evtx**（XML-based Event Log Format） |\n| 停止服务命令 | **net stop** |\n| 自启动管理工具 | **Autoruns**（可查看注册表Run键、启动文件夹、计划任务、服务自启动） |\n\n### 4.8 安全基线检查\n\n**主要检查项：**\n\n| 检查类别 | 检查内容 |\n|----------|----------|\n| 账户策略 | 口令复杂度、账户锁定阈值、最长使用期 |\n| 审核策略 | 登录事件、对象访问、策略变更审核 |\n| 用户权限分配 | 本地登录、远程关机、取得文件所有权 |\n| 安全选项 | 交互式登录、网络访问、网络安全设置 |\n\n> **审核建议：不适合审核\"用户打开和关闭应用程序\"，会产生大量无用日志。**\n\n---\n\n## 五、日志分析与应急响应\n\n### 5.1 Linux日志系统\n\n| 日志文件 | 内容 |\n|----------|------|\n| **/var/log/secure** | **安全相关日志（认证、登录）** |\n| /var/log/wtmp | 登录历史（二进制文件，用last命令查看） |\n| /var/log/lastlog | 所有用户最后登录记录 |\n| /var/log/message | 系统常规消息 |\n| /var/log/maillog | 邮件服务日志 |\n| /var/log/cron | 计划任务执行日志 |\n| /var/log/dmesg | 系统启动时的内核环缓冲信息 |\n\n> **必考知识点：Linux系统中，存放与安全相关的日志信息的文件是/var/log/secure**\n\n### 5.2 日志分析命令\n\n| 命令 | 作用 | 数据来源 |\n|------|------|----------|\n| last | 查看用户登录历史 | /var/log/wtmp |\n| lastlog | 查看所有用户最后登录时间 | /var/log/lastlog |\n| who | 查看当前登录用户 | /var/run/utmp |\n| lastb | 查看登录失败记录 | /var/log/btmp |\n\n### 5.3 Apache日志分析\n\n**标准Apache Combined Log格式：**\n```\n192.168.1.1 - - [01/Jan/2024:00:00:00 +0000] \"GET /page HTTP/1.1\" 200 1234 \"Referer\" \"User-Agent\"\n```\n\n| 字段 | 说明 |\n|------|------|\n| 第1字段 | 客户端IP地址 |\n| 第4字段 | 请求时间戳 |\n| 第6-8字段 | 请求方法、路径、协议 |\n\n> **提取IP地址的常用命令：** `awk '{print $1}' access.log`\n\n### 5.4 PDCERF应急响应模型\n\n| 阶段 | 英文 | 主要任务 |\n|------|------|----------|\n| **准备** | Preparation | 建立应急响应团队、准备工具和资源、制定预案 |\n| **检测** | Detection | 确认事件类型、评估影响范围、初步分析 |\n| **遏制** | Containment | 隔离受影响系统、阻止事件扩散 |\n| **根除** | Eradication | 清除恶意代码、修复漏洞、消除后门 |\n| **恢复** | Recovery | 恢复系统运行、验证功能完整性 |\n| **总结** | Lessons Learned | 编写事件报告、总结经验教训、改进措施 |\n\n### 5.5 常见安全事件识别\n\n| 事件类型 | 特征 | 日志线索 |\n|----------|------|----------|\n| 暴力破解 | 短时间内大量登录失败 | /var/log/secure大量Failed password |\n| webshell上传 | 异常脚本文件出现 | Web访问日志异常请求（如cmd、eval） |\n| 权限提升 | 普通用户获取root权限 | sudo/su命令日志异常，成功提权记录 |\n| 数据泄露 | 敏感文件被访问或外传 | 网络连接日志、大量出站流量、文件访问日志 |\n| DDoS攻击 | 服务不可用、资源耗尽 | 短时间内大量连接请求、CPU/带宽占用高 |\n\n### 5.6 计算机取证基础\n\n**取证原则（CIA三元组）：**\n\n| 原则 | 含义 | 实现方式 |\n|------|------|----------|\n| **保密性** | Confidentiality | 证据不被未授权访问 |\n| **完整性** | Integrity | 保持证据原始性（哈希校验） |\n| **可用性** | Availability | 合法授权者可访问证据 |\n\n> **常见错误说法：\"计算机取证必须在开机的状态下进行\" —— 这是错误的。关机状态下可以通过硬盘镜像获取证据。**\n\n### 5.7 日志分割工具\n\n| 工具 | 用途 |\n|------|------|\n| **split** | 文件分割工具（日志分割） |\n| awk | 文本处理，可按条件分割日志 |\n| logrotate | 日志轮转工具，自动管理日志文件 |\n\n---\n\n## 六、安全设备基础\n\n### 6.1 防火墙\n\n**防火墙分类：**\n\n| 类型 | 工作层次 | 特点 |\n|------|----------|------|\n| 包过滤防火墙 | 网络层 | 基于IP/端口过滤，简单快速 |\n| 状态检测防火墙 | 传输层 | 跟踪连接状态，动态建立规则 |\n| 应用层防火墙 | 应用层 | 深度检测应用层协议内容 |\n| 下一代防火墙(NGFW) | 全层次 | 集成IPS、AV、应用识别、用户识别 |\n\n### 6.2 IDS vs IPS\n\n| 对比项 | IDS（入侵检测系统） | IPS（入侵防御系统） |\n|--------|---------------------|---------------------|\n| 部署方式 | 旁路监听 | 串接部署 |\n| 响应方式 | 仅告警 | 告警+阻断 |\n| 对性能影响 | 较小 | 较大（可能产生延迟） |\n| 误报影响 | 仅告警 | 可能阻断正常流量 |\n\n**检测技术：**\n- **特征检测：** 基于已知攻击特征库匹配，准确率高但无法检测未知攻击\n- **异常检测：** 基于正常行为建模，检测偏离正常模式的行为\n- **状态检测：** 跟踪协议状态转换，检测状态异常\n\n### 6.3 VPN\n\n**核心安全机制：**\n\n| 安全机制 | 说明 | VPN是否包含 |\n|----------|------|-------------|\n| **隧道技术** | 封装数据包在公网传输 | **✅ 是** |\n| **身份认证技术** | 验证远程用户身份 | **✅ 是** |\n| **密钥管理技术** | 加密密钥生成与分发 | **✅ 是** |\n| **信息隐藏技术** | 隐蔽通信存在性（如隐写术） | ❌ 否 |\n\n**常见VPN协议：**\n\n| 协议 | 特点 | 安全性 |\n|------|------|--------|\n| PPTP | 基于PPP，点对点隧道协议 | **低（已被破解，不推荐）** |\n| L2TP/IPsec | 二层隧道+IPsec加密 | 中等 |\n| SSL VPN | 基于HTTPS，应用层 | **高（推荐）** |\n| OpenVPN | 开源SSL/TLS VPN | 高 |\n\n### 6.4 其他安全设备\n\n| 设备 | 功能 |\n|------|------|\n| **堡垒机** | 集中管理运维访问，记录操作行为，实现运维审计 |\n| **数据库审计系统(DAS)** | 监控和记录数据库操作，审计SQL行为 |\n| **安全审计系统** | 对网络行为进行安全审计，记录用户和系统行为 |\n| **漏洞扫描器** | 自动发现系统和应用漏洞 |\n| **APT检测设备** | 检测高级持续性威胁 |\n| **威胁情报平台** | 收集、整合威胁情报数据 |\n\n### 6.5 TCSEC安全级别\n\n**TCSEC（可信计算机系统评估准则）也称为橙皮书：**\n\n| 级别 | 名称 | 特点 |\n|------|------|------|\n| D | 最小保护 | 无安全保护 |\n| C1 | 选择性安全保护 | 基本安全要求 |\n| **C2** | **受控访问保护** | **审计、隔离、身份鉴别** |\n| B1 | 标签安全 | 强制访问控制 |\n| B2 | 结构化保护 | 安全模型化 |\n| B3 | 安全域 | 访问监控器 |\n| A1 | 验证设计 | 形式化验证，最高安全级别 |\n\n> **必考知识点：处理安全信息需要的最低安全级别是C2**\n\n---\n\n## 七、网络安全法律法规\n\n### 7.1 主要法律法规\n\n| 法律名称 | 施行时间 | 主要内容 |\n|----------|----------|----------|\n| 《网络安全法》 | 2017年6月1日 | 网络安全基本法，确立等级保护制度 |\n| 《数据安全法》 | 2021年9月1日 | 数据安全制度建设、数据分类分级 |\n| 《个人信息保护法》 | 2021年11月1日 | 个人信息处理规范、跨境传输 |\n| 《密码法》 | 2020年1月1日 | 密码分类管理、推广应用 |\n| 《电子签名法》 | 2005年4月1日 | 电子签名法律效力 |\n\n### 7.2 网络运营者义务\n\n- 遵守法律、行政法规，履行网络安全保护义务\n- 制定内部安全管理制度和操作规程\n- 采取防范计算机病毒和网络攻击的技术措施\n- 采取监测、记录网络运行状态、网络安全事件的技术措施\n- **按照规定留存相关的网络日志不少于六个月**\n- 发生网络安全事件，应当立即启动网络安全事件应急预案\n- 按照规定向有关主管部门报告\n\n### 7.3 关键信息基础设施保护\n\n**范围：**\n- 公共通信和信息服务、能源、交通、金融等行业\n- 重要互联网基础设施\n- 国防科工、大型装备、化工、食品药品等单位\n\n**数据要求：**\n- 在境内存储\n- 因业务需要向境外提供的，应当进行安全评估\n\n### 7.4 密码分类管理\n\n| 密码类型 | 管理方式 | 使用范围 |\n|----------|----------|----------|\n| 核心密码 | 实行严格管理 | 国家秘密 |\n| 普通密码 | 实行严格管理 | 保护国家秘密以外秘密 |\n| **商用密码** | **依法管理、自由使用** | 商业领域 |\n\n---\n\n## 附录：核心记忆点速查表\n\n| 知识点 | 答案 |\n|--------|------|\n| SMTP端口 | 25/587 |\n| POP3端口 | 110 |\n| SSH端口 | 22 |\n| TELNET vs SSH主要区别 | SSH加密，TELNET明文 |\n| SM3杂凑值长度 | **256位（32字节）** |\n| 密码分析最难攻击类型 | **唯密文攻击** |\n| Kerberos依赖 | **时间同步** |\n| Linux安全日志文件 | **/var/log/secure** |\n| Windows日志格式 | **.evtx** |\n| crontab五段顺序 | 分、时、日、月、周 |\n| 文件查看less特点 | 支持上下移动 |\n| vim交换文件 | **.filename.swp** |\n| TCSEC最低安全级别 | **C2** |\n| VPN不包括的技术 | 信息隐藏技术 |\n| Base64编码规则 | 每3字节变4字符，不足补= |\n| 等保三级鉴别要求 | 两种以上组合鉴别技术 |\n| 日志保留时间 | 不少于6个月 |\n| PDCERF第一阶段 | Preparation（准备） |\n| Kerberos使用的加密算法 | DES（传统版本） |\n| 数字信封不能做到 | 隐藏发送者真实身份 |\n| 修改缺省密码长度限制的配置文件 | /etc/login.defs |\n| 处理安全信息需要的最低安全级别 | C2 |\n\n---\n\n> **整理说明：**\n> 本知识点总结基于CCF网络与信息安全专业知识与技能比赛（初赛）理论题目素材整理，涵盖网络协议、等保2.0、商用密码、操作系统安全、日志分析、安全设备、法律法规七大模块。建议配合题库练习使用。";



/* ==================== 持久化 ==================== */
const KEY="secops_quiz_v1";
let db;
try{db=JSON.parse(localStorage.getItem(KEY))||null}catch(e){db=null}
if(!db||typeof db!=="object")db={stats:{},wrong:[],history:[],daily:{},review:{},ai:null,star:[],report:[]};
db.stats=db.stats||{};db.wrong=db.wrong||[];db.history=db.history||[];
db.daily=db.daily||{};db.review=db.review||{};db.star=db.star||[];db.report=db.report||[];db.ai=db.ai||{url:"https://open.bigmodel.cn/api/paas/v4/chat/completions",model:"",key:"",kb:true};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return todayStr(d)}
const REVIEW_LADDER=[1,2,4,7,15,30];
function recordAnswer(q,correct){
  const st=db.stats[q.id]=db.stats[q.id]||{r:0,w:0};
  if(correct){st.r++;db.wrong=db.wrong.filter(id=>id!==q.id)}
  else{st.w++;if(!db.wrong.includes(q.id))db.wrong.push(q.id)}
  db.daily[todayStr()]=(db.daily[todayStr()]||0)+1;    // 每日打卡计数
  const acc=st.r+st.w?st.r/(st.r+st.w):1;              // 含本题的历史正确率，驱动自适应复习
  if(!correct){
    // 答错：历史正确率≥30% 且已在复习中 → 只降一档（总错的题在短间隔徘徊）；否则回到第一天
    if(db.review[q.id]&&acc>=0.3){
      const back=REVIEW_LADDER[Math.max(0,REVIEW_LADDER.indexOf(db.review[q.id].iv)-1)];
      db.review[q.id]={iv:back,due:addDays(back)};
    }else db.review[q.id]={iv:1,due:addDays(1)};
  }else if(db.review[q.id]){
    const cur=Math.max(0,REVIEW_LADDER.indexOf(db.review[q.id].iv));
    let step=1;
    if(acc>=0.9&&st.r>=2)step=2;                        // 掌握稳定的题双倍速推进，提前毕业
    const ti=cur+step;
    if(ti>=REVIEW_LADDER.length){ // 全部轮次通过：毕业移出（含摘星）
      delete db.review[q.id];db.star=db.star.filter(id=>id!==q.id);db.wrong=db.wrong.filter(id=>id!==q.id);
    }else db.review[q.id]={iv:REVIEW_LADDER[ti],due:addDays(REVIEW_LADDER[ti])};
  }
  save();
}
function dueCount(){const t=todayStr();let n=0;for(const id in db.review){if(db.review[id].due<=t)n++}return n}
function streak(){
  let n=0;const d=new Date();
  if(!((db.daily[todayStr(d)]||0)>0))d.setDate(d.getDate()-1); // 今天还没答题则从昨天起算
  while((db.daily[todayStr(d)]||0)>0){n++;d.setDate(d.getDate()-1)}
  return n;
}
function heatHtml(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const start=new Date(t0);start.setDate(start.getDate()-112);
  start.setDate(start.getDate()-((start.getDay()+6)%7)); // 对齐到周一
  let cells="",d=new Date(start);
  for(let c=0;c<17;c++)for(let r=0;r<7;r++){

function trendSvg(){ // 模拟考成绩趋势线
  const hs=db.history.slice(-20);
  if(hs.length<2)return '<div class="empty" style="padding:14px 0">考满 2 次模拟考后，这里会画出成绩趋势线</div>';
  const W=600,H=150,P=30;
  const xs=i=>P+i*(W-2*P)/(hs.length-1);
  const ys=v=>H-24-(v/100)*(H-48);
  const pts=hs.map((h,i)=>xs(i).toFixed(1)+","+ys(h.score).toFixed(1)).join(" ");
  const grid=[60,80].map(v=>'<line x1="'+P+'" y1="'+ys(v)+'" x2="'+(W-P)+'" y2="'+ys(v)+'" stroke="var(--border)" stroke-dasharray="4 4"/><text x="4" y="'+(ys(v)+4).toFixed(1)+'" font-size="10" fill="var(--muted)">'+v+'</text>').join("");
  const dots=hs.map((h,i)=>'<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(h.score).toFixed(1)+'" r="3.5" fill="var(--primary)"><title>'+h.date+'　'+h.score+' 分</title></circle>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
    '<text x="4" y="12" font-size="10" fill="var(--muted)">模拟考成绩趋势（最近 '+hs.length+' 次）</text>'+grid+
    '<polyline points="'+pts+'" fill="none" stroke="var(--teal)" stroke-width="2"/>'+dots+'</svg>';
}
function radarSvg(){ // 分类掌握度雷达图
  const cats=Object.keys(CATS),N=cats.length,R=86,CX=130,CY=118;
  const px=(i,r)=>(CX+r*Math.cos(-Math.PI/2+i*2*Math.PI/N)).toFixed(1);
  const py=(i,r)=>(CY+r*Math.sin(-Math.PI/2+i*2*Math.PI/N)).toFixed(1);
  let rings="";[0.25,0.5,0.75,1].forEach(f=>{rings+='<polygon points="'+cats.map((_,i)=>px(i,R*f)+","+py(i,R*f)).join(" ")+'" fill="none" stroke="var(--border)"/>'});
  const axes=cats.map((_,i)=>'<line x1="'+CX+'" y1="'+CY+'" x2="'+px(i,R)+'" y2="'+py(i,R)+'" stroke="var(--border)"/>').join("");
  const poly=cats.map((k,i)=>{const s=catStats(k);return px(i,R*Math.max(0.06,(s.acc<0?0:s.acc)/100))+","+py(i,R*Math.max(0.06,(s.acc<0?0:s.acc)/100))}).join(" ");
  const labels=cats.map((k,i)=>'<text x="'+px(i,R+16)+'" y="'+py(i,R+16)+'" font-size="13" text-anchor="middle" dominant-baseline="middle"><title>'+CATS[k].n+'</title>'+CATS[k].icon+'</text>').join("");
  return '<svg viewBox="0 0 260 236" style="width:100%;max-width:320px;display:block;margin:0 auto">'+rings+axes+
    '<polygon points="'+poly+'" fill="rgba(2,132,199,.22)" stroke="var(--primary)" stroke-width="1.5"/>'+labels+'</svg>'+
    '<div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:4px">分类掌握度（正确率，未刷的分类按 0 计）</div>';
}
function overallStats(){
  let r=0,w=0;for(const id in db.stats){r+=db.stats[id].r;w+=db.stats[id].w}
  const total=r+w;
  return{r,w,total,acc:total?Math.round(r/total*100):0};
}
function catStats(cat){
  const qs=QUESTIONS.filter(q=>q.c===cat);
  let done=0,r=0,w=0;
  qs.forEach(q=>{const s=db.stats[q.id];if(s){done++;r+=s.r;w+=s.w}});
  const t=r+w;
  return{total:qs.length,done,acc:t?Math.round(r/t*100):-1};
}

/* 题干/选项/解析消毒：保留 code/sup/b 等安全格式标签，把可执行 HTML（img/script/onerror 等 XSS 载荷）转义为可见文本，防止渲染时执行 */
const __SAFE_TAG=/^(?:code|sup|sub|b|strong|i|em|br|u|span|blockquote|pre|p|table|tr|td|th|ul|ol|li|hr|h[1-6]|mark|small|abbr|kbd|samp|var|cite|del|ins|div|center)$/i;
function san(s){
  s=String(s);
  const codes=[];
  s=s.replace(/<code[^>]*>[\s\S]*?<\/code>/gi,function(m){codes.push(m);return ""+(codes.length-1)+""});
  s=s.replace(/<\/?[a-zA-Z][a-zA-Z0-9]*(?:\s[^<>]*|\/[^<>]*)*>/g,function(m){
    const tag=(m.match(/<\/?([a-zA-Z][a-zA-Z0-9]*)/)||[])[1];
    return __SAFE_TAG.test(tag)?m:m.replace(/</g,"&lt;").replace(/>/g,"&gt;");
  });
  return s.replace(/(\d+)/g,function(m,d){return codes[+d]});
}
let __sanitized=false;
function sanitizeQuestions(){if(__sanitized)return;__sanitized=true;QUESTIONS.forEach(q=>{q.q=san(q.q);q.o=(q.o||[]).map(san);q.e=san(q.e)})}

function rQuestion(){
  const exam=ses.mode==="exam";
  const q=qOf(ses.idx);
  const answered=ses.answers[ses.idx];
  const opts=optList(q);
  const catName=CATS[q.c].n;
  const typeBadge=q.t==="f"?"判断题":(q.t==="m"?"多选题":"单选题");
  let optsHtml="",verdict="",exp="";
  const msel=(!exam&&q.t==="m"&&ses.sel&&ses.sel[ses.idx])||[];
  opts.forEach((o,i)=>{
    let cls="",dis="";
    if(exam){
      const a=ses.answers[i];
      if(q.t==="m"?(Array.isArray(a)&&a.includes(i)):a===i)cls="sel";
    }else if(answered!==undefined){
      dis="disabled";
      const okList=q.t==="m"?[].concat(q.a):[q.a];
      if(okList.includes(i))cls="correct";
      else if(q.t==="m"?(Array.isArray(answered)&&answered.includes(i)):answered===i)cls="wrong";
    }else if(msel.includes(i))cls="sel";
    optsHtml+='<button class="opt '+cls+'" '+dis+' onclick="pick('+i+')"><span class="lt">'+LETTERS[i]+'</span><span>'+o+'</span></button>';
  });
  if(!exam&&answered!==undefined){
    const ok=isCorrect(q,answered);
    verdict='<div class="verdict '+(ok?"ok":"no")+'">'+(ok?"✅ 回答正确":"❌ 回答错误，正确答案是 "+correctText(q))+'</div>';
    exp='<div class="exp"><div class="exph">📖 解析</div>'+q.e+'</div>';
  }
  const mBtn=(!exam&&q.t==="m"&&answered===undefined)?'<button class="btn primary" style="width:100%;margin-top:14px"'+(msel.length?"":" disabled")+' onclick="confirmMulti()">✅ 确认答案（已选 '+msel.length+' 项，可多选）</button>':"";
  const nav=ses.qids.map((_,i)=>{
    let cls="";
    if(exam){
      if(ses.flags[i])cls="flg";
      else if(ses.answers[i]!==undefined)cls="ans";
    }else{
        if(ses.answers[i]!==undefined)cls=isCorrect(QUESTIONS[ses.qids[i]],ses.answers[i])?"done-ok":"done-no";
    }
    if(i===ses.idx)cls+=" cur";
    return '<button class="navc '+cls+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join("");
  const progress=Math.round((ses.idx+1)/ses.qids.length*100);
  const last=ses.idx===ses.qids.length-1;
  const timerHtml=exam?'<span class="timer" id="timer">--:--</span>':"";
  const flagBtn=exam?'<button class="btn ghost sm" onclick="flag()">'+(ses.flags[ses.idx]?"🚩 取消标记":"🚩 标记本题")+'</button>':"";
  const aiBtn=exam?"":'<button class="btn ghost sm" onclick="askAI()">'+icon("bot",14)+' 问AI</button>';
  const starBtn='<button class="btn ghost sm" onclick="toggleStar(qOf(ses.idx).id);render()">'+(db.star.includes(q.id)?"⭐ 已存疑":"☆ 存疑")+'</button>';
  const repBtn='<button class="btn ghost sm" onclick="toggleReport(qOf(ses.idx).id);render()">'+(db.report.includes(q.id)?"⚠️ 已报错":"⚠️ 报错")+'</button>';
    return '<div class="topbar"><button class="btn ghost sm" onclick="confirmExit()">← 退出</button>'+
    '<b>'+(exam?"📝 模拟考试":"📖 练习模式")+' · '+catName+'</b>'+
    '<span class="sp"></span>'+aiBtn+starBtn+repBtn+flagBtn+timerHtml+
    (exam?'<button class="btn primary sm" onclick="submitExam(true)">交卷</button>':"")+'</div>'+
    '<div class="pbar"><i style="width:'+progress+'%"></i></div>'+
    '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">第 '+(ses.idx+1)+' / '+ses.qids.length+' 题　答题卡见下方</div>'+
    '<div class="qcard">'+
      '<span class="badge">'+catName+'</span> <span class="badge gray">'+typeBadge+'</span> <span class="badge gray">#'+q.id+'</span>'+
      '<div class="qtitle">'+q.q+'</div>'+
      '<div class="opts">'+optsHtml+'</div>'+mBtn+verdict+exp+
      '<div class="qfoot">'+
        '<button class="btn ghost" '+(ses.idx===0?"disabled":"")+' onclick="nav(-1)">← 上一题</button>'+
        '<span class="sp" style="flex:1"></span>'+
        (last?(exam?'<button class="btn primary" onclick="submitExam(true)">完成并交卷 ✓</button>':'<button class="btn primary" onclick="finishPractice()">查看结果 ✓</button>')
             :'<button class="btn primary" onclick="nav(1)">下一题 →</button>')+
      '</div>'+
    '</div>'+
    '<div class="card"><h2>📍 答题卡'+(exam?' <span style="font-weight:400;font-size:12px;color:var(--muted)">（橙色=已标记，蓝色=已作答）</span>':' <span style="font-weight:400;font-size:12px;color:var(--muted)">（绿=答对，红=答错）</span>')+'</h2><div class="navg">'+nav+'</div></div>'+
    (exam?'':'<div class="footer-note">快捷键：A-D 或 1-4 选择答案 · 多选题选好后按 Enter 确认 · S 标记存疑 · ← → 切换题目</div>');
}
function startTimer(){
  const el=document.getElementById("timer");
  if(!el)return;
  const tick=()=>{
    const left=Math.max(0,Math.round((ses.deadline-Date.now())/1000));
    el.textContent=fmtTime(left);
    el.className="timer"+(left<300?" warn":"");
    if(left<=0){clearInterval(timerHandle);timerHandle=null;submitExam(false)}
  };
  tick();
  timerHandle=setInterval(tick,1000);
}

/* ---------- 结果页 ---------- */
function rResult(){
  const exam=ses&&ses.mode==="exam";
  let head,reviewBtns="";
  if(exam){
    const n=ses.qids.length;
    let correct=0,wrongList=[],noAns=[];
    ses.qids.forEach((qi,i)=>{
      const q=QUESTIONS[qi],a=ses.answers[i];
      if(a===undefined){noAns.push(i)}
      else if(isCorrect(q,a)){correct++}
      else wrongList.push(i);
    });
    const score=Math.round(correct/n*100);
    const cls=score>=80?"good":(score>=60?"":"bad");
    head='<div class="score-wrap"><div class="score '+cls+'">'+score+'</div><div class="rsub">满分100 · 共'+n+'题</div>'+
      '<div class="rgrid">'+
      '<div class="stat"><div class="num" style="color:var(--green)">'+correct+'</div><div class="lbl">答对</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--red)">'+wrongList.length+'</div><div class="lbl">答错</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--amber)">'+noAns.length+'</div><div class="lbl">未作答</div></div>'+
      '<div class="stat"><div class="num">'+fmtTime(Math.round((ses.endTs-ses.startTs)/1000))+'</div><div class="lbl">用时</div></div>'+
      '</div></div>';
    reviewBtns='<div style="text-align:center;margin-top:14px"><button class="btn primary" onclick="reExam()">再来一套</button>　<button class="btn ghost" onclick="view=\'home\';render()">返回首页</button></div>'+
      '<div class="card" style="margin-top:16px"><h2>📋 全卷回顾</h2>'+ses.qids.map((qi,i)=>revItem(qi,i)).join("")+'</div>';
  }else{
    const answered=Object.keys(ses.answers).length;
    if(!answered)return '<div class="topbar"><button class="btn ghost sm" onclick="view=\'home\';render()">← 返回</button></div><div class="card"><div class="empty">本次没有作答任何题目</div></div>';
    let correct=0,wrongIdx=[];
    Object.keys(ses.answers).forEach(i=>{
      const q=QUESTIONS[ses.qids[i]];
      if(isCorrect(q,ses.answers[i]))correct++;else wrongIdx.push(+i);
    });
    const acc=Math.round(correct/answered*100);
    head='<div class="score-wrap"><div class="score '+(acc>=80?"good":(acc>=60?"":"bad"))+'">'+acc+'%</div><div class="rsub">练习完成 · 共作答'+answered+'题</div>'+
      '<div class="rgrid">'+
      '<div class="stat"><div class="num" style="color:var(--green)">'+correct+'</div><div class="lbl">答对</div></div>'+
      '<div class="stat"><div class="num" style="color:var(--red)">'+wrongIdx.length+'</div><div class="lbl">答错</div></div>'+
      '<div class="stat"><div class="num">'+(wrongIdx.length?'<button class="btn primary sm" onclick="redoWrong()">重刷本次错题</button>':'🎉')+'</div><div class="lbl">'+(wrongIdx.length?'':'错题清零')+'</div></div>'+
      '<div class="stat"><div class="num">'+answered+'</div><div class="lbl">累计作答</div></div>'+
      '</div></div>';
    reviewBtns='<div style="text-align:center;margin-top:14px"><button class="btn primary" onclick="goConfig(\'practice\',cfg.order)">再刷一遍</button>　<button class="btn ghost" onclick="view=\'home\';render()">返回首页</button></div>'+
      (wrongIdx.length?'<div class="card" style="margin-top:16px"><h2>本次错题（已自动加入错题本）</h2>'+wrongIdx.map(i=>revItem(ses.qids[i],i)).join("")+'</div>':"");
  }
  return '<div class="topbar"><button class="btn ghost sm" onclick="view=\'home\';render()">← 返回首页</button><b style="font-size:16px">'+(exam?"考试成绩":"练习小结")+'</b></div>'+head+reviewBtns;
}
function revItem(qi,i){
  const q=QUESTIONS[qi],a=ses.answers[i],opts=optList(q);
  const ok=isCorrect(q,a);
  const ansTxt=q.t==="m"?(Array.isArray(a)&&a.length?a.slice().sort().map(j=>LETTERS[j]+". "+opts[j]).join("　"):"未作答"):(a===undefined?"未作答":LETTERS[a]+". "+opts[a]);
  const corr=q.t==="m"?[].concat(q.a).sort().map(j=>LETTERS[j]+". "+opts[j]).join("　"):LETTERS[q.a]+". "+opts[q.a];
  return '<div class="rev"><div class="rq">'+(i+1)+'. ['+CATS[q.c].n+'] '+q.q+'</div>'+
    '<div class="ropt '+(ok?"ok":"no")+'">你的答案：'+ansTxt+(ok?" ✓":" ✗")+'</div>'+
    (ok?"":'<div class="ropt ok">正确答案：'+corr+'</div>')+
    '<div class="rexp"><div class="exph">解析</div>'+q.e+'</div></div>';
}

/* ---------- 可疑题巡检 ---------- */
function patrolRows(){ // 数据可疑：作答≥5次且正确率<30% → 可能答案录错，也可能真是弱项
  return QUESTIONS.map(q=>({q,s:db.stats[q.id]})).filter(({s})=>{
    if(!s)return false;
    const n=s.r+s.w;
    return n>=5&&s.r/n<0.3;
  });
}
function rPatrol(){
  const auto=patrolRows();
  const reps=db.report.map(id=>({q:QUESTIONS[id-1]})).filter(x=>x.q);
  const item=(q,extra)=>{
    const s=db.stats[q.id],n=s?s.r+s.w:0,acc=s&&n?Math.round(s.r/n*100):0;
    const localIdx=QUESTIONS.filter(x=>x.c===q.c&&x.id<=q.id).length;
    return '<details><summary>['+CATS[q.c].n+'] '+q.q+(n?' <span class="badge red">'+acc+'%</span> <span class="badge gray">'+n+' 次作答</span>':' <span class="badge amber">新报错</span>')+'</summary><div class="ansbox">'+
      optList(q).map((o,i)=>((q.t==="m"?[].concat(q.a):[q.a]).includes(i)?"<b>"+LETTERS[i]+". "+o+"</b>":LETTERS[i]+". "+o)).join("<br>")+
      '<div class="exph" style="margin-top:10px">解析</div>'+q.e+
      '<div style="margin-top:8px"><span style="color:var(--muted);font-size:12px">'+extra+' · 源文件：questions/'+q.c+'.json 第 '+localIdx+' 题 · 确认有误就改源文件后重新 node build.js</span></div></div></details>';
  };
  const autoList=auto.map(({q})=>item(q,"数据可疑")).join("");
  const repList=reps.map(({q})=>item(q,"🙋 用户手动报错")).join("");
  return '<div class="topbar"><button class="btn ghost sm" onclick="view=\'home\';render()">← 返回</button><b style="font-size:16px">可疑题巡检（数据可疑 '+auto.length+' · 手动报错 '+reps.length+'）</b></div>'+
    (repList?'<div class="card"><h2>手动报错 <span style="font-weight:400;font-size:12px;color:var(--muted)">你在做题时用「⚠️ 报错」标记的</span></h2>'+repList+'</div>':'')+
    (autoList?'<div class="card"><h2>数据可疑 <span style="font-weight:400;font-size:12px;color:var(--muted)">正确率 <30% 且作答 ≥5 次</span></h2>'+autoList+'</div>':'')+
    (!repList&&!autoList?'<div class="card"><div class="empty">暂时没有可疑题 ✅<br><br><span style="font-size:13px">两个来源：① 做题页「⚠️ 报错」手动标记；② 作答 ≥5 次且正确率 <30% 的题自动汇总。<br>低正确率可能是答案录入有误，也可能是你的弱项——人工分辨，确认录错就改 questions/ 源文件。</span></div></div>':'');
}

/* ==================== 交互逻辑 ==================== */
function goConfig(mode,order){cfg.mode=mode;cfg.order=order;view="config";render()}
function toggleCat(k){cfg.cats.has(k)?cfg.cats.delete(k):cfg.cats.add(k);render()}
function allCats(){cfg.cats=new Set(Object.keys(CATS));render()}
function quickStart(cat){ // 点击分类直接顺序练习该分类
  cfg.mode="practice";cfg.order="seq";cfg.cats=new Set([cat]);
  startSession();
}
const EXAM_TPLS=[
  {name:"🎯 综合理论卷",mix:{s:60,f:10,m:10},minutes:90},
  {name:"📐 小型混合卷",mix:{s:20,f:5,m:5},minutes:30},
  {name:"🎲 不分题型",mix:null,minutes:0},
];
function setTemplate(i){ // 应用题型配比模板（mix 为 null 表示不限题型）
  const t=EXAM_TPLS[i];
  cfg.template=t.mix;
  if(t.mix){cfg.count=t.mix.s+t.mix.f+t.mix.m;cfg.minutes=t.minutes}
  render();
}
function toggleStar(qid){ // ⭐ 存疑：手动送入复习，当天到期（错题是明天起排，存疑要趁热）
  if(db.star.includes(qid)){
    db.star=db.star.filter(id=>id!==qid);
    if(!db.wrong.includes(qid))delete db.review[qid]; // 无错题历史则一并撤销复习排期
  }else{
    db.star.push(qid);
    if(db.review[qid])db.review[qid].due=todayStr();
    else db.review[qid]={iv:1,due:todayStr()};
  }
  save();
}
function toggleReport(qid){ // ⚠️ 手动报错：题干/答案疑似有误，汇入巡检页人工复核
  if(db.report.includes(qid))db.report=db.report.filter(id=>id!==qid);
  else db.report.push(qid);
  save();
}
function startCustomSession(){ // 背题浏览的搜索结果 → 自组练习会话
  const kw=browseFilter.kw.trim().toLowerCase();
  const idxs=QUESTIONS.map((q,i)=>({q,i})).filter(({q})=>
    (browseFilter.cat==="all"||q.c===browseFilter.cat)&&
    (!kw||q.q.toLowerCase().includes(kw)||(q.e||"").toLowerCase().includes(kw))).map(({i})=>i);
  if(!idxs.length)return skAlert("当前筛选没有题目");
  ses={mode:"practice",qids:idxs.slice(0,200),idx:0,answers:{},sel:{},flags:{},startTs:Date.now()};
  view="practice";render();
}
function buildOrder(pool){
  if(cfg.mode==="exam"){
    if(cfg.template){ // 按题型配比抽题组卷
      const part=t=>shuffle(pool.filter(i=>QUESTIONS[i].t===t)).slice(0,cfg.template[t]||0);
      return shuffle(part("s").concat(part("f"),part("m")));
    }
    return shuffle(pool).slice(0,Math.min(cfg.count==="全部"?pool.length:cfg.count,pool.length));
  }
  let arr;
  if(cfg.order==="rand")arr=shuffle(pool);
  else{ // 顺序：未做过的优先，其余按原顺序
    const fresh=pool.filter(i=>!db.stats[QUESTIONS[i].id]);
    const old=pool.filter(i=>db.stats[QUESTIONS[i].id]);
    arr=fresh.concat(old);
  }
  return arr;
}
function startSession(){
  const pool=poolOf(cfg.cats);
  if(!pool.length)return skAlert("请至少选择一个分类");
  const qids=buildOrder(pool);
  if(!qids.length)return skAlert("当前范围没有题目");
  ses={mode:cfg.mode,qids,idx:0,answers:{},sel:{},flags:{},startTs:Date.now()};
  if(cfg.mode==="exam"){
    const mins=cfg.minutes>0?cfg.minutes:Math.max(15,Math.ceil(qids.length*90/60));
    ses.deadline=Date.now()+mins*60*1000;
    view="exam";
  }else view="practice";
  render();
}
function startWrongPractice(){
  const ids=db.wrong.slice();
  if(!ids.length)return;
  ses={mode:"practice",qids:shuffle(ids.map(id=>id-1)),idx:0,answers:{},sel:{},flags:{},startTs:Date.now()};
  view="practice";render();
}
function redoWrong(){
  const wrongIdx=Object.keys(ses.answers).map(Number).filter(i=>ses.answers[i]!==QUESTIONS[ses.qids[i]].a);
  ses={mode:"practice",qids:shuffle(wrongIdx.map(i=>ses.qids[i])),idx:0,answers:{},sel:{},flags:{},startTs:Date.now()};
  view="practice";render();
}
function reExam(){view="config";render()}
function pick(i){
  const q=qOf(ses.idx);
  if(ses.mode==="exam"){
    // 可反复修改选择；多选题为切换选中
    if(q.t==="m"){
      const cur=(ses.answers[ses.idx]||[]).slice();
      const p=cur.indexOf(i);
      if(p<0)cur.push(i);else cur.splice(p,1);
      if(cur.length)ses.answers[ses.idx]=cur;else delete ses.answers[ses.idx];
    }else ses.answers[ses.idx]=i;
    render();
    return;
  }
  if(ses.answers[ses.idx]!==undefined)return; // 已作答锁定
  if(q.t==="m"){
    ses.sel=ses.sel||{};
    const cur=(ses.sel[ses.idx]||[]).slice();
    const p=cur.indexOf(i);
    if(p<0)cur.push(i);else cur.splice(p,1);
    ses.sel[ses.idx]=cur;
    render();
    return;
  }
  ses.answers[ses.idx]=i;
  recordAnswer(q,i===q.a);
  render();
}

  const q=qOf(ses.idx);
  if(q.t!=="m"||ses.answers[ses.idx]!==undefined)return;
  const sel=(ses.sel&&ses.sel[ses.idx]||[]).slice().sort();
  if(!sel.length)return;

  render();
}

function weakCats(){ // 弱项分类：累计作答≥5次且正确率<60%
  return Object.keys(CATS).map(k=>({k,s:catStats(k)})).filter(x=>x.s.done>=5&&x.s.acc>=0&&x.s.acc<60);
}
async function startWeakSession(){
  const weak=weakCats();
  if(!weak.length){skAlert("暂未识别到弱项分类 ✅\n\n判定规则：某分类累计作答 ≥5 次且正确率 <60%。\n先去刷一些题，数据够了这里会自动生成弱项专练。");return}
  const msg="识别到弱项分类：\n"+weak.map(w=>"· "+CATS[w.k].n+"（正确率 "+w.s.acc+"%，已刷 "+w.s.done+" 题）").join("\n")+"\n\n将优先重刷这些分类里错过/没做过的题（上限 50 题），开始吗？";
  if(!(await skConfirm(msg)))return;
  const weakSet=new Set(weak.map(w=>w.k));
  const missed=[],fresh=[],rest=[];
  QUESTIONS.filter(q=>weakSet.has(q.c)).forEach(q=>{
    const st=db.stats[q.id];
    if(!st)fresh.push(q.id-1);
    else if(st.w>0)missed.push(q.id-1);
    else rest.push(q.id-1);
  });
  const qids=shuffle(missed).concat(shuffle(fresh),shuffle(rest)).slice(0,50);
  ses={mode:"practice",qids,idx:0,answers:{},sel:{},flags:{},startTs:Date.now()};
  view="practice";render();
}

/* ---------- 知识库检索（轻量 RAG）：运行时把 KB_TEXT 按章节切块，按二元组重合度取 top N ---------- */
let kbChunksCache=null;
function kbChunkList(){
  if(kbChunksCache)return kbChunksCache;
  const out=[];let cur={h:"概述",t:""},inFence=false;
  String(KB_TEXT||"").split("\n").forEach(line=>{
    if(/^\s*```/.test(line)){inFence=!inFence;cur.t+=line+"\n";return} // 围栏内的 # 是 shell 注释，不是标题
    const m=inFence?null:line.match(/^#{1,3}\s+(.*)$/);
    if(m){if(cur.t.trim())out.push(cur);cur={h:m[1].trim(),t:""}}
    else cur.t+=line+"\n";
  });
  if(cur.t.trim())out.push(cur);
  const chunks=[];
  out.forEach(c=>{ // 超长章节按空行再切，控制在千字左右
    if(c.t.length<=1300){chunks.push(c);return}
    let buf={h:c.h+"（续）",t:""};
    c.t.split(/\n{2,}/).forEach(p=>{
      if(buf.t.length>900&&buf.t.trim()){chunks.push(buf);buf={h:c.h+"（续）",t:""}}
      buf.t+=p+"\n\n";
    });
    if(buf.t.trim())chunks.push(buf);
  });
  kbChunksCache=chunks;return chunks;
}
const KB_STOP=new Set(["什么","怎么","如何","哪些","哪个","属于","下列","说法","正确","错误","关于","以及","其中","应该","不是","就是","一个","这个","那个","可以","进行","使用","还是","描述","特点","作用","主要","常见","包括","类型","分别","以下","哪种","的是","而是","成为","分为"]);
function kbRetrieve(query,n){
  const grams=new Set();
  const cleaned=String(query||"").toLowerCase();
  (cleaned.match(/[a-z0-9]+/g)||[]).forEach(w=>{if(w.length>=2)grams.add(w)});
  const cn=cleaned.replace(/[^一-鿿]+/g,"");
  for(let i=0;i<cn.length-1;i++)grams.add(cn.slice(i,i+2));
  KB_STOP.forEach(g=>grams.delete(g));
  if(!grams.size)return null;
  const scored=kbChunkList().map(c=>{
    const lt=(c.h+"\n"+c.t).toLowerCase();let s=0,hits=0;
    grams.forEach(g=>{if(lt.includes(g)){hits++;s+=g.length}});
    return{c,s,hits};
  }).filter(x=>x.hits>=2).sort((a,b)=>b.s-a.s).slice(0,n);
  if(!scored.length)return null;
  return scored.map(x=>"【"+x.c.h+"】\n"+x.c.t.trim()).join("\n\n——\n\n");
}

/* ---------- 协议适配：OpenAI 兼容 + Anthropic 兼容（URL 含 /anthropic 自动识别） ---------- */
function isAnthropicEP(){return /\/anthropic(\/|$)/i.test(db.ai.url)}
function aiEndpoint(){const u=db.ai.url.trim();return isAnthropicEP()?u.replace(/\/+$/,"")+"/v1/messages":u}
function aiHeaders(){
  const h={"Content-Type":"application/json"};
  if(isAnthropicEP()){h["x-api-key"]=db.ai.key;h["anthropic-version"]="2023-06-01"}
  else if(db.ai.key)h["Authorization"]="Bearer "+db.ai.key;
  return h;
}
function aiBody(msgs,stream,maxTokens){ // Anthropic：system 拆到顶层、max_tokens 必填；OpenAI：system 放 messages
  const sys=buildSys();
  const chatMsgs=msgs.filter(m=>m.role!=="system");
  if(isAnthropicEP())return{model:db.ai.model||undefined,max_tokens:maxTokens||2048,system:sys,messages:chatMsgs,stream:!!stream};
  return{model:db.ai.model||undefined,messages:[{role:"system",content:sys}].concat(chatMsgs),stream:!!stream,temperature:0.6};
}
function aiExtractSSE(line){ // 单行 SSE data → 增量文本；兼容 Anthropic text_delta 与 OpenAI content/reasoning_content
  const s=String(line).trim();
  if(!s.startsWith("data:"))return"";
  const p=s.slice(5).trim();
  if(!p||p==="[DONE]")return"";
  try{
    const j=JSON.parse(p);
    if(j.type==="content_block_delta"){const d=j.delta||{};return d.type==="text_delta"?(d.text||""):""}
    const c0=j.choices&&j.choices[0];
    const d=c0&&(c0.delta||c0.message);
    if(d){if(d.content)return d.content;if(d.reasoning_content)return d.reasoning_content}
  }catch(e){}
  return"";
}
function aiExtractJSON(j){ // 非流式响应 JSON → 文本；兼容两协议
  if(!j)return"";
  if(Array.isArray(j.content))return j.content.filter(b=>b.type==="text").map(b=>b.text||"").join("");
  const c0=j.choices&&j.choices[0];
  const m=c0&&(c0.message||c0.delta);
  if(m){if(m.content)return m.content;if(m.reasoning_content)return m.reasoning_content}
  return"";
}
async function aiSend(ov){
  if(!chat||chat.busy)return;
  const input=document.getElementById("chatIn");
  const text=((ov===undefined||ov===null?"":String(ov))||(input?input.value:"")).trim();
  if(!text)return;
  if(input&&!ov)input.value="";
  chat.busy=true;
  chat.msgs.push({role:"user",content:text},{role:"assistant",content:""});
  const ai=chat.msgs.length-1;
  renderAIPanel();
  const box=document.getElementById("chatBox"),el=document.getElementById("ai-"+ai);
  const scroll=()=>{if(box)box.scrollTop=box.scrollHeight};
  scroll();
  try{
    const res=await fetch(aiEndpoint(),{method:"POST",headers:aiHeaders(),body:JSON.stringify(aiBody(buildMsgs(),true))});
    if(!res.ok)throw new Error("HTTP "+res.status+(res.status===429?"（模型被限流，稍后再试或换个模型）":res.status===401?"（API 密钥不对）":res.status===404?"（接口地址可能不对）":""));
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="",raw="";
    for(;;){
      const r2=await rd.read();if(r2.done)break;
      const chunk=dec.decode(r2.value,{stream:true});
      raw+=chunk;buf+=chunk;
      const ls=buf.split("\n");buf=ls.pop();
      for(const line of ls){
        const add=aiExtractSSE(line);
        if(add){
          chat.msgs[ai].content+=add;
          if(el)el.innerHTML=mdLite(chat.msgs[ai].content);
          scroll();
        }
      }
    }
    if(!chat.msgs[ai].content.trim()){
      // 兜底一：服务端无视 stream 参数返回了整体 JSON
      try{const got=aiExtractJSON(JSON.parse(raw));if(got)chat.msgs[ai].content=got}catch(e){}
    }
    if(!chat.msgs[ai].content.trim()){
      // 兜底二：仍为空 → 展示响应原文，便于定位问题
      chat.msgs[ai].content="⚠️ 模型返回了空内容。响应原文前 200 字符：\n"+raw.slice(0,200);
      chat.msgs[ai].err=true;
    }
  }catch(e){
    chat.msgs[ai].content="⚠️ 请求失败："+e.message+"\n\n排查清单：\n1️⃣ 云端接口：接口地址 / 模型名 / API 密钥填写正确，账户有剩余额度；\n2️⃣ 免费模型可能临时限流，稍后重试或换个模型；\n3️⃣ 本地 LM Studio：Developer 页启动 Server 并加载模型、开启 Allow CORS，密钥留空；\n4️⃣ 若提示 CORS / Failed to fetch：该接口不允许浏览器直连，换支持 CORS 的服务商。";
    chat.msgs[ai].err=true;
  }
  chat.busy=false;
  renderAIPanel();
}
async function aiTest(){ // 真实发送一条流式对话，验证整条链路而不是只看模型列表
  const el=document.getElementById("aiTestMsg");if(!el)return;
  el.innerHTML='<span style="color:var(--muted)">测试中…（真实发送一条对话请求）</span>';
  try{
    const res=await fetch(aiEndpoint(),{method:"POST",headers:aiHeaders(),
      body:JSON.stringify(aiBody([{role:"user",content:"只回复两个字：成功"}],true,100))});
    const raw=await res.text();
    if(!res.ok)throw new Error("HTTP "+res.status+" "+raw.slice(0,120));
    let got="";
    for(const line of raw.split("\n"))got+=aiExtractSSE(line);
    if(!got.trim())got=aiExtractJSON((()=>{try{return JSON.parse(raw)}catch(e){return null}})());
    if(got.trim())el.innerHTML='<span style="color:var(--green)">✅ 连接成功，模型回复：「'+escHtml(got.trim().slice(0,40))+'」</span>';
    else el.innerHTML='<span style="color:var(--red)">❌ 连通了但没有读到内容。响应前 200 字符：</span><br><span style="color:var(--muted);font-size:12px;word-break:break-all">'+escHtml(raw.slice(0,200))+'</span>';
  }catch(e){
    el.innerHTML='<span style="color:var(--red)">❌ 连接失败：'+escHtml(e.message)+'（检查接口地址 / 模型名 / 密钥 / 网络）</span>';
  }
}

/* ==================== 键盘快捷键 ==================== */
document.addEventListener("keydown",e=>{
  if(view!=="practice"&&view!=="exam")return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(!ses)return;
  const k=e.key.toLowerCase();
  if(k==="s"){toggleStar(qOf(ses.idx).id);render();return}
  const map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  if(k in map&&map[k]<optList(qOf(ses.idx)).length){pick(map[k]);return}
  if(e.key==="Enter"){const q=qOf(ses.idx);if(q.t==="m"&&ses.answers[ses.idx]===undefined)confirmMulti();return}
  if(e.key==="ArrowRight"&&ses.idx<ses.qids.length-1)nav(1);
  if(e.key==="ArrowLeft"&&ses.idx>0)nav(-1);
});

/* ---------- 自定义弹窗（skAlert / skConfirm，替代原生 alert/confirm） ---------- */
let skResolve=null;
function skClose(v){const m=document.querySelector(".sk-mask");if(m){m.classList.remove("open");setTimeout(()=>{m.remove();if(skResolve)skResolve(v);skResolve=null},180)}}
function skShow(msg,confirm){
  const old=document.querySelector(".sk-mask");
  if(old){old.remove();if(skResolve){const r=skResolve;skResolve=null;r(false)}}
  return new Promise(res=>{
    const m=document.createElement("div");
    if(!m.querySelector){res(confirm);return} // 无真实 DOM（node 测试环境）直接放行
    skResolve=res;
    m.className="sk-mask";
    m.innerHTML='<div class="sk-box"><h3>'+(confirm?"⚠️ 确认操作":"💬 提示")+'</h3><div class="msg"></div><div class="sk-actions"></div></div>';
    m.querySelector(".msg").textContent=msg;
    const acts=m.querySelector(".sk-actions");
    if(confirm){const no=document.createElement("button");no.className="btn ghost";no.textContent="取消";no.onclick=()=>skClose(false);acts.appendChild(no)}
    const ok=document.createElement("button");ok.className="btn primary";ok.textContent=confirm?"确定":"好的";ok.onclick=()=>skClose(true);acts.appendChild(ok);
    document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add("open"));ok.focus();
  });
}
function skAlert(msg){return skShow(msg,false)}
function skConfirm(msg){return skShow(msg,true)}
